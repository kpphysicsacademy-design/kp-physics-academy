<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#58cc02"><title>Units & Measurements | KP Physics</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:Inter,system-ui,sans-serif;color:#242424}.app{max-width:760px;min-height:100vh;margin:auto;background:#fff}.top{position:sticky;top:0;background:#fff;border-bottom:2px solid #eee;padding:14px 18px;display:flex;gap:14px;align-items:center;z-index:5}.back{border:0;background:#eee;border-radius:12px;padding:8px 12px;font-size:18px}.bar{height:10px;background:#eee;border-radius:20px;flex:1;overflow:hidden}.bar span{display:block;height:100%;background:#58cc02;width:0;transition:.25s}.hearts{font-weight:800}.content{padding:28px 20px 120px}.tag{font-size:12px;font-weight:800;color:#777;letter-spacing:1px}.title{font-size:30px;margin:6px 0}.q{margin:28px 0 18px;font-size:21px;font-weight:750;line-height:1.4}.options{display:grid;gap:12px}.option{width:100%;padding:16px;text-align:left;border:2px solid #ddd;border-radius:16px;background:#fff;font-size:16px;font-weight:650;cursor:pointer;box-shadow:0 3px 0 #ddd}.option:hover{border-color:#aaa}.option.correct{border-color:#58cc02;background:#eaffdc;box-shadow:0 3px 0 #46a800}.option.wrong{border-color:#ff4b4b;background:#ffe5e5;box-shadow:0 3px 0 #d92f2f}.feedback{display:none;margin-top:18px;padding:16px;border-radius:16px;background:#f2f2f2}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:5px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:#fff;border-top:2px solid #eee;padding:12px 20px calc(12px + env(safe-area-inset-bottom))}.continue{width:100%;border:0;border-radius:14px;padding:15px;background:#58cc02;color:#fff;font-size:16px;font-weight:800;box-shadow:0 4px 0 #46a800}.continue:disabled{background:#ccc;box-shadow:0 4px 0 #aaa}.result{text-align:center;display:none}.result.show{display:block}.result h2{font-size:30px}.xp{font-size:20px;font-weight:800}.score{font-size:48px;font-weight:900;color:#58cc02}</style></head><body><div class="app"><header class="top"><button class="back" onclick="location.href='app.html'">←</button><div class="bar"><span id="progress"></span></div><div class="hearts">❤️ <span id="hearts">5</span></div></header><main class="content"><div id="quiz"><div class="tag">PHYSICS • CONCEPT 1 • LESSON 1</div><h1 class="title">Units & Measurements</h1><div id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"><strong id="feedbackTitle"></strong><span id="explanation"></span></div></div><div class="result" id="result"><div class="score" id="score">5/5</div><h2>Lesson complete! 🎉</h2><p class="xp" id="xpReward">+50 XP</p><p>You finished the first Physics lesson.</p></div></main><footer class="bottom"><button class="continue" id="continue" disabled>Choose an answer</button></footer></div><script>
const questions=[
{q:'Which of the following is an SI base quantity?',o:['Force','Energy','Length','Velocity'],a:2,e:'Length is one of the seven SI base quantities. Force, energy and velocity are derived quantities.'},
{q:'The SI unit of electric current is:',o:['Volt','Ampere','Ohm','Coulomb'],a:1,e:'Ampere (A) is the SI base unit of electric current.'},
{q:'How many significant figures are present in 0.00450?',o:['2','3','4','5'],a:1,e:'Leading zeros are not significant. The digits 4, 5 and the trailing zero are significant: 3 figures.'},
{q:'Which quantity has the dimensions [ML²T⁻²]?',o:['Power','Force','Work','Pressure'],a:2,e:'Work = force × distance, so its dimensions are [ML²T⁻²].'},
{q:'If x = 2.0 m and y = 3.00 m, the number of significant figures in x + y is:',o:['1','2','3','4'],a:1,e:'For addition, retain the least number of decimal places. 2.0 + 3.00 = 5.0, which has 2 significant figures.'}
];
let i=0,score=0,answered=false,hearts=5;const qEl=document.getElementById('question'),oEl=document.getElementById('options'),fb=document.getElementById('feedback'),ft=document.getElementById('feedbackTitle'),ex=document.getElementById('explanation'),next=document.getElementById('continue');
const saved=JSON.parse(localStorage.getItem('kpPhysicsAppProgress')||'{}');hearts=saved.hearts??5;document.getElementById('hearts').textContent=hearts;
function render(){answered=false;fb.className='feedback';next.disabled=true;next.textContent='Choose an answer';document.getElementById('progress').style.width=(i/questions.length*100)+'%';qEl.innerHTML='<div class="q">'+(i+1)+'. '+questions[i].q+'</div>';oEl.innerHTML='';questions[i].o.forEach((x,n)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+n)+'. '+x;b.onclick=()=>answer(n,b);oEl.appendChild(b)})}
function answer(n,b){if(answered)return;answered=true;const correct=n===questions[i].a;document.querySelectorAll('.option').forEach(x=>x.disabled=true);b.classList.add(correct?'correct':'wrong');if(correct){score++;ft.textContent='Correct! 🎉';}else{document.querySelectorAll('.option')[questions[i].a].classList.add('correct');hearts=Math.max(0,hearts-1);document.getElementById('hearts').textContent=hearts;ft.textContent='Not quite — review this.'}ex.textContent=questions[i].e;fb.className='feedback show';next.disabled=false;next.textContent=i===questions.length-1?'Finish lesson':'Continue'}
next.onclick=()=>{if(!answered)return;if(i<questions.length-1){i++;render()}else finish()};
function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').className='result show';document.getElementById('score').textContent=score+'/5';document.getElementById('progress').style.width='100%';const s=JSON.parse(localStorage.getItem('kpPhysicsAppProgress')||'{}');s.xp=(s.xp||0)+(score*10);s.hearts=hearts;s.lesson_units_measurements=true;s.concept1=true;if(score===5)s.concept1Perfect=true;localStorage.setItem('kpPhysicsAppProgress',JSON.stringify(s));document.getElementById('xpReward').textContent='+'+(score*10)+' XP';next.disabled=false;next.textContent='Continue Physics Path';next.onclick=()=>location.href='app.html'}
render();
</script></body></html>
