<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relative Motion | KP Physics Academy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f9fd;color:#10213a}.top{background:#071a31;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:28px 18px 70px}.hero{text-align:center}.hero h1{font-size:38px;margin:10px 0}.hero span{color:#1687ff}.muted{color:#718096;line-height:1.5}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.stat,.mastery{background:#fff;border:1px solid #dfe7f1;border-radius:14px;padding:12px 18px;text-align:center}.mastery{max-width:900px;margin:20px auto 35px}.bar{height:10px;background:#e7edf4;border-radius:20px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:#20b56b}.section{margin:38px 0}.path{position:relative;padding:8px 0}.path:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%);background:#dce8f5;border-radius:10px}.lesson{position:relative;display:flex;align-items:center;min-height:125px}.lesson:nth-child(odd){justify-content:flex-start;padding-right:calc(50% + 45px)}.lesson:nth-child(even){justify-content:flex-end;padding-left:calc(50% + 45px)}.node{width:100%;max-width:400px;background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:17px;box-shadow:0 7px 20px #0000000b}.node.done{border-color:#20b56b}.node h3{margin:0;font-size:16px}.node p{font-size:12px;color:#718096;margin:7px 0}.tag{font-size:10px;font-weight:800;color:#138650}.btn{display:block;text-align:center;padding:10px;border-radius:9px;background:#1687ff;color:#fff;text-decoration:none;font-weight:800;margin-top:10px}.checkpoint{background:#fff7dc;border:1px solid #f1d37b;border-radius:16px;padding:15px;text-align:center;margin:12px auto;max-width:620px;font-weight:800}@media(max-width:700px){.hero h1{font-size:30px}.path:before{left:20px;transform:none}.lesson,.lesson:nth-child(odd),.lesson:nth-child(even){justify-content:flex-start;padding-left:50px;padding-right:0;min-height:120px}.node{max-width:none}}</style></head><body><header class="top"><a href="jee-physics-path.html">← JEE Physics Path</a><a href="index.html">Home</a></header><main class="wrap"><section class="hero"><p>🧭 JEE PHYSICS • MECHANICS • CONCEPT 5</p><h1>Relative Motion <span>Zero → Hero</span></h1><p class="muted">MCQ → Correction → Retry wrong questions → Master → Next</p></section><div class="stats"><div class="stat">🔥 <b id="streak">0</b><br><small>Streak</small></div><div class="stat">⭐ <b id="xp">0</b><br><small>XP</small></div><div class="stat">🎯 <b>11</b><br><small>Sections</small></div><div class="stat">📚 <b id="count">0</b><br><small>Lessons</small></div></div><div class="mastery"><b>Relative Motion Mastery</b><p id="progress" class="muted">Start from the foundation</p><div class="bar"><i id="bar"></i></div></div><div id="content"></div></main><script>const sections=[['🟢','01 • Reference Frames & Relative Position',['Reference Frame','Observer','Position Relative to Observer','Relative Position','Position Difference','Same Event in Different Frames','One-Dimensional Frames','Two-Dimensional Frames','Choosing a Reference Frame']],['🟢','02 • Relative Displacement',['Displacement Review','Relative Displacement','A relative to B','B relative to A','Sign Convention','Same-Direction Displacement','Opposite-Direction Displacement','Zero Relative Displacement','Basic Relative Displacement Problems']],['🔵','03 • Relative Velocity Foundations',['Relative Velocity','Vector Definition','vAB = vA − vB','Same-Direction Motion','Opposite-Direction Motion','Equal Velocities','Zero Relative Velocity','Relative Speed vs Relative Velocity','Basic Numerical Problems']],['🔵','04 • 1D Relative Motion',['Two Cars','Two Trains','Meeting Problems','Separation Problems','Catch-Up Problems','Chasing Problems','Same Starting Point','Different Starting Points','Time to Meet','Time to Overtake','1D Mixed Problems']],['🟡','05 • Relative Acceleration',['Relative Acceleration','aAB = aA − aB','Same Acceleration','Different Accelerations','Zero Relative Acceleration','Accelerating Bodies','Relative Acceleration Graphs','Velocity-Time Interpretation','Acceleration-Based Problems']],['🟡','06 • 2D Relative Motion',['Relative Velocity in 2D','Vector Components','x-Component','y-Component','Magnitude of Relative Velocity','Direction of Relative Velocity','Angle Between Velocities','Minimum Relative Speed','2D Meeting Problems','Advanced Vector Problems']],['🟠','07 • Rain-Man Problems',['Rain Relative to Ground','Rain Relative to Man','Apparent Direction of Rain','Umbrella Angle','Wind and Rain','Moving Observer','Stationary Observer','Relative Velocity Diagram','Rain-Man Numericals']],['🟠','08 • Boat & River',['Boat Velocity','River Velocity','Resultant Velocity','Boat Relative to Water','Boat Relative to Ground','Shortest Time','Shortest Distance','Crossing a River','Drift','Minimum Drift','Upstream and Downstream','Boat-River Numericals']],['🔴','09 • Wind, Aircraft & Advanced Relative Motion',['Aircraft and Wind','Ground Velocity','Air Velocity','Wind Velocity','Heading Angle','Minimum Time Flight','Minimum Distance Flight','Relative Motion of Aircraft','Moving Target','Pursuit Problems','Advanced 2D Relative Motion']],['🔴','10 • Multi-Body & Constraint Problems',['Multiple Moving Bodies','Relative Position Functions','Relative Velocity Functions','Relative Acceleration Functions','Moving Frames','Constraint Relations','Collision in Relative Frame','Closest Approach','Minimum Distance Between Bodies','JEE Main Mixed Problems','JEE Advanced Problems']],['🏆','11 • Final Mastery',['Foundation Test','Relative Displacement Test','Relative Velocity Test','1D Motion Test','Relative Acceleration Test','2D Motion Test','Rain-Man Test','Boat-River Test','Wind-Aircraft Test','Closest Approach Test','JEE Main Challenge','JEE Advanced Challenge','Wrong-Question Revision','Final Unseen Test','Relative Motion Mastered']]];const lessons=[];sections.forEach(s=>s[2].forEach(name=>lessons.push({name,section:s[1]})));let completed=Math.max(0,Math.min(lessons.length,Number(localStorage.getItem('kp_relative_completed')||0)));function render(){let n=0,out='';sections.forEach((s,si)=>{out+=`<section class="section"><h2>${s[0]} ${s[1]}</h2><p class="muted">${s[2].length} lessons • Zero → Hero</p><div class="path">`;s[2].forEach(name=>{const i=n++,done=i<completed;const href='relative-motion-lesson.html?id='+i;out+=`<div class="lesson"><div class="node ${done?'done':''}"><h3>${done?'🏆 ':s[0]+' '}${i+1}. ${name}</h3><p>${s[1]} • 5 MCQs per task</p><span class="tag">${done?'MASTERED':'UNLOCKED'}</span><a class="btn" href="${href}">${done?'Review':'Start Task →'}</a></div></div>`});out+='</div>';if(si<sections.length-1)out+='<div class="checkpoint">🏆 Section checkpoint — every wrong question must be answered correctly before mastery.</div>';out+='</section>'});document.getElementById('content').innerHTML=out;document.getElementById('count').textContent=lessons.length;document.getElementById('progress').textContent=`${completed} of ${lessons.length} lessons mastered • All lessons unlocked`;document.getElementById('bar').style.width=Math.round(completed/lessons.length*100)+'%';document.getElementById('xp').textContent=completed*10;document.getElementById('streak').textContent=localStorage.getItem('kp_streak')||0}render();</script></body></html>
