<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resonance | KP Physics Academy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f9fd;color:#10213a}.top{background:#071a31;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:30px 18px 70px}.hero{text-align:center}.hero h1{font-size:38px;margin:10px 0}.hero span{color:#1687ff}.muted{color:#718096;line-height:1.5}.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}.stat{background:#fff;border:1px solid #dfe7f1;border-radius:14px;padding:12px 18px;text-align:center}.section{margin:38px 0}.path{position:relative}.path:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:5px;transform:translateX(-50%);background:#dce8f5;border-radius:10px}.lesson{position:relative;min-height:125px;display:flex;align-items:center}.lesson:nth-child(odd){justify-content:flex-start;padding-right:calc(50% + 42px)}.lesson:nth-child(even){justify-content:flex-end;padding-left:calc(50% + 42px)}.card{width:100%;max-width:400px;background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:17px;box-shadow:0 6px 18px #0000000b}.card h3{margin:0;font-size:16px}.card p{font-size:12px;color:#718096}.tag{font-size:10px;font-weight:800;color:#138650}.btn{display:block;text-align:center;background:#1687ff;color:#fff;text-decoration:none;padding:10px;border-radius:9px;font-weight:bold;margin-top:10px}@media(max-width:700px){.path:before{left:18px;transform:none}.lesson,.lesson:nth-child(odd),.lesson:nth-child(even){justify-content:flex-start;padding-left:48px;padding-right:0}.card{max-width:none}}</style></head><body><header class="top"><a href="jee-physics-path.html">← JEE Physics Path</a><a href="index.html">Home</a></header><main class="wrap"><section class="hero"><p>🔄 JEE PHYSICS • EMI & AC
