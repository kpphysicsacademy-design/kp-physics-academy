<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp | League</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:Inter,Arial,sans-serif}.top{height:68px;background:#071a31;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.subject-select{background:#102744;color:#fff;border:1px solid #4b6fa0;border-radius:12px;padding:9px 32px 9px 12px;font-size:14px;font-weight:950;max-width:220px}.stats{display:flex;gap:7px}.pill{background:#102744;border:1px solid #294765;border-radius:12px;padding:7px 10px;font-size:10px;font-weight:900}.content{position:fixed;top:68px;bottom:58px;left:0;right:0;overflow:auto}.frame{width:100%;height:100%;min-height:700px;border:0;background:#fff;display:block}.bottom{position:fixed;bottom:0;left:0;right:0;height:58px;background:#fff;border-top:1px solid #dfe7ef;display:flex;z-index:100;box-shadow:0 -5px 18px #17203312}.bottom a{flex:1;text-align:center;color:#667085;text-decoration:none;font-size:9px;font-weight:900;padding-top:6px}.bottom span{display:block;font-size:20px;margin-bottom:2px}.bottom .active{color:#1687ff}@media(max-width:720px){.subject-select{max-width:175px;font-size:12px;padding:8px 28px 8px 10px}.stats .pill:last-child{display:none}.bottom a{font-size:8px}.bottom span{font-size:18px}}</style><link rel="stylesheet" href="skillup-theme.css?v=1"></head><body><header class="top"><div class="brand">SKILLUP<small>LEAGUE</small></div><select id="subjectSelect" class="subject-select" aria-label="Select subject"><option value="physics-learn.html">SkillUp Physics</option><option value="chemistry-learn.html">SkillUp Chemistry</option><option value="botany-learn.html">SkillUp Botany</option><option value="zoology-learn.html">SkillUp Zoology</option><option value="maths-learn.html">SkillUp Maths</option></select><div class="stats"><span class="pill">🔥 7</span><span class="pill">⭐ 420 XP</span><span class="pill">❤️ 5</span></div></header><main class="content"><iframe id="frame" class="frame" title="SkillUp League"></iframe></main><nav class="bottom"><a id="home" href="skillup-home.html"><span>🏠</span>Home</a><a id="learn"><span>🧭</span>Learn</a><a id="practice"><span>🎯</span>Practice</a><a class="active" id="league"><span>🏆</span>League</a><a id="profile"><span>👤</span>Profile</a></nav><script src="skillup-version.js"></script><script>const subject=(new URLSearchParams(location.search).get('subject')||'physics').toLowerCase();const map={physics:{learn:'physics-learn.html'},chemistry:{learn:'chemistry-learn.html'},botany:{learn:'botany-learn.html'},zoology:{learn:'zoology-learn.html'},maths:{learn:'maths-learn.html'}};const d=map[subject]||map.physics;const select=document.getElementById('subjectSelect');select.value=d.learn;select.onchange=()=>{const s=select.value.replace('-learn.html','');location.href=skillUpUrl('league.html',{subject:s})};document.getElementById('frame').src=skillUpUrl('challenge-concepts.html',{subject});document.getElementById('home').href=skillUpUrl('skillup-home.html');document.getElementById('learn').href=skillUpUrl(d.learn);document.getElementById('practice').href=skillUpUrl('practice.html',{subject});document.getElementById('league').href=skillUpUrl('league.html',{subject});document.getElementById('profile').href=skillUpUrl('profile.html');const f=document.getElementById('frame');function clean(){try{const doc=f.contentDocument;if(!doc)return;doc.querySelectorAll('header.top,.top,.footer,nav.footer').forEach(x=>x.style.setProperty('display','none','important'));doc.querySelectorAll('.subjects').forEach(x=>x.style.setProperty('display','none','important'));doc.body.style.background='#fff';doc.documentElement.style.background='#fff';doc.body.style.paddingBottom='0'}catch(e){}}f.addEventListener('load',()=>{clean();setTimeout(clean,100);setTimeout(clean,500);setTimeout(clean,1500);setTimeout(clean,3000)})</script></body></html>
