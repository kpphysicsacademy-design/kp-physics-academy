<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SkillUp | Flashcards</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fb;font-family:Arial,sans-serif;color:#263244}.app{max-width:760px;margin:auto;min-height:100dvh;padding:14px 14px 32px}.top{display:flex;align-items:center;gap:12px}.back{width:46px;height:46px;border:0;border-radius:15px;background:#fff;font-size:24px}.top h1{font-size:21px;margin:0}.top p{margin:4px 0;color:#697386;font-size:13px}.chapter{margin:16px 0;background:linear-gradient(135deg,#182e4f,#223b63);color:#fff;border-radius:22px;padding:18px}.chapter small{opacity:.75;font-weight:700}.chapter strong{display:block;font-size:18px;margin-top:6px}.progressrow{display:flex;align-items:center;gap:12px;margin:18px 2px}.count{font-weight:800;white-space:nowrap}.track{height:10px;flex:1;background:#e1e5ec;border-radius:20px;overflow:hidden}.fill{height:100%;background:#6847c6;width:12%;transition:.25s}.pct{font-weight:800}.card{background:#fff;border-radius:28px;padding:24px;box-shadow:0 8px 28px #23344a12;border:1px solid #e5e8ef;min-height:400px;display:flex;flex-direction:column}.tag{display:inline-block;align-self:flex-start;background:#f0ecff;color:#6045b5;border-radius:12px;padding:7px 11px;font-weight:800;font-size:13px}.card h2{font-size:31px;margin:26px 0 18px;color:#283754}.divider{height:4px;width:54px;background:#6847c6;border-radius:5px}.explanation{font-size:19px;line-height:1.75;margin:24px 0;color:#3b4658}.keys{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}.keys span{background:#f3f0ff;color:#5c45af;padding:8px 11px;border-radius:12px;font-size:14px;font-weight:700}.controls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-top:18px}.controls button{min-height:54px;border-radius:18px;border:1px solid #dce1ea;background:#fff;font-weight:800;font-size:15px}.controls .random{background:#f3f0ff;color:#5f45b4}.controls .next{background:#6042bd;color:#fff;border-color:#6042bd}.controls button:disabled{opacity:.45}@media(max-width:480px){.app{padding:12px}.chapter{padding:16px}.card{padding:20px;min-height:440px}.card h2{font-size:28px}.explanation{font-size:18px}.controls button{font-size:13px}}
</style></head><body><main class="app"><header class="top"><button class="back" onclick="goBack()">←</button><div><h1>SkillUp Flashcards</h1><p>Simple concept-by-concept learning</p></div></header><section class="chapter"><small id="meta">CLASS 6 • SCIENCE</small><strong id="chapterName">The Wonderful World of Science</strong></section><section class="progressrow"><span class="count" id="count"></span><div class="track"><div class="fill" id="fill"></div></div><span class="pct" id="pct"></span></section><section class="card"><span class="tag" id="tag"></span><h2 id="title"></h2><div class="divider"></div><p class="explanation" id="text"></p><div class="keys" id="keys"></div></section><section class="controls"><button id="prev">‹ Previous</button><button class="random" id="random">🔀 Random</button><button class="next" id="next">Next ›</button></section></main><script>
const cards=[{t:'What is Science?',x:'Science is the way we explore and understand the world around us. We observe carefully, ask questions, test ideas and discover answers.',k:['Observation','Questions','Experiments','Answers']},{t:'Curiosity',x:'Curiosity makes us wonder why and how things happen. A curious mind asks questions and looks for evidence instead of accepting everything without thinking.',k:['Why?','How?','Wonder','Discover']},{t:'Observation',x:'Observation means carefully noticing things using our senses and tools. Good observations help us collect useful information before reaching a conclusion.',k:['See','Listen','Measure','Notice']},{t:'Science is Everywhere',x:'Science is part of everyday life. We see it in food, water, weather, plants, machines, medicines and the stars in the sky.',k:['Nature','Weather','Food','Space']},{t:'Living Things',x:'Living things grow, respond and depend on their surroundings. Plants and animals interact with their environment to survive.',k:['Grow','Respond','Need','Environment']},{t:'Testing Ideas',x:'Scientists test ideas instead of only guessing. Evidence collected from observations and experiments helps decide whether an idea is supported.',k:['Idea','Test','Evidence','Result']},{t:'Scientific Method',x:'A simple investigation can follow these steps: observe, ask a question, think of an idea, test it, study the results and form a conclusion.',k:['Observe','Ask','Test','Analyse']},{t:'Keep Exploring',x:'Science is a journey of wondering, investigating and discovering. Every answer can lead to a new question and a new adventure.',k:['Wonder','Explore','Discover','Repeat']}];const $=id=>document.getElementById(id);let i=0;const p=new URLSearchParams(location.search),cls=p.get('class')||'6',sub=p.get('subject')||'science',ch=p.get('chapter')||'1',progressKey='skillup_progress_'+cls+'_'+sub+'_'+ch;function saveFlash(v){let d=JSON.parse(localStorage.getItem(progressKey)||'null')||{flash:0,practice:0,best:0,attempts:0};d.flash=Math.max(Number(d.flash)||0,Math.round(v));localStorage.setItem(progressKey,JSON.stringify(d))}function syncClass6Progress(){if(cls!=='6'||sub!=='science')return;let total=0,chapters={};for(let n=1;n<=12;n++){let d=JSON.parse(localStorage.getItem('skillup_progress_6_science_'+n)||'{}')||{};let flash=Math.min(100,Math.max(0,+d.flash||0)),practice=Math.min(100,Math.max(0,+d.practice||0)),test=Math.min(100,Math.max(0,+d.best||0)),overall=Math.round(flash*.25+practice*.35+test*.40);chapters[n]={flash,practice,test,overall,updatedAt:Date.now()};total+=overall}let subjectProgress=Math.round(total/12);localStorage.setItem('skillup_science_progress_6',JSON.stringify({chapters,subjectProgress,updatedAt:Date.now()}));localStorage.setItem('skillup_class6_progress',JSON.stringify({science:subjectProgress,updatedAt:Date.now()}));}
function render(){const c=cards[i];$('tag').textContent='CONCEPT '+(i+1);$('title').textContent=c.t;$('text').textContent=c.x;$('keys').innerHTML=c.k.map(v=>'<span>'+v+'</span>').join('');$('count').textContent='Card '+(i+1)+' of '+cards.length;const pc=Math.round((i+1)/cards.length*100);$('pct').textContent=pc+'%';$('fill').style.width=pc+'%';saveFlash(pc);syncClass6Progress();$('prev').disabled=i===0;$('next').textContent=i===cards.length-1?'Finish ✓':'Next ›'}function goBack(){location.href='chapter-preparation.html?class='+(p.get('class')||6)+'&subject='+(p.get('subject')||'science')+'&chapter='+(p.get('chapter')||1)}$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<cards.length-1){i++;render()}else{saveFlash(100);goBack()}};$('random').onclick=()=>{let n=i;while(n===i)n=Math.floor(Math.random()*cards.length);i=n;render()};$('meta').textContent='CLASS '+(p.get('class')||6)+' • '+(p.get('subject')||'science').toUpperCase();$('chapterName').textContent=p.get('title')||'The Wonderful World of Science';render();
</script><script type="module">import {backupChapterProgress} from "./skillup-progress-sync.js";window.addEventListener("skillup-progress-changed",()=>backupChapterProgress(6,"science",1));</script></body></html>
