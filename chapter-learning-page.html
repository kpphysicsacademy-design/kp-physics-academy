<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkillUp | Flash Cards</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fb;font-family:Arial,sans-serif;color:#263244}.app{max-width:760px;margin:auto;min-height:100dvh;padding:14px 14px 32px}.top{display:flex;align-items:center;gap:12px}.back{width:46px;height:46px;border:0;border-radius:15px;background:#fff;font-size:24px;box-shadow:0 3px 12px #22334412}.top h1{font-size:21px;margin:0}.top p{margin:4px 0 0;color:#697386;font-size:13px}.chapter{margin:16px 0;background:linear-gradient(135deg,#182e4f,#223b63);color:#fff;border-radius:22px;padding:18px}.chapter small{opacity:.75;font-weight:700}.chapter strong{display:block;font-size:18px;margin-top:6px}.progressrow{display:flex;align-items:center;gap:12px;margin:18px 2px}.count{font-weight:800;white-space:nowrap}.track{height:10px;flex:1;background:#e1e5ec;border-radius:20px;overflow:hidden}.fill{height:100%;width:12.5%;background:#6847c6;border-radius:20px;transition:.25s}.pct{font-weight:800;color:#566074}.card{background:#fff;border-radius:28px;padding:20px;box-shadow:0 8px 28px #23344a12;border:1px solid #e5e8ef}.tag{display:inline-block;background:#f0ecff;color:#6045b5;border-radius:12px;padding:7px 11px;font-weight:800;font-size:13px}.card h2{font-size:30px;margin:14px 0 16px}.visual{height:240px;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#dff2ff,#f4ecff);display:grid;place-items:center}.visual svg{width:100%;height:100%;display:block}.explanation{font-size:18px;line-height:1.65;text-align:center;margin:20px 4px 8px;color:#3b4658}.keys{margin-top:14px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.keys span{background:#f3f0ff;color:#5c45af;padding:7px 10px;border-radius:12px;font-size:13px;font-weight:700}.audio{margin-top:18px;border:1px solid #ded9f4;background:#faf9ff;border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px}.play{width:48px;height:48px;border:0;border-radius:50%;background:#6547c1;color:#fff;font-size:20px}.audioText{flex:1}.audioText b{display:block}.audioText small{color:#6f7787}.wave{height:26px;display:flex;align-items:center;gap:3px}.wave i{display:block;width:3px;background:#7657cf;border-radius:4px}.wave i:nth-child(1){height:8px}.wave i:nth-child(2){height:18px}.wave i:nth-child(3){height:12px}.wave i:nth-child(4){height:24px}.wave i:nth-child(5){height:10px}.wave i:nth-child(6){height:20px}.wave i:nth-child(7){height:14px}.controls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-top:18px}.controls button{min-height:54px;border-radius:18px;border:1px solid #dce1ea;background:#fff;font-weight:800;font-size:15px}.controls .random{background:#f3f0ff;color:#5f45b4}.controls .next{background:#6042bd;color:#fff;border-color:#6042bd}.controls button:disabled{opacity:.45}.hint{text-align:center;color:#7a8494;font-size:13px;margin:14px 0}@media(max-width:480px){.app{padding:12px}.chapter{padding:16px}.card{padding:16px;border-radius:24px}.card h2{font-size:27px}.visual{height:210px}.explanation{font-size:17px}.controls{grid-template-columns:1fr 1fr 1fr}.controls button{font-size:13px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><button class="back" onclick="goBack()">←</button><div><h1>SkillUp Flashcards</h1><p>Learn with visuals, explanations and audio</p></div></header>
<section class="chapter"><small id="meta">CLASS 6 • SCIENCE</small><strong id="chapterName">The Wonderful World of Science</strong></section>
<section class="progressrow"><span class="count" id="count">Card 1 of 8</span><div class="track"><div class="fill" id="fill"></div></div><span class="pct" id="pct">13%</span></section>
<section class="card">
<span class="tag" id="tag">CONCEPT 1</span>
<h2 id="title">What is Science?</h2>
<div class="visual" id="visual"></div>
<p class="explanation" id="text"></p>
<div class="keys" id="keys"></div>
<div class="audio"><button class="play" id="play" aria-label="Play audio">▶</button><div class="audioText"><b id="audioLabel">Listen to this card</b><small>Tap to hear the explanation</small><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>
</section>
<div class="hint">🔊 Audio uses your device's built-in voice</div>
<section class="controls"><button id="prev">‹ Previous</button><button class="random" id="random">🔀 Random</button><button class="next" id="next">Next ›</button></section>
</main>
<script>
const cards=[
{t:'What is Science?',x:'Science is the way we explore and understand the world around us. We observe carefully, ask questions, test ideas and discover answers.',k:['Observation','Questions','Experiments','Answers'],scene:'science'},
{t:'Curiosity',x:'Curiosity makes us wonder why and how things happen. A curious mind asks questions and looks for evidence instead of accepting everything without thinking.',k:['Why?','How?','Wonder','Discover'],scene:'question'},
{t:'Observation',x:'Observation means carefully noticing things using our senses and tools. Good observations help us collect useful information before reaching a conclusion.',k:['See','Listen','Measure','Notice'],scene:'observe'},
{t:'Science is Everywhere',x:'Science is part of everyday life. We see it in food, water, weather, plants, machines, medicines and the stars in the sky.',k:['Nature','Weather','Food','Space'],scene:'world'},
{t:'Living Things',x:'Living things grow, respond and depend on their surroundings. Plants and animals interact with their environment to survive.',k:['Grow','Respond','Need','Environment'],scene:'plant'},
{t:'Testing Ideas',x:'Scientists test ideas instead of only guessing. Evidence collected from observations and experiments helps decide whether an idea is supported.',k:['Idea','Test','Evidence','Result'],scene:'test'},
{t:'Scientific Method',x:'A simple investigation can follow these steps: observe, ask a question, think of an idea, test it, study the results and form a conclusion.',k:['Observe','Ask','Test','Analyse'],scene:'method'},
{t:'Keep Exploring',x:'Science is a journey of wondering, investigating and discovering. Every answer can lead to a new question and a new adventure.',k:['Wonder','Explore','Discover','Repeat'],scene:'space'}
];
const $=id=>document.getElementById(id);let i=0;const p=new URLSearchParams(location.search);
function scene(type){const label=cards[i].t;const art={science:['🔬','🧪','🌱'],question:['❓','💡','🔍'],observe:['👀','🔍','📏'],world:['🌍','☀️','⚙️'],plant:['🌱','🦋','☀️'],test:['🧪','⚗️','📊'],method:['👀','❓','🧪'],space:['🚀','🌙','⭐']}[type]||['🔬','💡','🌍'];return '<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+label+' illustration"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#d9f3ff"/><stop offset="1" stop-color="#eee5ff"/></linearGradient></defs><rect width="700" height="360" rx="28" fill="url(#g)"/><circle cx="110" cy="80" r="42" fill="#ffd86b" opacity=".8"/><circle cx="620" cy="65" r="60" fill="#c5b6ff" opacity=".45"/><rect x="60" y="265" width="580" height="38" rx="18" fill="#8f6a48"/><circle cx="350" cy="175" r="76" fill="#f4b77d"/><path d="M275 160q75-110 150 0v-42q-75-70-150 0z" fill="#27364d"/><circle cx="323" cy="178" r="8" fill="#263244"/><circle cx="377" cy="178" r="8" fill="#263244"/><path d="M330 214q20 16 40 0" fill="none" stroke="#9b5143" stroke-width="7" stroke-linecap="round"/><text x="165" y="250" font-size="72">'+art[0]+'</text><text x="305" y="280" font-size="82">'+art[1]+'</text><text x="470" y="245" font-size="72">'+art[2]+'</text><rect x="150" y="32" width="400" height="55" rx="22" fill="#fff" opacity=".88"/><text x="350" y="68" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#34405a">'+label+'</text></svg>'}
function render(){const c=cards[i];$('tag').textContent='CONCEPT '+(i+1);$('title').textContent=c.t;$('text').textContent=c.x;$('visual').innerHTML=scene(c.scene);$('keys').innerHTML=c.k.map(v=>'<span>'+v+'</span>').join('');$('count').textContent='Card '+(i+1)+' of '+cards.length;const percent=Math.round((i+1)/cards.length*100);$('pct').textContent=percent+'%';$('fill').style.width=percent+'%';$('prev').disabled=i===0;$('next').textContent=i===cards.length-1?'Finish ✓':'Next ›';}
function speak(){if(!('speechSynthesis' in window)){alert('Audio is not supported on this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cards[i].t+'. '+cards[i].x);u.rate=.9;u.onstart=()=>{$('play').textContent='■';$('audioLabel').textContent='Playing explanation...'};u.onend=()=>{$('play').textContent='▶';$('audioLabel').textContent='Listen to this card'};speechSynthesis.speak(u)}
function goBack(){const q='class='+(p.get('class')||6)+'&subject='+(p.get('subject')||'science')+'&chapter='+(p.get('chapter')||1);location.href='chapter-preparation.html?'+q}
$('play').onclick=speak;$('prev').onclick=()=>{if(i>0){i--;speechSynthesis.cancel();render()}};$('next').onclick=()=>{if(i<cards.length-1){i++;speechSynthesis.cancel();render()}else{goBack()}};$('random').onclick=()=>{let n=i;while(n===i)n=Math.floor(Math.random()*cards.length);i=n;speechSynthesis.cancel();render()};
$('meta').textContent='CLASS '+(p.get('class')||6)+' • '+(p.get('subject')||'science').toUpperCase();$('chapterName').textContent=p.get('title')||'The Wonderful World of Science';render();
</script>
</body></html>
