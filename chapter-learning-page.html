<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Chapter Learning</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fb;font-family:Arial,sans-serif;color:#263244}.flash-only{min-height:100vh;max-width:820px;margin:auto;padding:70px 30px 80px;display:flex;flex-direction:column;justify-content:center}.flash-card{position:relative;min-height:650px;background:#fff;border:1px solid #dfe3ea;border-radius:42px;padding:55px 45px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 12px 35px rgba(39,48,68,.06);cursor:pointer}.badge{position:absolute;top:55px;left:55px;background:linear-gradient(135deg,#6b52c2,#4c3996);color:#fff;border-radius:20px;padding:18px 28px;font-size:25px;font-weight:700}.icon{font-size:78px;margin:25px 0 38px}.flash-card h1{font-size:48px;margin:0 0 40px}.flash-card p{max-width:620px;font-size:28px;line-height:1.7;color:#556170;margin:0}.hint{margin-top:65px;font-size:20px;color:#7b8695}.progress{margin:55px 0 35px;text-align:center}.count{font-size:28px;margin-bottom:25px}.track{height:16px;border-radius:20px;background:#dfe4ed;overflow:hidden}.fill{height:100%;width:12.5%;background:#5a3cb5;border-radius:20px;transition:.3s}.controls{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:22px}.controls button{min-height:78px;border-radius:40px;border:1px solid #d6d9e1;background:#fff;font-size:24px;color:#596273;cursor:pointer}.controls .flip{background:linear-gradient(135deg,#6247bb,#5035a8);color:#fff;border:0;font-weight:700}.controls button:disabled{opacity:.45}@media(max-width:600px){.flash-only{padding:45px 20px 45px}.flash-card{min-height:600px;padding:35px 24px;border-radius:34px}.badge{top:40px;left:35px;font-size:21px;padding:15px 22px}.icon{font-size:68px;margin:55px 0 35px}.flash-card h1{font-size:38px}.flash-card p{font-size:24px}.controls{gap:12px}.controls button{font-size:18px;min-height:70px}.progress{margin:42px 0 28px}}
.back-top{position:fixed;top:14px;left:14px;z-index:10;border:1px solid #d9dde6;background:#fff;border-radius:28px;padding:12px 18px;font-size:16px;font-weight:700;color:#4d4770;box-shadow:0 3px 12px rgba(0,0,0,.08);cursor:pointer}
@media(max-width:600px){.flash-only{min-height:100dvh;width:100%;max-width:none;padding:74px 14px 20px;justify-content:center}.back-top{top:12px;left:12px;padding:11px 15px}.flash-card{width:100%;min-height:calc(100dvh - 250px);max-height:720px;border-radius:30px;padding:30px 20px}.badge{top:30px;left:25px}.icon{margin-top:70px}.flash-card h1{font-size:34px}.flash-card p{font-size:21px;line-height:1.55}.hint{margin-top:38px}.progress{margin:24px 0 18px}.count{font-size:24px;margin-bottom:15px}.track{height:12px}.controls{position:sticky;bottom:8px;grid-template-columns:1fr 1.25fr 1fr}.controls button{min-height:60px;font-size:16px}.controls button:first-child{font-size:0}.controls button:first-child:after{content:'‹';font-size:28px}.controls button:last-child{font-size:0}.controls button:last-child:after{content:'›';font-size:28px}}
</style>
</head>
<body>
<main class="flash-only"><button class="back-top" onclick="goBack()">← <span>Back</span></button>
<section class="flash-card" id="card" aria-label="Flash card">

<div class="icon" id="icon">💡</div>
<h1 id="title">What is Science?</h1>
<p id="text">Science is a systematic way of understanding the natural world through observation and experimentation.</p>
<div class="hint">Tap the card to flip</div>
</section>
<section class="progress"><div class="count" id="count">1 / 8</div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="controls"><button id="prev">‹ Previous</button><button class="flip" id="flip">↻ Flip Card</button><button id="next">Next ›</button></section>
</main>
<script>
const conceptParam=new URLSearchParams(location.search).get('concept');
const cards=[
['💡','What is Science?','Science is a systematic way of understanding the natural world through observation and experimentation.','Science helps us observe, ask questions, test ideas and understand the world.'],
['❓','Curiosity','Curiosity makes us ask questions about the things we see around us.','Questions are often the beginning of discovery.'],
['👀','Observation','Observation means carefully noticing things using our senses and tools.','Careful observation gives us information before we draw conclusions.'],
['🌍','Science is Everywhere','Science is present in nature, food, water, weather, machines and space.','Everyday life gives us many chances to explore science.'],
['🌱','Living Things','Living things grow, respond and depend on their surroundings.','Plants and animals interact with their environment to survive.'],
['🧪','Testing Ideas','Scientists test ideas and collect evidence instead of only guessing.','Evidence helps us decide whether an explanation is supported.'],
['🔬','Scientific Method','Observe, ask, think, test and analyse to investigate a question.','A clear process helps us investigate problems in an organised way.'],
['🚀','Keep Exploring','Science is a journey of observing, wondering and discovering.','Every answer can lead to a new question.']
];
let i=Math.max(0,cards.findIndex(c=>conceptParam&&c[1].toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-$/,'')===conceptParam)); if(i<0)i=0; let back=false;const $=id=>document.getElementById(id);
function goBack(){const from=new URLSearchParams(location.search).get('from');if(from==='chapter-preparation'){location.href='chapter-preparation.html'}else if(document.referrer&&document.referrer.includes(location.host)){history.back()}else{location.href='chapter-preparation.html'}}
function render(){const c=cards[i];back=false;$('icon').textContent=c[0];$('title').textContent=c[1];$('text').textContent=c[2];$('count').textContent=(i+1)+' / '+cards.length;$('fill').style.width=((i+1)/cards.length*100)+'%';$('prev').disabled=i===0;$('next').textContent=i===cards.length-1?'Finish ✓':'Next ›';}
function flip(){back=!back;$('text').textContent=back?cards[i][3]:cards[i][2];}
$('card').onclick=flip;$('flip').onclick=flip;$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<cards.length-1){i++;render()}else{alert('🎉 Flash cards completed!')}};render();
</script>
</body></html>
