<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Teacher Login | KP Physics Academy</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#031326,#0b3158);color:#0b1930;min-height:100vh;display:grid;place-items:center}.card{width:min(440px,calc(100% - 32px));background:#fff;border-radius:22px;padding:34px;box-shadow:0 18px 50px #0004}.logo{text-align:center;font-size:27px;font-weight:900;color:#1687ff}.badge{width:max-content;margin:12px auto 0;padding:7px 13px;border-radius:20px;background:#fff4c7;color:#7a5600;font-size:12px;font-weight:800}.sub{text-align:center;color:#718096;margin:12px 0 25px}label{display:block;font-weight:700;margin:15px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d6dfeb;border-radius:9px;font-size:15px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#1687ff;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.back{display:block;text-align:center;margin-top:20px;color:#1687ff;font-weight:700;text-decoration:none}.student{display:block;text-align:center;margin-top:18px;padding-top:18px;border-top:1px solid #e5eaf1;color:#1687ff;font-weight:800;text-decoration:none}.msg{margin-top:15px;padding:12px;border-radius:9px;display:none;line-height:1.5;background:#fff3f3;color:#8b0000}</style></head><body><div class="card"><div class="logo">KP PHYSICS ACADEMY</div><div class="badge">👨‍🏫 TEACHER AREA</div><div class="sub">Sign in to manage classes, chapters, concepts, formulas and learning content.</div><label>Email</label><input id="email" type="email" placeholder="Teacher email"><label>Password</label><input id="password" type="password" placeholder="Teacher password"><button onclick="teacherLogin()">Teacher Login</button><div class="msg" id="msg"></div><a class="student" href="login.html">👨‍🎓 Student Login →</a><a class="back" href="index.html">← Back to Home</a></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),msg=document.getElementById('msg');function show(t){msg.textContent=t;msg.style.display='block'}window.teacherLogin=async()=>{try{const c=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);const snap=await getDoc(doc(db,'users',c.user.uid));if(!snap.exists()||snap.data().role!=='teacher'){await auth.signOut();show('This account is not registered as a teacher. Please use Student Login or contact the academy administrator.');return}location.href='teacher-dashboard.html'}catch(e){show(e.message)}};</script></body></html>
