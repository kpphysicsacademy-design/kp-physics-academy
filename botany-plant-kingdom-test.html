<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plant Kingdom Tests | SkillUp</title><style>:root{--g:#58cc02;--gd:#46a302;--ink:#4b4b4b;--line:#e5e5e5}*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:var(--ink)}.w{max-width:720px;margin:auto;padding:18px 14px 40px}.test-nav{display:flex;gap:10px;align-items:center;font-weight:900;margin-bottom:18px}.test-nav a,.back{color:#777;text-decoration:none}.hero,.topic,.quiz{background:#fff;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:20px;padding:20px;margin:14px 0}.hero{text-align:center}.mascot{font-size:50px}.mode{background:#eaf8df;color:#46a302;border-radius:14px;padding:10px;font-weight:900;margin-top:12px}.label{font-size:13px;font-weight:900;color:#777;letter-spacing:1px;margin:20px 4px 8px}.topic{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}.num{width:36px;height:36px;border-radius:12px;background:#eaf8df;color:#46a302;display:grid;place-items:center;font-weight:900}.topic-emoji{font-size:29px}.copy{flex:1}.copy b,.copy small{display:block}.copy small{color:#777;margin-top:4px}.start,.next-btn,.primary{background:var(--g);color:#fff;border:0;border-bottom:4px solid var(--gd);border-radius:12px;padding:11px;font-weight:900}.progress{height:14px;background:#e5e5e5;border-radius:20px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:var(--g)}.opts{display:grid;gap:12px}.opts button{background:#fff;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:15px;padding:15px;text-align:left;font-weight:800}.correct{border-color:#58cc02!important;background:#f1ffe8!important}.wrong{border-color:#ff4b4b!important;background:#fff0f0!important}#fb{background:#f4fbef;border-radius:14px;padding:14px;line-height:1.5;font-weight:700}.next-btn{width:100%;margin-top:12px}.done{display:none}.review{text-align:left;margin-top:20px}.review-item{background:#fff7f7;border:2px solid #ffd5d5;border-radius:14px;padding:14px;margin:10px 0}@media(max-width:520px){.topic{padding:14px}.start{font-size:10px}}.home-nav{position:fixed;top:12px;left:12px;z-index:1000;width:46px;height:46px;display:grid;place-items:center;background:#fff;border:2px solid #e5e5e5;border-bottom:5px solid #d6d6d6;border-radius:16px;text-decoration:none;font-size:23px;box-shadow:0 4px 12px rgba(0,0,0,.08)}</style></head><body><a class="home-nav" href="skillup-home.html" aria-label="Go to SkillUp Home">🏠</a><main class="w"><nav class="test-nav"><a href="botany-plant-kingdom.html">🌿 Plant Kingdom</a><span>›</span><b>🧪 Tests</b></nav><a class="back" href="botany-plant-kingdom.html">← Back to Chapter</a><div id="app"></div></main><script>const topics={"basis-classification":[["Which feature is important in plant classification?","Body organisation","Only colour","Only habitat","Only age",0],["Vascular tissue is absent in:","Bryophytes","Gymnosperms","Angiosperms","All seed plants",0],["Seed plants are distinguished by:","Seed formation","Absence of reproduction","No tissues","No cells",0]],"algae":[["Algae are mostly:","Aquatic","Desert animals","Parasitic mammals","Terrestrial insects",0],["Green algae belong to:","Chlorophyceae","Phaeophyceae only","Gymnosperms","Bryophytes",0],["The algal plant body is generally:","Thalloid","Always woody","Always flowering","Always vascular",0]],"bryophytes":[["Bryophytes are called amphibians because they:","Need water for sexual reproduction","Live only in oceans","Have seeds","Produce flowers",0],["Dominant phase in bryophytes is:","Gametophyte","Sporophyte","Seed","Fruit",0],["A bryophyte example is:","Funaria","Pinus","Mango","Cycas",0]],"pteridophytes":[["Pteridophytes possess:","Vascular tissue","Flowers","Fruits","Naked seeds",0],["Pteridophytes reproduce mainly by:","Spores","Fruits","Flowers","Naked seeds",0],["Heterospory is important because it relates to:","Seed habit evolution","Loss of reproduction","Flower formation only","Fruit ripening",0]],"gymnosperms":[["Gymnosperm seeds are:","Naked","Inside fruits","Absent","Produced by fungi",0],["A gymnosperm example is:","Pinus","Funaria","Spirogyra","Marchantia",0],["Gymnosperm ovules are:","Not enclosed in an ovary","Always inside fruits","Absent","Inside flowers",0]],"angiosperms":[["Angiosperms are:","Flowering plants","Seedless plants","Non-vascular plants","Algae",0],["A unique feature of angiosperms is:","Double fertilisation","No fertilisation","No seeds","No ovules",0],["Seeds of angiosperms are enclosed in:","Fruits","Spores","Cones only","Rhizoids",0]],"life-cycles":[["A life cycle with dominant haploid phase is:","Haplontic","Diplontic","Only sporophytic","None",0],["Both multicellular haploid and diploid phases occur in:","Haplodiplontic","Only diplontic","Only haplontic","None",0],["Alternation of generations involves:","Haploid and diploid phases","Only seeds","Only flowers","Only fruits",0]],"comparison":[["Flowers are characteristic of:","Angiosperms","Bryophytes","Pteridophytes","Algae",0],["Vascular tissue first appears prominently in:","Pteridophytes","Bryophytes","Algae","None",0],["Seeds occur in:","Gymnosperms and angiosperms","Algae only","Bryophytes only","Pteridophytes only",0]],"reproduction":[["Seedless plants commonly reproduce by:","Spores","Fruits","Flowers","Naked seeds",0],["Heterospory produces:","Two kinds of spores","Only seeds","Only fruits","No reproductive structures",0],["Seed habit evolved with protection and retention of:","Megaspore","Fruit only","Leaf","Stem",0]],"ncert-identification":[["Which is a bryophyte?","Marchantia","Pinus","Mango","Cycas",0],["Which is a gymnosperm?","Cycas","Funaria","Ulothrix","Marchantia",0],["Which feature best identifies angiosperms?","Flowers","Rhizoids","Thallus","Spores only",0]]},keys=["basis-classification","algae","bryophytes","pteridophytes","gymnosperms","angiosperms","life-cycles","comparison","reproduction","ncert-identification"],labels=["Basis of Classification","Algae","Bryophytes","Pteridophytes","Gymnosperms","Angiosperms","Plant Life Cycles","Comparative Plant Groups","Reproduction & Seed Habit","NCERT Examples & Identification"],emojis=["🌱","🌊","🌿","🍃","🌲","🌸","🔄","📊","🧬","📚"];const explanations={"basis-classification":"Plant classification uses structural and reproductive characters such as body organisation, vascular tissue and seeds.","algae":"Algae are mostly aquatic and commonly have a simple thalloid body.","bryophytes":"Bryophytes require water for sexual reproduction and have a dominant gametophyte.","pteridophytes":"Pteridophytes are seedless vascular plants that reproduce through spores.","gymnosperms":"Gymnosperms produce naked seeds because their ovules are not enclosed within an ovary.","angiosperms":"Angiosperms are flowering plants and show double fertilisation.","life-cycles":"Plant life cycles differ according to the dominant haploid and diploid phases.","comparison":"Vascular tissue, seeds and flowers are high-yield features for comparing plant groups.","reproduction":"Heterospory was an important evolutionary step toward the development of seed habit.","ncert-identification":"NCERT examples and diagnostic features help identify the correct plant group."};const app=document.getElementById('app');const key=new URLSearchParams(location.search).get('topic');function showList(){app.innerHTML='<section class="hero"><div class="mascot">🌿</div><h1>Choose a Plant Kingdom Test</h1><p>Answer at your own pace and learn from explanations.</p><div class="mode">🎯 PLANT KINGDOM • CONCEPT-WISE TESTS</div></section><div class="label">CHOOSE A SKILL</div>'+keys.map((k,i)=>'<a class="topic" href="?topic='+k+'"><span class="num">'+(i+1)+'</span><span class="topic-emoji">'+emojis[i]+'</span><span class="copy"><b>'+labels[i]+'</b><small>'+topics[k].length+' questions</small></span><span class="start">START →</span></a>').join('')}function showTest(){const qs=topics[key];let i=0,score=0,wrong=[];app.innerHTML='<section class="hero"><div class="mascot">'+emojis[keys.indexOf(key)]+'</div><h1>'+labels[keys.indexOf(key)]+'</h1><div class="progress"><span id="bar"></span></div><b id="status"></b></section><section class="quiz" id="quiz"></section><section class="hero done" id="done"><div class="mascot">🏆</div><h1>Skill Complete!</h1><p id="final"></p><div id="review"></div><button class="primary" onclick="location.reload()">TRY AGAIN</button></section>';const quiz=document.getElementById('quiz'),bar=document.getElementById('bar'),status=document.getElementById('status'),done=document.getElementById('done'),final=document.getElementById('final'),review=document.getElementById('review');function render(){const q=qs[i];status.textContent='Question '+(i+1)+' / '+qs.length;const opts=q.slice(1,5).map((text,index)=>({text,index}));for(let x=opts.length-1;x>0;x--){const y=Math.floor(Math.random()*(x+1));[opts[x],opts[y]]=[opts[y],opts[x]]}quiz.innerHTML='<b>QUESTION '+(i+1)+' OF '+qs.length+'</b><h2>'+q[0]+'</h2><div class="opts">'+opts.map((o,n)=>'<button data-index="'+o.index+'">'+String.fromCharCode(65+n)+'. '+o.text+'</button>').join('')+'</div><div id="fb"></div>';document.querySelectorAll('.opts button').forEach(btn=>btn.onclick=()=>answer(Number(btn.dataset.index),q))}function answer(choice,q){const buttons=[...document.querySelectorAll('.opts button')];buttons.forEach(b=>{b.disabled=true;if(Number(b.dataset.index)===q[5])b.classList.add('correct')});const fb=document.getElementById('fb');if(choice===q[5]){score++;fb.innerHTML='🎉 <b>Correct!</b><br>💡 '+explanations[key]}else{const selected=buttons.find(b=>Number(b.dataset.index)===choice);if(selected)selected.classList.add('wrong');wrong.push({q:q[0],selected:q[choice+1],correct:q[q[5]+1]});fb.innerHTML='💪 <b>Keep learning!</b><br>💡 '+explanations[key]}const next=document.createElement('button');next.className='next-btn';next.textContent=i===qs.length-1?'FINISH →':'NEXT →';next.onclick=nextQuestion;fb.appendChild(document.createElement('br'));fb.appendChild(next)}function nextQuestion(){i++;bar.style.width=(i/qs.length*100)+'%';if(i<qs.length){render();return}quiz.style.display='none';final.textContent='Score: '+score+' / '+qs.length;if(wrong.length){review.innerHTML='<div class="review"><h2>📝 Review Wrong Attempts</h2>'+wrong.map((x,n)=>'<div class="review-item"><b>'+(n+1)+'. '+x.q+'</b><p>❌ Your answer: '+x.selected+'</p><p>✅ Correct answer: '+x.correct+'</p></div>').join('')+'</div>'}else review.innerHTML='<p>🎉 Perfect score! No wrong attempts to review.</p>';done.style.display='block'}render()}if(key&&topics[key])showTest();else showList();</script></body></html>
