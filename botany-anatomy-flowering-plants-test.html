const labels={meristem:"🧫 Meristematic Tissues",permanent:"🌿 Permanent Tissues",complex:"🚰 Complex Tissues",root:"🥕 Root Anatomy",stem:"🌿 Stem Anatomy",leaf:"🍃 Leaf Anatomy",secondary:"🌳 Secondary Growth"};const app=document.getElementById("app"),key=new URLSearchParams(location.search).get("topic");function list(){app.innerHTML='<section class="hero"><div class="mascot">🌸</div><h1>Anatomy Tests</h1><p>Concept-wise NCERT and NEET practice.</p><div class="mode">🎯 6 SKILLS • 30 QUESTIONS</div></section><div class="label">CHOOSE A TEST</div>'+Object.keys(topics).map((k,i)=>'<a class="topic" href="?topic='+k+'"><span class="num">'+(i+1)+'</span><span class="emoji">'+labels[k].split(" ")[0]+'</span><span class="copy"><b>'+labels[k]+'</b><small>'+topics[k].length+' questions</small></span><span class="start">START →</span></a>').join("")}function test(){const qs=topics[key];let i=0,score=0,wrong=[];app.innerHTML='<section class="hero"><div class="mascot">'+labels[key].split(" ")[0]+'</div><h1>'+labels[key]+'</h1><div class="progress"><span id="bar"></span></div><b id="status"></b></section><section class="quiz" id="quiz"></section><section class="hero done" id="done"><div class="mascot">🏆</div><h1>Test Complete!</h1><p id="final"></p><div id="review"></div><button class="primary" onclick="location.reload()">TRY AGAIN</button></section>';const quiz=document.getElementById("quiz"),bar=document.getElementById("bar"),status=document.getElementById("status"),done=document.getElementById("done");function render(){const q=qs[i];status.textContent='Question '+(i+1)+' / '+qs.length;let o=q.slice(1,5).map((t,n)=>({t,n}));o.sort(()=>Math.random()-.5);quiz.innerHTML='<b>QUESTION '+(i+1)+' OF '+qs.length+'</b><h2>'+q[0]+'</h2><div class="opts">'+o.map((x,n)=>'<button data-i="'+x.n+'">'+String.fromCharCode(65+n)+'. '+x.t+'</button>').join("")+'</div><div id="fb"></div>';document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>answer(+b.dataset.i,q))}function answer(ch,q){const bs=[...document.querySelectorAll(".opts button")],fb=document.getElementById("fb");bs.forEach(b=>{b.disabled=true;if(+b.dataset.i===q[5])b.classList.add("correct")});if(ch===q[5]){score++;fb.innerHTML="🎉 <b>Correct!</b>"}else{bs.find(b=>+b.dataset.i===ch)?.classList.add("wrong");wrong.push(q);fb.innerHTML="💡 <b>Keep learning!</b><br>Correct answer: "+q[q[5]+1]}fb.innerHTML+='<button class="next">'+(i===qs.length-1?"FINISH →":"NEXT →")+"</button>";fb.querySelector("button").onclick=()=>{i++;bar.style.width=(i/qs.length*100)+"%";if(i<qs.length)render();else{quiz.style.display="none";document.getElementById("final").textContent="Score: "+score+" / "+qs.length;document.getElementById("review").innerHTML=wrong.length?'<h2>📝 Review Wrong Answers</h2>'+wrong.map(q=>'<div class="review-item"><b>'+q[0]+'</b><p>✅ '+q[q[5]+1]+'</p></div>').join(""):"🎉 Perfect score!";done.style.display="block"}}}render()}key&&topics[key]?test():list();
