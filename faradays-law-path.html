ity Concept','Damping','Rod Motion','JEE Advanced Problems']],['🔴','09 • JEE Main & Advanced',['Magnetic Flux','Faraday Formula','Flux Change','Motional EMF','Rotating Coil','Rod on Rails','Graph Questions','Mixed JEE Main Test','JEE Advanced Challenge']],['🏆','10 • Final Mastery',['Foundations Test','Flux Test','Faraday Formula Test','Motional EMF Test','Changing Geometry Test','Advanced Induction Test','Mixed JEE Test','JEE Mastery Test','Wrong-Question Revision','Final Unseen Mastery']]];let n=0,out='';sections.forEach(s=>{out+=`<section class="section"><h2>${s[0]} ${s[1]}</h2><p class="muted">${s[2].length} lessons • 5 MCQs per task</p><div class="path">`;s[2].forEach(x=>{const i=n++;out+=`<div class="lesson"><div class="card"><h3>${i+1}. ${x}</h3><p>${s[1]} • Zero → Hero</p><span class="tag">🔓 UNLOCKED</span><a class="btn" href="jee-physics-lesson-shuffled.html?topic=faradays-law&lesson=${i+1}">Start Task →</a></div></div>`});out+='</div></section>'});document.getElementById('content').innerHTML=out;</script></main></body></html>
