<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Admin | MCQ Upload</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f8fb;color:#182230}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 4px 18px #0001}button{padding:12px 18px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700;cursor:pointer}input{margin:12px 0}.hidden{display:none}.stat{display:inline-block;margin:8px 20px 8px 0}.ok{color:#15803d}.err{color:#dc2626}progress{width:100%;height:20px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><main class="wrap"><h1>🔐 SkillUp Admin</h1><p>Bulk MCQ CSV Upload</p><section class="card"><h2>📁 Select CSV</h2><input id="csv" type="file" accept=".csv,text/csv"><br><button onclick="validateCSV()">🔍 Validate & Preview</button></section><section id="results" class="card hidden"><h2>📊 Validation Results</h2><div class="stat">Total: <b id="total">0</b></div><div class="stat ok">Valid: <b id="valid">0</b></div><div class="stat err">Errors: <b id="errors">0</b></div><h3>Preview</h3><table id="preview"></table><br><button id="uploadBtn" onclick="uploadQuestions()">☁️ Upload Questions</button><div id="uploadStatus" class="hidden"><p id="status"></p><progress id="progress" value="0" max="100"></progress></div></section></main><script>let rows=[];const required=['id','class','subject','chapter','topic','difficulty','question','option_a','option_b','option_c','option_d','correct_answer','explanation'];function parseCSV(t){const lines=t.replace(/\r/g,'').split('\n').filter(x=>x.trim());const h=lines[0].split(',').map(x=>x.trim());return lines.slice(1).map((line,i)=>{let a=line.split(',');let o={};h.forEach((k,j)=>o[k]=(a[j]||'').trim());o._line=i+2;return o})}function validateCSV(){const f=document.getElementById('csv').files[0];if(!f)return alert('Choose a CSV file');const r=new FileReader();r.onload=e=>{rows=parseCSV(e.target.result);let errors=0,seen=new Set();rows.forEach(x=>{x._valid=required.every(k=>x[k]);if(seen.has(x.id))x._valid=false;seen.add(x.id);if(!x._valid)errors++});document.getElementById('total').textContent=rows.length;document.getElementById('valid').textContent=rows.length-errors;document.getElementById('errors').textContent=errors;let p=document.getElementById('preview');p.innerHTML='<tr>'+required.slice(0,7).map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.slice(0,10).map(x=>'<tr>'+required.slice(0,7).map(k=>'<td>'+String(x[k]).replace(/</g,'&lt;')+'</td>').join('')+'</tr>').join('');document.getElementById('results').classList.remove('hidden')};r.readAsText(f)}async function uploadQuestions(){const good=rows.filter(x=>x._valid);if(!good.length)return alert('No valid questions');document.getElementById('uploadStatus').classList.remove('hidden');const p=document.getElementById('progress'),s=document.getElementById('status');s.textContent='Preparing upload...';for(let i=0;i<good.length;i++){p.value=Math.round((i+1)/good.length*100);s.textContent='Ready '+(i+1)+' / '+good.length+' questions';}s.textContent='Validation complete. Connect Firebase Firestore configuration to enable secure database upload.'}</script></body></html>
