<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard | KP Physics Academy</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#0b1930}header{background:#031326;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.card{background:#fff;border-radius:18px;padding:25px;box-shadow:0 8px 25px #0b193012;margin-bottom:22px}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d6dfeb;border-radius:9px;font:inherit}textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}button{border:0;border-radius:8px;padding:11px 16px;background:#1687ff;color:#fff;font-weight:800;cursor:pointer;margin-top:15px}.danger{background:#d33}.list{display:grid;gap:10px}.item{border:1px solid #dfe7f0;border-radius:12px;padding:15px;display:flex;justify-content:space-between;gap:15px;align-items:center}.item button{margin:0}.muted{color:#718096}@media(max-width:700px){.row{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start}}</style></head><body><header><strong>KP PHYSICS ACADEMY • TEACHER</strong><button onclick="logout()">Logout</button></header><main class="wrap"><div class="card"><h1>Teacher Content Studio</h1><p class="muted">Create and update concepts that students will see in their class dashboard.</p><form id="form"><div class="row"><div><label>Class</label><select id="classNo"><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div><div><label>Chapter</label><input id="chapter" placeholder="e.g. Motion"></div></div><label>Concept title</label><input id="title" placeholder="e.g. What is speed?"><label>Child-friendly explanation</label><textarea id="explanation" placeholder="Explain the idea in simple language..."></textarea><div class="row"><div><label>Example</label><textarea id="example" placeholder="A simple real-life example..."></textarea></div><div><label>Formula (optional)</label><textarea id="formula" placeholder="v = d/t"></textarea></div></div><label>Image URL (optional)</label><input id="imageUrl" placeholder="https://..."><button type="submit">Save / Publish Concept</button><button type="button" class="danger" onclick="clearForm()">Clear</button></form><p id="msg" class="muted"></p></div><div class="card"><h2>Published Concepts</h2><div id="list" class="list">Loading...</div></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),db=getFirestore(app);let editingId=null;const $=id=>document.getElementById(id);window.logout=()=>location.href='index.html';$('form').onsubmit=async e=>{e.preventDefault();const data={classNo:Number($('classNo').value),chapter:$('chapter').value.trim(),title:$('title').value.trim(),explanation:$('explanation').value.trim(),example:$('example').value.trim(),formula:$('formula').value.trim(),imageUrl:$('imageUrl').value.trim(),updatedAt:serverTimestamp()};if(!data.title||!data.explanation){$('msg').textContent='Please add a concept title and explanation.';return}try{if(editingId){const{updateDoc}=await import('https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js');await updateDoc(doc(db,'concepts',editingId),data)}else await addDoc(collection(db,'concepts'),{...data,createdAt:serverTimestamp()});$('msg').textContent='Concept saved successfully.';clearForm();loadList()}catch(e){$('msg').textContent=e.message}};async function loadList(){const box=$('list');try{const s=await getDocs(collection(db,'concepts'));box.innerHTML='';if(s.empty){box.innerHTML='<p class="muted">No concepts yet.</p>';return}s.forEach(x=>{const d=x.data(),el=document.createElement('div');el.className='item';el.innerHTML='<div><b>Class '+d.classNo+' • '+esc(d.title||'')+'</b><div class="muted">'+esc(d.chapter||'')+'</div></div><div><button data-edit>Edit</button> <button class="danger" data-del>Delete</button></div>';el.querySelector('[data-edit]').onclick=()=>edit(x.id,d);el.querySelector('[data-del]').onclick=async()=>{if(confirm('Delete this concept?')){await deleteDoc(doc(db,'concepts',x.id));loadList()}};box.appendChild(el)})}catch(e){box.innerHTML='<p class="muted">Unable to load content. Check Firebase configuration/rules.</p>'}}function edit(id,d){editingId=id;$('classNo').value=d.classNo;$('chapter').value=d.chapter||'';$('title').value=d.title||'';$('explanation').value=d.explanation||'';$('example').value=d.example||'';$('formula').value=d.formula||'';$('imageUrl').value=d.imageUrl||'';window.scrollTo({top:0,behavior:'smooth'})}window.clearForm=()=>{editingId=null;$('form').reset();$('msg').textContent='Ready for a new concept.'};function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}loadList();</script></body></html>
