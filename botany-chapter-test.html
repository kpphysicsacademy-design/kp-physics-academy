<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Test</title><style>body{font-family:Arial;margin:0;background:#f7f7f7;color:#333}.w{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border:2px solid #e5e5e5;border-bottom:5px solid #ddd;border-radius:20px;padding:20px;margin:14px 0}.hero{text-align:center}.opts button,.btn{width:100%;margin:8px 0;padding:14px;border-radius:14px;border:2px solid #ddd;background:#fff;font-weight:bold;text-align:left}.btn{display:block;text-align:center;background:#58cc02;color:#fff;text-decoration:none;border:0}</style></head><body><main class="w" id="app"></main><script>const ch=new URLSearchParams(location.search).get('chapter')||'Botany Chapter';let i=0,score=0;const qs=[['The best source for NEET chapter preparation is:',['NCERT concepts','Random guessing','Skipping revision','Only formulas'],0],['A strong learning strategy includes:',['Concepts, practice and revision','Only one test','No NCERT reading','Avoiding mistakes'],0],['After learning a topic, you should:',['Practice and analyse errors','Forget it','Skip tests','Stop revision'],0],['Revision helps improve:',['Retention and recall','Confusion only','Nothing','Luck'],0],['NEET questions often test:',['Conceptual understanding and application','Only handwriting','Only attendance','None'],0]];function render(){if(i===qs.length){app.innerHTML='<section class="card hero"><h1>🏆 Test Complete</h1><p>'+ch+'</p><h2>Score: '+score+' / '+qs.length+'</h2><a class="btn" href="botany-full-path.html">BACK TO PATH</a></section>';return}let q=qs[i];app.innerHTML='<section class="card hero"><h1>🎯 '+ch+'</h1><p>Question '+(i+1)+' of '+qs.length+'</p></section><section class="card"><h2>'+q[0]+'</h2><div class="opts">'+q[1].map((o,n)=>'<button onclick="ans('+n+')">'+String.fromCharCode(65+n)+'. '+o+'</button>').join('')+'</div></section>'}function ans(n){if(n===qs[i][2])score++;i++;render()}render();</script></main></body></html>
