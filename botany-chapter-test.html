or:#777;text-decoration:none;font-weight:900}.nav{margin:4px 0 12px}</style></head><body><main class="w"><div class="nav"><a class="back" href="botany-chapter-learn.html?chapter=What%20is%20Living%3F%20Growth%2C%20Reproduction%20%26%20Metabolism">← Back to Learn</a></div><div id="app"></div></main><script>
const chapter='What is Living? Growth, Reproduction & Metabolism';
const topics={
'living-nonliving':[['Which is a defining feature of living organisms?','Metabolism','External accumulation only','Rusting','Crystallisation',0],['Growth in non-living objects occurs mainly by','External accumulation','Cell division','Cell enlargement from within','Metabolism',0],['Living organisms show organised','Cellular organisation','Mineral deposition only','Crystal growth only','External layering',0]],
'growth':[['Growth in living organisms generally means','Increase in mass and number of individuals','Only increase in height','Only movement','Loss of mass',0],['Plant growth is generally','Indeterminate','Always absent after maturity','Only external','Non-cellular',0],['Growth alone cannot define life because','Non-living objects may also grow','Plants never grow','Animals never reproduce','Cells have no metabolism',0]],
'reproduction':[['Reproduction is','Production of progeny','Only increase in body size','Breakdown of food','Response to light only',0],['Reproduction is not an all-inclusive defining property because','Some living organisms are sterile','All organisms reproduce sexually','Plants cannot reproduce','Only animals are living',0],['Asexual reproduction usually involves','One parent','Two gamete-producing parents','No living parent','Only non-living matter',0]],
'metabolism':[['Metabolism is','Sum total of all chemical reactions','Only digestion','Only breathing','Only reproduction',0],['Anabolism is mainly','Building complex molecules','Breaking molecules only','Movement','Reproduction only',0],['Catabolism mainly involves','Breakdown of complex molecules','Building proteins only','Cell division only','Pollination',0],['Metabolism is a defining feature of','Living organisms','Rocks only','Clouds only','Machines only',0]],
'consciousness':[['Consciousness is the ability to','Sense and respond to surroundings','Only reproduce','Only grow','Only move fast',0],['Human beings show self-consciousness because they can','Be aware of themselves','Stop metabolism','Live without cells','Avoid all stimuli',0],['Response to environment includes response to','Physical, chemical and biological stimuli','Only colour','Only sound','Only size',0]],
'ncert-traps':[['NCERT describes living organisms as','Self-replicating, evolving and self-regulating systems','Only growing objects','Only reproducing objects','Only green objects',0],['Which pair is most reliable for recognising life in NCERT context?','Metabolism and consciousness','Height and colour','Size and movement','Age and weight',0],['Sterile organisms are','Living despite inability to reproduce','Non-living','Always plants','Always microbes',0]]
};
const labels=['Living vs Non-living','Growth','Reproduction','Metabolism','Consciousness & Response','NCERT Concepts & NEET Traps'];
const keys=Object.keys(topics),emojis=['🌱','📈','🧬','⚙️','👁️','⚠️'];
const app=document.getElementById('app'),key=new URLSearchParams(location.search).get('topic');
function list(){app.innerHTML='<section class="hero"><div style="font-size:50px">🔬</div><h1>'+chapter+'</h1><p>NCERT-focused concept-wise NEET practice with instant feedback, progress tracking and error review.</p><div class="mode">🎯 CONCEPT-WISE PRACTICE</div></section><div class="label">CHOOSE A TEST</div>'+keys.map((k,i)=>'<a class="topic" href="?chapter='+encodeURIComponent(chapter)+'&topic='+k+'"><span class="num">'+(i+1)+'</span><span class="emoji">'+emojis[i]+'</span><span class="copy"><b>'+labels[i]+'</b><small>'+topics[k].length+' practice questions</small></span><span class="start">START →</span></a>').join('')}
function test(){const qs=topics[key];let i=0,score=0,wrong=[];app.innerHTML='<section class="hero"><div style="font-size:45px">'+emojis[keys.indexOf(key)]+'</div><h1>'+labels[keys.indexOf(key)]+'</h1><div class="progress"><span id="bar"></span></div><b id="status"></b></section><section class="quiz" id="quiz"></section><section class="result hidden" id="result"><h1>🏆 Test Complete!</h1><p id="score"></p><div id="review"></div><button class="next" onclick="location.href=location.pathname+\'?chapter='+encodeURIComponent(chapter)+'\'">BACK TO TESTS</button></section>';
function render(){let q=qs[i],opts=q.slice(1,5).map((x,j)=>({x,j}));for(let n=opts.length-1;n>0;n--){let z=Math.floor(Math.random()*(n+1));[opts[n],opts[z]]=[opts[z],opts[n]]}status.textContent='Question '+(i+1)+' / '+qs.length;quiz.innerHTML='<h2>'+q[0]+'</h2><div class="opts">'+opts.map((o,n)=>'<button data="'+o.j+'">'+String.fromCharCode(65+n)+'. '+o.x+'</button>').join('')+'</div><div id="fb"></div>';document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>answer(+b.dataset.data,q))}
function answer(choice,q){let bs=[...document.querySelectorAll('.opts button')];bs.forEach(b=>{b.disabled=true;if(+b.dataset.data===q[5])b.classList.add('correct')});let fb=document.getElementById('fb');if(choice===q[5]){score++;fb.innerHTML='🎉 Correct! Great job.'}else{bs.find(b=>+b.dataset.data===choice).classList.add('wrong');wrong.push({q:q[0],correct:q[q[5]+1]});fb.innerHTML='💡 Correct answer: '+q[q[5]+1]+'. Review this concept and try again!'}fb.innerHTML+='<button class="next" id="next">'+(i===qs.length-1?'FINISH →':'NEXT →')+'</button>';next.onclick=()=>{i++;bar.style.width=(i/qs.length*100)+'%';i<qs.length?render():finish()}}
function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');scoreEl=document.getElementById('score');scoreEl.textContent='Score: '+score+' / '+qs.length;review.innerHTML=wrong.length?'<h2>📝 Review Wrong Attempts</h2>'+wrong.map(x=>'<div class="review-item"><b>'+x.q+'</b><br>✅ '+x.correct+'</div>').join(''):'🎉 Perfect! No wrong attempts.'}render()}
key&&topics[key]?test():list();
</script></body></html>
