    const pct=Math.round(score/qs.length*100);
    document.getElementById('score').innerHTML='Score: <b>'+score+' / '+qs.length+'</b> ('+pct+'%)<br><small>Correct: '+score+' • Wrong: '+wrong.length+'</small>'+(score===qs.length?'<br>🏆 PERFECT SCORE — 100% CORRECT!':'');
    document.getElementById('review').innerHTML=wrong.length?'<h2>📝 Review Wrong Attempts</h2>'+wrong.map(x=>'<div class="review-item"><b>❌ '+x.q+'</b><br>📘 <b>'+x.correct+'</b> is correct because <small>'+x.explanation+'</small></div>').join(''):'🎉 <b>Perfect! 100% correct answers.</b>';
    document.getElementById('restart').onclick=()=>{i=0;score=0;wrong=[];answered=new Set();document.getElementById('result').classList.add('hidden');render();};
  }
  render();
}
try{
 const routes={home:list,test};
 (state.topic&&topics[state.topic]?routes.test:routes.home)();
}catch(err){
 console.error('Quiz page error:',err);
 app.innerHTML='<section class="hero"><div style="font-size:50px">⚠️</div><h1>Quiz loading issue</h1><p style="color:#64748b">This chapter could not be loaded. Please return to the chapter list.</p><button class="next" onclick="location.href=location.pathname">RETURN TO QUIZZES</button></section>';
}
