<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Botany Chapter Test</title>
<style>body{font-family:Arial,sans-serif;background:#f7f9fc;color:#172033;display:grid;place-items:center;min-height:100vh;margin:0}.box{text-align:center;padding:24px}.spin{width:32px;height:32px;border:4px solid #dfe7ef;border-top-color:#58cc02;border-radius:50%;animation:r .8s linear infinite;margin:0 auto 14px}@keyframes r{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="box"><div class="spin"></div><b>Opening SkillUp NEET Practice…</b><p>Loading the verified central Botany question engine.</p></div>
<script>
(function(){
 const p=new URLSearchParams(location.search),chapter=(p.get('chapter')||'').trim();
 const target=new URL('question-bank.html',location.href);
 target.searchParams.set('subject','botany');
 if(chapter)target.searchParams.set('chapter',chapter);
 location.replace(target.href);
})();
</script>
</body>
</html>
