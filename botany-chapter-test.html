<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What is Living? Growth, Reproduction & Metabolism Tests | SkillUp</title><style>:root{--g:#1f8f4e;--gd:#16723d;--ink:#263238;--muted:#6d7780;--line:#dfe7e2;--soft:#f4faf6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7faf8 0%,#fff 100%);font-family:Arial,sans-serif;color:var(--ink)}.w{max-width:980px;margin:auto;padding:24px 18px 48px}.hero,.topic,.quiz,.result{background:#fff;border:1px solid var(--line);box-shadow:0 3px 12px rgba(38,50,56,.08);border-radius:24px;padding:28px;margin:18px 0}.hero{text-align:center}.hero h1{font-size:34px;margin:10px 0 20px}.mode{display:inline-block;background:#eef8f0;color:var(--gd);border-radius:999px;padding:8px 14px;font-weight:900;margin-bottom:12px}.label{font-size:13px;font-weight:900;color:#718078;letter-spacing:1px;margin:20px 4px 8px}.topic{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}.num{width:38px;height:38px;border-radius:50%;background:#eaf5ed;color:var(--gd);display:grid;place-items:center;font-weight:900}.emoji{font-size:29px}.copy{flex:1}.copy b,.copy small{display:block}.copy small{color:#777;margin-top:4px}.start,.next,.primary{background:var(--g);color:#fff;border:0;border-bottom:4px solid var(--gd);border-radius:14px;padding:13px 20px;font-weight:900}.progress{height:15px;background:#e8eeea;border-radius:20px;overflow:hidden;margin:18px 0 8px}.progress span{display:block;height:100%;width:0;background:var(--g);transition:width .25s}.question-count{display:block;color:var(--muted);font-weight:800}.quiz h2{font-size:26px;line-height:1.3;margin:0 0 22px}.opts{display:grid;gap:13px}.opts button{background:#fff;border:1px solid #d8e1dc;border-bottom:4px solid #d8e1dc;border-radius:17px;padding:17px;text-align:left;font-size:17px;font-weight:800;color:var(--ink);transition:.15s}.opts button:hover:not(:disabled){transform:translateY(-1px);border-color:#b9d9c3}.opts button:disabled{cursor:default}.correct{border-color:#43a65e!important;background:#f0fbf2!important}.wrong{border-color:#e15b5b!important;background:#fff2f2!important}#fb{margin-top:16px;background:#f0f7f2;border-radius:16px;padding:16px;line-height:1.55;font-weight:700}.hint{margin-top:16px;background:linear-gradient(90deg,#f4faf5,#eef6f0);border-radius:16px;padding:16px;font-weight:700;color:#356446}.nav-buttons{display:flex;gap:14px;justify-content:space-between;margin-top:20px}.nav-buttons button{min-width:150px}.nav-buttons .next{margin-top:0}.secondary{background:#fff;color:#456052;border:1px solid #d8e1dc;border-bottom:4px solid #d8e1dc;border-radius:14px;padding:13px 20px;font-weight:900}.next{width:auto;margin-top:12px}.hidden{display:none}.review-item{background:#fff7f7;border:1px solid #ffd5d5;border-radius:14px;padding:14px;margin:10px 0}.back{color:#777;text-decoration:none;font-weight:900}@media(max-width:600px){.w{padding:14px 12px 36px}.hero,.quiz,.result{padding:20px;border-radius:20px}.hero h1{font-size:28px}.quiz h2{font-size:22px}.nav-buttons{flex-direction:column}.nav-buttons button{width:100%}}</style></head><body><main class="w"><div id="app"></div></main><script>
const chapter=new URLSearchParams(location.search).get('chapter')||'What is Living? Growth, Reproduction & Metabolism';
const chapterConfigs={
'Cellular Organisation & Consciousness':{
icon:'🧫',
topics:{
'cellular-organisation':[['The basic structural and functional unit of life is','Cell','Tissue','Organ','Organ system',0],['A virus lacks','Independent cellular organisation','Genetic material','A protective coat','Ability to infect host cells',0],['In multicellular organisms specialised cells form','Tissues','Only chromosomes','Only enzymes','Only spores',0]],
'cell-basic-unit':[['Cells are called basic units because they','Perform essential life processes','Are always visible','Are always multicellular','Never contain genetic material',0],['Coordinated cellular activities are necessary for','Maintenance of life','Formation of rocks','Crystal growth only','External accumulation',0],['Cellular organisation is important because living systems show','Internal coordination','Only external growth','No metabolism','No response',0]],
'genetic-material':[['Genetic material primarily stores','Hereditary information','Only energy','Water','Minerals only',0],['Genetic material helps direct','Cellular activities','Only body colour','Only external size','Only movement',0]],
'unicellular-multicellular':[['A unicellular organism performs life processes','Within one cell','Only in tissues','Without a cell','Only in organs',0],['Multicellular organisms show','Division of labour','Absence of cells','No coordination','Only external growth',0]],
'consciousness':[['Consciousness refers to ability to','Sense and respond to surroundings','Only reproduce','Only grow','Only move rapidly',0],['Humans additionally possess','Self-consciousness','No metabolism','No cells','No responses',0]],
'response-stimuli':[['Living organisms respond to','Physical, chemical and biological stimuli','Only their size','Only age','Only colour',0],['A response may involve','Physiological change','Only external deposition','Crystal formation','No coordination',0]],
'self-consciousness':[['Self-consciousness means','Awareness of oneself','Only awareness of light','Absence of response','Only reproduction',0],['Self-consciousness is especially associated with','Human beings','Rocks','Viruses','Crystals',0]],
'ncert-neet':[['An important feature of living systems is','Organised cellular activities','Rusting','Crystal growth','External accumulation',0],['For NEET preparation, definitions should follow','NCERT terminology','Random wording','Only coaching notes','Unrelated examples',0]]
}}};

const defaultTopics={
'living-nonliving':[['Which is a defining feature of living organisms?','Metabolism','External accumulation only','Rusting','Crystallisation',0],['Growth in non-living objects occurs mainly by','External accumulation','Cell division','Cell enlargement from within','Metabolism',0],['Living organisms show organised','Cellular organisation','Mineral deposition only','Crystal growth only','External layering',0]],
'growth':[['Growth in living organisms generally means','Increase in mass and number of individuals','Only increase in height','Only movement','Loss of mass',0],['Plant growth is generally','Indeterminate','Always absent after maturity','Only external','Non-cellular',0],['Growth alone cannot define life because','Non-living objects may also grow','Plants never grow','Animals never reproduce','Cells have no metabolism',0]],
'reproduction':[['Reproduction is','Production of progeny','Only increase in body size','Breakdown of food','Response to light only',0],['Reproduction is not an all-inclusive defining property because','Some living organisms are sterile','All organisms reproduce sexually','Plants cannot reproduce','Only animals are living',0],['Asexual reproduction usually involves','One parent','Two gamete-producing parents','No living parent','Only non-living matter',0]],
'metabolism':[['Metabolism is','Sum total of all chemical reactions','Only digestion','Only breathing','Only reproduction',0],['Anabolism is mainly','Building complex molecules','Breaking molecules only','Movement','Reproduction only',0],['Catabolism mainly involves','Breakdown of complex molecules','Building proteins only','Cell division only','Pollination',0],['Metabolism is a defining feature of','Living organisms','Rocks only','Clouds only','Machines only',0]],
'consciousness':[['Consciousness is the ability to','Sense and respond to surroundings','Only reproduce','Only grow','Only move fast',0],['Human beings show self-consciousness because they can','Be aware of themselves','Stop metabolism','Live without cells','Avoid all stimuli',0],['Response to environment includes response to','Physical, chemical and biological stimuli','Only colour','Only sound','Only size',0]],
'ncert-traps':[['NCERT describes living organisms as','Self-replicating, evolving and self-regulating systems','Only growing objects','Only reproducing objects','Only green objects',0],['Which pair is most reliable for recognising life in NCERT context?','Metabolism and consciousness','Height and colour','Size and movement','Age and weight',0],['Sterile organisms are','Living despite inability to reproduce','Non-living','Always plants','Always microbes',0]]
};
let topics=defaultTopics;
if(chapterConfigs[chapter])topics=chapterConfigs[chapter].topics;
const labels=chapterConfigs[chapter]?['Cellular Organisation','Cell: Basic Unit of Life','Genetic Material','Unicellular & Multicellular Organisation','Consciousness','Response to Stimuli','Self-Consciousness','NCERT & NEET Key Points']:['Living vs Non-living','Growth','Reproduction','Metabolism','Consciousness & Response','NCERT Concepts & NEET Traps'];
const keys=Object.keys(topics),emojis=chapterConfigs[chapter]?['🧫','🔬','🧬','🌐','👁️','⚡','🧠','🎯']:['🌱','📈','🧬','⚙️','👁️','⚠️'];
const app=document.getElementById('app');const params=new URLSearchParams(location.search);const key=params.get('topic');const state={chapter,topic:key,question:0,score:0,wrong:[],answers:[]};function navigate(topic){location.href=location.pathname+'?chapter='+encodeURIComponent(chapter)+(topic?'&topic='+topic:'')}
function list(){app.innerHTML='<section class="hero"><div style="font-size:50px">🔬</div><h1>'+chapter+'</h1><p>NCERT-focused concept-wise NEET practice with instant feedback, progress tracking and error review.</p><div class="mode">🎯 CONCEPT-WISE PRACTICE</div></section><div class="label">CHOOSE A TEST</div>'+keys.map((k,i)=>'<a class="topic" href="?chapter='+encodeURIComponent(chapter)+'&topic='+k+'"><span class="num">'+(i+1)+'</span><span class="emoji">'+emojis[i]+'</span><span class="copy"><b>'+labels[i]+'</b><small>'+topics[k].length+' practice questions</small></span><span class="start">START →</span></a>').join('')}
function test(){const qs=topics[state.topic];if(!qs){navigate('');return}let i=0,score=0,wrong=[];app.innerHTML='<section class="hero"><div class="mode">🌱 BOTANY</div><div style="font-size:48px">'+emojis[keys.indexOf(state.topic)]+'</div><h1>'+labels[keys.indexOf(state.topic)]+'</h1><div class="progress"><span id="bar"></span></div><span class="question-count" id="status"></span></section><section class="quiz" id="quiz"></section><section class="result hidden" id="result"><h1>🏆 Test Complete!</h1><p id="score"></p><div id="review"></div><button class="next" onclick="location.href=location.pathname+'?chapter='+encodeURIComponent(chapter)">BACK TO TESTS</button></section>';
function render(){const q=qs[i];const opts=q.slice(1,5).map((x,j)=>({x,j}));for(let n=opts.length-1;n>0;n--){const z=Math.floor(Math.random()*(n+1));[opts[n],opts[z]]=[opts[z],opts[n]]}document.getElementById('status').textContent='Question '+(i+1)+' of '+qs.length;document.getElementById('bar').style.width=((i+1)/qs.length*100)+'%';document.getElementById('quiz').innerHTML='<h2>🌿 '+q[0]+'</h2><div class="opts">'+opts.map((o,n)=>'<button type="button" data-choice="'+o.j+'"><span class="num" style="display:inline-grid;margin-right:14px;vertical-align:middle">'+String.fromCharCode(65+n)+'</span>'+o.x+'</button>').join('')+'</div><div class="hint" id="hint">💡 Select an answer to check it.</div><div id="fb"></div><div class="nav-buttons"><button type="button" class="secondary" id="prev">← Previous</button><button type="button" class="secondary" id="showExp">🧠 Show Explanation</button><button type="button" class="next" id="nextMain">Next →</button></div>';document.getElementById('prev').disabled=i===0;document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};document.getElementById('showExp').onclick=()=>{document.getElementById('hint').textContent='🧠 '+explanation(q)};const next=document.getElementById('nextMain');next.textContent=i===qs.length-1?'Finish →':'Next →';next.onclick=()=>{if(i<qs.length-1){i++;render()}else{finish()}};document.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>answer(Number(btn.dataset.choice),q))}
function answer(choice,q){const bs=[...document.querySelectorAll('[data-choice]')];bs.forEach(b=>{b.disabled=true;if(Number(b.dataset.choice)===q[5])b.classList.add('correct')});const fb=document.getElementById('fb');if(choice===q[5]){score++;fb.innerHTML='<b>'+feedbackMessage(q,choice)+'</b><br>'+explanation(q)}else{const selected=bs.find(b=>Number(b.dataset.choice)===choice);if(selected)selected.classList.add('wrong');wrong.push({q:q[0],correct:q[q[5]+1],explanation:explanation(q)});fb.innerHTML='<b>'+feedbackMessage(q,choice)+'</b><br>✅ Correct answer: '+q[q[5]+1]+'<br>'+explanation(q)}}
function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');const pct=Math.round(score/qs.length*100);document.getElementById('score').innerHTML='Score: <b>'+score+' / '+qs.length+'</b> ('+pct+'%)<br><small>Correct: '+score+' • Wrong: '+wrong.length+'</small>'+(score===qs.length?'<br><span style="color:#16723d;font-size:20px">🏆 PERFECT SCORE — 100% CORRECT!</span>':'');document.getElementById('review').innerHTML=wrong.length?'<h2>📝 Review Wrong Attempts</h2>'+wrong.map(x=>'<div class="review-item"><b>❌ '+x.q+'</b><br>✅ <b>Correct answer:</b> '+x.correct+'<br><small>'+x.explanation+'</small></div>').join(''):'🎉 <b>Perfect! 100% correct answers.</b><br>🏆 Excellent NEET concept mastery!'}
render()}

function explanation(q){const a=q[q[5]+1];return '📘 Explanation: '+a+' is correct because it matches the NCERT concept being tested. Review the key definition and the related example before continuing.'}function feedbackMessage(q,choice){const ok=choice===q[5];return ok?'🎉 Correct! Excellent — '+q[q[5]+1]+' is the right answer.':'❌ Not quite. The correct answer is '+q[q[5]+1]+'.'}function answer(choice,q){let bs=[...document.querySelectorAll('.opts button')];bs.forEach(b=>{b.disabled=true;if(+b.dataset.data===q[5])b.classList.add('correct')});let fb=document.getElementById('fb');state.answers.push({question:q[0],choice:q[choice+1],correct:q[q[5]+1],isCorrect:choice===q[5]});if(choice===q[5]){score++;state.score=score;fb.innerHTML='<b>'+feedbackMessage(q,choice)+'</b><br>'+explanation(q)}else{bs.find(b=>+b.dataset.data===choice).classList.add('wrong');wrong.push({q:q[0],correct:q[q[5]+1],explanation:explanation(q)});state.wrong=wrong;fb.innerHTML='<b>'+feedbackMessage(q,choice)+'</b><br>✅ Correct answer: '+q[q[5]+1]+'<br>'+explanation(q)}document.getElementById('nextMain').disabled=false;document.getElementById('nextMain').onclick=()=>{if(i<qs.length-1){i++;render()}else{finish()}}}
function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');scoreEl=document.getElementById('score');const pct=Math.round(score/qs.length*100);scoreEl.innerHTML='Score: <b>'+score+' / '+qs.length+'</b> ('+pct+'%)<br><small>Correct: '+score+' • Wrong: '+wrong.length+'</small>'+(score===qs.length?'<br><span style="color:#46a302;font-size:20px">🏆 PERFECT SCORE — 100% CORRECT!</span>':'');review.innerHTML=wrong.length?'<h2>📝 Review Wrong Attempts</h2>'+wrong.map(x=>'<div class="review-item"><b>❌ '+x.q+'</b><br>✅ <b>Correct answer:</b> '+x.correct+'<br><small>'+x.explanation+'</small></div>').join(''):'🎉 <b>Perfect! 100% correct answers.</b><br>🏆 Excellent NEET concept mastery!'}render()}
const routes={home:list,test};(state.topic&&topics[state.topic]?routes.test:routes.home)();
</script></body></html>
