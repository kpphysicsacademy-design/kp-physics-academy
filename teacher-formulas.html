<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Formulas | Teacher | KP Physics Academy</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#0b1930}header{background:#031326;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;text-decoration:none;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 25px #0b193012;margin-bottom:22px}h1{margin-top:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d6dfeb;border-radius:9px;font:inherit}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:8px;padding:11px 16px;background:#1687ff;color:#fff;font-weight:800;cursor:pointer;margin-top:15px}.danger{background:#d33}.preview{margin-top:15px;padding:22px;text-align:center;background:#f8fbff;border:1px solid #dce8f5;border-radius:12px;font-size:24px}.muted{color:#718096}.formula-list{display:grid;gap:14px}.formula-card{border:1px solid #dfe7f0;border-radius:14px;padding:18px}.formula-card h3{margin:0 0 5px}.formula-display{font-size:24px;text-align:center;padding:16px;background:#f8fbff;border-radius:10px;margin:12px 0}.actions button{margin-right:8px}.symbol{margin:4px 0}.status{margin-top:12px;font-weight:700}@media(max-width:700px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><strong>KP PHYSICS ACADEMY • FORMULAS</strong><a href="teacher-dashboard.html">← Teacher Dashboard</a></header>
<main class="wrap">
<div class="card">
<h1>🧮 Physics Formula Studio</h1>
<p class="muted">Create formulas that children can see as clear, beautiful formula cards. Text is stored as data; an image can be added when a visual version is useful.</p>
<form id="form">
<div class="row"><div><label>Class</label><select id="classNo"><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div><div><label>Chapter</label><input id="chapter" placeholder="e.g. Motion"></div></div>
<label>Formula name</label><input id="name" placeholder="e.g. Speed">
<label>Formula in simple text</label><input id="text" placeholder="Speed = Distance ÷ Time">
<label>LaTeX formula</label><input id="latex" placeholder="v = \\frac{d}{t}">
<div class="preview" id="preview">Formula preview appears here</div>
<div class="row"><div><label>Meaning of symbols</label><textarea id="symbols" placeholder="v = speed\nd = distance\nt = time"></textarea></div><div><label>SI unit</label><input id="unit" placeholder="m/s"><label>Child-friendly example</label><textarea id="example" placeholder="A bicycle travels 20 m in 5 s..."></textarea></div></div>
<label>Formula image URL (optional)</label><input id="imageUrl" placeholder="https://..."><button type="submit">Save Formula</button><button type="button" class="danger" onclick="clearForm()">Clear</button>
<div id="status" class="status"></div>
</form></div>
<div class="card"><h2>Published Formulas</h2><div id="list" class="formula-list">Loading...</div></div>
</main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config.js';
const app=initializeApp(firebaseConfig),db=getFirestore(app);let editingId=null;const $=id=>document.getElementById(id);
function renderPreview(){const v=$('latex').value.trim();$('preview').innerHTML=v?'\\('+v+'\\)':'Formula preview appears here';if(window.MathJax)MathJax.typesetPromise([$ ('preview')]).catch(()=>{});}
$('latex').addEventListener('input',renderPreview);
$('form').onsubmit=async e=>{e.preventDefault();const data={classNo:Number($('classNo').value),chapter:$('chapter').value.trim(),name:$('name').value.trim(),text:$('text').value.trim(),latex:$('latex').value.trim(),symbols:$('symbols').value.trim(),unit:$('unit').value.trim(),example:$('example').value.trim(),imageUrl:$('imageUrl').value.trim(),updatedAt:serverTimestamp()};if(!data.name||!data.latex){$('status').textContent='Please add a formula name and LaTeX formula.';return}try{if(editingId){const{updateDoc}=await import('https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js');await updateDoc(doc(db,'formulas',editingId),data)}else await addDoc(collection(db,'formulas'),{...data,createdAt:serverTimestamp()});$('status').textContent='Formula saved successfully.';clearForm();loadList()}catch(e){$('status').textContent=e.message}};
async function loadList(){try{const s=await getDocs(collection(db,'formulas'));const box=$('list');box.innerHTML='';if(s.empty){box.innerHTML='<p class="muted">No formulas yet.</p>';return}s.forEach(x=>{const d=x.data(),el=document.createElement('div');el.className='formula-card';el.innerHTML='<h3>'+esc(d.name||'')+'</h3><div class="muted">Class '+esc(d.classNo)+' • '+esc(d.chapter||'')+'</div><div class="formula-display">\\('+esc(d.latex||'')+'\\)</div><p><b>Text:</b> '+esc(d.text||'')+'</p><p><b>Unit:</b> '+esc(d.unit||'')+'</p><p><b>Symbols:</b><br>'+esc(d.symbols||'').replace(/\n/g,'<br>')+'</p><p><b>Example:</b> '+esc(d.example||'')+'</p><div class="actions"><button data-edit>Edit</button><button class="danger" data-del>Delete</button></div>';el.querySelector('[data-edit]').onclick=()=>edit(x.id,d);el.querySelector('[data-del]').onclick=async()=>{if(confirm('Delete this formula?')){await deleteDoc(doc(db,'formulas',x.id));loadList()}};box.appendChild(el)});if(window.MathJax)MathJax.typesetPromise([box]).catch(()=>{})}catch(e){$('list').innerHTML='<p class="muted">Unable to load formulas. Check Firebase configuration/rules.</p>'}}
function edit(id,d){editingId=id;$('classNo').value=d.classNo;$('chapter').value=d.chapter||'';$('name').value=d.name||'';$('text').value=d.text||'';$('latex').value=d.latex||'';$('symbols').value=d.symbols||'';$('unit').value=d.unit||'';$('example').value=d.example||'';$('imageUrl').value=d.imageUrl||'';renderPreview();window.scrollTo({top:0,behavior:'smooth'})}
window.clearForm=()=>{editingId=null;$('form').reset();$('preview').textContent='Formula preview appears here';$('status').textContent='Ready for a new formula.'};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}loadList();
</script></body></html>
