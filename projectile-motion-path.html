<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projectile Motion | KP Physics Academy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f9fd;color:#10213a}.top{background:#071a31;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:28px 18px 70px}.hero{text-align:center}.hero h1{font-size:38px;margin:10px 0}.hero span{color:#1687ff}.muted{color:#718096;line-height:1.5}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.stat,.mastery{background:#fff;border:1px solid #dfe7f1;border-radius:14px;padding:12px 18px;text-align:center}.mastery{max-width:900px;margin:20px auto 35px}.bar{height:10px;background:#e7edf4;border-radius:20px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:#20b56b}.section{margin:38px 0}.path{position:relative;padding:8px 0}.path:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%);background:#dce8f5;border-radius:10px}.lesson{position:relative;display:flex;align-items:center;min-height:125px}.lesson:nth-child(odd){justify-content:flex-start;padding-right:calc(50% + 45px)}.lesson:nth-child(even){justify-content:flex-end;padding-left:calc(50% + 45px)}.node{width:100%;max-width:400px;background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:17px;box-shadow:0 7px 20px #0000000b}.node.done{border-color:#20b56b}.node h3{margin:0;font-size:16px}.node p{font-size:12px;color:#718096;margin:7px 0}.tag{font-size:10px;font-weight:800;color:#138650}.btn{display:block;text-align:center;padding:10px;border-radius:9px;background:#1687ff;color:#fff;text-decoration:none;font-weight:800;margin-top:10px}.checkpoint{background:#fff7dc;border:1px solid #f1d37b;border-radius:16px;padding:15px;text-align:center;margin:12px auto;max-width:620px;font-weight:800}@media(max-width:700px){.hero h1{font-size:30px}.path:before{left:20px;transform:none}.lesson,.lesson:nth-child(odd),.lesson:nth-child(even){justify-content:flex-start;padding-left:50px;padding-right:0;min-height:120px}.node{max-width:none}}</style></head><body><header class="top"><a href="jee-physics-path.html">← JEE Physics Path</a><a href="index.html">Home</a></header><main class="wrap"><section class="hero"><p>🧭 JEE PHYSICS • MECHANICS • CONCEPT 6</p><h1>Projectile Motion <span>Zero → Hero</span></h1><p class="muted">MCQ → Correction → Retry wrong questions → Master → Next</p></section><div class="stats"><div class="stat">🔥 <b id="streak">0</b><br><small>Streak</small></div><div class="stat">⭐ <b id="xp">0</b><br><small>XP</small></div><div class="stat">🎯 <b>10</b><br><small>Sections</small></div><div class="stat">📚 <b id="count">0</b><br><small>Lessons</small></div></div><div class="mastery"><b>Projectile Motion Mastery</b><p id="progress" class="muted">Start from the foundation</p><div class="bar"><i id="bar"></i></div></div><div id="content"></div></main><script>const sections=[['🟢','01 • Projectile Foundations',['What is a Projectile?','Projectile Motion Assumptions','Gravity as Acceleration','Horizontal and Vertical Motion','Independence of Motions','Initial Position','Initial Velocity','Launch Angle','Reference Axes','Foundation Problems']],['🟢','02 • Velocity Components',['Resolving Initial Velocity','Horizontal Component','Vertical Component','Time Dependence of Components','Velocity at Any Time','Speed at Any Time','Direction of Velocity','Horizontal Projection','Vertical Projection','Component-Based Practice']],['🔵','03 • Time of Flight & Height',['Time of Flight','Maximum Height','Time to Reach Maximum Height','Vertical Displacement','Maximum Height Derivation','Special Angle Cases','Height at a Given Time','Velocity at Maximum Height','Speed at Maximum Height','Numerical Practice']],['🔵','04 • Horizontal Range & Trajectory',['Horizontal Range','Range Derivation','Trajectory Equation','Parabolic Path','Range vs Angle','Maximum Range','Complementary Angles','Same-Range Projectiles','Height-Range Relations','Range Numericals']],['🟡','05 • Projectile from Height',['Horizontal Projection from Height','Time to Hit Ground','Horizontal Distance','Impact Velocity','Impact Angle','Projectile from Elevated Point','Range from Height','Maximum Height from Ground','Mixed Height Problems','JEE Main Applications']],['🟡','06 • Oblique Projectile Applications',['Projectile on Level Ground','Symmetric Motion','Ascending Motion','Descending Motion','Velocity at Same Height','Equal-Speed Points','Time Symmetry','Range Symmetry','Maximum Height Conditions','Application Problems']],['🟠','07 • Relative & Moving Projectile Problems',['Projectile from Moving Vehicle','Projectile from Moving Platform','Target in Motion','Meeting a Projectile','Relative Velocity in Projectile Motion','Moving Target Problems','Minimum Time Interception','Minimum Distance','Observer Problems','Advanced Target Questions']],['🟠','08 • Inclined Plane Projectile',['Inclined Plane Geometry','Projectile onto Inclined Plane','Angle of Projection','Range Along Incline','Maximum Range on Incline','Trajectory Relative to Incline','Time to Strike Incline','Height Above Incline','Inclined-Plane Numericals','Advanced Incline Problems']],['🔴','09 • Advanced Projectile Analysis',['Vector Equation of Projectile','Parametric Equations','Eliminating Time','Velocity-Position Relation','Curvature Introduction','Envelope of Projectiles','Projectile Through Two Points','Minimum Speed Problems','Optimization Problems','JEE Main Mixed Problems','JEE Advanced Problems']],['🏆','10 • Final Mastery',['Foundation Test','Velocity Components Test','Time & Height Test','Range & Trajectory Test','Height Projection Test','Oblique Projectile Test','Moving Target Test','Inclined Plane Test','Advanced Mixed Test','JEE Main Challenge','JEE Advanced Challenge','Wrong-Question Revision','Final Unseen Test','Projectile Motion Mastered']]];const lessons=[];sections.forEach(s=>s[2].forEach(name=>lessons.push({name,section:s[1]})));let completed=Math.max(0,Math.min(lessons.length,Number(localStorage.getItem('kp_projectile_completed')||0)));function render(){let n=0,out='';sections.forEach((s,si)=>{out+=`<section class="section"><h2>${s[0]} ${s[1]}</h2><p class="muted">${s[2].length} lessons • Zero → Hero</p><div class="path">`;s[2].forEach(name=>{const i=n++,done=i<completed,current=i===completed;out+=`<div class="lesson"><div class="node ${done?'done':''}"><h3>${done?'🏆 ':current?'⭐ ':s[0]+' '}${i+1}. ${name}</h3><p>${s[1]} • 5 MCQs per task</p><span class="tag">${done?'MASTERED':'UNLOCKED'}</span><a class="btn" href="projectile-motion-lesson.html?id=${i}">${done?'Review':'Start Task →'}</a></div></div>`});out+='</div>';if(si<sections.length-1)out+='<div class="checkpoint">🏆 Section checkpoint — every wrong question must be answered correctly before mastery.</div>';out+='</section>'});document.getElementById('content').innerHTML=out;document.getElementById('count').textContent=lessons.length;document.getElementById('progress').textContent=`${completed} of ${lessons.length} lessons mastered • All lessons unlocked`;document.getElementById('bar').style.width=Math.round(completed/lessons.length*100)+'%';document.getElementById('xp').textContent=completed*10;document.getElementById('streak').textContent=localStorage.getItem('kp_streak')||0}render();</script></body></html>
