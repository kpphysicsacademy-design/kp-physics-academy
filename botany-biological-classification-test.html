<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biological Classification Tests | SkillUp</title><style>:root{--g:#58cc02;--gd:#46a302;--ink:#4b4b4b;--line:#e5e5e5}*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:var(--ink)}.w{max-width:720px;margin:auto;padding:18px 14px 40px}.test-nav{display:flex;gap:10px;align-items:center;font-weight:900;margin-bottom:18px}.test-nav a,.back{color:#777;text-decoration:none}.hero,.topic,.quiz{background:#fff;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:20px;padding:20px;margin:14px 0}.hero{text-align:center}.mascot{font-size:50px}.mode{background:#eaf8df;color:#46a302;border-radius:14px;padding:10px;font-weight:900;margin-top:12px}.label{font-size:13px;font-weight:900;color:#777;letter-spacing:1px;margin:20px 4px 8px}.topic{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}.num{width:36px;height:36px;border-radius:12px;background:#eaf8df;color:#46a302;display:grid;place-items:center;font-weight:900}.topic-emoji{font-size:29px}.copy{flex:1}.copy b,.copy small{display:block}.copy small{color:#777;margin-top:4px}.start,.next-btn,.primary{background:var(--g);color:#fff;border:0;border-bottom:4px solid var(--gd);border-radius:12px;padding:11px;font-weight:900}.progress{height:14px;background:#e5e5e5;border-radius:20px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:var(--g)}.opts{display:grid;gap:12px}.opts button{background:#fff;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:15px;padding:15px;text-align:left;font-weight:800}.correct{border-color:#58cc02!important;background:#f1ffe8!important}.wrong{border-color:#ff4b4b!important;background:#fff0f0!important}#fb{background:#f4fbef;border-radius:14px;padding:14px;line-height:1.5;font-weight:700}.next-btn{width:100%;margin-top:12px}.done{display:none}.review{text-align:left;margin-top:20px}.review-item{background:#fff7f7;border:2px solid #ffd5d5;border-radius:14px;padding:14px;margin:10px 0}@media(max-width:520px){.topic{padding:14px}.start{font-size:10px}}</style></head><body><main class="w"><nav class="test-nav"><a href="botany-biological-classification.html">🧬 Biological Classification</a><span>›</span><b>🧪 Tests</b></nav><a class="back" href="botany-biological-classification.html">← Back to Chapter</a><div id="app"></div></main><script>const topics={"need-for-classification":[["Why is classification necessary?","It makes biodiversity easier to study","It stops evolution","It removes species","It makes all organisms identical",0],["Classification is based mainly on:","Similarities and differences","Only colour","Only size","Only habitat",0],["Classification helps in:","Correct identification of organisms","Stopping reproduction","Changing DNA","Preventing variation",0]],"five-kingdom":[["Who proposed the Five Kingdom classification?","R. H. Whittaker","Linnaeus","Darwin","Haeckel",0],["Whittaker proposed the Five Kingdom system in:","1969","1959","1979","1989",0],["Which is NOT a Whittaker kingdom?","Virus","Monera","Protista","Fungi",0]],"monera":[["Monera contains mainly:","Prokaryotic organisms","Multicellular plants","Only fungi","Only animals",0],["Bacterial cell wall contains:","Peptidoglycan","Chitin","Cellulose","Lignin",0],["Cyanobacteria are:","Photosynthetic prokaryotes","Fungi","Viruses","Animals",0]],"protista":[["Protists are mainly:","Unicellular eukaryotes","Prokaryotes","Multicellular fungi","Viruses",0],["Diatom walls contain:","Silica","Chitin","Peptidoglycan","Lignin",0],["Red tides are associated with:","Dinoflagellates","Diatoms","Bacteria","Fungi",0]],"fungi":[["Fungal cell wall mainly contains:","Chitin","Cellulose","Peptidoglycan","Lignin",0],["A mass of hyphae forms:","Mycelium","Capsid","Pellicle","Nucleus",0],["Fungi generally show:","Heterotrophic nutrition","Autotrophic nutrition only","Photosynthesis","Chemosynthesis only",0]],"viruses":[["Viruses are:","Obligate intracellular parasites","Independent autotrophs","Multicellular organisms","Only plants",0],["A viral protein coat is called:","Capsid","Pellicle","Cell wall","Mycelium",0],["A virus contains:","Either DNA or RNA","Always both DNA and RNA","Only protein","Cellulose",0]],"viroids":[["Viroids consist of:","Naked RNA","DNA with capsid","Protein only","DNA and RNA together",0],["Viroids lack a:","Protein coat","RNA","Infectious nature","Host",0],["Viroids mainly infect:","Plants","Only bacteria","Only animals","Only fungi",0]],"lichens":[["Lichens are an association between:","Alga and fungus","Bacterium and virus","Two animals","Two fungi only",0],["The algal partner is called:","Phycobiont","Mycobiont","Capsid","Pellicle",0],["Lichens are indicators of:","Air pollution","Earthquakes","Magnetic fields","Ocean depth",0]]},keys=["need-for-classification","five-kingdom","monera","protista","fungi","viruses","viroids","lichens"],labels=["Need for Classification","Five Kingdom Classification","Kingdom Monera","Kingdom Protista","Kingdom Fungi","Viruses","Viroids","Lichens"],emojis=["🧠","🏆","🦠","🔬","🍄","🦠","🧬","🌿"];const explanations={"need-for-classification":"Classification organizes biodiversity into meaningful groups and makes identification and study easier.","five-kingdom":"Whittaker's system uses cell structure, body organization, nutrition and relationships.","monera":"Monera includes prokaryotes such as bacteria and cyanobacteria.","protista":"Protista mainly includes unicellular eukaryotic organisms.","fungi":"Fungi are heterotrophs with chitinous cell walls.","viruses":"Viruses reproduce only inside suitable living host cells.","viroids":"Viroids are infectious agents made of naked RNA.","lichens":"Lichens are a mutualistic association between an alga and a fungus."};const app=document.getElementById('app');const key=new URLSearchParams(location.search).get('topic');function showList(){app.innerHTML='<section class="hero"><div class="mascot">🦉</div><h1>Choose a Concept Test</h1><p>Answer at your own pace and learn from explanations.</p><div class="mode">🎯 CONCEPT-WISE PRACTICE</div></section><div class="label">CHOOSE A SKILL</div>'+keys.map((k,i)=>'<a class="topic" href="?topic='+k+'"><span class="num">'+(i+1)+'</span><span class="topic-emoji">'+emojis[i]+'</span><span class="copy"><b>'+labels[i]+'</b><small>'+topics[k].length+' questions</small></span><span class="start">START →</span></a>').join('')}function showTest(){const qs=topics[key];let i=0,score=0,wrong=[];app.innerHTML='<section class="hero"><div class="mascot">'+emojis[keys.indexOf(key)]+'</div><h1>'+labels[keys.indexOf(key)]+'</h1><div class="progress"><span id="bar"></span></div><b id="status"></b></section><section class="quiz" id="quiz"></section><section class="hero done" id="done"><div class="mascot">🏆</div><h1>Skill Complete!</h1><p id="final"></p><div id="review"></div><button class="primary" onclick="location.reload()">TRY AGAIN</button></section>';const quiz=document.getElementById('quiz'),bar=document.getElementById('bar'),status=document.getElementById('status'),done=document.getElementById('done'),final=document.getElementById('final'),review=document.getElementById('review');function render(){const q=qs[i];status.textContent='Question '+(i+1)+' / '+qs.length;const opts=q.slice(1,5).map((text,index)=>({text,index}));for(let x=opts.length-1;x>0;x--){const y=Math.floor(Math.random()*(x+1));[opts[x],opts[y]]=[opts[y],opts[x]]}quiz.innerHTML='<b>QUESTION '+(i+1)+' OF '+qs.length+'</b><h2>'+q[0]+'</h2><div class="opts">'+opts.map((o,n)=>'<button data-index="'+o.index+'">'+String.fromCharCode(65+n)+'. '+o.text+'</button>').join('')+'</div><div id="fb"></div>';document.querySelectorAll('.opts button').forEach(btn=>btn.onclick=()=>answer(Number(btn.dataset.index),q))}function answer(choice,q){const buttons=[...document.querySelectorAll('.opts button')];buttons.forEach(b=>{b.disabled=true;if(Number(b.dataset.index)===q[5])b.classList.add('correct')});const fb=document.getElementById('fb');if(choice===q[5]){score++;fb.innerHTML='🎉 <b>Correct!</b><br>💡 '+explanations[key]}else{const selected=buttons.find(b=>Number(b.dataset.index)===choice);if(selected)selected.classList.add('wrong');wrong.push({q:q[0],selected:q[choice+1],correct:q[q[5]+1]});fb.innerHTML='💪 <b>Keep learning!</b><br>💡 '+explanations[key]}const next=document.createElement('button');next.className='next-btn';next.textContent=i===qs.length-1?'FINISH →':'NEXT →';next.onclick=nextQuestion;fb.appendChild(document.createElement('br'));fb.appendChild(next)}function nextQuestion(){i++;bar.style.width=(i/qs.length*100)+'%';if(i<qs.length){render();return}quiz.style.display='none';final.textContent='Score: '+score+' / '+qs.length;if(wrong.length){review.innerHTML='<div class="review"><h2>📝 Review Wrong Attempts</h2>'+wrong.map((x,n)=>'<div class="review-item"><b>'+(n+1)+'. '+x.q+'</b><p>❌ Your answer: '+x.selected+'</p><p>✅ Correct answer: '+x.correct+'</p></div>').join('')+'</div>'}else review.innerHTML='<p>🎉 Perfect score! No wrong attempts to review.</p>';done.style.display='block'}render()}if(key&&topics[key])showTest();else showList();</script></body></html>
