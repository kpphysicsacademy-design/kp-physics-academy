const app=document.getElementById('app');const params=new URLSearchParams(location.search);const key=params.get('topic');const state={chapter,topic:key,question:0,score:0,wrong:[],answers:[]};function navigate(topic){location.href=location.pathname+'?chapter='+encodeURIComponent(chapter)+(topic?'&topic='+topic:'')}
function list(){app.innerHTML='<section class="hero"><div style="font-size:50px">🔬</div><h1>'+chapter+'</h1><p>Duolingo-style concept practice with instant feedback, progress tracking, explanations and error review.</p><div class="mode">🎯 CONCEPT-WISE PRACTICE</div></section><div class="label">CHOOSE A TEST</div>'+keys.map((k,i)=>'<a class="topic" href="?chapter='+encodeURIComponent(chapter)+'&topic='+k+'"><span class="num">'+(i+1)+'</span><span class="emoji">'+emojis[i]+'</span><span class="copy"><b>'+labels[i]+'</b><small>'+topics[k].length+' practice questions</small></span><span class="start">START →</span></a>').join('')}
function test(){
  const qs=topics[state.topic];
  if(!qs){ list(); return; }
  let i=0, score=0, wrong=[], answered=new Set();
  app.innerHTML='<section class="hero"><div class="mode">🌱 BOTANY</div><div style="font-size:48px">'+emojis[keys.indexOf(state.topic)]+'</div><h1>'+labels[keys.indexOf(state.topic)]+'</h1><div class="progress"><span id="bar"></span></div><span class="question-count" id="status"></span></section><section class="quiz" id="quiz"></section><section class="result hidden" id="result"><h1>🏆 Test Complete!</h1><p id="score"></p><div id="review"></div><button class="next" id="restart">TRY AGAIN</button></section>';

  function explanation(q){ return '📘 '+q[q[5]+1]+' is correct. This matches the NCERT concept being tested.'; }

  function render(){
    const q=qs[i];
    const opts=q.slice(1,5).map((x,j)=>({x,j}));
    for(let n=opts.length-1;n>0;n--){const z=Math.floor(Math.random()*(n+1));[opts[n],opts[z]]=[opts[z],opts[n]];}
    document.getElementById('status').textContent='Question '+(i+1)+' of '+qs.length;
    document.getElementById('bar').style.width=((i+1)/qs.length*100)+'%';
    const quiz=document.getElementById('quiz');
    quiz.classList.remove('hidden');
    quiz.innerHTML='<h2>🌿 '+q[0]+'</h2><div class="opts">'+opts.map((o,n)=>'<button type="button" data-choice="'+o.j+'"><span class="num" style="display:inline-grid;margin-right:14px;vertical-align:middle">'+String.fromCharCode(65+n)+'</span>'+o.x+'</button>').join('')+'</div><div class="hint" id="hint">💡 Choose the best answer.</div><div id="fb"></div><div class="nav-buttons"><button type="button" class="secondary" id="prev">← Previous</button><button type="button" class="secondary" id="showExp">🧠 Show Explanation</button><button type="button" class="next" id="nextMain">'+(i===qs.length-1?'Finish →':'Next →')+'</button></div>';
    document.getElementById('prev').disabled=i===0;
    document.getElementById('prev').onclick=()=>{if(i>0){i--;render();}};
    document.getElementById('showExp').onclick=()=>{document.getElementById('hint').textContent=explanation(q);};
    document.getElementById('nextMain').onclick=()=>{if(i<qs.length-1){i++;render();}else{finish();}};
    quiz.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>answer(Number(btn.dataset.choice),q));
  }

  function answer(choice,q){
    const bs=[...document.querySelectorAll('[data-choice]')];
    if(answered.has(i)) return;
    answered.add(i);
    bs.forEach(b=>{b.disabled=true;if(Number(b.dataset.choice)===q[5])b.classList.add('correct');});
    const fb=document.getElementById('fb');
    if(choice===q[5]){score++;fb.innerHTML='<b>🎉 Correct!</b><br>'+explanation(q);}
    else{const selected=bs.find(b=>Number(b.dataset.choice)===choice);if(selected)selected.classList.add('wrong');wrong.push({q:q[0],correct:q[q[5]+1],explanation:explanation(q)});fb.innerHTML='<b>❌ Not quite.</b><br>✅ Correct answer: '+q[q[5]+1]+'<br>'+explanation(q);}
  }

  function finish(){
    document.getElementById('quiz').classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');
    const pct=Math.round(score/qs.length*100);
    document.getElementById('score').innerHTML='Score: <b>'+score+' / '+qs.length+'</b> ('+pct+'%)<br><small>Correct: '+score+' • Wrong: '+wrong.length+'</small>'+(score===qs.length?'<br>🏆 PERFECT SCORE — 100% CORRECT!':'');
    document.getElementById('review').innerHTML=wrong.length?'<h2>📝 Review Wrong Attempts</h2>'+wrong.map(x=>'<div class="review-item"><b>❌ '+x.q+'</b><br>✅ '+x.correct+'<br><small>'+x.explanation+'</small></div>').join(''):'🎉 <b>Perfect! 100% correct answers.</b>';
    document.getElementById('restart').onclick=()=>{i=0;score=0;wrong=[];answered=new Set();document.getElementById('result').classList.add('hidden');render();};
  }
  render();
}
