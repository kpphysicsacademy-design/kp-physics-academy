<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biological Classification Tests | SkillUp</title><style>:root{--g:#58cc02;--gd:#46a302;--line:#e5e5e5;--ink:#4b4b4b;--red:#ff4b4b}*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:var(--ink)}.w{max-width:720px;margin:auto;padding:16px}.back{font-weight:900;color:#777;text-decoration:none}.hero,.topic,.quiz{background:#fff;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:20px;padding:20px;margin:14px 0}.hero{text-align:center}.mascot{font-size:54px}.topic{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}.num{width:38px;height:38px;border-radius:12px;background:#eaf8df;color:var(--gd);display:grid;place-items:center;font-weight:900}.topic b{display:block}.topic small{color:#777;font-weight:700}.start,.primary{margin-left:auto;background:var(--g);color:#fff;padding:10px 12px;border-radius:12px;border:0;border-bottom:4px solid var(--gd);font-weight:900}.progress{height:14px;background:#e5e5e5;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--g);width:0}.opts{display:grid;gap:12px}.opts button{padding:16px;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:16px;background:#fff;text-align:left;font-weight:800}.correct{border-color:var(--g)!important;background:#f1ffe8!important}.wrong{border-color:var(--red)!important;background:#fff0f0!important}.done{display:none;text-align:center}.topic-emoji{font-size:30px;line-height:1;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.topic b{font-size:17px}.hero h1{display:flex;align-items:center;justify-content:center;gap:8px}</style></head><body><main class="w"><a class="back" href="botany-biological-classification.html">← Back to Biological Classification</a><div id="app"></div></main><script>const topics={"need-for-classification":[["Why is classification necessary?","It makes biodiversity easier to study","It stops evolution","It removes species","It makes all organisms identical",0],["Classification is based mainly on:","Similarities and differences","Only colour","Only size","Only habitat",0],["Classification helps in:","Correct identification of organisms","Stopping reproduction","Changing DNA","Preventing variation",0],["A useful classification should help us understand:","Relationships among organisms","Only body weight","Only food habits","Only age",0],["Modern classification also considers:","Evolutionary relationships","Only colour","Only economic value","Only geography",0]],"five-kingdom":[["Who proposed the Five Kingdom classification?","R. H. Whittaker","Linnaeus","Darwin","Haeckel",0],["Whittaker proposed the Five Kingdom system in:","1969","1959","1979","1989",0],["Which is NOT a Whittaker kingdom?","Virus","Monera","Protista","Fungi",0],["Whittaker used which criterion?","Cell structure and mode of nutrition","Only colour","Only habitat","Only size",0],["Prokaryotes were placed in:","Monera","Protista","Fungi","Plantae",0]],"monera":[["Monera contains mainly:","Prokaryotic organisms","Multicellular plants","Only fungi","Only animals",0],["Bacterial cell wall contains:","Peptidoglycan","Chitin","Cellulose","Lignin",0],["Cyanobacteria are:","Photosynthetic prokaryotes","Fungi","Viruses","Animals",0],["Methanogens belong to:","Archaebacteria","Diatoms","Dinoflagellates","Fungi",0],["Bacteria commonly reproduce by:","Binary fission","Budding only","Seeds","Spores only",0]],"protista":[["Protists are mainly:","Unicellular eukaryotes","Prokaryotes","Multicellular fungi","Viruses",0],["Diatom walls contain:","Silica","Chitin","Peptidoglycan","Lignin",0],["Red tides are associated with:","Dinoflagellates","Diatoms","Bacteria","Fungi",0],["Euglenoids have a flexible:","Pellicle","Capsid","Cell wall of chitin","Silica shell",0],["Slime moulds are included in:","Protista","Monera","Fungi only","Animalia",0]],"fungi":[["Fungal cell wall mainly contains:","Chitin","Cellulose","Peptidoglycan","Lignin",0],["A mass of hyphae forms:","Mycelium","Capsid","Pellicle","Nucleus",0],["Fungi generally show:","Heterotrophic nutrition","Autotrophic nutrition only","Photosynthesis","Chemosynthesis only",0],["Yeast is commonly:","Unicellular","A virus","A bacterium","A plant",0],["Bread mould belongs to:","Fungi","Protista","Monera","Animalia",0]],"viruses":[["Viruses are:","Obligate intracellular parasites","Independent autotrophs","Multicellular organisms","Only plants",0],["A viral protein coat is called:","Capsid","Pellicle","Cell wall","Mycelium",0],["A virus contains:","Either DNA or RNA","Always both DNA and RNA","Only protein","Cellulose",0],["A bacteriophage infects:","Bacteria","Fungi","Plants only","Humans only",0],["Outside a host viruses are generally:","Inert","Photosynthetic","Actively dividing","Multicellular",0]],"viroids":[["Viroids consist of:","Naked RNA","DNA with capsid","Protein only","DNA and RNA together",0],["Viroids lack a:","Protein coat","RNA","Infectious nature","Host",0],["Viroids mainly infect:","Plants","Only bacteria","Only animals","Only fungi",0],["Viroids were discovered by:","Theodor O. Diener","Whittaker","Darwin","Pasteur",0],["Compared with viruses, viroids are:","Simpler infectious agents","Multicellular","Always DNA based","Bacteria",0]],"lichens":[["Lichens are an association between:","Alga and fungus","Bacterium and virus","Two animals","Two fungi only",0],["The algal partner is called:","Phycobiont","Mycobiont","Capsid","Pellicle",0],["The fungal partner is called:","Mycobiont","Phycobiont","Thallus","Viroid",0],["The algal partner mainly provides:","Food by photosynthesis","Chitin","Capsid","Peptidoglycan",0],["Lichens are indicators of:","Air pollution","Earthquakes","Magnetic fields","Ocean depth",0]]};const names=["need-for-classification","five-kingdom","monera","protista","fungi","viruses","viroids","lichens"];const emojis=["🧠","🏆","🦠","🔬","🍄","🦠","🧬","🌿"];const labels=["Need for Classification","Five Kingdom Classification","Kingdom Monera","Kingdom Protista","Kingdom Fungi","Viruses","Viroids","Lichens"];const app=document.getElementById('app'),key=new URLSearchParams(location.search).get('topic');function list(){app.innerHTML='<section class="hero"><div class="mascot">🦉</div><h1>Choose a Concept Test</h1><p>New questions for every concept.</p></section><div class="label">CHOOSE A SKILL</div>'+names.map((k,i)=>'<a class="topic" href="?topic='+k+'"><span class="num">'+(i+1)+'</span><span class="topic-emoji">'+emojis[i]+'</span><span><b>'+labels[i]+'</b><small>'+topics[k].length+' concept questions</small></span><span class="start">START →</span></a>').join('')}function test(){let qs=topics[key],i=0,score=0;app.innerHTML='<section class="hero"><div class="mascot">🧠</div><h1>'+labels[names.indexOf(key)]+'</h1><div class="progress"><span id="bar"></span></div><b id="status">Question 1 / '+qs.length+'</b></section><section class="quiz" id="quiz"></section><section class="hero done" id="done"><div class="mascot">🏆</div><h1>Skill Complete!</h1><p id="final"></p><button class="primary" onclick="location.reload()">TRY AGAIN</button></section>';function render(){let q=qs[i];quiz.innerHTML='<b>QUESTION '+(i+1)+' OF '+qs.length+'</b><h2>'+q[0]+'</h2><div class="opts">'+q.slice(1,5).map((x,n)=>'<button onclick="pick('+n+')">'+String.fromCharCode(65+n)+'. '+x+'</button>').join('')+'</div><p id="fb"></p>'}window.pick=n=>{let q=qs[i],bs=[...document.querySelectorAll('.opts button')];bs.forEach((b,x)=>{b.disabled=true;if(x===q[5])b.classList.add('correct')});if(n===q[5]){score++;fb.textContent='🎉 Correct!'}else{bs[n].classList.add('wrong');fb.textContent='💪 Keep learning!'}setTimeout(()=>{i++;bar.style.width=(i/qs.length*100)+'%';if(i<qs.length){status.textContent='Question '+(i+1)+' / '+qs.length;render()}else{quiz.style.display='none';final.textContent='Score: '+score+' / '+qs.length;done.style.display='block'}},700)};render()}key&&topics[key]?test():list();</script></body></html>
