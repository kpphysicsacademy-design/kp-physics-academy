<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Need for Classification Test | SkillUp</title><style>:root{--g:#58cc02;--gd:#46a302;--line:#e5e5e5;--ink:#4b4b4b;--red:#ff4b4b}*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:var(--ink)}.w{max-width:680px;margin:auto;padding:16px}.back{display:inline-block;color:#777;font-weight:900;text-decoration:none;margin-bottom:14px}.card{background:#fff;border:2px solid var(--line);border-bottom:6px solid #ddd;border-radius:20px;padding:20px;margin:14px 0}.hero{text-align:center}.mascot{font-size:58px}.progress{height:14px;background:#e5e5e5;border-radius:99px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;width:0;background:var(--g);transition:.3s}.qno{font-size:12px;font-weight:900;color:#777}.opts{display:grid;gap:12px;margin-top:18px}.opts button,.primary{padding:16px;border:2px solid var(--line);border-bottom:5px solid #d7d7d7;border-radius:16px;background:#fff;text-align:left;font-weight:900;font-size:16px;color:var(--ink)}.correct{border-color:var(--g)!important;background:#f2ffe8!important}.wrong{border-color:var(--red)!important;background:#fff0f0!important}.feedback{font-weight:900;min-height:26px;margin-top:14px}.primary{width:100%;background:var(--g);border-color:var(--gd);color:#fff;text-align:center;cursor:pointer}.done{display:none;text-align:center}</style></head><body><main class="w"><a class="back" href="botany-biological-classification-test.html">← Back to Test List</a><section class="card hero"><div class="mascot">🧠</div><h1>Need for Classification</h1><p>Concept Test • 10 Questions</p><div class="progress"><span id="bar"></span></div><b id="status">Question 1 / 10</b></section><section class="card" id="quiz"></section><section class="card done" id="done"><div class="mascot">🏆</div><h1>Skill Complete!</h1><p id="final"></p><button class="primary" onclick="location.reload()">🔄 TRY AGAIN</button></section></main><script>const qs=[["Why do we classify organisms?","To study biodiversity systematically","To stop evolution","To make organisms identical","To change habitats",0],["Classification groups organisms using:","Similarities and differences","Only colour","Only size","Only age",0],["Classification makes biodiversity easier to:","Study and understand","Destroy","Ignore","Reduce",0],["Modern classification considers:","Evolutionary relationships","Only body weight","Only colour","Only habitat",0],["Classification helps in:","Identification of organisms","Stopping reproduction","Changing DNA","Removing species",0],["Organisms in the same group generally show:","Certain similarities","No similarities","Same size always","Same habitat always",0],["Scientific classification helps scientists:","Communicate accurately","Use random names","Avoid study","Stop discovery",0],["A natural classification reflects:","Important relationships","Random grouping","Only economic value","Only colour",0],["Classification helps understand:","Diversity of organisms","Only human anatomy","Only weather","Only rocks",0],["One major benefit of classification is:","Systematic study of life","Stopping biodiversity","Making species identical","Removing variation",0]];let i=0,score=0;const quiz=document.getElementById('quiz');function render(){const q=qs[i];quiz.innerHTML='<div class="qno">QUESTION '+(i+1)+' OF '+qs.length+'</div><h2>'+q[0]+'</h2><div class="opts">'+q.slice(1,5).map((o,n)=>'<button onclick="pick('+n+')">'+String.fromCharCode(65+n)+'. '+o+'</button>').join('')+'</div><p class="feedback"></p>'}function pick(n){const q=qs[i],bs=[...quiz.querySelectorAll('button')];bs.forEach((b,x)=>{b.disabled=true;if(x===q[5])b.classList.add('correct')});const fb=quiz.querySelector('.feedback');if(n===q[5]){score++;fb.textContent='🎉 Great job! Correct!'}else{bs[n].classList.add('wrong');fb.textContent='💪 Keep going! Correct answer is highlighted.'}setTimeout(()=>{i++;document.getElementById('bar').style.width=(i/qs.length*100)+'%';if(i<qs.length){document.getElementById('status').textContent='Question '+(i+1)+' / '+qs.length;render()}else{quiz.style.display='none';document.getElementById('final').textContent='Your score: '+score+' / '+qs.length;document.getElementById('done').style.display='block';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}},850)}render()</script></body></html>
