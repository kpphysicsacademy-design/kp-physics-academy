<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Five Kingdom Classification | NEET Botany</title><style>body{font-family:Arial,sans-serif;background:#f7fff2;color:#263238;margin:0}.wrap{max-width:760px;margin:auto;padding:20px 14px 50px}.hero,.quiz,.result{background:#fff;border:2px solid #dfead8;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 4px 0 #d8e5d2}.hero{text-align:center}.icon{font-size:42px}.tag{display:inline-block;background:#e8f8dc;color:#46a302;border-radius:20px;padding:7px 12px;font-weight:900}.progress{height:14px;background:#e5e5e5;border-radius:99px;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;background:#58cc02;width:0}.opts{display:grid;gap:11px}.opts button{padding:15px;border:2px solid #dfe5e8;border-radius:16px;background:white;text-align:left;font-weight:800;font-size:16px;cursor:pointer}.correct{border-color:#58cc02!important;background:#effbe8!important}.wrong{border-color:#ff4b4b!important;background:#fff0f0!important}.feedback{padding:15px;border-radius:15px;margin-top:14px;background:#f4f7f4;line-height:1.55}.next{margin-top:16px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:900;cursor:pointer}.hidden{display:none}@media(max-width:600px){.wrap{padding:12px}.hero,.quiz,.result{padding:17px}}</style></head><body><main class="wrap"><section class="hero"><div class="icon">🌱</div><div class="tag">NEET BOTANY • FIVE KINGDOM CLASSIFICATION</div><h1>Five Kingdom Classification</h1><p>Practice one concept at a time and master Whittaker's classification.</p></section><section class="quiz"><div id="count"></div><div class="progress"><span id="bar"></span></div><h2 id="q"></h2><div class="opts" id="opts"></div><div id="fb" class="feedback hidden"></div><button id="next" class="next hidden">NEXT →</button></section><section id="result" class="result hidden"></section></main><script>
const questions=[
['Who proposed the five-kingdom classification?','R.H. Whittaker','Carolus Linnaeus','Ernst Haeckel','Robert Brown',0,'R.H. Whittaker proposed the five-kingdom classification in 1969.'],
['Which is the primary basis for separating Monera from the other four kingdoms?','Prokaryotic cellular organisation','Mode of locomotion','Body colour','Habitat',0,'Monera consists of prokaryotic organisms, whereas Protista, Fungi, Plantae and Animalia are eukaryotic.'],
['Which kingdom contains unicellular eukaryotes such as Amoeba?','Protista','Monera','Fungi','Animalia',0,'Protista includes predominantly unicellular eukaryotic organisms such as Amoeba and Paramecium.'],
['Which kingdom is characterised by absorptive heterotrophic nutrition?','Fungi','Plantae','Animalia','Monera',0,'Fungi obtain nutrients mainly by absorption after extracellular digestion.'],
['The cell wall of fungi is mainly composed of:','Chitin','Cellulose','Peptidoglycan','Lignin',0,'Fungal cell walls contain chitin, unlike plant cell walls which are mainly cellulose.'],
['Which kingdom includes organisms with ingestive heterotrophic nutrition?','Animalia','Fungi','Plantae','Monera',0,'Animals obtain food by ingestion and digest it internally.'],
['Cyanobacteria are placed in:','Monera','Protista','Fungi','Plantae',0,'Cyanobacteria are prokaryotic organisms and are included in Monera in the five-kingdom system.'],
['Methanogens belong to:','Archaebacteria','Eubacteria','Protista','Fungi',0,'Methanogens are archaebacteria commonly associated with anaerobic habitats such as the rumen of cattle.'],
['Which organism is a typical member of Fungi?','Agaricus','Nostoc','Amoeba','Paramecium',0,'Agaricus is a mushroom and belongs to Kingdom Fungi.'],
['Lichens represent a symbiotic association between:','Alga and fungus','Bacterium and virus','Plant and animal','Fungus and virus',0,'A lichen is a symbiotic association between a photosynthetic partner, usually an alga/cyanobacterium, and a fungus.'],
['Which kingdom contains multicellular organisms with cell walls and chlorophyll-based autotrophic nutrition?','Plantae','Animalia','Fungi','Protista',0,'Plantae consists mainly of multicellular eukaryotic organisms with cell walls and predominantly photosynthetic nutrition.'],
['Which kingdom is primarily made up of unicellular eukaryotes?','Protista','Monera','Plantae','Animalia',0,'Protista is primarily a kingdom of unicellular eukaryotes, although some forms may be colonial or simple multicellular.'],
['Mycoplasma is placed in Monera because it is:','Prokaryotic and lacks a cell wall','Eukaryotic and has chitin','Multicellular and photosynthetic','A fungus',0,'Mycoplasma is a prokaryote distinguished by the absence of a cell wall.'],
['Which kingdom contains organisms that may be unicellular or multicellular and reproduce by spores?','Fungi','Animalia','Plantae only','Monera only',0,'Fungi include unicellular forms such as yeast and multicellular forms that commonly reproduce through spores.'],
['Which criterion was NOT a major basis of Whittaker’s five-kingdom classification?','Body colour','Cell structure','Mode of nutrition','Reproduction',0,'Whittaker considered cell structure, body organisation, nutrition, reproduction and evolutionary relationships; body colour was not a major criterion.'],
['Which kingdom contains organisms that are generally multicellular and ingestive heterotrophs?','Animalia','Fungi','Protista','Monera',0,'Animalia consists of multicellular eukaryotes that obtain nutrition by ingestion.'],
['Which group is characterised by prokaryotic cells and includes both archaebacteria and eubacteria?','Monera','Protista','Fungi','Plantae',0,'Monera contains prokaryotic organisms, including archaebacteria and eubacteria in the traditional five-kingdom classification.'],
['Euglena is placed in Protista because it is:','A unicellular eukaryote with both plant-like and animal-like features','A prokaryote','A multicellular fungus','A bacterium',0,'Euglena is a unicellular eukaryote showing both photosynthetic and heterotrophic modes of nutrition.'],
['Which kingdom is distinct from Plantae because its members obtain nutrients by absorption rather than photosynthesis?','Fungi','Animalia','Monera','Protista',0,'Fungi are heterotrophic and characteristically absorb nutrients after extracellular digestion.'],
['What makes the five-kingdom classification different from a simple two-kingdom system?','It separates organisms using cellular organisation, nutrition, body organisation and other criteria','It uses only habitat','It uses only body size','It ignores cell structure',0,'The five-kingdom system provides a broader classification using multiple biological criteria rather than only plant-versus-animal grouping.']
];
let i=0,score=0,answered=false;const q=document.getElementById('q'),opts=document.getElementById('opts'),fb=document.getElementById('fb'),next=document.getElementById('next'),count=document.getElementById('count'),bar=document.getElementById('bar');function render(){answered=false;const x=questions[i];count.textContent=`Question ${i+1} of ${questions.length}`;bar.style.width=((i/questions.length)*100)+'%';q.textContent=x[0];opts.innerHTML='';fb.className='feedback hidden';next.className='next hidden';x.slice(1,5).forEach((o,n)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(n,b);opts.appendChild(b)})}function answer(n,b){if(answered)return;answered=true;const x=questions[i],buttons=[...opts.children];buttons.forEach(v=>v.disabled=true);if(n===x[5]){score++;b.classList.add('correct');fb.textContent='✅ Correct. '+x[6]}else{b.classList.add('wrong');buttons[x[5]].classList.add('correct');fb.textContent='❌ Incorrect. '+x[6]+' Correct answer: '+x[x[5]+1]}fb.className='feedback';next.textContent=i===questions.length-1?'SEE RESULT →':'NEXT →';next.className='next'}next.onclick=()=>{if(i<questions.length-1){i++;render()}else{document.querySelector('.quiz').classList.add('hidden');const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<h2>🌱 Five Kingdom Classification Complete</h2><p><strong>${score}/${questions.length}</strong> correct</p><p>${Math.round(score/questions.length*100)}% accuracy</p><button class="next" onclick="location.reload()">RETRY</button>`}}render();</script></body></html>
