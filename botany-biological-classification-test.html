<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Five Kingdom Classification | NEET Botany</title><style>body{font-family:Arial,sans-serif;background:#f7fff2;color:#263238;margin:0}.wrap{max-width:760px;margin:auto;padding:20px 14px 50px}.hero,.quiz,.result{background:#fff;border:2px solid #dfead8;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 4px 0 #d8e5d2}.hero{text-align:center}.icon{font-size:42px}.tag,.concept{display:inline-block;border-radius:20px;padding:7px 12px;font-weight:900}.tag{background:#e8f8dc;color:#46a302}.concept{background:#edf7ff;color:#2673a8;margin-bottom:8px}.progress{height:14px;background:#e5e5e5;border-radius:99px;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;background:#58cc02;width:0}.opts{display:grid;gap:11px}.opts button{padding:15px;border:2px solid #dfe5e8;border-radius:16px;background:white;text-align:left;font-weight:800;font-size:16px;cursor:pointer}.correct{border-color:#58cc02!important;background:#effbe8!important}.wrong{border-color:#ff4b4b!important;background:#fff0f0!important}.feedback{padding:15px;border-radius:15px;margin-top:14px;background:#f4f7f4;line-height:1.55}.next{margin-top:16px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:900;cursor:pointer}.hidden{display:none}@media(max-width:600px){.wrap{padding:12px}.hero,.quiz,.result{padding:17px}}</style></head><body><main class="wrap"><section class="hero"><div class="icon">🌱</div><div class="tag">NEET BOTANY • FIVE KINGDOM CLASSIFICATION</div><h1>Five Kingdom Classification</h1><p>40 subconcept questions. One concept at a time with immediate feedback and specific explanations.</p></section><section class="quiz"><div id="concept" class="concept"></div><div id="count"></div><div class="progress"><span id="bar"></span></div><h2 id="q"></h2><div class="opts" id="opts"></div><div id="fb" class="feedback hidden"></div><button id="next" class="next hidden">NEXT →</button></section><section id="result" class="result hidden"></section></main><script>
const questions=[
['Need for Biological Classification','Why is biological classification necessary?','It organizes the enormous diversity of organisms into meaningful groups','It makes all organisms identical','It removes the need for identification','It only describes habitats',0,'Biological classification organizes diverse organisms into groups based on shared characteristics, making identification and study systematic.'],
['Need for Biological Classification','Which problem is reduced by a scientific classification system?','Difficulty in studying the large diversity of organisms','Cellular respiration','Photosynthesis','DNA replication',0,'Classification reduces the complexity of biological diversity by grouping organisms according to shared characteristics.'],
['Need for Biological Classification','A useful classification system should primarily reflect:','Natural relationships among organisms','Only body colour','Only geographic location','Only body size',0,'A biological classification aims to represent meaningful similarities, differences and evolutionary relationships among organisms.'],
['Need for Biological Classification','Which statement best describes biological classification?','Grouping organisms using selected characteristics and relationships','Naming organisms only','Measuring organisms only','Counting species only',0,'Classification is the systematic grouping of organisms using characteristics and relationships.'],
['Limitations of Two-Kingdom Classification','Which major group was difficult to place in the old two-kingdom system?','Bacteria','Humans','Flowering plants','Birds',0,'The two-kingdom system could not satisfactorily accommodate organisms such as bacteria because their cellular organization differs fundamentally from eukaryotes.'],
['Limitations of Two-Kingdom Classification','The two-kingdom system mainly divided organisms into:','Plantae and Animalia','Monera and Protista','Fungi and Plantae','Protista and Animalia',0,'The traditional two-kingdom system classified organisms broadly into Kingdom Plantae and Kingdom Animalia.'],
['Limitations of Two-Kingdom Classification','Why could fungi not be satisfactorily grouped with plants?','Fungi are heterotrophic and lack chlorophyll','Fungi are prokaryotic','Fungi are animals','Fungi have no cell wall',0,'Fungi are heterotrophic, lack chlorophyll and obtain nutrients by absorption, so treating them simply as plants was inadequate.'],
['Limitations of Two-Kingdom Classification','Which distinction was poorly represented by the two-kingdom system?','Prokaryotic versus eukaryotic organization','Vertebrates versus invertebrates','Root versus shoot','Leaf versus stem',0,'The two-kingdom system did not adequately separate prokaryotic organisms from eukaryotic organisms.'],
['R.H. Whittaker and Five Kingdom System','Who proposed the five-kingdom classification?','R.H. Whittaker','Carolus Linnaeus','Charles Darwin','Robert Hooke',0,'R.H. Whittaker proposed the five-kingdom classification in 1969.'],
['R.H. Whittaker and Five Kingdom System','In which year was Whittaker’s five-kingdom classification proposed?','1969','1753','1859','1990',0,'Whittaker proposed the five-kingdom system in 1969.'],

['R.H. Whittaker and Five Kingdom System','Which set represents Whittaker’s five kingdoms?','Monera, Protista, Fungi, Plantae and Animalia','Bacteria, Viruses, Plants, Fungi and Animals','Monera, Algae, Plants, Animals and Viruses','Protista, Fungi, Plants, Animals and Viruses',0,'Whittaker divided organisms into Monera, Protista, Fungi, Plantae and Animalia.'],

['Criteria Used by Whittaker','Which nutritional distinction separates fungi from plants?','Fungi are absorptive heterotrophs whereas plants are predominantly autotrophic','Fungi are photosynthetic','Plants ingest food','Plants lack cell walls',0,'Fungi obtain nutrients by absorption after extracellular digestion, while plants are predominantly photosynthetic autotrophs.'],
['Criteria Used by Whittaker','Which was NOT a major criterion used by Whittaker?','Body colour','Cell structure','Mode of nutrition','Body organization',0,'Whittaker considered cell structure, body organization, mode of nutrition, reproduction and evolutionary relationships; body colour was not a major criterion.'],
['Criteria Used by Whittaker','Which criterion considers whether organisms are unicellular or multicellular?','Body organization','Body colour','Habitat','Locomotion',0,'Body organization includes the level of organization such as unicellular or multicellular condition.'],

['Kingdom Monera — General Characteristics','Which organisms are traditionally included in Monera?','Bacteria and cyanobacteria','Amoeba and Paramecium','Yeast and mushrooms','Mosses and ferns',0,'The traditional five-kingdom system places bacteria and cyanobacteria within Monera.'],
['Kingdom Monera — General Characteristics','Which statement about Monera is correct?','They are prokaryotic and may be autotrophic or heterotrophic','They are all multicellular','They all have chloroplasts','They all reproduce sexually',0,'Monerans are prokaryotic and show diverse modes of nutrition, including autotrophic and heterotrophic nutrition.'],
['Archaebacteria and Eubacteria','Which group includes organisms adapted to extreme habitats such as high salt or high temperature?','Archaebacteria','Eubacteria only','Protozoans','Fungi',0,'Archaebacteria include groups adapted to extreme habitats such as high salt, high temperature and anaerobic conditions.'],
['Archaebacteria and Eubacteria','Which feature is characteristic of archaebacterial cell walls?','They lack the typical peptidoglycan wall of eubacteria','They always contain cellulose','They always contain chitin','They have no cell membrane',0,'Archaebacterial cell walls differ chemically from those of eubacteria and do not contain the typical peptidoglycan found in eubacterial walls.'],

['Chrysophytes, Dinoflagellates and Euglenoids','The cell walls of diatoms are rich in:','Silica','Chitin','Peptidoglycan','Lignin',0,'Diatom cell walls contain silica and form distinctive shells called frustules.'],
['Chrysophytes, Dinoflagellates and Euglenoids','Red tides are commonly associated with rapid multiplication of:','Dinoflagellates','Diatoms only','Fungi','Mosses',0,'Certain dinoflagellates multiply rapidly and can cause red tides in marine environments.'],
['Chrysophytes, Dinoflagellates and Euglenoids','Euglena is notable for having:','Both photosynthetic and heterotrophic modes of nutrition','A peptidoglycan wall','No nucleus','A chitinous wall',0,'Euglena can photosynthesise in light and obtain organic nutrients heterotrophically under suitable conditions.'],

['Slime Moulds and Protozoans','Which group includes Amoeba and Paramecium?','Protozoans','Cyanobacteria','Fungi','Bryophytes',0,'Amoeba and Paramecium are protozoans, unicellular heterotrophic protists.'],
['Slime Moulds and Protozoans','Which protozoan is traditionally associated with malaria?','Plasmodium','Amoeba','Paramecium','Euglena',0,'Plasmodium is a parasitic protozoan responsible for malaria.'],

['Lichens and Mycorrhiza','Mycorrhiza is an association between:','Fungus and plant roots','Fungus and animal gut','Bacterium and virus','Alga and protozoan',0,'Mycorrhiza is a mutualistic association between fungal hyphae and plant roots.'],

['Kingdom Animalia — General Characteristics','Which feature is characteristic of Kingdom Animalia?','Multicellular ingestive heterotrophs without cell walls','Unicellular prokaryotes','Photosynthetic cells with cellulose walls','Absorptive fungi',0,'Animals are multicellular eukaryotic heterotrophs that obtain food by ingestion and lack cell walls.'],

let i=0,score=0,answered=false;const q=document.getElementById('q'),opts=document.getElementById('opts'),fb=document.getElementById('fb'),next=document.getElementById('next'),count=document.getElementById('count'),bar=document.getElementById('bar'),concept=document.getElementById('concept');function render(){answered=false;const x=questions[i];concept.textContent=x[0];count.textContent=`Question ${i+1} of ${questions.length}`;bar.style.width=((i/questions.length)*100)+'%';q.textContent=x[1];opts.innerHTML='';fb.className='feedback hidden';next.className='next hidden';x.slice(2,6).forEach((o,n)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(n,b);opts.appendChild(b)})}function answer(n,b){if(answered)return;answered=true;const x=questions[i],buttons=[...opts.children];buttons.forEach(v=>v.disabled=true);if(n===x[6]){score++;b.classList.add('correct');fb.textContent='✅ Correct. '+x[7]}else{b.classList.add('wrong');buttons[x[6]].classList.add('correct');fb.textContent='❌ Incorrect. '+x[7]+' Correct answer: '+x[x[6]+2]}fb.className='feedback';next.textContent=i===questions.length-1?'SEE RESULT →':'NEXT →';next.className='next'}next.onclick=()=>{if(i<questions.length-1){i++;render()}else{document.querySelector('.quiz').classList.add('hidden');const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<h2>🌱 Five Kingdom Classification Complete</h2><p><strong>${score}/${questions.length}</strong> correct</p><p>${Math.round(score/questions.length*100)}% accuracy</p><p>40 questions completed across 10 focused subconcepts.</p><button class="next" onclick="location.reload()">RETRY</button>`}}render();</script></body></html>
