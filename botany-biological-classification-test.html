<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Five Kingdom Classification | NEET Botany</title><style>body{font-family:Arial,sans-serif;background:#f7fff2;color:#263238;margin:0}.wrap{max-width:760px;margin:auto;padding:20px 14px 50px}.hero,.quiz,.result{background:#fff;border:2px solid #dfead8;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 4px 0 #d8e5d2}.hero{text-align:center}.icon{font-size:42px}.tag,.concept{display:inline-block;border-radius:20px;padding:7px 12px;font-weight:900}.tag{background:#e8f8dc;color:#46a302}.concept{background:#edf7ff;color:#2673a8;margin-bottom:8px}.progress{height:14px;background:#e5e5e5;border-radius:99px;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;background:#58cc02;width:0}.opts{display:grid;gap:11px}.opts button{padding:15px;border:2px solid #dfe5e8;border-radius:16px;background:white;text-align:left;font-weight:800;font-size:16px;cursor:pointer}.correct{border-color:#58cc02!important;background:#effbe8!important}.wrong{border-color:#ff4b4b!important;background:#fff0f0!important}.feedback{padding:15px;border-radius:15px;margin-top:14px;background:#f4f7f4;line-height:1.55}.next{margin-top:16px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:900;cursor:pointer}.hidden{display:none}@media(max-width:600px){.wrap{padding:12px}.hero,.quiz,.result{padding:17px}}</style></head><body><main class="wrap"><section class="hero"><div class="icon">🌱</div><div class="tag">NEET BOTANY • FIVE KINGDOM CLASSIFICATION</div><h1>Five Kingdom Classification</h1><p>Concept-wise practice: learn, answer, review, and move to the next concept.</p></section><section class="quiz"><div id="concept" class="concept"></div><div id="count"></div><div class="progress"><span id="bar"></span></div><h2 id="q"></h2><div class="opts" id="opts"></div><div id="fb" class="feedback hidden"></div><button id="next" class="next hidden">NEXT →</button></section><section id="result" class="result hidden"></section></main><script>
const questions=[
['Five Kingdom Classification — Proposal & Criteria','Who proposed the five-kingdom classification?','R.H. Whittaker','Carolus Linnaeus','Ernst Haeckel','Robert Brown',0,'R.H. Whittaker proposed the five-kingdom classification in 1969.'],
['Five Kingdom Classification — Proposal & Criteria','Which criterion was NOT a major basis of Whittaker’s classification?','Body colour','Cell structure','Mode of nutrition','Body organisation',0,'Whittaker used criteria including cell structure, body organisation, mode of nutrition, reproduction and evolutionary relationships; body colour was not a major criterion.'],
['Five Kingdom Classification — Proposal & Criteria','Why was cellular organisation important in the five-kingdom system?','It separates prokaryotic organisms from eukaryotic organisms','It identifies organisms by colour','It measures body size','It determines habitat only',0,'Cellular organisation distinguishes prokaryotic Monera from the eukaryotic kingdoms Protista, Fungi, Plantae and Animalia.'],
['Five Kingdom Classification — Proposal & Criteria','Which combination best represents major criteria used in five-kingdom classification?','Cell structure, body organisation and mode of nutrition','Body colour, size and habitat','Only reproduction and habitat','Only locomotion and body shape',0,'Whittaker’s classification considered cell structure, body organisation, mode of nutrition, reproduction and evolutionary relationships.'],
['Kingdom Monera — Prokaryotes','Which kingdom contains prokaryotic organisms?','Monera','Protista','Fungi','Plantae',0,'Monera contains prokaryotic organisms whose cells lack a true nucleus bounded by a nuclear membrane.'],
['Kingdom Monera — Prokaryotes','Cyanobacteria are placed in which kingdom in the five-kingdom system?','Monera','Protista','Fungi','Animalia',0,'Cyanobacteria are prokaryotic organisms and are placed in Monera in the traditional five-kingdom classification.'],
['Kingdom Monera — Prokaryotes','Mycoplasma is notable because it:','Lacks a cell wall','Has a chitinous cell wall','Is multicellular','Has membrane-bound chloroplasts',0,'Mycoplasma is a prokaryote distinguished by the absence of a cell wall.'],
['Kingdom Monera — Prokaryotes','Which pair belongs to Monera?','Archaebacteria and eubacteria','Amoeba and Paramecium','Yeast and Agaricus','Moss and fern',0,'The traditional five-kingdom system places both archaebacteria and eubacteria within Monera.'],
['Kingdom Protista — Unicellular Eukaryotes','Which kingdom primarily contains unicellular eukaryotes?','Protista','Monera','Plantae','Animalia',0,'Protista is primarily composed of unicellular eukaryotic organisms.'],
['Kingdom Protista — Unicellular Eukaryotes','Amoeba belongs to:','Protista','Monera','Fungi','Plantae',0,'Amoeba is a unicellular eukaryote and is classified under Protista.'],
['Kingdom Protista — Unicellular Eukaryotes','Euglena is placed in Protista mainly because it is:','A unicellular eukaryote showing both photosynthetic and heterotrophic nutrition','A prokaryote without a nucleus','A multicellular fungus','A bacterium with peptidoglycan',0,'Euglena is a unicellular eukaryote that can photosynthesise and can also obtain nutrition heterotrophically.'],
['Kingdom Protista — Unicellular Eukaryotes','Which organism is a typical protist?','Paramecium','Nostoc','Agaricus','Mushroom',0,'Paramecium is a unicellular eukaryote classified in Protista.'],
['Kingdom Fungi — Nutrition & Structure','Which kingdom is characterised by absorptive heterotrophic nutrition?','Fungi','Plantae','Animalia','Protista',0,'Fungi obtain nutrients by absorption after extracellular digestion of food.'],
['Kingdom Fungi — Nutrition & Structure','The cell wall of fungi is mainly composed of:','Chitin','Cellulose','Peptidoglycan','Lignin',0,'Chitin is the characteristic structural polysaccharide of fungal cell walls.'],
['Kingdom Fungi — Nutrition & Structure','Which organism is a member of Fungi?','Agaricus','Amoeba','Nostoc','Paramecium',0,'Agaricus is a mushroom and belongs to Kingdom Fungi.'],
['Kingdom Fungi — Nutrition & Structure','Lichens are an association between:','A photosynthetic partner and a fungus','A bacterium and a virus','A plant and an animal','Two viruses',0,'A lichen is a symbiotic association between a photosynthetic partner, usually an alga or cyanobacterium, and a fungus.'],
['Kingdom Plantae & Animalia — Nutrition','Which kingdom contains predominantly multicellular photosynthetic organisms with cell walls?','Plantae','Animalia','Fungi','Monera',0,'Plantae contains predominantly multicellular eukaryotes with cell walls and photosynthetic nutrition.'],
['Kingdom Plantae & Animalia — Nutrition','Which kingdom is characterised by ingestive heterotrophic nutrition?','Animalia','Fungi','Plantae','Monera',0,'Animals obtain food by ingestion and digest it internally.'],
['Kingdom Plantae & Animalia — Nutrition','Which feature distinguishes Animalia from Fungi most directly?','Animals obtain food by ingestion, whereas fungi obtain nutrients by absorption','Animals have chitinous cell walls','Fungi ingest food internally','Animals are prokaryotic',0,'Animalia is characterised by ingestive heterotrophic nutrition, while fungi characteristically obtain nutrients by absorption.'],
['Kingdom Plantae & Animalia — Nutrition','Which statement correctly contrasts Plantae and Animalia?','Plantae are predominantly autotrophic and have cell walls; Animalia are ingestive heterotrophs without cell walls','Both are prokaryotic','Both have chitinous cell walls','Plantae obtain food only by ingestion',0,'Plants are predominantly photosynthetic autotrophs with cell walls, whereas animals are multicellular ingestive heterotrophs lacking cell walls.']
];
let i=0,score=0,answered=false;const q=document.getElementById('q'),opts=document.getElementById('opts'),fb=document.getElementById('fb'),next=document.getElementById('next'),count=document.getElementById('count'),bar=document.getElementById('bar'),concept=document.getElementById('concept');function render(){answered=false;const x=questions[i];concept.textContent=x[0];count.textContent=`Question ${i+1} of ${questions.length}`;bar.style.width=((i/questions.length)*100)+'%';q.textContent=x[1];opts.innerHTML='';fb.className='feedback hidden';next.className='next hidden';x.slice(2,6).forEach((o,n)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(n,b);opts.appendChild(b)})}function answer(n,b){if(answered)return;answered=true;const x=questions[i],buttons=[...opts.children];buttons.forEach(v=>v.disabled=true);if(n===x[6]){score++;b.classList.add('correct');fb.textContent='✅ Correct. '+x[7]}else{b.classList.add('wrong');buttons[x[6]].classList.add('correct');fb.textContent='❌ Incorrect. '+x[7]+' Correct answer: '+x[x[6]+2]}fb.className='feedback';next.textContent=i===questions.length-1?'SEE RESULT →':'NEXT →';next.className='next'}next.onclick=()=>{if(i<questions.length-1){i++;render()}else{document.querySelector('.quiz').classList.add('hidden');const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<h2>🌱 Five Kingdom Classification Complete</h2><p><strong>${score}/${questions.length}</strong> correct</p><p>${Math.round(score/questions.length*100)}% accuracy</p><p>Concepts covered: Proposal & Criteria, Monera, Protista, Fungi, Plantae & Animalia.</p><button class="next" onclick="location.reload()">RETRY</button>`}}render();</script></body></html>
