<section class="hero"><span class="badge">CLASS 7 • PHYSICS • NCERT CURRICULUM</span><h1>Physics Learning Path</h1><p>6 chapters • Learn → Concepts → Practice → Mastery</p><div class="version">SkillUp v20260826.13</div></section>
<section class="progress"><div class="prow"><span>🏆 0 XP</span><div class="bar"><i></i></div><span>0%</span></div></section>
<main class="path" id="path"></main>
<nav class="bottom"><a href="skillup-home.html"><span>🏠</span>Home</a><a class="active" href="class7-physics-learn.html"><span>🧭</span>Learn</a><a href="question-bank.html?class=7"><span>🎯</span>Practice</a><a href="league.html?class=7&subject=physics"><span>🏆</span>League</a><a href="profile.html"><span>👤</span>Profile</a></nav>
<script>
const chapters=[
 ['Heat',['Hot and cold objects','Temperature','Thermometer','Heat transfer','Conduction','Convection','Radiation','Conductors and insulators']],
 ['Motion and Time',['Motion','Speed','Measurement of time','Units of time','Simple pendulum','Distance-time graphs','Uniform and non-uniform motion']],
 ['Electric Current and Its Effects',['Electric circuit','Heating effect of current','Electric fuse','Magnetic effect of current','Electromagnet','Electric bell']],
 ['Light',['Propagation of light','Reflection','Plane mirror','Image formation','Lateral inversion','Multiple reflections','Human eye and vision']],
 ['Winds, Storms and Cyclones — Physics',['Air pressure','Pressure differences','Wind movement','Cyclones','Safety during storms']],
 ['Measurement and Data Skills',['SI units','Length','Mass','Time','Temperature','Graphs and data interpretation']]
];
const path=document.getElementById('path');
chapters.forEach((ch,i)=>{
 const open=i===0;
 const slug=encodeURIComponent(ch[0]);
 path.insertAdjacentHTML('beforeend',`<section class="chapter ${open?'open':''}">
  <div class="head"><div class="num">${i+1}</div><div><h2>${ch[0]}</h2><p>Chapter ${i+1} • ${open?'Start here':'Locked'}</p></div></div>
  ${open?`<div class="road">
   <div class="node learn"><a href="#" aria-label="Learn">📘</a><span class="label">Learn</span></div>
   <div class="node concept"><a href="#" aria-label="Concepts">💡</a><span class="label">Concepts</span></div>
   <div class="node practice"><a href="question-bank.html?class=7&chapter=${slug}" aria-label="Practice">🎯</a><span class="label">Practice</span></div>
   <div class="node master"><a href="question-bank.html?class=7&chapter=${slug}" aria-label="Mastery">🏆</a><span class="label">Mastery</span></div>
  </div>`:`<div class="locked"><b>🔒</b> Complete previous chapter to unlock</div>`}
 </section>`);
});
</script>
<script id="skillupPathStandard">
(function(){
  const icons={
    learn:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v16h5.5A2.5 2.5 0 0 1 20 21z"/></svg>',
    challenge:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 5 13h6l-1 9 8-11h-6z"/></svg>',
    practice:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1.2"/></svg>',
    mastery:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v7a6 6 0 0 1-12 0z"/><path d="M6 7H3v2a5 5 0 0 0 5 5M18 7h3v2a5 5 0 0 1-5 5M12 17v4M8 21h8"/></svg>',
    locked:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>'
  };
  function stageFor(node){
    const label=node.querySelector('.label,.word');
    const t=(label?label.textContent:'').trim().toLowerCase();
    if(t==='concepts'||t==='challenge') return 'challenge';
    if(t==='practice') return 'practice';
    if(t==='mastery') return 'mastery';
    if(t==='learn') return 'learn';
    if(node.classList.contains('locked')) return 'locked';
    return 'learn';
  }
  document.querySelectorAll('.road .node').forEach(function(node){
    const stage=stageFor(node);
    node.classList.add('skillup-stage',stage);
    let target=node.tagName==='A'?node:node.querySelector('a');
    if(!target) return;
    const text=stage==='challenge'?'Challenge':stage.charAt(0).toUpperCase()+stage.slice(1);
    target.classList.add('skillup-stage-link');
    target.innerHTML=icons[stage]+'<span class="skillup-label">'+text+'</span>';
  });
  document.querySelectorAll('.hero p').forEach(function(p){p.textContent=p.textContent.replace(/Concepts/g,'Challenge')});
  document.querySelectorAll('.version').forEach(function(v){v.textContent='SkillUp v20260826.13'});
})();
</script></body>
