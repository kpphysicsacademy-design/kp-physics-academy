<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chapter Practice | SkillUp</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6fb;color:#273244;font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100dvh;padding:16px}.top{display:flex;gap:12px;align-items:center}.back{border:0;background:#fff;border-radius:16px;padding:12px 15px;font-size:20px}.title{font-size:21px;font-weight:800}.sub{font-size:14px;color:#687386;margin-top:4px}.progress{display:flex;justify-content:space-between;margin:22px 2px 9px;font-weight:700}.track{height:10px;background:#dfe4ec;border-radius:20px;overflow:hidden}.fill{height:100%;background:#5b45b7;width:5%;transition:.25s}.card{margin-top:24px;background:#fff;border-radius:26px;padding:22px;box-shadow:0 8px 25px #24344a0b}.badge{display:inline-block;padding:8px 12px;border-radius:14px;background:#eeeaff;color:#5943ad;font-weight:800;font-size:13px}.question{font-size:23px;line-height:1.45;margin:22px 0}.options{display:grid;gap:12px}.option{width:100%;text-align:left;border:2px solid #e1e5ed;background:#fff;border-radius:17px;padding:15px;font-size:16px;color:#273244}.option b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#edf0f5;margin-right:10px}.correct{border-color:#2fa84f;background:#effaf1}.wrong{border-color:#d64545;background:#fff1f1}.explain{margin-top:16px;padding:15px;border-radius:16px;background:#f3f0ff;line-height:1.5}.actions{display:flex;gap:12px;margin-top:20px}.actions button{flex:1;padding:15px;border-radius:22px;border:1px solid #d9dce4;background:#fff;font-weight:800;font-size:16px}.next{background:#5b45b7!important;color:#fff!important;border-color:#5b45b7!important}.hidden{display:none}.result{text-align:center}.score{font-size:56px;font-weight:900;color:#5b45b7}@media(max-width:480px){.app{padding:13px}.card{padding:18px}.question{font-size:21px}}</style></head>
<body><main class="app"><header class="top"><button class="back" onclick="location.href=backUrl()">←</button><div><div class="title" id="chapterTitle">Chapter Practice</div><div class="sub">20 Questions · MCQ Practice</div></div></header>
<div id="quiz"><div class="progress"><span id="count"></span><span id="percent"></span></div><div class="track"><div class="fill" id="fill"></div></div><section class="card"><span class="badge">Practice</span><h1 class="question" id="question"></h1><div class="options" id="options"></div><div id="explain"></div></section><div class="actions"><button onclick="prev()">‹ Previous</button><button class="next" id="nextBtn" onclick="next()">Next ›</button></div></div>
<section class="card result hidden" id="result"><span class="badge">Completed</span><div class="score" id="score"></div><h1>Practice Complete!</h1><p id="summary"></p><div class="actions"><button onclick="location.href=backUrl()">Back to Chapter</button><button class="next" onclick="restart()">Practice Again</button></div></section></main>
<script>
const bank=[
["Which of these best describes science?",["A way to understand the world through observation and investigation","A collection of magic tricks","A way to avoid asking questions","Only memorising facts"],0,"Science helps us understand the world by observing, questioning and investigating."],
["What often starts a scientific investigation?",["A question","A holiday","A prize","A rumour"],0,"Scientific investigations usually begin with a question or curiosity about something."],
["Carefully noticing and collecting information is called:",["Observation","Prediction","Conclusion","Imagination"],0,"Observation means carefully noticing and gathering information."],
["Why do scientists perform experiments?",["To test ideas using evidence","To avoid observations","To guarantee every guess is correct","To stop asking questions"],0,"Experiments help test ideas and collect evidence."],
["A possible explanation that can be tested is called a:",["Hypothesis","Measurement","Tool","Conclusion"],0,"A hypothesis is a possible explanation that can be tested."],
["Which quality encourages us to ask why and how?",["Curiosity","Carelessness","Silence","Fear of questions"],0,"Curiosity motivates scientific questions and exploration."],
["Which instrument is used to measure temperature?",["Thermometer","Ruler","Compass","Balance"],0,"A thermometer is used to measure temperature."],
["A ruler is mainly used to measure:",["Length","Temperature","Time","Direction"],0,"A ruler measures length."],
["A balance is used to measure:",["Mass","Direction","Temperature","Light"],0,"A balance is used to measure mass."],
["Which is an example of science in everyday life?",["Observing water turn into steam when heated","Ignoring natural changes","Avoiding all questions","Rejecting evidence without checking"],0,"Heating water and observing its change is an everyday scientific phenomenon."],
["What should a prediction be checked by?",["Testing and evidence","Luck only","Copying answers","Ignoring results"],0,"Predictions need to be tested using observations or experiments."],
["Evidence is commonly collected through:",["Observation and investigation","Rumours","Luck","Guessing only"],0,"Scientific evidence is collected through observation and investigation."],
["Why is measurement useful in science?",["It provides information that can be compared accurately","It removes the need for observation","It proves every idea immediately","It replaces experiments"],0,"Measurement gives quantitative information for accurate comparison."],
["After studying results, scientists may form a:",["Conclusion","Random guess","Holiday plan","Question mark only"],0,"A conclusion is formed after examining evidence and results."],
["What may happen when new evidence is found?",["Scientific ideas may be revised","Science must stop","Evidence should be ignored","Questions disappear forever"],0,"New evidence can improve or change scientific explanations."],
["Plants are examples of:",["Living things","Machines","Tools","Rocks"],0,"Plants are living organisms."],
["Living things interact with their:",["Environment","Nothing at all","Only books","Only screens"],0,"Living things depend on and interact with their environment."],
["Which is a good scientific question?",["Why do plants grow towards light?","How can I avoid observing anything?","Why should evidence be ignored?","How can all questions be stopped?"],0,"Questions about natural phenomena can guide scientific investigation."],
["New discoveries often lead to:",["More questions and investigation","The end of science","No further observation","No curiosity"],0,"Discoveries often create new questions for scientists to explore."],
["Science is best seen as a journey of:",["Wondering, investigating and discovering","Never asking questions","Only guessing","Avoiding nature"],0,"Science continues through curiosity, investigation and discovery."]
];
function shuffle(a){for(let n=a.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}
const sourceBank=bank.map(q=>({question:q[0],options:q[1],correct:q[2],explanation:q[3]}));
const questionOrder=shuffle(sourceBank.map(q=>({...q})));
bank.length=0;
questionOrder.forEach((q,index)=>{
  const correctText=q.options[q.correct];
  const wrongOptions=q.options.filter((_,n)=>n!==q.correct);
  shuffle(wrongOptions);
  const correctPosition=(index+Math.floor(Math.random()*4))%4;
  wrongOptions.splice(correctPosition,0,correctText);
  bank.push([q.question,wrongOptions,correctPosition,q.explanation]);
});
let i=0,answers=Array(bank.length).fill(null),checked=Array(bank.length).fill(false);const $=id=>document.getElementById(id);
const p=new URLSearchParams(location.search),cls=p.get("class")||"6",sub=p.get("subject")||"science",ch=p.get("chapter")||"1",progressKey="skillup_progress_"+cls+"_"+sub+"_"+ch;if(p.get("title"))$("chapterTitle").textContent=decodeURIComponent(p.get("title"))+" Practice";
function render(){let q=bank[i],answered=checked[i];$("count").textContent="Question "+(i+1)+" of "+bank.length;$("percent").textContent=Math.round((i+1)/bank.length*100)+"%";$("fill").style.width=((i+1)/bank.length*100)+"%";$("question").textContent=q[0];$("options").innerHTML=q[1].map((o,n)=>{let c="option";if(answered&&n===q[2])c+=" correct";if(answered&&answers[i]===n&&n!==q[2])c+=" wrong";return '<button class="'+c+'" onclick="pick('+n+')" '+(answered?"disabled":"")+'><b>'+String.fromCharCode(65+n)+'</b>'+o+"</button>"}).join("");$("explain").innerHTML=answered?'<div class="explain"><b>'+(answers[i]===q[2]?"✓ Correct! ":"Explanation: ")+'</b>'+q[3]+"</div>":"";$("nextBtn").textContent=i===bank.length-1?"Finish ›":"Next ›"}
function pick(n){if(checked[i])return;answers[i]=n;checked[i]=true;render()}function prev(){if(i>0){i--;render()}}function next(){if(!checked[i]){alert("Please select an answer");return}if(i<bank.length-1){i++;render()}else finish()}function syncClass6Progress(){if(cls!=='6'||sub!=='science')return;let total=0,chapters={};for(let n=1;n<=12;n++){let x=JSON.parse(localStorage.getItem('skillup_progress_6_science_'+n)||'{}')||{},flash=Math.min(100,+x.flash||0),practice=Math.min(100,+x.practice||0),test=Math.min(100,+x.best||0),overall=Math.round(flash*.25+practice*.35+test*.40);chapters[n]={flash,practice,test,overall};total+=overall}let subjectProgress=Math.round(total/12);localStorage.setItem('skillup_science_progress_6',JSON.stringify({chapters,subjectProgress,updatedAt:Date.now()}));
window.dispatchEvent(new Event('skillup-progress-changed'));localStorage.setItem('skillup_class6_progress',JSON.stringify({science:subjectProgress,updatedAt:Date.now()}));
window.dispatchEvent(new Event('skillup-progress-changed'));}
function finish(){let s=answers.reduce((a,v,n)=>a+(v===bank[n][2]?1:0),0),pc=Math.round(s/bank.length*100),d=JSON.parse(localStorage.getItem(progressKey)||"null")||{flash:0,practice:0,best:0,attempts:0};d.practice=Math.max(Number(d.practice)||0,pc);d.practiceScore=s;d.practiceTotal=bank.length;localStorage.setItem(progressKey,JSON.stringify(d));
window.dispatchEvent(new Event('skillup-progress-changed'));syncClass6Progress();$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=s+" / "+bank.length;$("summary").textContent="You answered "+s+" out of "+bank.length+" questions correctly ("+Math.round(s/bank.length*100)+"%)."}function restart(){i=0;answers=Array(bank.length).fill(null);checked=Array(bank.length).fill(false);$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}function backUrl(){return "chapter-preparation.html?class="+(p.get("class")||6)+"&subject="+(p.get("subject")||"science")+"&chapter="+(p.get("chapter")||1)+(p.get("title")?"&title="+encodeURIComponent(p.get("title")):"")}render();
</script><script type="module">import {backupChapterProgress} from "./skillup-progress-sync.js";window.addEventListener("skillup-progress-changed",()=>backupChapterProgress(6,"science",1));</script><script src="routes.js"></script><script src="navigation.js"></script></body></html>
