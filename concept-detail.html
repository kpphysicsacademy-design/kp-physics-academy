const data={
1:{title:'What is Science?',summary:'Science helps us understand the world around us.',explanation:'Science begins with curiosity. We observe things, ask questions and try to find answers.',highlight:'Science begins with curiosity.',example:'You see a plant growing toward sunlight and ask: “Why does it grow in that direction?”',q:'What is an important first step in science?',options:['Memorizing an answer','Observing carefully','Ignoring the problem','Stopping questions'],answer:1,why:'Correct! Careful observation helps us notice things and ask questions.'},
2:{title:'Curiosity and Discovery',summary:'Curiosity makes us ask why and how.',explanation:'When we notice something interesting, curiosity encourages us to explore and discover new things.',highlight:'Every answer can lead to a new question.',example:'You notice that shadows change during the day and wonder why.',q:'What can curiosity encourage us to do?',options:['Stop learning','Ask questions','Ignore observations','Avoid discovery'],answer:1,why:'Correct! Curiosity encourages us to ask questions and explore.'},
3:{title:'Science is Everywhere',summary:'Science can be explored all around us.',explanation:'We can observe science in plants, animals, water, weather, materials and the universe.',highlight:'The world around us is full of opportunities to explore.',example:'You observe rain, clouds and puddles disappearing after sunshine.',q:'Which is a place where we can explore science?',options:['Only laboratories','Only textbooks','The world around us','Nowhere'],answer:2,why:'Correct! Science can be explored in everyday life and nature.'},
4:{title:'Living Things and Our Planet',summary:'Living things grow and change in their environment.',explanation:'Plants and animals can be observed to understand life and the environment around them.',highlight:'Observation helps us understand living things.',example:'You watch a seed grow into a young plant.',q:'What can help us understand living things?',options:['Careful observation','Ignoring changes','Guessing only','Avoiding nature'],answer:0,why:'Correct! Careful observation helps us notice growth and change.'},
5:{title:'Materials, Food and Water',summary:'Different materials have different properties.',explanation:'Everyday objects are made of different materials, and water can change in different conditions.',highlight:'Observe materials and changes carefully.',example:'Ice melts and changes into liquid water.',q:'What can happen to water when conditions change?',options:['It can show different forms','It disappears forever','It becomes a book','It never changes'],answer:0,why:'Correct! Water can be observed in different forms and conditions.'},
6:{title:'The Scientific Method',summary:'Scientific investigation follows a simple learning process.',explanation:'Observe something, ask a question, make a possible explanation, test it and analyse the result.',highlight:'Observe → Question → Guess → Test → Analyse',example:'A plant is not growing well, so you observe it and test possible reasons.',q:'Which comes first in this scientific process?',options:['Analyse','Observe','Finish','Memorize'],answer:1,why:'Correct! Scientific investigation begins with observation.'},
7:{title:'Thinking Like a Scientist',summary:'Scientific thinking can help solve everyday problems.',explanation:'Observe a problem, think of possible causes, test ideas and check what happens.',highlight:'Evidence helps us check our ideas.',example:'A pen stops writing, so you investigate why it is not working.',q:'What should you do after noticing a problem?',options:['Ignore it','Think and investigate','Immediately give up','Avoid evidence'],answer:1,why:'Correct! Thinking and investigating possible causes is part of scientific problem-solving.'},
8:{title:'Joyful Exploration',summary:'Science is a continuing journey of questions and discovery.',explanation:'Keep observing your surroundings, asking questions and exploring new ideas.',highlight:'Stay curious and keep discovering.',example:'You and your friends observe insects in a garden and share your questions.',q:'What is a good attitude for learning science?',options:['Stay curious','Stop asking questions','Avoid exploring','Ignore discoveries'],answer:0,why:'Correct! Curiosity is an important part of learning and discovery.'}
};
