1:{title:'What is Science?',summary:'Science helps us understand the world through observation, questions and exploration.',explanation:'Science is a way of thinking and doing. It begins when we become curious about something around us and try to understand how or why it happens.',highlight:'Key idea: Science is not only a collection of facts—it is also a process of asking questions and finding evidence-based answers.',steps:['Observe carefully','Ask questions','Explore ideas','Use evidence']},
