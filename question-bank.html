</style></head><body><main class="wrap"><section class="card hero"><div style="font-size:42px">🌱</div><span class="tag">NEET BOTANY • CONCEPT PRACTICE</span><h1>What is Living? Growth, Reproduction &amp; Metabolism</h1><p>20 focused questions with immediate feedback and specific explanations.</p><div class="progress"><i id="bar"></i></div></section><section class="card" id="quiz"></section><section class="card score hidden" id="done"></section></main><nav class="nav"><a href="skillup-home.html"><span>🏠</span>Home</a><a class="active" href="question-bank.html?subject=botany&amp;chapter=What+is+Living%3F+Growth%2C+Reproduction+%26+Metabolism"><span>🎯</span>Practice</a><a href="challenge-concepts.html?subject=botany"><span>🏆</span>League</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const qs=[
['Which characteristic is considered a defining feature of living organisms?',['Growth only','Metabolism','Increase in size only','Locomotion'],1,'Metabolism is a defining feature of living systems because all living organisms perform coordinated chemical reactions necessary for maintenance and survival.'],
['The sum total of all chemical reactions occurring in a living organism is called:',['Growth','Reproduction','Metabolism','Consciousness'],2,'Metabolism includes the complete set of biochemical reactions occurring in an organism, including both constructive and degradative pathways.'],
['Which process specifically involves the formation of complex molecules from simpler molecules?',['Anabolism','Catabolism','Excretion','Growth'],0,'Anabolism is the constructive part of metabolism in which simpler molecules are used to build more complex molecules.'],
['Breakdown of complex molecules into simpler molecules is called:',['Anabolism','Catabolism','Assimilation','Growth'],1,'Catabolism is the degradative part of metabolism and commonly releases energy from complex molecules.'],
['Which statement about growth in living organisms is correct?',['It is always an increase in body size','It may involve an increase in cell number or cell mass','It occurs only before reproduction','It occurs only in multicellular organisms'],1,'Living organisms can grow through cell division and/or enlargement. Therefore, growth is not restricted to a simple increase in external size.'],
['In unicellular organisms, growth is generally associated with:',['Increase in cell mass followed by division','Formation of tissues','Formation of organs','Development of a vascular system'],0,'A unicellular organism grows mainly by increasing cellular material and subsequently divides to produce new cells.'],
['Why is reproduction not considered an essential characteristic for an individual organism to remain alive?',['Some individuals may be sterile','Reproduction never occurs in living organisms','Only plants reproduce','All organisms reproduce only once'],0,'Reproduction ensures continuity of the species, but an individual organism can remain alive without reproducing; populations can contain sterile individuals.'],
['Which statement best describes reproduction?',['Process that ensures continuity of a species','Process responsible only for growth','Process that occurs only sexually','Process that occurs only in animals'],0,'Reproduction produces new individuals and thereby maintains continuity of a biological species across generations.'],
['Which is an example of asexual reproduction?',['Binary fission in Amoeba','Fertilisation in humans','Fusion of gametes','Cross-pollination'],0,'Binary fission produces new individuals from a single parent without fusion of male and female gametes, so it is asexual reproduction.'],
['Which property enables an organism to respond to changes in its surroundings?',['Consciousness or sensitivity','Digestion only','Growth only','Excretion only'],0,'Living organisms detect and respond to internal or external stimuli. This responsiveness is associated with consciousness or sensitivity.'],
['Plants respond to external stimuli. Which is an example?',['Phototropism','Metal corrosion','Rock weathering','Crystal formation'],0,'Phototropism is directional growth of a plant part in response to light, demonstrating responsiveness in plants.'],
['Which statement about viruses is most appropriate in the context of living characteristics?',['They show cellular metabolism independently','They are acellular and depend on host cells for replication','They are always cellular','They reproduce independently outside hosts'],1,'Viruses are acellular and lack independent metabolic machinery; replication requires a suitable living host cell.'],
['A major difference between living and non-living growth is that living growth generally occurs through:',['Internal addition of material and cellular processes','Only external deposition','Only crystallisation','Only erosion'],0,'Living growth results from internally controlled cellular synthesis and/or cell division, unlike non-living growth by external deposition.'],
['Which process is directly involved in energy release from nutrients?',['Catabolic reactions','Anabolic reactions only','Cell division only','Pollination'],0,'Catabolic reactions break down nutrient molecules and can release energy that cells capture and use for biological work.'],
['Which of the following best demonstrates cellular organisation?',['Cells form tissues and organs in multicellular organisms','A crystal increases by deposition','A stone changes shape by erosion','Water evaporates'],0,'Multicellular living organisms show hierarchical organisation in which cells form tissues, tissues form organs and organs may form organ systems.'],
['Which feature is present in all living organisms and is fundamental to life processes?',['Cellular organisation','Ability to fly','Presence of roots','Presence of chlorophyll'],0,'All living organisms are made of one or more cells, making cellular organisation a fundamental feature of life.'],
['Which statement correctly connects metabolism and life?',['Metabolism provides the biochemical basis for maintenance and function','Metabolism occurs only after death','Metabolism is identical to reproduction','Metabolism occurs only in plants'],0,'Continuous metabolic activity supplies materials and energy needed for maintenance, growth, repair and other cellular functions.'],
['An organism that reacts to a stimulus by changing its activity demonstrates:',['Responsiveness','Taxonomy','Nomenclature','Decomposition'],0,'A response to a stimulus is evidence of responsiveness, one of the characteristic properties of living systems.'],
['Which combination contains characteristic processes of living organisms?',['Metabolism, growth, reproduction and response to stimuli','Rusting, melting and crystallisation','Weathering, erosion and deposition','Evaporation, freezing and boiling'],0,'Living systems exhibit integrated biological processes such as metabolism, growth, reproduction and response to stimuli, whereas the other choices describe physical or chemical changes in non-living matter.'],
['Why is metabolism particularly useful as a criterion for recognising life?',['It represents coordinated biochemical activity within living systems','It occurs only in dead matter','It is simply an increase in body size','It is identical to locomotion'],0,'Metabolism represents the organised network of biochemical reactions that maintains living systems, making it a central criterion for life.']

e',a.dataset.subject===s));if(b)b.onclick=()=>m.classList.toggle('show');document.addEventListener('click',e=>{if(m&&!e.target.closest('.skillup-subject'))m.classList.remove('show')});const t=document.querySelector('.title');if(t)t.innerHTML=n[0]+' '+n[1]+' Practice';question.id='questionSection'}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build);else build();})();</script></body></html>
