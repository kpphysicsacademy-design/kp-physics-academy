<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Question Bank</title>
<link rel="stylesheet" href="common.css">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f7f9fc;color:#172033;padding-bottom:70px}
.wrap{max-width:600px;margin:auto;padding:14px}
.hero,.panel{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:15px;margin-bottom:10px}
.hero{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card{border:1px solid #e1e7ef;border-radius:13px;padding:12px;background:#fff}
.card b{font-size:13px}.card small{display:block;color:#667085;margin-top:5px}
button,.btn{width:100%;border:0;border-radius:9px;padding:10px;margin-top:9px;background:#7652d9;color:#fff;font-weight:bold;text-decoration:none;display:block;text-align:center;box-sizing:border-box}
.hidden{display:none}.question{font-size:18px;font-weight:bold;margin:14px 0}.option{background:#f7f9fc;color:#172033;border:1px solid #e1e7ef;margin:7px 0}.progress{height:8px;background:#e8edf4;border-radius:8px;overflow:hidden}.progress div{height:100%;width:0;background:#7652d9}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<div style="font-size:32px">📚</div>
<h1>SkillUp Question Bank</h1>
<p>Choose a mode and start practicing.</p>
</section>

<section id="home" class="panel">
<h3>Choose Activity</h3>
<div class="grid">
<div class="card"><b>⚡ Daily League</b><small>Competitive daily questions.</small><button onclick="startMode('league','daily')">JOIN</button></div>
<div class="card"><b>🏆 Weekly League</b><small>Weekly competition.</small><button onclick="startMode('league','weekly')">JOIN</button></div>
<div class="card"><b>📝 Daily Test</b><small>Timed assessment.</small><button onclick="startMode('test','daily')">START</button></div>
<div class="card"><b>🎯 Full Syllabus</b><small>Mixed syllabus practice.</small><button onclick="startMode('test','full-syllabus')">START</button></div>
</div>
<a class="btn" href="compete.html">← BACK TO COMPETE</a>
</section>

<section id="quiz" class="panel hidden">
<div class="progress"><div id="bar"></div></div>
<div id="status" style="margin-top:10px;font-size:12px;color:#667085"></div>
<div id="question" class="question"></div>
<div id="options"></div>
</section>

<section id="result" class="panel hidden" style="text-align:center">
<h2>🎉 Session Complete</h2>
<p id="score"></p>
<button onclick="restart()">PLAY AGAIN</button>
<a class="btn" href="compete.html">BACK TO COMPETE</a>
</section>
</main>

<script>
const questions=[
 {q:"What is the SI unit of force?",a:["Joule","Newton","Watt","Pascal"],correct:1},
 {q:"What is the value of acceleration due to gravity approximately?",a:["9.8 m/s²","98 m/s²","0.98 m/s²","1.8 m/s²"],correct:0},
 {q:"Which quantity has magnitude and direction?",a:["Speed","Mass","Vector","Time"],correct:2},
 {q:"What is the unit of electric current?",a:["Volt","Ampere","Ohm","Coulomb"],correct:1},
 {q:"Energy cannot be created or destroyed is the law of?",a:["Motion","Conservation of Energy","Gravitation","Pressure"],correct:1}
];
let current=0,score=0,session=[];
function startMode(mode,type){
 session=[...questions];current=0;score=0;
 document.getElementById('home').classList.add('hidden');
 document.getElementById('quiz').classList.remove('hidden');
 showQuestion();
}
function showQuestion(){
 const x=session[current];
 document.getElementById('status').textContent='Question '+(current+1)+' of '+session.length;
 document.getElementById('bar').style.width=((current/session.length)*100)+'%';
 document.getElementById('question').textContent=x.q;
 const box=document.getElementById('options');box.innerHTML='';
 x.a.forEach((answer,i)=>{
   const b=document.createElement('button');b.className='option';b.textContent=answer;
   b.onclick=()=>answerQuestion(i);box.appendChild(b);
 });
}
function answerQuestion(i){
 if(i===session[current].correct)score++;
 current++;
 if(current<session.length)showQuestion();else finish();
}
function finish(){
 document.getElementById('quiz').classList.add('hidden');
 document.getElementById('result').classList.remove('hidden');
 document.getElementById('score').textContent='Score: '+score+' / '+session.length;
 document.getElementById('bar').style.width='100%';
}
function restart(){
 document.getElementById('result').classList.add('hidden');
 document.getElementById('home').classList.remove('hidden');
}
const params=new URLSearchParams(location.search);
if(params.get('mode')) startMode(params.get('mode'),params.get('type')||params.get('frequency'));
</script>
<script src="routes.js"></script>
<script src="navigation.js"></script>
<script src="pages.js"></script>
<script src="link-audit.js"></script>
<script id="skillup-maths-practice-structure">
(function(){
  const subject=(new URLSearchParams(location.search).get('subject')||'physics').toLowerCase();
  if(subject!=='maths') return;
  const path=document.getElementById('physicsPath');
  if(!path) return;
  const title=document.querySelector('.path-title');
  const sub=document.querySelector('.path-sub');
  const note=document.querySelector('.path-note');
  if(title) title.textContent='COMPLETE MATHS TOPIC PATH';
  if(sub) sub.textContent='Learn by topic, from foundations to JEE mastery';
  if(note) note.textContent='Tap any topic to open its Maths practice set.';
  const topics=[
    ['Number Sense','Number\nSense','foundation','number-sense'],
    ['Arithmetic','Arithmetic','foundation','arithmetic'],
    ['Fractions & Decimals','Fractions\n& Decimals','foundation','fractions-decimals'],
    ['Ratio & Proportion','Ratio &\nProportion','foundation','ratio-proportion'],
    ['Percentage','Percentage','foundation','percentage'],
    ['Powers & Roots','Powers\n& Roots','foundation','powers-roots'],
    ['Algebraic Expressions','Expressions','algebra','algebraic-expressions'],
    ['Linear Equations','Linear\nEquations','algebra','linear-equations'],
    ['Identities & Factorisation','Identities &\nFactorisation','algebra','identities-factorisation'],
    ['Quadratic Equations','Quadratics','algebra','quadratic-equations'],
    ['Functions','Functions','algebra','functions'],
    ['Complex Numbers','Complex\nNumbers','algebra','complex-numbers'],
    ['Inequalities','Inequalities','algebra','inequalities'],
    ['Lines & Angles','Lines &\nAngles','geometry','lines-angles'],
    ['Triangles','Triangles','geometry','triangles'],
    ['Circles','Circles','geometry','circles'],
    ['Mensuration','Mensuration','geometry','mensuration'],
    ['Coordinate Geometry','Coordinate\nGeometry','geometry','coordinate-geometry'],
    ['Conics','Conics','geometry','conics'],
    ['Trigonometric Ratios','Trig\nRatios','trigonometry','trigonometric-ratios'],
    ['Trigonometric Identities','Trig\nIdentities','trigonometry','trigonometric-identities'],
    ['Compound Angles','Compound\nAngles','trigonometry','compound-angles'],
    ['Trigonometric Equations','Trig\nEquations','trigonometry','trigonometric-equations'],
    ['Inverse Trigonometry','Inverse\nTrig','trigonometry','inverse-trigonometry'],
    ['Sequences & Series','Sequences\n& Series','calculus','sequences-series'],
    ['Limits & Continuity','Limits &\nContinuity','calculus','limits-continuity'],
    ['Differentiation','Differentiation','calculus','differentiation'],
    ['Applications of Derivatives','Applications\nof Derivatives','calculus','applications-derivatives'],
    ['Integration','Integration','calculus','integration'],
    ['Probability & Statistics','Probability\n& Statistics','modern','probability-statistics'],
    ['JEE Main Maths','JEE\nMAIN','exam','jee-main'],
    ['JEE Advanced Maths','JEE\nADVANCED','exam','jee-advanced']
  ];
  const colors={foundation:'foundation',algebra:'mechanics',geometry:'thermal',trigonometry:'waves',calculus:'electric',modern:'optics',exam:'exam'};
  path.innerHTML='';
  topics.forEach((t,i)=>{
    const node=document.createElement('div');
    node.className='path-node '+colors[t[2]];
    const wrap=document.createElement('div'); wrap.className='node-wrap';
    const a=document.createElement('a');
    const q=new URLSearchParams(); q.set('subject','maths'); q.set('topic',t[3]);
    a.href='question-bank.html?'+q.toString(); a.innerText=t[1];
    const info=document.createElement('div');
    info.innerHTML='<div class="node-number">'+String(i+1).padStart(2,'0')+'</div><div class="node-label">'+t[0]+'</div>';
    wrap.append(a,info); node.appendChild(wrap); path.appendChild(node);
  });
  const heading=document.querySelector('.title');
  if(heading) heading.innerHTML='📐 Maths Practice';
  const subtitle=document.querySelector('.subtitle');
  if(subtitle) subtitle.textContent='One continuous Maths topic path — from foundations to JEE Advanced';
})();
</script></body>
</html>
