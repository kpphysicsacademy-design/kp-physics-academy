<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Concept Practice</title><style>body{margin:0;background:#f7fbf8;font-family:Inter,system-ui,sans-serif;color:#183028}.wrap{max-width:760px;margin:auto;padding:20px 14px 90px}.card{background:#fff;border:2px solid #d9e9df;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #1830280c}.hero{text-align:center}.hero h1{font-size:25px;margin:8px 0}.hero p{color:#64746d;font-size:13px}.tag{display:inline-block;background:#e8f8e9;color:#16853b;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:900}.progress{height:10px;background:#e5eee8;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#20a447;transition:width .2s}.qnum{font-size:10px;font-weight:900;color:#20a447}.q{font-size:19px;line-height:1.4}.opts{display:grid;gap:10px}.opts button{border:2px solid #d9e9df;background:#fff;border-radius:14px;padding:14px;text-align:left;font-weight:800;font-size:14px;cursor:pointer}.correct{border-color:#20a447!important;background:#eef9ee!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.feedback{margin-top:14px;padding:14px;border-radius:14px;background:#f1f8f2;line-height:1.5;font-size:13px}.next{margin-top:14px;width:100%;border:0;background:#20a447;color:#fff;border-radius:13px;padding:13px;font-weight:900;font-size:14px;cursor:pointer}.hidden{display:none}.error{border-color:#efc5c5;background:#fff8f8;color:#7d2929}.nav{position:fixed;bottom:0;left:0;right:0;height:58px;background:#fff;border-top:1px solid #d9e9df;display:flex;z-index:20}.nav a{flex:1;text-align:center;text-decoration:none;color:#64746d;font-size:9px;font-weight:900;padding-top:7px}.nav span{display:block;font-size:20px}.nav .active{color:#20a447}@media(max-width:520px){.wrap{padding:12px 10px 75px}.card{padding:16px}.q{font-size:17px}.opts button{font-size:13px}}</style><style id="skillup-practice-structure">
.skillup-header{height:70px;background:#09233d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;margin:-18px -16px 18px;position:sticky;top:0;z-index:50;box-shadow:0 4px 18px #0002}.skillup-brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff}.skillup-brand .logo{font-size:31px}.skillup-brand b{font-size:18px}.skillup-brand small{display:block;color:#61d9d5;font-size:8px;font-weight:900;letter-spacing:1.5px}.skillup-subject{position:relative}.skillup-subject button{background:#1687ff;color:#fff;border:1px solid #55a7ff;border-radius:11px;padding:10px 14px;font-size:11px;font-weight:950;cursor:pointer}.skillup-subject-menu{display:none;position:absolute;top:48px;left:50%;transform:translateX(-50%);width:205px;background:#fff;border:1px solid #dce3ec;border-radius:13px;box-shadow:0 12px 28px #0003;overflow:hidden;z-index:100}.skillup-subject-menu.show{display:block}.skillup-subject-menu a{display:block;padding:12px 14px;color:#172033;text-decoration:none;font-size:11px;font-weight:900}.skillup-subject-menu a:hover,.skillup-subject-menu a.active{background:#eef5ff;color:#1687ff}.skillup-stats{display:flex;gap:7px}.skillup-stat{background:#183653;border:1px solid #31516f;border-radius:11px;padding:8px 11px;font-size:10px;font-weight:950}.skillup-practice-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}.skillup-practice-main{min-width:0}.skillup-practice-side{display:grid;gap:14px}.skillup-side-card{background:#fff;border:1px solid #dce3ec;border-radius:16px;padding:16px;box-shadow:0 5px 20px #17203314}.skillup-side-title{font-size:12px;font-weight:950;color:#1687ff;margin-bottom:12px}.skillup-overview{display:grid;grid-template-columns:1fr 1fr;gap:8px}.skillup-metric{border:1px solid #e3e9f0;border-radius:11px;padding:11px}.skillup-metric b{display:block;font-size:17px;color:#1687ff}.skillup-metric span{font-size:8px;color:#667085;font-weight:800}.skillup-actions{display:grid;gap:8px}.skillup-action{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:11px;text-decoration:none;font-size:10px;font-weight:900}.skillup-action.blue{background:#eef6ff;color:#126fcf}.skillup-action.green{background:#eef9f0;color:#198754}.skillup-action.gold{background:#fff7df;color:#a16d00}.skillup-action.purple{background:#f4efff;color:#7652d9}.skillup-action.red{background:#fff0f0;color:#d23d3d}@media(max-width:900px){.skillup-practice-grid{grid-template-columns:1fr}.skillup-practice-side{grid-template-columns:1fr 1fr}.skillup-header{margin:-12px -7px 14px;padding:0 10px}.skillup-stats .skillup-stat:last-child{display:none}.skillup-brand b{font-size:15px}.skillup-brand small{font-size:7px}.skillup-subject button{padding:8px 10px;font-size:9px}}@media(max-width:560px){.skillup-practice-side{grid-template-columns:1fr}.skillup-subject-menu{left:auto;right:0;transform:none}.skillup-header{height:62px}}
</style></head><body><main class="wrap"><section class="card hero"><div style="font-size:42px">🌱</div><span class="tag">NEET BOTANY • CONCEPT PRACTICE</span><h1 id="title">Concept Practice</h1><p id="description">Loading the requested concept.</p><div class="progress"><i id="bar"></i></div></section><section class="card" id="quiz"></section><section class="card hidden" id="done"></section></main><nav class="nav"><a href="skillup-home.html"><span>🏠</span>Home</a><a class="active" href="question-bank.html"><span>🎯</span>Practice</a><a href="challenge-concepts.html?subject=botany"><span>🏆</span>League</a><a href="profile.html"><span>👤</span>Profile</a></nav><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getFirestore,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';import{firebaseConfig}from'./firebase-web-config.js';
const p=new URLSearchParams(location.search),subject=(p.get('subject')||'').trim().toLowerCase(),topic=(p.get('topic')||'').trim().replace(/\s+/g,' '),title=document.getElementById('title'),description=document.getElementById('description'),quiz=document.getElementById('quiz'),done=document.getElementById('done'),bar=document.getElementById('bar');
function showError(msg){title.textContent=topic||'Concept Practice';description.textContent='No question set is assigned to this exact concept.';quiz.className='card error';quiz.innerHTML='<strong>No fallback question set.</strong><p>'+esc(msg)+'</p><p>Questions must be explicitly mapped to this concept before practice is available.</p>'}
if(!subject||!topic){showError('Open Practice from a specific concept in the NEET learning path.');}else{title.textContent=topic;document.title='SkillUp | '+topic+' Practice';loadConcept()}
async function loadConcept(){try{const db=getFirestore(initializeApp(firebaseConfig));const snap=await getDocs(query(collection(db,'questions'),where('published','==',true)));const qs=[];snap.forEach(d=>{const x=d.data(),s=String(x.subject||'').trim().toLowerCase(),t=String(x.topic||'').trim().replace(/\s+/g,' ');if(s===subject&&t.toLowerCase()===topic.toLowerCase()&&Array.isArray(x.options)&&x.options.length===4&&Number.isInteger(Number(x.correctIndex))&&Number(x.correctIndex)>=0&&Number(x.correctIndex)<4&&String(x.question||'').trim()&&String(x.explanation||'').trim())qs.push({question:String(x.question),options:x.options.map(String),correctIndex:Number(x.correctIndex),explanation:String(x.explanation),id:d.id})});if(!qs.length){showError('No published, validated questions are mapped to “'+topic+'” for '+subject+'.');return}start(qs)}catch(e){console.error(e);showError('The exact concept question bank could not be loaded. No other concept will be substituted.')}}
function start(qs){let i=0,score=0,answered=false;description.textContent=qs.length+' questions mapped specifically to this concept.';function render(){answered=false;const x=qs[i];quiz.className='card';quiz.innerHTML='<div class="qnum">QUESTION '+(i+1)+' OF '+qs.length+'</div><div class="q">'+esc(x.question)+'</div><div class="opts">'+x.options.map((o,n)=>'<button data-i="'+n+'">'+String.fromCharCode(65+n)+'. '+esc(o)+'</button>').join('')+'</div><div id="fb" class="feedback hidden"></div><button id="nx" class="next hidden">NEXT →</button>';bar.style.width=(i/qs.length*100)+'%';quiz.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b))}function answer(n,b){if(answered)return;answered=true;const x=qs[i],bs=[...quiz.querySelectorAll('.opts button')];bs.forEach(v=>v.disabled=true);const fb=quiz.querySelector('#fb');if(n===x.correctIndex){score++;b.classList.add('correct');fb.textContent='✅ Correct. '+x.explanation}else{b.classList.add('wrong');bs[x.correctIndex].classList.add('correct');fb.textContent='❌ Incorrect. '+x.explanation+' Correct answer: '+String.fromCharCode(65+x.correctIndex)+'. '+x.options[x.correctIndex]}fb.className='feedback';const nx=quiz.querySelector('#nx');nx.className='next';nx.textContent=i===qs.length-1?'SEE RESULT →':'NEXT →';nx.onclick=()=>{if(i<qs.length-1){i++;render()}else{quiz.className='card hidden';bar.style.width='100%';done.className='card';done.innerHTML='<h2>🌱 '+esc(topic)+' Complete</h2><p><strong>'+score+'/'+qs.length+'</strong> correct</p><p>'+Math.round(score/qs.length*100)+'% accuracy</p><button class="next" onclick="location.reload()">RETRY</button>}}}render()}
function esc(v){return String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</script><script id="five-kingdom-exact-route">(function(){const p=new URLSearchParams(location.search);const subject=(p.get("subject")||"").trim().toLowerCase();const topic=(p.get("topic")||"").trim().replace(/\s+/g," ").toLowerCase();if(subject==="botany"&&topic==="five kingdom classification"){location.replace("botany-biological-classification-test.html");}})();</script></body></html>
