<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | NEET Practice</title>
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="skillup-mastery.css">
<style>
.skillup-practice{max-width:900px;margin:auto}.su-card{background:#fff;border:1px solid #dce3ec;border-radius:18px;padding:22px;box-shadow:0 8px 28px #17203312}.su-card h1{margin:0 0 8px;color:#09233d}.su-progress{height:8px;background:#e8eef5;border-radius:99px;overflow:hidden;margin:16px 0}.su-progress i{display:block;height:100%;width:0;background:#1687ff;transition:width .25s}.su-option{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;border:2px solid #dce3ec;border-radius:12px;background:#fff;cursor:pointer;font-weight:750}.su-option:hover:not(:disabled){border-color:#1687ff}.su-option.correct{border-color:#58cc02;background:#eef9e9}.su-option.wrong{border-color:#e05252;background:#fff0f0}.su-option:disabled{cursor:default}.su-primary{margin-top:12px;border:0;border-radius:12px;padding:12px 18px;background:#1687ff;color:#fff;font-weight:900;cursor:pointer}.su-weak{margin-top:16px;padding:14px;border-radius:12px;background:#f5f8fb}.su-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.su-stat{padding:14px;border:1px solid #dce3ec;border-radius:12px;text-align:center}@media(max-width:600px){.su-card{padding:16px}.su-summary-grid{grid-template-columns:1fr}}
</style><style id="skillup-practice-structure">
.skillup-header{height:70px;background:#09233d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;margin:-18px -16px 18px;position:sticky;top:0;z-index:50;box-shadow:0 4px 18px #0002}.skillup-brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff}.skillup-brand .logo{font-size:31px}.skillup-brand b{font-size:18px}.skillup-brand small{display:block;color:#61d9d5;font-size:8px;font-weight:900;letter-spacing:1.5px}.skillup-subject{position:relative}.skillup-subject button{background:#1687ff;color:#fff;border:1px solid #55a7ff;border-radius:11px;padding:10px 14px;font-size:11px;font-weight:950;cursor:pointer}.skillup-subject-menu{display:none;position:absolute;top:48px;left:50%;transform:translateX(-50%);width:205px;background:#fff;border:1px solid #dce3ec;border-radius:13px;box-shadow:0 12px 28px #0003;overflow:hidden;z-index:100}.skillup-subject-menu.show{display:block}.skillup-subject-menu a{display:block;padding:12px 14px;color:#172033;text-decoration:none;font-size:11px;font-weight:900}.skillup-subject-menu a:hover,.skillup-subject-menu a.active{background:#eef5ff;color:#1687ff}.skillup-stats{display:flex;gap:7px}.skillup-stat{background:#183653;border:1px solid #31516f;border-radius:11px;padding:8px 11px;font-size:10px;font-weight:950}.skillup-practice-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}.skillup-practice-main{min-width:0}.skillup-practice-side{display:grid;gap:14px}.skillup-side-card{background:#fff;border:1px solid #dce3ec;border-radius:16px;padding:16px;box-shadow:0 5px 20px #17203314}.skillup-side-title{font-size:12px;font-weight:950;color:#1687ff;margin-bottom:12px}.skillup-overview{display:grid;grid-template-columns:1fr 1fr;gap:8px}.skillup-metric{border:1px solid #e3e9f0;border-radius:11px;padding:11px}.skillup-metric b{display:block;font-size:17px;color:#1687ff}.skillup-metric span{font-size:8px;color:#667085;font-weight:800}.skillup-actions{display:grid;gap:8px}.skillup-action{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:11px;text-decoration:none;font-size:10px;font-weight:900}.skillup-action.blue{background:#eef6ff;color:#126fcf}.skillup-action.green{background:#eef9f0;color:#198754}.skillup-action.gold{background:#fff7df;color:#a16d00}.skillup-action.purple{background:#f4efff;color:#7652d9}.skillup-action.red{background:#fff0f0;color:#d23d3d}@media(max-width:900px){.skillup-practice-grid{grid-template-columns:1fr}.skillup-practice-side{grid-template-columns:1fr 1fr}.skillup-header{margin:-12px -7px 14px;padding:0 10px}.skillup-stats .skillup-stat:last-child{display:none}.skillup-brand b{font-size:15px}.skillup-brand small{font-size:7px}.skillup-subject button{padding:8px 10px;font-size:9px}}@media(max-width:560px){.skillup-practice-side{grid-template-columns:1fr}.skillup-subject-menu{left:auto;right:0;transform:none}.skillup-header{height:62px}}
</style></head>
<body>
<main class="skillup-practice"><section class="su-card" id="practiceApp">
<h1>🎯 NEET Practice</h1><p id="context">Loading verified questions…</p><div class="su-progress"><i id="progress"></i></div><div id="question"></div><div id="feedback"></div><button class="su-primary" id="next" hidden>Next →</button>
</section></main>
<script src="skillup-mastery.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getFirestore,collection,getDocs,query,where} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
import {firebaseConfig} from './firebase-web-config.js';
const p=new URLSearchParams(location.search),subject=(p.get('subject')||'').trim().toLowerCase(),chapter=(p.get('chapter')||'').trim(),topic=(p.get('topic')||'').trim();
const context=document.getElementById('context'),qEl=document.getElementById('question'),fb=document.getElementById('feedback'),next=document.getElementById('next'),bar=document.getElementById('progress');let engine;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(q,s){const opts=Array.isArray(q.options)?q.options:[];context.textContent=(chapter||topic||subject||'NEET')+' • Question '+(s.index+1)+' of '+s.queueLength;bar.style.width=Math.round(s.progress*100)+'%';qEl.innerHTML='<h2>'+esc(q.question)+'</h2><div id="opts"></div>';const box=document.getElementById('opts');opts.forEach((o,i)=>{const b=document.createElement('button');b.className='su-option';b.textContent=o;b.onclick=()=>answer(i);box.appendChild(b)});fb.innerHTML='';next.hidden=true;}
function answer(i){const q=engine.current(),correct=engine.answer(i);document.querySelectorAll('.su-option').forEach((b,j)=>{b.disabled=true;if(j===q.correctIndex)b.classList.add('correct');if(j===i&&!correct)b.classList.add('wrong')});fb.innerHTML='<div class="su-weak"><b>'+(correct?'✅ Correct':'❌ Incorrect')+'</b>'+(q.explanation?'<br><br>'+esc(q.explanation):'')+'</div>';next.hidden=false;}
next.onclick=()=>engine.next();
function complete(s){bar.style.width='100%';context.textContent='100% mastery completed';qEl.innerHTML='<h2>🎉 Mastery complete</h2><div class="su-summary-grid"><div class="su-stat"><b>'+s.mastered+'/'+s.total+'</b><br>Mastered</div><div class="su-stat"><b>'+s.firstPassAccuracy+'%</b><br>First pass</div><div class="su-stat"><b>'+s.rounds+'</b><br>Rounds</div></div>';fb.innerHTML='<div class="su-weak"><b>Weak areas</b><br>'+((s.skills||[]).slice(0,5).map(x=>esc(x.skill)+' — '+x.rate+'%').join('<br>')||'None identified')+'</div>';next.hidden=true;}
async function load(){try{const app=initializeApp(firebaseConfig),db=getFirestore(app);const snap=await getDocs(query(collection(db,'questions'),where('published','==',true)));let list=snap.docs.map(d=>({id:d.id,...d.data()}));list=list.filter(x=>!subject||String(x.subject||'').toLowerCase()===subject).filter(x=>!chapter||String(x.chapter||'')===chapter).filter(x=>!topic||String(x.topic||'')===topic).filter(x=>String(x.question||'').trim()&&Array.isArray(x.options)&&x.options.length===4&&Number.isInteger(x.correctIndex)&&x.correctIndex>=0&&x.correctIndex<4&&String(x.explanation||'').trim());if(!list.length)throw Error('No verified questions found for this selection.');const qs=list.map(x=>({id:x.id,question:x.question,options:x.options,correctIndex:x.correctIndex,explanation:x.explanation,skill:x.topic||topic||chapter||subject}));engine=new window.SkillUpMasteryPractice({questions:qs,onRender:render,onComplete:complete,skillFor:q=>q.skill});render(engine.current(),engine.state());}catch(e){console.error(e);context.textContent='Practice setup';qEl.innerHTML='<h2>Practice unavailable</h2><p>'+esc(e.message||'Verified question source could not be loaded.')+'</p>';}}
load();
</script>
<script src="routes.js"></script><script src="navigation.js"></script><script src="pages.js"></script><script src="link-audit.js"></script>
<script id="skillup-practice-structure-js">(function(){function build(){const c=document.querySelector('.container');if(!c)return;const path=c.querySelector('.physics-path'),controls=c.querySelector('.controls'),question=c.querySelector('.question'),challenge=c.querySelector('.challenge');if(!path||!controls||!question||!challenge)return;let old=c.querySelector('.skillup-practice-grid');if(old)old.remove();document.querySelectorAll('.skillup-practice-side').forEach(x=>x.remove());const grid=document.createElement('div');grid.className='skillup-practice-grid';const main=document.createElement('div');main.className='skillup-practice-main';const side=document.createElement('aside');side.className='skillup-practice-side';main.append(path,controls,question,challenge);side.innerHTML='<section class="skillup-side-card"><div class="skillup-side-title">YOUR PRACTICE OVERVIEW</div><div class="skillup-overview"><div class="skillup-metric"><b>0</b><span>TOTAL ATTEMPTED</span></div><div class="skillup-metric"><b>0</b><span>CORRECT</span></div><div class="skillup-metric"><b>0%</b><span>ACCURACY</span></div><div class="skillup-metric"><b>0m</b><span>TIME SPENT</span></div></div></section><section class="skillup-side-card"><div class="skillup-side-title">QUICK ACTIONS</div><div class="skillup-actions"><a class="skillup-action blue" href="#questionSection">🎯 Topic Wise Practice <span>›</span></a><a class="skillup-action green" href="#questionSection">📄 Mini Test <span>›</span></a><a class="skillup-action gold" href="#challengeSection">🏆 Chapter Test <span>›</span></a><a class="skillup-action purple" href="#questionSection">📊 Mock Test <span>›</span></a><a class="skillup-action red" href="#questionSection">📕 Weak Topics <span>›</span></a></div></section>';grid.append(main,side);const first=c.querySelector('.title');first.parentNode.insertBefore(grid,first.nextElementSibling?.nextElementSibling||null);const p=new URLSearchParams(location.search),s=(p.get('subject')||'physics').toLowerCase(),names={physics:['⚡','PHYSICS'],chemistry:['🧪','CHEMISTRY'],botany:['🌿','BOTANY'],zoology:['🧬','ZOOLOGY'],maths:['📐','MATHS']},n=names[s]||names.physics,b=document.getElementById('skillupSubjectButton'),m=document.getElementById('skillupSubjectMenu');if(b)b.innerText=n[0]+' '+n[1]+' ▾';document.querySelectorAll('#skillupSubjectMenu a').forEach(a=>a.classList.toggle('active',a.dataset.subject===s));if(b)b.onclick=()=>m.classList.toggle('show');document.addEventListener('click',e=>{if(m&&!e.target.closest('.skillup-subject'))m.classList.remove('show')});const t=document.querySelector('.title');if(t)t.innerHTML=n[0]+' '+n[1]+' Practice';question.id='questionSection'}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build);else build();})();</script><script id="skillup-maths-practice-structure">
(function(){
  const subject=(new URLSearchParams(location.search).get('subject')||'physics').toLowerCase();
  if(subject!=='maths') return;
  const path=document.getElementById('physicsPath');
  if(!path) return;
  const title=document.querySelector('.path-title');
  const sub=document.querySelector('.path-sub');
  const note=document.querySelector('.path-note');
  if(title) title.textContent='COMPLETE MATHS TOPIC PATH';
  if(sub) sub.textContent='Learn by topic, from foundations to JEE mastery';
  if(note) note.textContent='Tap any topic to open its Maths practice set.';
  const topics=[
    ['Number Sense','Number\nSense','foundation','number-sense'],
    ['Arithmetic','Arithmetic','foundation','arithmetic'],
    ['Fractions & Decimals','Fractions\n& Decimals','foundation','fractions-decimals'],
    ['Ratio & Proportion','Ratio &\nProportion','foundation','ratio-proportion'],
    ['Percentage','Percentage','foundation','percentage'],
    ['Powers & Roots','Powers\n& Roots','foundation','powers-roots'],
    ['Algebraic Expressions','Expressions','algebra','algebraic-expressions'],
    ['Linear Equations','Linear\nEquations','algebra','linear-equations'],
    ['Identities & Factorisation','Identities &\nFactorisation','algebra','identities-factorisation'],
    ['Quadratic Equations','Quadratics','algebra','quadratic-equations'],
    ['Functions','Functions','algebra','functions'],
    ['Complex Numbers','Complex\nNumbers','algebra','complex-numbers'],
    ['Inequalities','Inequalities','algebra','inequalities'],
    ['Lines & Angles','Lines &\nAngles','geometry','lines-angles'],
    ['Triangles','Triangles','geometry','triangles'],
    ['Circles','Circles','geometry','circles'],
    ['Mensuration','Mensuration','geometry','mensuration'],
    ['Coordinate Geometry','Coordinate\nGeometry','geometry','coordinate-geometry'],
    ['Conics','Conics','geometry','conics'],
    ['Trigonometric Ratios','Trig\nRatios','trigonometry','trigonometric-ratios'],
    ['Trigonometric Identities','Trig\nIdentities','trigonometry','trigonometric-identities'],
    ['Compound Angles','Compound\nAngles','trigonometry','compound-angles'],
    ['Trigonometric Equations','Trig\nEquations','trigonometry','trigonometric-equations'],
    ['Inverse Trigonometry','Inverse\nTrig','trigonometry','inverse-trigonometry'],
    ['Sequences & Series','Sequences\n& Series','calculus','sequences-series'],
    ['Limits & Continuity','Limits &\nContinuity','calculus','limits-continuity'],
    ['Differentiation','Differentiation','calculus','differentiation'],
    ['Applications of Derivatives','Applications\nof Derivatives','calculus','applications-derivatives'],
    ['Integration','Integration','calculus','integration'],
    ['Probability & Statistics','Probability\n& Statistics','modern','probability-statistics'],
    ['JEE Main Maths','JEE\nMAIN','exam','jee-main'],
    ['JEE Advanced Maths','JEE\nADVANCED','exam','jee-advanced']
  ];
  const colors={foundation:'foundation',algebra:'mechanics',geometry:'thermal',trigonometry:'waves',calculus:'electric',modern:'optics',exam:'exam'};
  path.innerHTML='';
  topics.forEach((t,i)=>{
    const node=document.createElement('div');
    node.className='path-node '+colors[t[2]];
    const wrap=document.createElement('div'); wrap.className='node-wrap';
    const a=document.createElement('a');
    const q=new URLSearchParams(); q.set('subject','maths'); q.set('topic',t[3]);
    a.href='question-bank.html?'+q.toString(); a.innerText=t[1];
    const info=document.createElement('div');
    info.innerHTML='<div class="node-number">'+String(i+1).padStart(2,'0')+'</div><div class="node-label">'+t[0]+'</div>';
    wrap.append(a,info); node.appendChild(wrap); path.appendChild(node);
  });
  const heading=document.querySelector('.title');
  if(heading) heading.innerHTML='📐 Maths Practice';
  const subtitle=document.querySelector('.subtitle');
  if(subtitle) subtitle.textContent='One continuous Maths topic path — from foundations to JEE Advanced';
})();
</script></body></html>
