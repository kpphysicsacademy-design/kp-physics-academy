<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Physics Question Bank | KP Physics Academy</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#071a33}header{background:#031326;color:#fff;padding:22px 7%;font-size:25px;font-weight:bold}.container{max-width:1100px;margin:40px auto;padding:20px}.back{color:#1687ff;text-decoration:none;font-weight:bold}.title{text-align:center;margin-top:35px;color:#1687ff}.subtitle{text-align:center;color:#68758a;margin-bottom:30px}.controls,.question{background:#fff;padding:25px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.08);margin-bottom:25px}.search{display:flex;gap:10px}.search input{flex:1;padding:14px;border:1px solid #d5ddea;border-radius:8px;font-size:16px}button{border:0;padding:12px 20px;border-radius:8px;cursor:pointer;background:#1687ff;color:#fff;font-size:15px;font-weight:bold}button:hover{opacity:.9}.progress-box{margin-top:18px}.progress-text{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:bold}.progress{width:100%;height:10px;background:#e3e9f2;border-radius:10px;overflow:hidden}.progress-bar{height:100%;width:0;background:#1687ff}.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.badge{background:#1687ff;color:#fff;padding:7px 14px;border-radius:20px;font-weight:bold}.question h2{font-size:22px;line-height:1.5}.options{margin-top:20px}.option{background:#f1f6ff;border:2px solid transparent;padding:15px;margin-top:12px;border-radius:9px;cursor:pointer;transition:.2s}.option:hover{border-color:#1687ff}.option.correct{background:#d9f7df;border-color:#20a044;color:#075b1b}.option.wrong{background:#ffdede;border-color:#e53935;color:#8b0000}.answer{margin-top:20px;padding:18px;border-radius:10px;display:none;line-height:1.6;background:#f5f8fc;border:1px solid #dbe3ef}.answer.correct-box{background:#eef8ee;border-color:#b7dfbd}.answer.wrong-box{background:#fff3f3;border-color:#f0b4b4}.explanation{margin-top:10px}.nav{display:flex;justify-content:space-between;margin-top:25px}@media(max-width:600px){.search{flex-direction:column}.qhead{flex-direction:column;gap:10px;align-items:flex-start}.nav{gap:10px}.nav button{flex:1}}
</style>
</head>
<body>
<header>KP PHYSICS ACADEMY</header>
<div class="container">
<a href="index.html" class="back">← Back to Home</a>
<h1 class="title">Physics Question Bank</h1>
<p class="subtitle">Continuous Physics Learning — Q1 to Q10000</p>
<div class="controls"><div class="search"><input type="number" id="questionNumber" min="1" max="10000" placeholder="Enter question number (1 - 10000)"><button onclick="goToQuestion()">Open Question</button></div><div class="progress-box"><div class="progress-text"><span id="progressText">Question 1</span><span>10000 Questions</span></div><div class="progress"><div class="progress-bar" id="progressBar"></div></div></div></div>
<div class="question"><div class="qhead"><span class="badge" id="number">Q1</span><strong id="count">1 / 10000</strong></div><h2 id="text">Loading question...</h2><div class="options" id="options"></div><div class="answer" id="answer"></div><div class="nav"><button onclick="previousQuestion()">← Previous</button><button onclick="nextQuestion()">Next →</button></div></div>
</div>
<script>
const PROJECT_ID="kp-physics-academy";
const FIRESTORE_URL="https://firestore.googleapis.com/v1/projects/"+PROJECT_ID+"/databases/(default)/documents/physics_questions";
let currentQuestion=1,totalQuestions=10000,questionCache={};

const fallbackQuestions={
  1:{answer:"A",explanation:"The metre (m) is the SI base unit of length."},
  2:{answer:"B",explanation:"The kilogram (kg) is the SI base unit of mass."}
};

function getField(fields,names){
  for(const n of names){
    if(fields[n]?.stringValue!==undefined)return fields[n].stringValue;
  }
  return "";
}

async function loadQuestion(){
 const text=document.getElementById("text"),options=document.getElementById("options"),answer=document.getElementById("answer");
 text.innerText="Loading question...";options.innerHTML="";answer.style.display="none";answer.innerHTML="";answer.className="answer";
 document.getElementById("number").innerText="Q"+currentQuestion;document.getElementById("count").innerText=currentQuestion+" / "+totalQuestions;document.getElementById("progressText").innerText="Question "+currentQuestion;document.getElementById("progressBar").style.width=(currentQuestion/totalQuestions*100)+"%";
 if(questionCache[currentQuestion]){displayQuestion(questionCache[currentQuestion]);return}
 try{const r=await fetch(FIRESTORE_URL+"/Q"+currentQuestion);if(!r.ok)throw new Error("Question not found");const data=await r.json();questionCache[currentQuestion]=data;displayQuestion(data)}catch(e){console.error(e);text.innerText="Question Q"+currentQuestion+" is not available yet.";options.innerHTML='<div class="option">This question has not been added to Firestore yet.</div>'}
}

function displayQuestion(data){
 const fields=data.fields||{};
 const question=getField(fields,["question"])||"Question not available";
 const optionA=getField(fields,["optionA"]),optionB=getField(fields,["optionB"]),optionC=getField(fields,["optionC"]),optionD=getField(fields,["optionD"]);
 let correctAnswer=getField(fields,["Answer","answer","CorrectAnswer","correctAnswer","correctOption"]);
 let explanation=getField(fields,["Explanation","explanation","Solution","solution"]);
 const fallback=fallbackQuestions[currentQuestion];
 if(!correctAnswer&&fallback)correctAnswer=fallback.answer;
 if(!explanation&&fallback)explanation=fallback.explanation;
 document.getElementById("text").innerText=question;
 const box=document.getElementById("options");box.innerHTML="";
 [{letter:"A",text:optionA},{letter:"B",text:optionB},{letter:"C",text:optionC},{letter:"D",text:optionD}].forEach(o=>{if(!o.text)return;const div=document.createElement("div");div.className="option";div.innerText=o.letter+". "+o.text;div.onclick=()=>selectOption(div,o.letter,correctAnswer,explanation);box.appendChild(div)})
}

function normalizeAnswer(value){
 if(!value)return "";
 const v=value.trim().toUpperCase();
 const m=v.match(/^(?:OPTION\s*)?([ABCD])(?:\.|\)|\s|$)/);
 if(m)return m[1];
 const opts=[...document.querySelectorAll(".option")];
 for(const o of opts){if(o.innerText.substring(3).trim().toUpperCase()===v)return o.innerText.charAt(0)}
 return v;
}

function selectOption(element,selected,correctAnswer,explanation){
 const all=[...document.querySelectorAll(".option")];
 all.forEach(o=>o.classList.remove("correct","wrong"));
 const answerBox=document.getElementById("answer");answerBox.className="answer";
 const correct=normalizeAnswer(correctAnswer);
 if(!correct){
  element.classList.add("wrong");
  answerBox.innerHTML='<strong>Answer data not available.</strong><div class="explanation">Please add the <b>Answer</b> and <b>Explanation</b> fields to this question in Firestore.</div>';
  answerBox.style.display="block";return;
 }
 const isCorrect=selected===correct;
 if(isCorrect)element.classList.add("correct");
 else{
  element.classList.add("wrong");
  const correctElement=all.find(o=>o.innerText.trim().toUpperCase().startsWith(correct+"."));
  if(correctElement)correctElement.classList.add("correct");
 }
 let html=isCorrect?"<strong>Correct!</strong>":"<strong>Incorrect.</strong><br>Correct answer: "+correct;
 html+="<div class='explanation'><strong>Explanation:</strong><br>"+(explanation||"No explanation available yet.")+"</div>";
 answerBox.innerHTML=html;
 answerBox.classList.add(isCorrect?"correct-box":"wrong-box");
 answerBox.style.display="block";
}

function nextQuestion(){if(currentQuestion<totalQuestions){currentQuestion++;loadQuestion();window.scrollTo({top:0,behavior:"smooth"})}}
function previousQuestion(){if(currentQuestion>1){currentQuestion--;loadQuestion();window.scrollTo({top:0,behavior:"smooth"})}}
function goToQuestion(){const n=Number(document.getElementById("questionNumber").value);if(n>=1&&n<=10000){currentQuestion=n;loadQuestion()}else alert("Please enter a question number from 1 to 10000.")}
document.getElementById("questionNumber").addEventListener("keydown",e=>{if(e.key==="Enter")goToQuestion()});
loadQuestion();
</script>
</body>
</html>
