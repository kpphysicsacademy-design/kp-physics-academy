<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | NEET Practice</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="skillup-mastery.css">
</head>
<body>
<main class="su-practice">
<section class="su-card" id="practiceApp">
<h1>🎯 NEET Practice</h1><p id="context">Loading questions…</p>
<div class="su-progress"><i id="progress"></i></div><div id="question"></div><div id="feedback"></div>
<button class="su-primary" id="next" hidden>Next →</button>
</section></main>
<script src="skillup-mastery.js"></script>
<script>
(function(){
const p=new URLSearchParams(location.search),subject=(p.get('subject')||'').trim().toLowerCase(),chapter=(p.get('chapter')||'').trim(),topic=(p.get('topic')||'').trim();
const context=document.getElementById('context'),qEl=document.getElementById('question'),fb=document.getElementById('feedback'),next=document.getElementById('next'),bar=document.getElementById('progress');let engine;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(q,s){const opts=q.options||[],prompt=q.question||'';context.textContent=(chapter||topic||subject||'NEET')+' • Question '+(s.index+1)+' of '+s.queueLength;bar.style.width=Math.round(s.progress*100)+'%';qEl.innerHTML='<h2>'+esc(prompt)+'</h2><div id="opts"></div>';const box=document.getElementById('opts');opts.forEach((o,i)=>{const b=document.createElement('button');b.className='su-option';b.textContent=o;b.onclick=()=>answer(i);box.appendChild(b)});fb.innerHTML='';next.hidden=true;}
function answer(i){const q=engine.current(),correct=engine.answer(i);document.querySelectorAll('.su-option').forEach((b,j)=>{b.disabled=true;if(j===q.correctIndex)b.classList.add('correct');if(j===i&&!correct)b.classList.add('wrong')});fb.innerHTML='<div class="su-weak"><b>'+(correct?'✅ Correct':'❌ Incorrect')+'</b>'+(q.explanation?'<br><br>'+esc(q.explanation):'')+'</div>';next.hidden=false;}
next.onclick=()=>engine.next();
function complete(s){bar.style.width='100%';context.textContent='100% mastery completed';qEl.innerHTML='<h2>🎉 Mastery complete</h2><div class="su-summary-grid"><div class="su-stat"><b>'+s.mastered+'/'+s.total+'</b><br>Mastered</div><div class="su-stat"><b>'+s.firstPassAccuracy+'%</b><br>First pass</div><div class="su-stat"><b>'+s.rounds+'</b><br>Rounds</div></div>';fb.innerHTML='<div class="su-weak"><b>Weak areas</b><br>'+((s.skills||[]).slice(0,5).map(x=>esc(x.skill)+' — '+x.rate+'%').join('<br>')||'None identified')+'</div>';next.hidden=true;}
async function load(){try{const r=await fetch('questions.json',{cache:'no-store'});if(!r.ok)throw Error('Verified question source is not available yet.');const data=await r.json();let list=Array.isArray(data)?data:(data.questions||[]);list=list.filter(x=>!subject||String(x.subject||'').toLowerCase()===subject).filter(x=>!chapter||String(x.chapter||'')===chapter).filter(x=>!topic||String(x.topic||'')===topic);if(!list.length)throw Error('No questions found for this selection.');const qs=list.map(x=>({question:x.question,options:x.options||[x.option_a,x.option_b,x.option_c,x.option_d],correctIndex:x.correctIndex??x.correctAnswerIndex??['A','B','C','D'].indexOf(String(x.correct_answer||'').toUpperCase()),explanation:x.explanation,skill:x.topic||topic||chapter||subject}));engine=new SkillUpMasteryPractice({questions:qs,onRender:render,onComplete:complete,skillFor:q=>q.skill});render(engine.current(),engine.state());}catch(e){context.textContent='Practice setup';qEl.innerHTML='<h2>Practice unavailable</h2><p>'+esc(e.message)+'</p>';}}
load();})();
</script>
<script src="routes.js"></script><script src="navigation.js"></script><script src="pages.js"></script><script src="link-audit.js"></script>
</body></html>
