['Which characteristic is considered a defining feature of living organisms?',['Growth only','Metabolism','Increase in size only','Locomotion'],1,'Metabolism is a defining feature of living systems because living cells carry out coordinated chemical reactions needed for maintenance and survival.'],
['The sum total of all chemical reactions occurring in a living organism is called:',['Growth','Reproduction','Metabolism','Consciousness'],2,'Metabolism is the complete set of biochemical reactions occurring in an organism, including constructive and degradative reactions.'],
['Formation of complex molecules from simpler molecules is called:',['Anabolism','Catabolism','Excretion','Growth'],0,'Anabolism is the constructive part of metabolism in which simpler molecules are assembled into more complex molecules.'],
['Breakdown of complex molecules into simpler molecules is called:',['Anabolism','Catabolism','Assimilation','Growth'],1,'Catabolism is the degradative part of metabolism and commonly releases usable energy.'],
['Which statement about growth in living organisms is correct?',['It is always an increase in body size','It may involve an increase in cell number or cell mass','It occurs only before reproduction','It occurs only in multicellular organisms'],1,'Living growth can occur through cell division and cell enlargement, so it is not simply an increase in external size.'],
['In unicellular organisms, growth is generally associated with:',['Increase in cell mass followed by division','Formation of tissues','Formation of organs','Development of a vascular system'],0,'A unicellular organism increases cellular material and can then divide to produce new individuals.'],
['Why is reproduction not essential for the survival of an individual organism?',['Some individuals may be sterile','Reproduction never occurs','Only plants reproduce','All organisms reproduce once'],0,'Reproduction ensures continuity of the species, but an individual organism can live without reproducing.'],
['Which statement best describes reproduction?',['A process ensuring continuity of a species','A process responsible only for growth','A process occurring only sexually','A process occurring only in animals'],0,'Reproduction produces new individuals and maintains continuity of a species across generations.'],
['Which is an example of asexual reproduction?',['Binary fission in Amoeba','Fertilisation in humans','Fusion of gametes','Cross-pollination'],0,'Binary fission produces offspring from one parent without fusion of gametes and is therefore asexual reproduction.'],
['Which property enables an organism to respond to changes in its surroundings?',['Consciousness or sensitivity','Digestion only','Growth only','Excretion only'],0,'Living organisms detect and respond to internal or external stimuli, a property associated with sensitivity or consciousness.'],
['Plants respond to external stimuli. Which is an example?',['Phototropism','Metal corrosion','Rock weathering','Crystal formation'],0,'Phototropism is directional plant growth in response to light and demonstrates responsiveness.'],
['Which statement about viruses is most appropriate regarding living characteristics?',['They show independent cellular metabolism','They are acellular and depend on host cells for replication','They are always cellular','They reproduce independently outside hosts'],1,'Viruses are acellular and lack independent metabolic machinery; replication requires a suitable living host cell.'],
['A major difference between living and non-living growth is that living growth generally occurs through:',['Internal cellular processes','Only external deposition','Only crystallisation','Only erosion'],0,'Living growth results from internally controlled cellular synthesis and/or cell division, unlike growth by external deposition.'],
['Which process is directly involved in energy release from nutrients?',['Catabolic reactions','Anabolic reactions only','Cell division only','Pollination'],0,'Catabolic reactions break down nutrient molecules and can release energy captured for cellular work.'],
['Which feature demonstrates cellular organisation in multicellular organisms?',['Cells form tissues and organs','Crystals form by deposition','Rocks undergo erosion','Water evaporates'],0,'Multicellular organisms show organisation in which cells form tissues and tissues contribute to organs and organ systems.'],
['Which feature is fundamental to all living organisms?',['Cellular organisation','Ability to fly','Presence of roots','Presence of chlorophyll'],0,'All living organisms consist of one or more cells, making cellular organisation fundamental to life.'],
['Which statement correctly connects metabolism and life?',['Metabolism provides biochemical activity for maintenance and function','Metabolism occurs only after death','Metabolism is identical to reproduction','Metabolism occurs only in plants'],0,'Metabolism provides the biochemical reactions needed for maintenance, growth, repair and other cellular functions.'],
['An organism that changes its activity after detecting a stimulus demonstrates:',['Responsiveness','Taxonomy','Nomenclature','Decomposition'],0,'A response to a stimulus demonstrates responsiveness, a characteristic property of living systems.'],
['Which combination contains characteristic processes of living organisms?',['Metabolism, growth, reproduction and response to stimuli','Rusting, melting and crystallisation','Weathering, erosion and deposition','Evaporation, freezing and boiling'],0,'Living systems exhibit integrated biological processes such as metabolism, growth, reproduction and response to stimuli.'],
['Why is metabolism useful as a criterion for recognising life?',['It represents coordinated biochemical activity','It occurs only in dead matter','It means increase in body size','It is identical to locomotion'],0,'Metabolism represents the organised network of biochemical reactions that maintains living systems.'],
['Which statement about metabolism is correct?',['It includes both anabolism and catabolism','It means only digestion','It means only respiration','It occurs only during growth'],0,'Metabolism includes all biochemical reactions, with anabolism building molecules and catabolism breaking them down.'],
['Which of the following is an anabolic process?',['Protein synthesis from amino acids','Breakdown of glucose','Digestion of starch','Breakdown of fats'],0,'Protein synthesis joins amino acids to form a larger molecule and is therefore an anabolic process.'],
['Which of the following is a catabolic process?',['Breakdown of glucose during cellular respiration','DNA replication','Protein synthesis','Glycogen synthesis'],0,'Glucose breakdown during cellular respiration is degradative and therefore represents catabolism.'],
['Growth in living organisms is associated with:',['Synthesis of cellular material and/or cell division','Only accumulation of dust','Only crystallisation','Only surface deposition'],0,'Biological growth results from cellular synthesis, increase in cell mass and/or increase in cell number.'],
['Which statement about reproduction is correct?',['It may be sexual or asexual','It is always sexual','It occurs only in multicellular organisms','It is identical to metabolism'],0,'Reproduction occurs by sexual and asexual methods depending on the organism.'],
['Which process involves fusion of male and female gametes?',['Sexual reproduction','Binary fission','Budding only','Fragmentation only'],0,'Sexual reproduction involves formation and fusion of gametes, producing a new individual with genetic contributions from parents.'],
['Which is a characteristic response to a stimulus in humans?',['Withdrawal of hand from a hot object','Formation of a crystal','Rusting of iron','Evaporation of water'],0,'Withdrawal from a hot object is a coordinated biological response to a stimulus detected by the nervous system.'],
['Which statement about consciousness is most appropriate in biology?',['It reflects awareness and response to internal or external stimuli','It occurs only in plants','It is the same as growth','It is a form of crystallisation'],0,'Consciousness in biological contexts involves awareness and the ability to respond to stimuli, especially developed in animals.'],
['Which process can occur in both unicellular and multicellular organisms?',['Metabolism','Formation of organs','Formation of tissues','Development of organ systems'],0,'Both unicellular and multicellular organisms carry out metabolism because cellular biochemical activity is essential for life.'],
['Why can a sterile individual still be considered living?',['It can maintain metabolism and other life processes','It cannot perform any biochemical reaction','It is necessarily non-cellular','It cannot respond to stimuli'],0,'Sterility affects reproduction, not the other fundamental life processes such as metabolism, cellular organisation and responsiveness.'],
['Which observation best supports that an organism is alive?',['It carries out metabolism','It has a particular colour','It has a fixed shape','It occupies space'],0,'Active metabolism is direct evidence of ongoing biochemical activity characteristic of living systems.'],
['Which statement distinguishes biological reproduction from simple physical increase in size?',['Reproduction produces new individuals','Reproduction is only an increase in volume','Reproduction is crystallisation','Reproduction is evaporation'],0,'Reproduction results in formation of new individuals, whereas physical size increase can occur without producing offspring.'],
['Which life process maintains the chemical reactions required for cellular function?',['Metabolism','Nomenclature','Classification','Locomotion only'],0,'Metabolism maintains the network of chemical reactions that supplies energy and materials for cellular function.'],
['Which statement about non-living growth is correct?',['Crystals may grow by deposition of material on their surface','It always requires cell division','It always requires DNA replication','It always requires metabolism'],0,'Non-living objects such as crystals can increase in size by external deposition, unlike cellular biological growth.'],
['Which property is shown when a plant bends toward light?',['Response to stimulus','Catabolism only','Reproduction only','Excretion only'],0,'Growth toward a light source is a response to the environmental stimulus of light.'],
['Which of the following is not a defining life process by itself?',['Increase in size of a non-living crystal','Metabolism','Cellular organisation','Response to stimuli'],0,'A crystal can increase in size without being alive, so size increase alone cannot define life.'],
['Which statement about life processes is correct?',['They are interconnected and support survival of the organism','They occur independently without biochemical reactions','They occur only during reproduction','They occur only in animals'],0,'Life processes are interconnected; metabolism supplies energy and materials that support growth, maintenance, response and reproduction.'],
['An increase in the number of cells in a multicellular organism results mainly from:',['Cell division','Crystal deposition','Evaporation','Rusting'],0,'Cell division increases cell number and contributes to biological growth in multicellular organisms.'],
['Which statement best explains why reproduction is important at the species level?',['It maintains continuity of the species through generations','It is required for every individual to remain alive','It replaces metabolism','It produces energy directly'],0,'Reproduction produces successive generations and therefore maintains the continuity of a species.'],
['Which pair correctly represents the two broad components of metabolism?',['Anabolism and catabolism','Growth and locomotion','Reproduction and excretion','Sensitivity and taxonomy'],0,'Metabolism consists broadly of anabolism, which builds molecules, and catabolism, which breaks molecules down.'],
['Which feature provides the strongest evidence of active life in a cell?',['Ongoing coordinated biochemical reactions','A fixed external shape only','Presence of mineral deposits','Increase in size without cellular activity'],0,'Active coordinated biochemical reactions demonstrate metabolism and therefore ongoing cellular life.']
