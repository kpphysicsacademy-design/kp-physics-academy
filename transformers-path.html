ractical','Energy Transfer','Frequency Effects','Mixed Circuit Problems','JEE Advanced Problems']],['🔴','09 • JEE Main & Advanced',['Turns Ratio','Voltage Ratio','Current Ratio','EMF Equation','Step-Up/Down','Efficiency','Losses','Mixed JEE Main Test','JEE Advanced Challenge']],['🏆','10 • Final Mastery',['Foundations Test','Ideal Transformer Test','EMF Test','Step-Up/Down Test','Efficiency Test','Loss Test','Advanced Transformer Test','Mixed JEE Test','Wrong-Question Revision','Final Unseen Mastery']]];let n=0,out='';sections.forEach(s=>{out+=`<section class="section"><h2>${s[0]} ${s[1]}</h2><p class="muted">${s[2].length} lessons • 5 MCQs per task</p><div class="path">`;s[2].forEach(x=>{const i=n++;out+=`<div class="lesson"><div class="card"><h3>${i+1}. ${x}</h3><p>${s[1]} • Zero → Hero</p><span class="tag">🔓 UNLOCKED</span><a class="btn" href="jee-physics-lesson-shuffled.html?topic=transformers&lesson=${i+1}">Start Task →</a></div></div>`});out+='</div></section>'});document.getElementById('content').innerHTML=out;</script></main></body></html>
