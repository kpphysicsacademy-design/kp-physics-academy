<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concept Lesson | KP Physics Academy</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#0b1930}.wrap{max-width:800px;margin:auto;padding:30px 18px}.card{background:#fff;border-radius:18px;padding:30px;box-shadow:0 8px 30px #0b193012}.tag{color:#1687ff;font-weight:800}.visual{width:100%;max-height:360px;object-fit:contain;border-radius:12px;margin:20px 0;background:#f1f6ff}.formula{font:700 30px Georgia,serif;text-align:center;background:#edf5ff;padding:20px;border-radius:12px;margin:20px 0}.back{color:#1687ff;font-weight:700;text-decoration:none}.next{margin-top:25px;width:100%;padding:13px;border:0;border-radius:9px;background:#1687ff;color:#fff;font-weight:800}</style></head><body><main class="wrap"><a class="back" href="student-dashboard.html">← Back to My Learning</a><div class="card" id="lesson" style="margin-top:22px"></div></main><script>const d=JSON.parse(localStorage.getItem('kp_student_concept')||'null'),root=document.getElementById('lesson');if(!d){root.innerHTML='<h2>No concept selected</h2><p>Return to your student dashboard.</p>'}else{root.innerHTML='<span class="tag">Class '+(d.classNo||'')+' • '+esc(d.chapter||'Physics')+'</span><h1>'+esc(d.title||'Concept')+'</h1>'+(d.imageUrl?'<img class="visual" src="'+esc(d.imageUrl)+'" alt="Concept visual">':'')+'<h2>🌟 Understand it</h2><p>'+esc(d.explanation||'Your teacher has not added the explanation yet.')+'</p>'+(d.example?'<h2>🧸 Example</h2><p>'+esc(d.example)+'</p>':'')+(d.formula?'<h2>📐 Formula</h2><div class="formula">'+esc(d.formula)+'</div>':'')+'<h2>⭐ Remember</h2><p>Try explaining this idea in your own words before moving on.</p><button class="next" onclick="location.href=\'student-dashboard.html\'">✓ I Understand — Back to My Learning</button>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
