<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satellites | KP Physics Academy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f9fd;color:#10213a}.top{background:#071a31;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:30px 18px 70px}.hero{text-align:center}.hero h1{font-size:38px;margin:10px 0}.hero span{color:#1687ff}.muted{color:#718096;line-height:1.5}.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}.stat{background:#fff;border:1px solid #dfe7f1;border-radius:14px;padding:12px 18px;text-align:center}.section{margin:38px 0}.path{position:relative}.path:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:5px;transform:translateX(-50%);background:#dce8f5;border-radius:10px}.lesson{position:relative;min-height:125px;display:flex;align-items:center}.lesson:nth-child(odd){justify-content:flex-start;padding-right:calc(50% + 42px)}.lesson:nth-child(even){justify-content:flex-end;padding-left:calc(50% + 42px)}.card{width:100%;max-width:400px;background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:17px;box-shadow:0 6px 18px #0000000b}.card h3{margin:0;font-size:16px}.card p{font-size:12px;color:#718096}.tag{font-size:10px;font-weight:800;color:#138650}.btn{display:block;text-align:center;background:#1687ff;color:#fff;text-decoration:none;padding:10px;border-radius:9px;font-weight:bold;margin-top:10px}@media(max-width:700px){.path:before{left:18px;transform:none}.lesson,.lesson:nth-child(odd),.lesson:nth-child(even){justify-content:flex-start;padding-left:48px;padding-right:0}.card{max-width:none}}</style></head><body><header class="top"><a href="jee-physics-path.html">← JEE Physics Path</a><a href="index.html">Home</a></header><main class="wrap"><section class="hero"><p>⚙️ JEE PHYSICS • MECHANICS • CONCEPT 22</p><h1>🛰️ Satellites <span>Zero → Hero</span></h1><p class="muted">Learn → Practice → Correct → Retry → Master</p></section><div class="stats"><div class="stat">🔥 0<br><small>Streak</small></div><div class="stat">⭐ 0<br><small>XP</small></div><div class="stat">🎯 10<br><small>Sections</small></div><div class="stat"><b>100+</b><br><small>Lessons</small></div></div><div id="content"></div></main><script>const sections=[['🟢','01 • Satellite Foundations',['What is an Artificial Satellite?','Orbital Motion','Gravitational Force as Centripetal Force','Circular Orbit','Orbital Radius','Satellite Speed','Orbital Angular Velocity','Basic Satellite Equations','Basic Problems']],['🟢','02 • Orbital Velocity',['Orbital Velocity','v = √(GM/r)','Near-Earth Satellite','Dependence on Orbital Radius','Dependence on Planet Mass','Circular Orbit Speed','Comparison of Orbits','Velocity Numericals']],['🔵','03 • Time Period & Frequency',['Orbital Time Period','T = 2π√(r³/GM)','Angular Frequency','Orbital Frequency','Kepler’s Third Law','Radius–Period Relation','Comparing Satellites','Period Problems']],['🔵','04 • Satellite Energy',['Kinetic Energy of Satellite','Potential Energy','Total Mechanical Energy','E = −GMm/2r','Energy vs Radius','Energy Change Between Orbits','Binding Energy','Energy Numericals']],['🟡','05 • Geostationary & Polar Satellites',['Geostationary Satellite','Conditions for Geostationary Orbit','Orbital Radius','Orbital Period','Applications','Polar Satellite','Sun-Synchronous Idea','Communication Satellites','Comparison Problems']],['🟡','06 • Escape & Satellite Transfer',['Escape Velocity','Escape from Earth','Escape Energy','Orbital Transfer','Changing Satellite Orbit','Energy Required for Transfer','Higher vs Lower Orbit','Transfer Problems']],['🟠','07 • Kepler & Planetary Motion',['Kepler’s First Law','Kepler’s Second Law','Areal Velocity','Kepler’s Third Law','Planetary Orbits','Central Force Connection','Angular Momentum Conservation','Areal Velocity Problems']],['🟠','08 • Advanced Satellite Problems',['Satellite Around Different Planets','Altitude-Based Problems','Earth Rotation Effects','Satellite Weightlessness','Apparent Weight','Multiple Satellites','Orbital Energy Comparison','Advanced Constraint Problems']],['🔴','09 • JEE Main & Advanced',['Orbital Velocity Questions','Time Period Questions','Energy Questions','Geostationary Problems','Escape Problems','Kepler Law Problems','Transfer Problems','Mixed JEE Main Test','JEE Advanced Challenge']],['🏆','10 • Final Mastery',['Foundations Test','Orbital Velocity Test','Time Period Test','Energy Test','Geostationary Test','Escape Test','Kepler Test','Advanced Satellite Test','Wrong-Question Revision','Final Unseen Mastery']]];let n=0,out='';sections.forEach(s=>{out+=`<section class="section"><h2>${s[0]} ${s[1]}</h2><p class="muted">${s[2].length} lessons • 5 MCQs per task</p><div class="path">`;s[2].forEach(x=>{const i=n++;out+=`<div class="lesson"><div class="card"><h3>${i+1}. ${x}</h3><p>${s[1]} • Zero → Hero</p><span class="tag">🔓 UNLOCKED</span><a class="btn" href="jee-physics-lesson-shuffled.html?topic=satellites&lesson=${i+1}">Start Task →</a></div></div>`});out+='</div></section>'});document.getElementById('content').innerHTML=out;</script></main></body></html>
