<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SkillUp | Chapter Test</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fb;color:#263244;font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100dvh;padding:14px}.top{display:flex;align-items:center;gap:12px}.back{width:46px;height:46px;border:0;border-radius:15px;background:#fff;font-size:24px}.title{font-size:21px;font-weight:800}.sub{font-size:13px;color:#6b7587;margin-top:4px}.hero{margin:16px 0;background:linear-gradient(135deg,#182e4f,#6042bd);color:#fff;border-radius:24px;padding:20px}.hero h2{margin:5px 0;font-size:22px}.hero small{opacity:.78}.stats{display:flex;gap:10px;margin-top:14px}.stat{flex:1;background:#ffffff18;border:1px solid #ffffff24;border-radius:14px;padding:10px;text-align:center;font-weight:800}.progress{display:flex;justify-content:space-between;margin:18px 2px 8px;font-weight:800}.track{height:9px;background:#dfe4ec;border-radius:20px;overflow:hidden}.fill{height:100%;background:#6042bd;width:5%;transition:.25s}.card{margin-top:20px;background:#fff;border:1px solid #e4e8ef;border-radius:26px;padding:21px;box-shadow:0 8px 25px #24344a0b}.qno{display:inline-block;background:#f0ecff;color:#6045b5;padding:7px 11px;border-radius:12px;font-weight:800;font-size:13px}.question{font-size:22px;line-height:1.45;margin:20px 0}.options{display:grid;gap:11px}.option{width:100%;text-align:left;border:2px solid #e2e6ed;background:#fff;border-radius:16px;padding:14px;font-size:16px;color:#263244}.option.selected{border-color:#6042bd;background:#f5f2ff}.letter{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#edf0f5;margin-right:10px;font-weight:800}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:15px;border-radius:19px;border:1px solid #d9dfe8;background:#fff;font-size:16px;font-weight:800}.primary{background:#6042bd!important;color:#fff!important;border-color:#6042bd!important}.finish{background:#17385f!important;border-color:#17385f!important}.hidden{display:none}.result{text-align:center}.score{font-size:56px;font-weight:900;color:#6042bd}.result p{line-height:1.6;color:#596578}.review{margin-top:15px;text-align:left}.reviewItem{padding:13px;border-bottom:1px solid #e8ebf0}.good{color:#21814a}.bad{color:#c13d3d}@media(max-width:480px){.app{padding:12px}.card{padding:18px}.question{font-size:20px}.stats{gap:7px}.stat{font-size:13px}}</style></head><body><main class="app"><header class="top"><button class="back" onclick="back()">←</button><div><div class="title">Chapter Test</div><div class="sub">Complete the test before seeing answers</div></div></header><section class="hero"><small id="meta">CLASS 6 • SCIENCE</small><h2 id="chapterTitle">The Wonderful World of Science</h2><div class="stats"><div class="stat">20 Questions</div><div class="stat">No Instant Feedback</div><div class="stat">Final Score</div></div></section><section id="test"><div class="progress"><span id="count"></span><span id="answered"></span></div><div class="track"><div class="fill" id="fill"></div></div><section class="card"><span class="qno" id="qno"></span><h1 class="question" id="question"></h1><div class="options" id="options"></div></section><div class="actions"><button id="prev">‹ Previous</button><button id="next" class="primary">Next ›</button></div><div class="actions"><button id="submit" class="finish">Submit Chapter Test</button></div></section><section id="result" class="card result hidden"><span class="qno">TEST COMPLETE</span><div class="score" id="score"></div><h1>Chapter Test Result</h1><p id="summary"></p><div class="review" id="review"></div><div class="actions"><button onclick="back()">Back to Chapter</button><button class="primary" onclick="restart()">Retake Test</button></div></section></main><script>
const raw=[['Which of these best describes science?',['A way to understand the world through observation and investigation','A collection of magic tricks','A way to avoid asking questions','Only memorising facts'],0],['What often starts a scientific investigation?',['A question','A holiday','A prize','A rumour'],0],['Carefully noticing and collecting information is called:',['Observation','Prediction','Conclusion','Imagination'],0],['Why do scientists perform experiments?',['To test ideas using evidence','To avoid observations','To guarantee every guess is correct','To stop asking questions'],0],['A possible explanation that can be tested is called a:',['Hypothesis','Measurement','Tool','Conclusion'],0],['Which quality encourages us to ask why and how?',['Curiosity','Carelessness','Silence','Fear of questions'],0],['Which instrument is used to measure temperature?',['Thermometer','Ruler','Compass','Balance'],0],['A ruler is mainly used to measure:',['Length','Temperature','Time','Direction'],0],['A balance is used to measure:',['Mass','Direction','Temperature','Light'],0],['Which is an example of science in everyday life?',['Observing water turn into steam when heated','Ignoring natural changes','Avoiding all questions','Rejecting evidence without checking'],0],['What should a prediction be checked by?',['Testing and evidence','Luck only','Copying answers','Ignoring results'],0],['Evidence is commonly collected through:',['Observation and investigation','Rumours','Luck','Guessing only'],0],['Why is measurement useful in science?',['It provides information that can be compared accurately','It removes the need for observation','It proves every idea immediately','It replaces experiments'],0],['After studying results, scientists may form a:',['Conclusion','Random guess','Holiday plan','Question mark only'],0],['What may happen when new evidence is found?',['Scientific ideas may be revised','Science must stop','Evidence should be ignored','Questions disappear forever'],0],['Plants are examples of:',['Living things','Machines','Tools','Rocks'],0],['Living things interact with their:',['Environment','Nothing at all','Only books','Only screens'],0],['Which is a good scientific question?',['Why do plants grow towards light?','How can I avoid observing anything?','Why should evidence be ignored?','How can all questions be stopped?'],0],['New discoveries often lead to:',['More questions and investigation','The end of science','No further observation','No curiosity'],0],['Science is best seen as a journey of:',['Wondering, investigating and discovering','Never asking questions','Only guessing','Avoiding nature'],0]];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let questions=shuffle(raw.map((q,qi)=>{let opts=q[1].map((t,i)=>({t,ok:i===q[2]}));shuffle(opts);return {q:q[0],o:opts.map(x=>x.t),a:opts.findIndex(x=>x.ok)}}));let i=0,answers=Array(questions.length).fill(null);const $=x=>document.getElementById(x),p=new URLSearchParams(location.search);
function render(){let q=questions[i],done=answers.filter(x=>x!==null).length;$('count').textContent='Question '+(i+1)+' of '+questions.length;$('answered').textContent=done+' answered';$('fill').style.width=((i+1)/questions.length*100)+'%';$('qno').textContent='QUESTION '+(i+1);$('question').textContent=q.q;$('options').innerHTML=q.o.map((o,n)=>'<button class="option '+(answers[i]===n?'selected':'')+'" onclick="pick('+n+')"><span class="letter">'+String.fromCharCode(65+n)+'</span>'+o+'</button>').join('');$('prev').disabled=i===0;$('next').textContent=i===questions.length-1?'Review ›':'Next ›'}
function pick(n){answers[i]=n;render()}$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<questions.length-1){i++;render()}};$('submit').onclick=submitTest;
function submitTest(){let missing=answers.filter(x=>x===null).length;if(missing&&!confirm(missing+' question(s) are unanswered. Submit anyway?'))return;let score=answers.reduce((s,a,n)=>s+(a===questions[n].a?1:0),0),pc=Math.round(score/questions.length*100);$('test').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=score+' / '+questions.length;$('summary').textContent='You scored '+pc+'%. Correct answers and results are shown only after submitting the test.';$('review').innerHTML=questions.map((q,n)=>'<div class="reviewItem '+(answers[n]===q.a?'good':'bad')+'"><b>Q'+(n+1)+': '+(answers[n]===q.a?'✓ Correct':'✗ Incorrect')+'</b><br><small>Correct answer: '+String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'</small></div>').join('')}
function restart(){questions=shuffle(raw.map(q=>{let opts=q[1].map((t,i)=>({t,ok:i===q[2]}));shuffle(opts);return{q:q[0],o:opts.map(x=>x.t),a:opts.findIndex(x=>x.ok)}}));answers=Array(questions.length).fill(null);i=0;$('result').classList.add('hidden');$('test').classList.remove('hidden');render()}function back(){location.href='chapter-preparation.html?class='+(p.get('class')||6)+'&subject='+(p.get('subject')||'science')+'&chapter='+(p.get('chapter')||1)}$('meta').textContent='CLASS '+(p.get('class')||6)+' • '+(p.get('subject')||'science').toUpperCase();$('chapterTitle').textContent=p.get('title')||'The Wonderful World of Science';render();
</script></body></html>
