<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morphology Tests | SkillUp</title><style>:root{--g:#58cc02;--gd:#46a302;--ink:#4b4b4b;--line:#e5e5e5}*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:var(--ink)}.w{max-width:720px;margin:auto;padding:18px 14px 40px}.nav{display:flex;gap:10px;align-items:center;font-weight:900;margin-bottom:18px}.nav a{color:#777;text-decoration:none}.hero,.topic,.quiz{background:#fff;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:20px;padding:20px;margin:14px 0}.hero{text-align:center}.mascot{font-size:50px}.mode{background:#eaf8df;color:#46a302;border-radius:14px;padding:10px;font-weight:900;margin-top:12px}.label{font-size:13px;font-weight:900;color:#777;letter-spacing:1px;margin:20px 4px 8px}.topic{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}.num{width:36px;height:36px;border-radius:12px;background:#eaf8df;color:#46a302;display:grid;place-items:center;font-weight:900}.emoji{font-size:29px}.copy{flex:1}.copy b,.copy small{display:block}.copy small{color:#777;margin-top:4px}.start,.next,.primary{background:var(--g);color:#fff;border:0;border-bottom:4px solid var(--gd);border-radius:12px;padding:11px;font-weight:900}.progress{height:14px;background:#e5e5e5;border-radius:20px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:var(--g)}.opts{display:grid;gap:12px}.opts button{background:#fff;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:15px;padding:15px;text-align:left;font-weight:800}.correct{border-color:#58cc02!important;background:#f1ffe8!important}.wrong{border-color:#ff4b4b!important;background:#fff0f0!important}#fb{margin-top:12px;background:#f4fbef;border-radius:14px;padding:14px;line-height:1.5;font-weight:700}.next{width:100%;margin-top:12px}.done{display:none}.review-item{background:#fff7f7;border:2px solid #ffd5d5;border-radius:14px;padding:14px;margin:10px 0}.home{position:fixed;top:12px;left:12px;width:46px;height:46px;display:grid;place-items:center;background:#fff;border:2px solid #e5e5e5;border-bottom:5px solid #d6d6d6;border-radius:16px;text-decoration:none;font-size:23px}</style></head><body><a class="home" href="botany-full-path.html">🏠</a><main class="w"><nav class="nav"><a href="botany-morphology-flowering-plants.html">🌸 Morphology</a><span>›</span><b>🧪 Tests</b></nav><div id="app"></div></main><script>
const topics={
root:[["Which region of root bears root hairs?","Zone of maturation","Root cap","Zone of cell division","Zone of elongation",0],["Prop roots occur in:","Banyan","Maize","Carrot","Potato",0],["Storage tap root occurs in:","Carrot","Maize","Banyan","Rhizophora",0],["Pneumatophores are found in:","Rhizophora","Banyan","Wheat","Pea",0],["Fibrous root system is typical of:","Wheat","Mustard","Gram","Mango",0]],
stem:[["The stem is characterized by presence of:","Nodes and internodes","Root cap","Root hairs","Calyptra only",0],["Potato is a modification of:","Stem","Root","Leaf","Flower",0],["Tendrils of grapevine are modified:","Stems","Roots","Leaves","Flowers",0],["Thorns of Citrus are modified:","Stems","Roots","Leaves","Stipules",0],["Runner is a:","Subaerial stem modification","Root modification","Leaf modification","Fruit type",0]],
leaf:[["Arrangement of leaves on stem is called:","Phyllotaxy","Venation","Aestivation","Placentation",0],["Reticulate venation is common in:","Dicots","Monocots","Algae","Bryophytes",0],["Parallel venation is common in:","Monocots","Dicots","Gymnosperms only","Bryophytes",0],["Pinnately compound leaf occurs in:","Neem","Silk cotton","Guava","Grass",0],["Phyllode occurs in:","Australian Acacia","Mango","Pea","Maize",0]],
flower:[["The female reproductive whorl is:","Gynoecium","Androecium","Corolla","Calyx",0],["Valvate aestivation has:","Margins touching without overlap","Margins overlapping regularly","Twisted margins","No petals",0],["Axile placentation occurs in:","China rose","Mustard","Sunflower","Pea",0],["A flower with ovary above other floral parts is:","Hypogynous","Epigynous","Perigynous","Inferior",0],["Bilateral symmetry is called:","Zygomorphic","Actinomorphic","Asymmetric","Radial only",0]],
fruitseed:[["Mango is a:","Drupe","Berry","Legume","Caryopsis",0],["Coconut is classified as:","Drupe","Legume","Capsule","Berry",0],["Fruit develops mainly from:","Ovary","Anther","Sepal","Stigma",0],["Seed coat develops from:","Integuments","Ovule wall","Ovary wall","Embryo",0],["Maize seed is:","Endospermic","Non-endospermic","Without embryo","Without seed coat",0]],
families:[["Papilionaceous corolla is characteristic of:","Fabaceae","Solanaceae","Liliaceae","Poaceae",0],["Epipetalous stamens occur in:","Solanaceae","Fabaceae","Liliaceae","Brassicaceae",0],["Perianth is typical of:","Liliaceae","Fabaceae","Solanaceae","Mustard",0],["Mustard shows:","Parietal placentation","Axile placentation","Free central placentation","Basal placentation",0],["Fabaceae usually has:","Monocarpellary gynoecium","Tricarpellary gynoecium","Bicarpellary syncarpous gynoecium","No gynoecium",0]]
};
const labels={root:"🌱 Root",stem:"🌿 Stem",leaf:"🍃 Leaf",flower:"🌸 Flower",fruitseed:"🍎 Fruit & 🌰 Seed",families:"🧬 Important Families"};const app=document.getElementById("app"),key=new URLSearchParams(location.search).get("topic");function list(){app.innerHTML='<section class="hero"><div class="mascot">🌸</div><h1>Morphology Tests</h1><p>Concept-wise NCERT and NEET practice.</p><div class="mode">🎯 6 SKILLS • 30 QUESTIONS</div></section><div class="label">CHOOSE A TEST</div>'+Object.keys(topics).map((k,i)=>'<a class="topic" href="?topic='+k+'"><span class="num">'+(i+1)+'</span><span class="emoji">'+labels[k].split(" ")[0]+'</span><span class="copy"><b>'+labels[k]+'</b><small>'+topics[k].length+' questions</small></span><span class="start">START →</span></a>').join("")}function test(){const qs=topics[key];let i=0,score=0,wrong=[];app.innerHTML='<section class="hero"><div class="mascot">'+labels[key].split(" ")[0]+'</div><h1>'+labels[key]+'</h1><div class="progress"><span id="bar"></span></div><b id="status"></b></section><section class="quiz" id="quiz"></section><section class="hero done" id="done"><div class="mascot">🏆</div><h1>Test Complete!</h1><p id="final"></p><div id="review"></div><button class="primary" onclick="location.reload()">TRY AGAIN</button></section>';const quiz=document.getElementById("quiz"),bar=document.getElementById("bar"),status=document.getElementById("status"),done=document.getElementById("done");function render(){const q=qs[i];status.textContent='Question '+(i+1)+' / '+qs.length;let o=q.slice(1,5).map((t,n)=>({t,n}));o.sort(()=>Math.random()-.5);quiz.innerHTML='<b>QUESTION '+(i+1)+' OF '+qs.length+'</b><h2>'+q[0]+'</h2><div class="opts">'+o.map((x,n)=>'<button data-i="'+x.n+'">'+String.fromCharCode(65+n)+'. '+x.t+'</button>').join("")+'</div><div id="fb"></div>';document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>answer(+b.dataset.i,q))}function answer(ch,q){const bs=[...document.querySelectorAll(".opts button")],fb=document.getElementById("fb");bs.forEach(b=>{b.disabled=true;if(+b.dataset.i===q[5])b.classList.add("correct")});if(ch===q[5]){score++;fb.innerHTML="🎉 <b>Correct!</b>"}else{bs.find(b=>+b.dataset.i===ch)?.classList.add("wrong");wrong.push(q);fb.innerHTML="💡 <b>Keep learning!</b><br>Correct answer: "+q[q[5]+1]}fb.innerHTML+='<button class="next">'+(i===qs.length-1?"FINISH →":"NEXT →")+"</button>";fb.querySelector("button").onclick=()=>{i++;bar.style.width=(i/qs.length*100)+"%";if(i<qs.length)render();else{quiz.style.display="none";document.getElementById("final").textContent="Score: "+score+" / "+qs.length;document.getElementById("review").innerHTML=wrong.length?'<h2>📝 Review Wrong Answers</h2>'+wrong.map(q=>'<div class="review-item"><b>'+q[0]+'</b><p>✅ '+q[q[5]+1]+'</p></div>').join(""):"🎉 Perfect score!";done.style.display="block"}}}render()}key&&topics[key]?test():list();
</script></body></html>
