<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMS Values | KP Physics Academy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f9fd;color:#10213a}.top{background:#071a31;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:30px 18px 70px}.hero{text-align:center}.hero h1{font-size:38px;margin:10px 0}.hero span{color:#1687ff}.muted{color:#718096;line-height:1.5}.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}.stat{background:#fff;border:1px solid #dfe7f1;border-radius:14px;padding:12px 18px;text-align:center}.section{margin:38px 0}.path{position:relative}.path:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:5px;transform:translateX(-50%);background:#dce8f5;border-radius:10px}.lesson{position:relative;min-height:125px;display:flex;align-items:center}.lesson:nth-child(odd){justify-content:flex-start;padding-right:calc(50% + 42px)}.lesson:nth-child(even){justify-content:flex-end;padding-left:calc(50% + 42px)}.card{width:100%;max-width:400px;background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:17px;box-shadow:0 6px 18px #0000000b}.card h3{margin:0;font-size:16px}.card p{font-size:12px;color:#718096}.tag{font-size:10px;font-weight:800;color:#138650}.btn{display:block;text-align:center;background:#1687ff;color:#fff;text-decoration:none;padding:10px;border-radius:9px;font-weight:bold;margin-top:10px}@media(max-width:700px){.path:before{left:18px;transform:none}.lesson,.lesson:nth-child(odd),.lesson:nth-child(even){justify-content:flex-start;padding-left:48px;padding-right:0}.card{max-width:none}}</style></head><body><header class="top"><a href="jee-physics-path.html">← JEE Physics Path</a><a href="index.html">Home</a></header><main class="wrap"><section class="hero"><p>🔄 JEE PHYSICS • EMI & AC • CONCEPT 83</p><h1>📐 RMS Values <span>Zero → Hero</span></h1><p class="muted">Learn → Practice → Correct → Retry → Master</p></section><div class="stats"><div class="stat">🔥 0<br><small>Streak</small></div><div class="stat">⭐ 0<br><small>XP</small></div><div class="stat">🎯 10<br><small>Sections</small></div><div class="stat"><b>100+</b><br><small>Lessons</small></div></div><div id="content"></div></main><script>const sections=[['🟢','01 • RMS Foundations',['RMS Concept','Effective Value','DC Equivalent Heating','AC vs DC','Instantaneous Value','Cycle Average','Mean Square','Square Root','Basic Problems']],['🟢','02 • RMS of Sinusoidal AC',['i = I₀ sinωt','V = V₀ sinωt','Iᵣₘₛ = I₀/√2','Vᵣₘₛ = V₀/√2','Peak Value','Peak-to-RMS Relation','Time Period','Angular Frequency','Formula Problems']],['🔵','03 • RMS from Waveforms',['Square Wave','Triangular Wave','Sawtooth Wave','Piecewise Wave','Graph Reading','Mean Square Integration','Symmetry','Half-Cycle Analysis','Waveform Numericals']],['🔵','04 • RMS and Average Values',['Average Current','Average Voltage','Average over Full Cycle','Average over Half Cycle','RMS vs Average','Form Factor','Crest Factor','Rectified Waveforms','Comparison Problems']],['🟡','05 • RMS in RLC Circuits',['RMS Voltage','RMS Current','Resistive Drop','Inductive Drop','Capacitive Drop','Impedance Relation','Phasor RMS','Power Using RMS','RLC Numericals']],['🟡','06 • RMS and AC Power',['P = VᵣₘₛIᵣₘₛcosφ','Pure Resistance Power','Pure Inductor Power','Pure Capacitor Power','Power Factor','Energy per Cycle','Heating Effect','Power Measurement','Power Problems']],['🟠','07 • Advanced RMS Analysis',['Non-Sinusoidal Signals','Composite Waveforms','Superposition','AC + DC Components','RMS of Sum','RMS of Difference','Graph Integration','Piecewise Signals','JEE Applications']],['🟠','08 • RMS + Instruments',['AC Ammeter','AC Voltmeter','True RMS Concept','Thermal Instruments','Calibration','Measurement Errors','Loading Effects','Practical Meters','JEE Advanced Problems']],['🔴','09 • JEE Main & Advanced',['Sinusoidal RMS','Peak-RMS Conversion','Waveform RMS','Average vs RMS','RLC RMS','AC Power','Composite Signals','Mixed JEE Main Test','JEE Advanced Challenge']],['🏆','10 • Final Mastery',['Foundations Test','Sinusoidal Test','Waveform Test','Average/RMS Test','RLC Test','Power Test','Advanced RMS Test','Mixed JEE Test','Wrong-Question Revision','Final Unseen Mastery']]];let n=0,out='';sections.forEach(s=>{out+=`<section class="section"><h2>${s[0]} ${s[1]}</h2><p class="muted">${s[2].length} lessons • 5 MCQs per task</p><div class="path">`;s[2].forEach(x=>{const i=n++;out+=`<div class="lesson"><div class="card"><h3>${i+1}. ${x}</h3><p>${s[1]} • Zero → Hero</p><span class="tag">🔓 UNLOCKED</span><a class="btn" href="jee-physics-lesson-shuffled.html?topic=rms-values&lesson=${i+1}">Start Task →</a></div></div>`});out+='</div></section>'});document.getElementById('content').innerHTML=out;</script></main></body></html>
