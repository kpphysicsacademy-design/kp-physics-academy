 Zero Error','Zero Correction','Zero-Error Practice']],['🟠','SECTION 6 — Absolute Error',['Absolute Error','Mean Value','Mean Absolute Error','Experimental Result','Numerical Practice']],['🟠','SECTION 7 — Relative & Percentage Error',['Relative Error','Percentage Error','Relative → Percentage','Comparing Measurements','Numerical Practice']],['🔴','SECTION 8 — Error Propagation',['Error in Addition','Error in Subtraction','Error in Multiplication','Error in Division','Error in Powers','Combined Error Problems']],['🔴','SECTION 9 — Experimental Analysis',['Experimental Data','Repeated Measurements','Data Tables','Graphs','Slope','Intercept','Physical Meaning','Experimental Problems']],['🔥','SECTION 10 — JEE Application',['Conceptual JEE Questions','Calculation Questions','Experimental Questions','Error-Based Traps','Mixed Problems','JEE Main Practice']],['⚡','SECTION 11 — JEE Advanced',['Multi-concept Problems','Experimental Reasoning','Data Analysis','Error Propagation Problems','Advanced Numerical Problems','JEE Advanced Challenge']]];let completed=+localStorage.getItem('kp_error_completed')||0;const lessons=[];sections.forEach((s,si)=>s[2].forEach((name,li)=>lessons.push({name,section:s[1],icon:s[0]})));function render(){let n=0,out='';sections.forEach(s=>{out+=`<section class="section"><h2>${s[0]} ${s[1]}</h2><p class="muted">${s[2].length} lessons • ${n===0?'Start here': 'Master the previous lessons to unlock'}</p><div class="path">`;s[2].forEach(name=>{const i=n++;const unlocked=i<=completed;const done=i<completed;const current=i===completed;out+=`<div class="lesson"><div class="node ${done?'done':''} ${current?'current':''} ${!unlocked?'locked':''}"><h3>${done?'🏆 ':current?'⭐ ':s[0]+' '}${i+1}. ${name}</h3><p>${s[1]} • Zero → Hero</p><span class="tag">${done?'MASTERED':unlocked?'READY':'LOCKED'}</span>${i===0?'<a class="btn" href="error-experimental-analysis-task-1.html">Start Lesson →</a>':current?'<a class="btn" href="error-experimental-analysis-task-'+(i+1)+'.
