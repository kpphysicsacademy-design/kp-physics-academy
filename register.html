<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a31"><title>SkillUp | Create Account</title>
<style>
:root{--navy:#071a31;--blue:#1687ff;--purple:#423de8;--ink:#172033;--muted:#667085;--line:#dfe7ef;--bg:#f4f7fb;--danger:#b42318;--success:#16834b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
.page{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 15% 10%,#1687ff14,transparent 28%),radial-gradient(circle at 90% 90%,#58cc0210,transparent 24%),var(--bg)}
.wrap{width:min(520px,100%)}.brand{text-align:center;margin-bottom:16px}.brand-icon{width:68px;height:68px;margin:0 auto 9px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(145deg,#071a31,#0d3157);border:1px solid #294765;color:#fff;font-size:31px;box-shadow:0 12px 30px #071a3125}.brand-name{font-size:26px;font-weight:950;color:var(--navy)}.brand-name span{color:var(--blue)}.tagline{margin-top:4px;color:#b87900;font-size:8px;font-weight:950;letter-spacing:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px 22px;box-shadow:0 15px 45px #17203312}.welcome{text-align:center}.welcome h1{font-size:23px;margin:0 0 6px}.welcome p{font-size:11px;color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{margin-bottom:13px}.field.full{grid-column:1/-1}.field label{display:block;font-size:9px;font-weight:950;margin-bottom:7px}.input,.select{width:100%;height:49px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:13px;outline:0;background:#fbfdff;color:var(--ink)}.input:focus,.select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1687ff14}.terms{font-size:8px;color:#98a2b3;line-height:1.5;text-align:center;margin:2px 3px 13px}.btn{width:100%;height:50px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:950;font-size:12px;cursor:pointer;box-shadow:0 8px 22px #1687ff35}.btn:disabled{opacity:.7;cursor:wait}.msg{min-height:22px;text-align:center;font-size:10px;font-weight:800;margin-top:10px;line-height:1.45}.msg.error{color:var(--danger)}.msg.success{color:var(--success)}.login{text-align:center;font-size:10px;color:var(--muted);margin-top:12px}.login a{color:var(--blue);font-weight:950;text-decoration:none}
@media(max-width:520px){.page{padding:14px;align-items:flex-start;padding-top:26px}.wrap{width:100%}.card{padding:22px 17px;border-radius:20px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.brand-icon{width:64px;height:64px;font-size:29px}.brand-name{font-size:24px}}
</style>
</head>
<body>
<div class="page"><main class="wrap">
<header class="brand"><div class="brand-icon">⚛️</div><div class="brand-name">SKILL<span>UP</span></div><div class="tagline">MASTER EVERY SUBJECT</div></header>
<section class="card">
<div class="welcome"><h1>Create Your Account 🚀</h1><p>Start your personalized SkillUp learning journey.</p></div>
<form id="form">
<div class="grid">
<div class="field"><label for="name">FULL NAME</label><input id="name" class="input" autocomplete="name" required placeholder="Your name"></div>
<div class="field"><label for="email">EMAIL ADDRESS</label><input id="email" class="input" type="email" autocomplete="email" required placeholder="you@example.com"></div>
<div class="field"><label for="studentClass">CLASS</label><select id="studentClass" class="select"><option value="6">Class 6</option><option value="7">Class 7</option><option value="8">Class 8</option><option value="9">Class 9</option><option value="10">Class 10</option><option value="11">Class 11</option><option value="12" selected>Class 12</option></select></div>
<div class="field"><label for="target">TARGET</label><select id="target" class="select"><option value="School">School</option><option value="JEE">JEE</option><option value="NEET">NEET</option><option value="Other">Other</option></select></div>
<div class="field full"><label for="password">PASSWORD</label><input id="password" class="input" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"></div>
<div class="field full"><label for="confirm">CONFIRM PASSWORD</label><input id="confirm" class="input" type="password" autocomplete="new-password" minlength="6" required placeholder="Re-enter password"></div>
</div>
<div class="terms">Your password is securely handled by Firebase Authentication. Your learning profile is stored in Firestore.</div>
<button id="create" class="btn" type="submit">CREATE ACCOUNT →</button>
</form>
<div id="msg" class="msg" aria-live="polite"></div>
<div class="login">Already have an account? <a href="login.html">SIGN IN</a></div>
</section></main></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getAuth,createUserWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import{getFirestore,doc,setDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
function show(text,type='error'){$('msg').textContent=text;$('msg').className='msg '+type}
function authMessage(code){return({'auth/email-already-in-use':'An account already exists with this email. Please use Sign In.','auth/invalid-email':'Please enter a valid email address.','auth/weak-password':'Password must contain at least 6 characters.','auth/operation-not-allowed':'Email/password sign-up is not enabled in Firebase Authentication.','auth/network-request-failed':'Network error. Please check your internet connection.','auth/too-many-requests':'Too many attempts. Please wait and try again.','auth/admin-restricted-operation':'Firebase is currently blocking account creation. Check Authentication settings.'})[code]||('Firebase sign-up error: '+code)}
$('form').onsubmit=async e=>{e.preventDefault();show('');const name=$('name').value.trim(),email=$('email').value.trim(),password=$('password').value,confirm=$('confirm').value;if(!name){show('Please enter your full name.');return}if(password!==confirm){show('Passwords do not match.');return}const btn=$('create');btn.disabled=true;btn.textContent='CREATING ACCOUNT…';try{const credential=await createUserWithEmailAndPassword(auth,email,password);const user=credential.user;try{await setDoc(doc(db,'users',user.uid),{uid:user.uid,name,email,role:'student',class:$('studentClass').value,classNo:Number($('studentClass').value),target:$('target').value,createdAt:new Date().toISOString(),stats:{xp:0,streak:0,questions:0,correct:0,accuracy:0}},{merge:true});show('Account created successfully. Opening SkillUp Home…','success');setTimeout(()=>location.href='student-dashboard.html',500)}catch(dbError){show('Account created, but profile setup failed. You can sign in now.','error');console.error('Firestore profile error:',dbError)}}catch(error){console.error('Firebase signup error:',error);show(authMessage(error.code))}finally{btn.disabled=false;btn.textContent='CREATE ACCOUNT →'}};
</script>
</body></html>
