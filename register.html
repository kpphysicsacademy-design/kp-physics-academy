<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a31"><title>SkillUp | Create Account</title><style>:root{--navy:#071a31;--blue:#1687ff;--purple:#5b55f5;--ink:#172033;--muted:#667085;--line:#dfe7ef;--bg:#f5f8fc;--danger:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#071a31 0 46%,#eef5ff 46%);display:grid;place-items:center;padding:22px;color:var(--ink)}.card{width:min(520px,100%);background:#fff;border-radius:25px;padding:38px;box-shadow:0 30px 70px #071a3130}.logo{text-align:center;color:var(--blue);font-size:25px;font-weight:950}.sub{text-align:center;color:var(--muted);font-size:12px;margin:7px 0 25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:10px;font-weight:900;margin-bottom:7px}.input,.select{width:100%;height:46px;border:1.5px solid var(--line);border-radius:11px;padding:0 12px;font-size:13px;outline:0;background:#fbfdff}.input:focus,.select:focus{border-color:var(--blue);box-shadow:0 0 0 4px #1687ff12}.btn{width:100%;height:48px;border:0;border-radius:12px;background:linear-gradient(135deg,#1687ff,#423de8);color:#fff;font-weight:950;cursor:pointer;margin-top:6px}.msg{text-align:center;min-height:18px;font-size:10px;font-weight:800;margin-top:10px;color:var(--danger)}.terms{font-size:9px;color:var(--muted);line-height:1.5;margin:12px 0;text-align:center}.login{text-align:center;font-size:10px;color:var(--muted);margin-top:18px}.login a{color:var(--blue);font-weight:900;text-decoration:none}@media(max-width:520px){body{padding:0;background:var(--bg)}.card{min-height:100vh;border-radius:0;padding:28px 22px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><main class="card"><div class="logo">⚛️ SkillUp</div><div class="sub">Create your personal learning profile</div><form id="form"><div class="grid"><div class="field"><label>FULL NAME</label><input id="name" class="input" autocomplete="name" required placeholder="Your name"></div><div class="field"><label>EMAIL ADDRESS</label><input id="email" class="input" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label>CLASS</label><select id="studentClass" class="select"><option value="6">Class 6</option><option value="7">Class 7</option><option value="8">Class 8</option><option value="9">Class 9</option><option value="10">Class 10</option><option value="11">Class 11</option><option value="12" selected>Class 12</option></select></div><div class="field"><label>TARGET</label><select id="target" class="select"><option value="School Physics">School Physics</option><option value="JEE">JEE</option><option value="NEET">NEET</option><option value="Other">Other</option></select></div><div class="field full"><label>PASSWORD</label><input id="password" class="input" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"></div><div class="field full"><label>CONFIRM PASSWORD</label><input id="confirm" class="input" type="password" autocomplete="new-password" minlength="6" required placeholder="Re-enter password"></div></div><div class="terms">Your password is handled by Firebase Authentication. Your profile information is stored separately in Firestore for personal progress tracking.</div><button id="create" class="btn">Create Account</button></form><div id="msg" class="msg" aria-live="polite"></div><div class="login">Already have an account? <a href="login.html">Sign in</a></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,createUserWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),msg=(t)=>{$('msg').textContent=t};$('form').onsubmit=async e=>{e.preventDefault();msg('');const name=$('name').value.trim(),email=$('email').value.trim(),password=$('password').value,confirm=$('confirm').value;if(password!==confirm){msg('Passwords do not match.');return}$('create').disabled=true;$('create').textContent='Creating…';try{const c=await createUserWithEmailAndPassword(auth,email,password);await setDoc(doc(db,'users',c.user.uid),{uid:c.user.uid,name,email,role:'student',class:$('studentClass').value,target:$('target').value,createdAt:new Date().toISOString(),stats:{xp:0,streak:0,questions:0,correct:0,accuracy:0}}, {merge:true});location.href='student-dashboard.html'}catch(e){const m={'auth/email-already-in-use':'An account already exists for this email.','auth/weak-password':'Choose a stronger password.','auth/invalid-email':'Enter a valid email address.'};msg(m[e.code]||'Could not create the account. Please try again.')}finally{$('create').disabled=false;$('create').textContent='Create Account'}};</script></body></html>
