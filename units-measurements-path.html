alysis in Modern Physics'];function render(){let out='';concepts.forEach((x,i)=>{const done=+localStorage.getItem('kp_child_'+x)||0;const current=i===0&&!done;out+=`<div class="unit"><div class="node ${done?'done':''} ${current?'current':''}"><div class="icon">${done?'🏆':current?'🚀':'📏'}</div><h3>${i+1}. ${x}</h3><p>${done?'Keep going — child concepts mastered: '+done:'Child concepts • Learn → Practice → Master'}</p><span class="tag">${done?'MASTERED / IN PROGRESS':current?'START HERE':'LOCKED AFTER PREVIOUS SKILL'}</span><br><button onclick="openConcept(${i})">${done?'Continue →':current?'Start Lesson →':'Preview Path →'}</button></div></div>`});document.getElementById('content').innerHTML=out;const total=concepts.reduce((s,x)=>s+(+localStorage.getItem('kp_child_'+x)||0),0);const pct=Math.min(100,Math.round(total/300*100));document.getElementById('xp').textContent=total*10;document.getElementById('streak').textContent=localStorage.getItem('kp_streak')||0;document.getElementById('progress').textContent=`31 sub-topics • ${total} child concepts mastered so far`;document.getElementById('bar').style.width=pct+'%';document.getElementById('pct').textContent=pct+'%'}function openConcept(i){location.href='units-measurements-child-path.html?topic='+encodeURIComponent(concepts[i])}render();</script></body></html>
