<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Create Account</title><style>:root{--navy:#10213b;--blue:#2d7ff9;--green:#58cc02;--ink:#172033;--muted:#697386;--line:#dbe3ec;--bg:#f6f8fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#f6f8fb,#eef5ff);font-family:Inter,system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;padding:18px}.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:25px 22px;box-shadow:0 16px 45px #10213b18}.brand{text-align:center}.logo{font-size:42px}.brand h1{margin:2px 0;font-size:24px;letter-spacing:1px}.brand small{color:var(--blue);font-size:8px;letter-spacing:2px;font-weight:900}.brand p{color:var(--muted);font-size:11px;margin:14px 0 20px}.field{margin:11px 0}.field label{display:block;font-size:10px;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;padding:12px 13px;border:2px solid var(--line);border-radius:12px;font-size:13px;outline:0;background:#fff}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2d7ff918}.pass{position:relative}.pass input{padding-right:45px}.eye{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:18px;cursor:pointer}.terms{display:flex;gap:8px;align-items:flex-start;font-size:9px;color:var(--muted);margin:14px 0}.terms input{accent-color:var(--blue);margin-top:1px}.terms a{color:var(--blue);font-weight:800}.create{width:100%;border:0;border-radius:13px;padding:13px;background:var(--green);color:#fff;font-size:12px;font-weight:950;box-shadow:0 4px 0 #46a800;cursor:pointer}.create:active{transform:translateY(2px);box-shadow:0 2px 0 #46a800}.or{display:flex;align-items:center;gap:8px;color:#9aa4b2;font-size:9px;margin:18px 0}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}.google{width:100%;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:11px;font-weight:900;cursor:pointer}.login{text-align:center;font-size:10px;color:var(--muted);margin:18px 0 0}.login a{color:var(--blue);font-weight:950}.note{text-align:center;font-size:8px;color:#9aa4b2;margin-top:14px;line-height:1.4}.error{display:none;background:#fff0f0;color:#c62d2d;border:1px solid #ffcaca;border-radius:10px;padding:8px;font-size:9px;margin:8px 0}.success{display:none;background:#effbe8;color:#328500;border:1px solid #bde99d;border-radius:10px;padding:8px;font-size:9px;margin:8px 0}@media(max-width:480px){body{padding:10px}.card{padding:21px 17px;border-radius:22px}}
</style></head><body><main class="card"><section class="brand"><div class="logo">📐</div><h1>SKILLUP</h1><small>MASTER EVERY SUBJECT</small><p>Create your account and start your learning journey.</p></section><div id="error" class="error"></div><div id="success" class="success"></div><form id="form"><div class="field"><label>👤 FULL NAME</label><input id="name" type="text" placeholder="Enter your full name" autocomplete="name" required></div><div class="field"><label>📧 EMAIL ADDRESS</label><input id="email" type="email" placeholder="Enter your email" autocomplete="email" required></div><div class="field"><label>📱 MOBILE NUMBER</label><input id="mobile" type="tel" placeholder="+91 XXXXX XXXXX" autocomplete="tel" pattern="[+0-9 ()-]{10,}" required></div><div class="field"><label>🎯 TARGET</label><select id="target" required><option value="" selected disabled>Select your goal</option><option>NEET</option><option>JEE</option><option>School</option><option>Other</option></select></div><div class="field pass"><label>🔒 PASSWORD</label><input id="password" type="password" placeholder="Create a password" autocomplete="new-password" minlength="8" required><button class="eye" type="button" onclick="toggle('password',this)">👁</button></div><div class="field pass"><label>🔒 CONFIRM PASSWORD</label><input id="confirm" type="password" placeholder="Confirm your password" autocomplete="new-password" minlength="8" required><button class="eye" type="button" onclick="toggle('confirm',this)">👁</button></div><label class="terms"><input id="terms" type="checkbox" required><span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</span></label><button class="create" type="submit">CREATE ACCOUNT →</button></form><div class="or">OR</div><button class="google" type="button" onclick="googleLogin()">🔵 Continue with Google</button><div class="login">Already have an account? <a href="login.html">LOGIN</a></div><div class="note">Your password should be handled by your authentication provider. Do not store passwords in GitHub files.</div></main><script>const form=document.getElementById('form'),error=document.getElementById('error'),success=document.getElementById('success');function toggle(id,b){const x=document.getElementById(id);x.type=x.type==='password'?'text':'password';b.textContent=x.type==='password'?'👁':'🙈'}form.addEventListener('submit',e=>{e.preventDefault();error.style.display='none';success.style.display='none';const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p!==c){error.textContent='Passwords do not match.';error.style.display='block';return}if(p.length<8){error.textContent='Password must contain at least 8 characters.';error.style.display='block';return}success.textContent='Details validated. Connect this button to Firebase Authentication in FlutterFlow to create the account securely.';success.style.display='block'});function googleLogin(){alert('Connect Google Sign-In through Firebase Authentication / FlutterFlow.')}</script></body></html>
