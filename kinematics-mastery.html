<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinematics Final Mastery | KP Physics Academy</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#243238}.top{background:#fff;border-bottom:2px solid #eee;padding:14px 18px;display:flex;justify-content:space-between;position:sticky;top:0}.top a{color:#1687ff;font-weight:800;text-decoration:none}.wrap{max-width:700px;margin:auto;padding:24px 16px 80px}.hero{text-align:center}.hero h1{font-size:29px;margin:8px}.muted{color:#68757b;line-height:1.55}.stats{display:flex;justify-content:center;gap:18px;font-weight:800;margin:16px}.card{background:#fff;border:2px solid #e5e5e5;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 3px 0 #ddd}.q{font-size:19px;font-weight:800;line-height:1.45}.opt{width:100%;display:block;text-align:left;padding:14px;margin:10px 0;border:2px solid #e1e5e7;border-radius:13px;background:#fff;font-size:16px;cursor:pointer}.correct{border-color:#58cc02!important;background:#efffe8!important}.wrong{border-color:#ff4b4b!important;background:#fff1f1!important}.feedback{font-weight:800;line-height:1.5;margin-top:14px}.btn{display:block;width:100%;padding:14px;border:0;border-radius:13px;background:#58cc02;color:#fff;font-weight:900;text-decoration:none;text-align:center;margin-top:12px;box-shadow:0 3px 0 #46a800;cursor:pointer}.secondary{background:#fff;color:#1687ff;border:2px solid #1687ff;box-shadow:none}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#fff3d6;color:#9a6900;font-size:12px;font-weight:900}.result{display:none;text-align:center}.score{font-size:40px;font-weight:900}.rank{font-size:22px;font-weight:900}</style></head><body><header class="top"><a href="kinematics-path.html">← Kinematics</a><a href="app.html">⚡ App</a></header><main class="wrap"><section class="hero"><div class="badge">🏆 FINAL MASTERY TEST</div><h1>🎓 Kinematics Mastery</h1><p class="muted">12 mixed JEE-style questions • No XP until the final result</p><div class="stats"><span>⭐ <b id="xp">0</b> XP</span><span>❤️ <b id="hearts">5</b></span></div></section><div id="quiz"></div><section id="result" class="card result"></section><a class="btn secondary" href="kinematics-path.html">Back to Kinematics Path</a></main><script>const qs=[['A body travels 3 m east and 4 m north. Its displacement magnitude is:',['1 m','5 m','7 m','12 m'],1,'√(3²+4²)=5 m.'],['A car changes velocity from 10 m/s to 30 m/s in 5 s. Its acceleration is:',['2 m/s²','4 m/s²','5 m/s²','6 m/s²'],1,'a=(30−10)/5=4 m/s².'],['The area under a velocity-time graph represents:',['Acceleration','Displacement','Velocity','Jerk'],1,'The signed area under v-t gives displacement.'],['For constant acceleration, which relation is correct?',['v=u+at','v=u+a/t','v=u−at always','v=at/u'],0,'The first equation of motion is v=u+at.'],['Car A moves east at 20 m/s and B east at 12 m/s. A relative to B is:',['8 m/s east','8 m/s west','32 m/s east','32 m/s west'],0,'20−12=8 m/s east.'],['A projectile is launched at 45° on level ground. Its range is maximum for a fixed launch speed because:',['sin45°=0','sin90°=1','cos45°=0','g=0'],1,'R=u²sin2θ/g, and sin90°=1.'],['A particle has velocity components 6 m/s and 8 m/s. Its speed is:',['2 m/s','10 m/s','14 m/s','48 m/s'],1,'√(6²+8²)=10 m/s.'],['An object has constant velocity. Its acceleration is:',['Zero','g','Constant non-zero','Infinite'],0,'Velocity is not changing, so acceleration is zero.'],['A runner completes a 400 m lap and returns to the start. Its displacement is:',['0 m','200 m','400 m','800 m'],0,'Initial and final positions coincide.'],['A body starts from rest with a=2 m/s² for 5 s. Distance travelled is:',['5 m','10 m','25 m','50 m'],2,'s=½at²=½×2×25=25 m.'],['A boat has perpendicular velocities 5 m/s north and 3 m/s east. Ground speed is:',['2 m/s','4 m/s','√34 m/s','8 m/s'],2,'Resultant speed = √(25+9)=√34 m/s.'],['A body thrown vertically upward has acceleration at its highest point:',['Zero','g downward','g upward','Infinite'],1,'Gravity continues to act downward even when velocity is zero.']];let i=0,score=0,answered=false;function saved(){try{return JSON.parse(localStorage.getItem('kpPhysicsAppProgress')||'{}')}catch(e){return {}}}function stats(){const s=saved();xp.textContent=s.xp||0;hearts.textContent=s.hearts??5}function render(){const x=qs[i];quiz.innerHTML='<section class="card"><div class="badge">QUESTION '+(i+1)+' / '+qs.length+'</div><p class="q">'+x[0]+'</p>'+x[1].map((v,j)=>'<button class="opt" onclick="answer('+j+')">'+String.fromCharCode(65+j)+'. '+v+'</button>').join('')+'<div id="feedback" class="feedback"></div></section>';stats()}function answer(j){if(answered)return;answered=true;const x=qs[i],b=document.querySelectorAll('.opt');if(j===x[2]){score++;b[j].classList.add('correct');feedback.innerHTML='✅ Correct!<br>'+x[3]}else{b[j].classList.add('wrong');b[x[2]].classList.add('correct');feedback.innerHTML='❌ Incorrect.<br>'+x[3]}setTimeout(()=>{if(i<qs.length-1){i++;answered=false;render()}else finish()},650)}function finish(){quiz.innerHTML='';const pct=Math.round(score/qs.length*100);let rank=pct>=90?'🏆 Kinematics Master':pct>=75?'🥇 Advanced':pct>=60?'🥈 Proficient':'📚 Keep Practising';const s=saved();if(pct>=75)s.xp=Number(s.xp||0)+100;localStorage.setItem('kpPhysicsAppProgress',JSON.stringify(s));localStorage.setItem('kp_kinematics_mastery_score',String(score));result.style.display='block';result.innerHTML='<div class="score">'+score+'/'+qs.length+'</div><p class="rank">'+rank+'</p><p class="muted">Final score: '+pct+'%</p><p>'+(pct>=75?'⭐ +100 XP earned':'Complete the lessons again and retake the mastery test.')+'</p><a class="btn" href="kinematics-path.html">Return to Kinematics Path</a>';stats()}render();</script></body></html>
