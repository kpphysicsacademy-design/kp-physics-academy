</style></head><body><main class="app"><header class="top"><button class="back" onclick="history.back()">←</button><div><h1>Chapter Progress</h1><p>Your progress is updated from Chapter Test results</p></div></header><section class="hero"><small id="meta">CLASS 6 • SCIENCE</small><h2 id="chapter">The Wonderful World of Science</h2></section><section class="scoreCard"><div class="ring" id="ring"><div class="ringIn"><div><b id="percent">0%</b><br><small>Best Score</small></div></div></div><span class="status" id="status">Not Tested</span><p id="message">Complete the Chapter Test to update your progress.</p><div class="stats"><div class="stat"><b id="score">—</b><small>Best Score</small></div><div class="stat"><b id="attempts">0</b><small>Attempts</small></div><div class="stat"><b id="progress">0%</b><small>Progress</small></div></div></section><section class="section"><h3>Learning Progress</h3><div class="barRow"><span>Flashcards</span><span id="flash">0%</span></div><div class="track"><div class="fill" id="flashBar" style="width:0%"></div></div><div class="barRow"><span>Practice</span><span id="practice">0%</span></div><div class="track"><div class="fill" id="practiceBar" style="width:0%"></div></div><div class="barRow"><span>Chapter Test</span><span id="test">0%</span></div><div class="track"><div class="fill" id="testBar" style="width:0%"></div></div></section><button class="next" onclick="goTest()">🎯 Take / Retake Chapter Test</button><button class="reset" onclick="clearProgress()">Reset Demo Progress</button></main><script>
const p=new URLSearchParams(location.search),cls=p.get('class')||'6',sub=p.get('subject')||'science',ch=p.get('chapter')||'1',title=p.get('title')||'The Wonderful World of Science';const key='skillup_progress_'+cls+'_'+sub+'_'+ch;const $=x=>document.getElementById(x);$('meta').textContent='CLASS '+cls+' • '+sub.toUpperCase();$('chapter').textContent=title;
function level(pc){if(pc>=90)return['🏆 Chapter Mastered','Excellent! You have mastered this chapter.'];if(pc>=80)return['🟢 Very Good','Strong performance. Review weak areas and aim for mastery.'];if(pc>=60)return['🟡 Good Progress','Good progress. More practice can improve your score.'];if(pc>=40)return['🟠 Learning','Keep practising the concepts before your next test.'];return['🔴 Needs Improvement','Review the chapter and practise before retaking the test.']}
function render(){let d=JSON.parse(localStorage.getItem(key)||'null')||{best:0,score:0,total:20,attempts:0,flash:0,practice:0};let pc=Math.round(d.best||0);let l=level(pc);$('percent').textContent=pc+'%';$('progress').textContent=pc+'%';$('ring').style.setProperty('--p',pc+'%');$('status').textContent=d.attempts?l[0]:'Not Tested';$('message').textContent=d.attempts?l[1]:'Complete the Chapter Test to update your progress.';$('score').textContent=d.attempts?(d.score+'/'+d.total):'—';$('attempts').textContent=d.attempts||0;$('flash').textContent=(d.flash||0)+'%';$('practice').textContent=(d.practice||0)+'%';$('test').textContent=pc+'%';$('flashBar').style.width=(d.flash||0)+'%';$('practiceBar').style.width=(d.practice||0)+'%';$('testBar').style.width=pc+'%'}
function goTest(){location.href='chapter-test.html?class='+cls+'&subject='+sub+'&chapter='+ch+'&title='+encodeURIComponent(title)}function clearProgress(){localStorage.removeItem(key);render()}render();
</script></body></html>
