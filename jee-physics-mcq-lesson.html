<script>
const qs=[
['Physical Quantities','A student says a table is 2. What is missing?',['A. Nothing','B. The unit','C. The formula','D. The graph'],1,'A physical quantity must include a numerical value and an appropriate unit.'],
['SI System of Units','A force is measured in which SI unit?',['A. kg','B. N','C. J','D. W'],1,'The SI unit of force is the newton (N).'],
['Other Systems of Units','Which is a CGS unit of force?',['A. Newton','B. Joule','C. Dyne','D. Watt'],2,'Dyne is the CGS unit of force.'],
['Dimensions of Physical Quantities','What are the dimensions of velocity?',['A. [LT⁻¹]','B. [LT⁻²]','C. [MLT⁻²]','D. [ML²T⁻²]'],0,'Velocity = displacement/time, hence [LT⁻¹].'],
['Dimensional Formula','If v = s/t, what is [v]?',['A. [L]','B. [LT⁻¹]','C. [LT⁻²]','D. [T⁻¹]'],1,'Dividing length by time gives [LT⁻¹].'],
['Common Dimensional Formulae','Which has dimensions [ML²T⁻²]?',['A. Momentum','B. Force','C. Energy','D. Power'],2,'Work and energy have dimensions [ML²T⁻²].'],
['Dimensional Homogeneity','Can quantities with different dimensions be added directly?',['A. Yes','B. No','C. Only in SI','D. Only in CGS'],1,'Terms added in a physical equation must have identical dimensions.'],
['Dimensional Analysis','What is a main use of dimensional analysis?',['A. Checking dimensional consistency','B. Measuring temperature','C. Drawing vectors','D. Finding colour'],0,'Dimensional analysis checks dimensional consistency and can help derive relations.'],
['Deriving Relations Using Dimensions','For a pendulum period, dimensional analysis can determine dependence on l and g up to what?',['A. A dimensionless constant','B. Charge','C. Density only','D. Temperature only'],0,'The numerical dimensionless constant cannot be obtained by dimensional analysis alone.'],
['Limitations of Dimensional Analysis','Can dimensional analysis determine 2π exactly?',['A. Yes','B. No','C. Only in SI','D. Always'],1,'Dimensionless numerical constants are a limitation of dimensional analysis.'],
['Conversion of Units','How many metres are 2 km?',['A. 20 m','B. 200 m','C. 2000 m','D. 20000 m'],2,'2 km = 2000 m.'],
['Conversion Using Dimensions','If 1 km = 10³ m, then 1 km/h equals?',['A. 1/3.6 m/s','B. 3.6 m/s','C. 36 m/s','D. 3600 m/s'],0,'1 km/h = 1000/3600 m/s = 1/3.6 m/s.'],
['Orders of Magnitude','The order of magnitude of 7×10⁴ is closest to?',['A. 10³','B. 10⁴','C. 10⁵','D. 10⁶'],2,'7×10⁴ is closer to 10⁵ on the order-of-magnitude scale.'],
['Accuracy and Precision','Repeated readings close to each other but far from the true value are?',['A. Accurate only','B. Precise but inaccurate','C. Neither','D. Impossible'],1,'Precision means repeatability; accuracy means closeness to the true value.'],
['Significant Figures','How many significant figures are in 0.00450?',['A. 2','B. 3','C. 4','D. 5'],1,'The significant digits are 4, 5 and the trailing zero: 3 significant figures.'],
['Operations with Significant Figures','For multiplication, the final answer is limited by the factor with?',['A. Most decimal places','B. Least significant figures','C. Largest value','D. Smallest unit'],1,'Multiplication and division use the least-significant-figures rule.'],
['Types of Errors','A zero-offset that remains in repeated readings is mainly?',['A. Systematic error','B. Random error','C. No error','D. Rounding only'],0,'A persistent zero offset is a systematic instrumental error.'],
['Absolute Error','If xi = 10.2 and x̄ = 10.0, the absolute error is?',['A. 0.02','B. 0.2','C. 2','D. 20'],1,'Absolute deviation = |10.2 − 10.0| = 0.2.'],
['Relative Error','If Δx/x = 0.02, percentage error is?',['A. 0.2%','B. 2%','C. 20%','D. 200%'],1,'Percentage error = 0.02 × 100 = 2%.'],
['Propagation of Errors','For z = xy, the maximum fractional error is?',['A. Δx + Δy','B. Δx/x + Δy/y','C. Δx/x − Δy/y','D. xy'],1,'For a product, fractional errors add in the maximum-error treatment.'],
['Errors in Derived Quantities','For A = l², fractional error in A is approximately?',['A. Δl/l','B. 2Δl/l','C. Δl²/l²','D. 0'],1,'For A = l², ΔA/A ≈ 2Δl/l.'],
['Least Count','A ruler marked every 1 mm has a least count of?',['A. 1 mm','B. 1 cm','C. 0.1 m','D. 10 mm'],0,'The smallest directly measurable division is 1 mm.'],
['Vernier Calipers','A vernier caliper is especially useful for measuring?',['A. Internal diameter','B. Temperature','C. Electric current','D. Time period only'],0,'Vernier calipers can measure internal and external dimensions and depth.'],
['Screw Gauge','A screw gauge is commonly used to measure?',['A. Wire diameter','B. Room temperature','C. Mass of a planet','D. Sound frequency directly'],0,'A screw gauge measures very small lengths such as wire diameter.'],
['Zero Error and Zero Correction','If zero error is +0.02 cm, zero correction is?',['A. +0.02 cm','B. −0.02 cm','C. 0.02 m','D. Cannot be defined'],1,'Zero correction has the opposite sign to zero error.'],
['Graphical Measurement and Experimental Analysis','In a straight-line graph y = mx + c, m represents?',['A. Intercept','B. Slope','C. Area','D. Error only'],1,'m is the slope and c is the y-intercept.'],
['Dimensionless Quantities','Which is dimensionless?',['A. Strain','B. Force','C. Energy','D. Momentum'],0,'Strain is a ratio of two lengths, so it is dimensionless.'],
['Dimensionless Constants','Which cannot be obtained by dimensional analysis alone?',['A. Dimensions of force','B. Dimensions of energy','C. The numerical value of π','D. Dimensions of velocity'],2,'Dimensional analysis cannot determine dimensionless numerical constants.'],
['Dimensional Analysis in Mechanics','If x = at² and x is displacement, the dimensions of a are?',['A. [LT⁻¹]','B. [LT⁻²]','C. [L²T⁻²]','D. [T⁻²]'],1,'a = x/t², hence [a] = [LT⁻²].'],
['Dimensional Analysis in Electricity','What are the dimensions of electric charge?',['A. [AT]','B. [A/T]','C. [MLT⁻¹]','D. [ML²T⁻²]'],0,'Charge Q = current × time, so [Q] = [AT].'],
['Dimensional Analysis in Modern Physics','The dimensions of Planck constant h are?',['A. [ML²T⁻¹]','B. [MLT⁻²]','C. [ML²T⁻²]','D. [LT⁻¹]'],0,'From E = hν, h = E/ν = energy × time = [ML²T⁻¹].']
];
let i=Math.max(0,Math.min(qs.length-1,parseInt(new URLSearchParams(location.search).get('sub')||'0',10)||0));let answered=false;
const topic=document.getElementById('topic'),question=document.getElementById('question'),options=document.getElementById('options'),feedback=document.getElementById('feedback'),next=document.getElementById('next');
function render(){const q=qs[i];answered=false;topic.textContent=`SUB-CONCEPT ${i+1} OF ${qs.length} • ${q[0]}`;question.textContent=q[1];options.innerHTML=q[2].map((o,n)=>`<button onclick="answer(${n})">${o}</button>`).join('');feedback.className='feedback';feedback.textContent='';next.disabled=true;next.textContent=i===qs.length-1?'Finish Unit →':'Next MCQ →';document.getElementById('count').textContent=i+1;document.getElementById('prog').style.width=((i+1)/qs.length*100)+'%';document.getElementById('xp').textContent=localStorage.getItem('kp_units_xp')||0;document.getElementById('streak').textContent=localStorage.getItem('kp_streak')||0}
function answer(choice){if(answered)return;answered=true;const q=qs[i],buttons=[...options.children];buttons.forEach(b=>b.disabled=true);if(choice===q[3]){buttons[choice].classList.add('correct');feedback.className='feedback show correct';feedback.innerHTML=`<b>✓ Correct!</b><br>${q[4]}`;localStorage.setItem('kp_units_xp',(+localStorage.getItem('kp_units_xp')||0)+10)}else{buttons[choice].classList.add('wrong');buttons[q[3]].classList.add('correct');feedback.className='feedback show wrong';feedback.innerHTML=`<b>✗ Correction</b><br><b>Correct answer: ${q[2][q[3]]}</b><br>${q[4]}`}next.disabled=false;document.getElementById('xp').textContent=localStorage.getItem('kp_units_xp')||0}
next.onclick=()=>{if(!answered)return;if(i<qs.length-1){i++;history.replaceState(null,'',`jee-physics-mcq-lesson.html?unit=units-measurements&sub=${i}`);render()}else{localStorage.setItem('kp_units_completed',31);document.getElementById('quizCard').style.display='none';document.getElementById('completion').classList.add('show');document.getElementById('prog').style.width='100%'}};
render();
</script></body></html>
