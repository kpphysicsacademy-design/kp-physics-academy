*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f9fd;color:#10213a}.top{background:#071a31;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:bold}.wrap{max-width:850px;margin:auto;padding:35px 18px 80px}.eyebrow{text-align:center;color:#1687ff;font-weight:800;font-size:13px}.title{text-align:center;font-size:34px;margin:10px 0}.sub{text-align:center;color:#718096}.progress{height:9px;background:#e4ebf3;border-radius:20px;overflow:hidden;margin:22px 0}.progress i{display:block;height:100%;background:#20b56b;width:3%;border-radius:20px}.card{background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:28px;margin-top:20px;box-shadow:0 7px 22px #0000000b}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#e9f7ef;color:#138650;font-size:11px;font-weight:800}.question{font-size:21px;font-weight:700;line-height:1.5;margin:20px 0}.option{display:block;width:100%;margin:11px 0;padding:15px;border:1px solid #d6dfeb;background:#fff;border-radius:11px;text-align:left;font-size:16px;cursor:pointer}.option:hover{border-color:#1687ff;background:#f7fbff}.option:disabled{cursor:default}.feedback{margin-top:20px;padding:16px;border-radius:12px;line-height:1.55}.correct{background:#e9f7ef;border:1px solid #9bd6b5}.wrong{background:#fff1f1;border:1px solid #efb1b1}.correction-title{font-weight:800;font-size:17px;margin-bottom:7px}.next,.back{width:100%;padding:14px;border:0;border-radius:11px;font-weight:800;cursor:pointer;margin-top:14px}.next{background:#1687ff;color:#fff}.back{background:#e8eef5;color:#10213a}.hidden{display:none}.score{text-align:center;color:#718096;font-size:14px}@media(max-width:600px){.title{font-size:28px}.question{font-size:18px}}

<body>
<header class="top"><a href="units-measurements-path.html">← Units & Measurements</a><a href="index.html">Home</a></header>
<main class="wrap">
<div class="eyebrow">JEE PHYSICS • UNITS & MEASUREMENTS</div>
<h1 class="title" id="title"></h1><p class="sub">MCQ only • Answer → Correction → Next</p>
<div class="progress"><i id="bar"></i></div><p class="score" id="score"></p>
<section class="card"><span class="badge" id="badge"></span><div class="question" id="question"></div><div id="options"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="next hidden" onclick="nextQuestion()">Next MCQ →</button><button class="back" onclick="location.href='units-measurements-path.html'">← Back to Units & Measurements</button></section>
</main>
<script>
const qs=[
['Physical Quantities','A student says the length of a table is 2. What is missing?',['A. Nothing','B. The unit','C. The formula','D. The graph'],1,'A physical measurement must include a numerical value and a unit.'],
['SI System of Units','Which is the SI unit of force?',['A. kg','B. N','C. J','D. W'],1,'Force is measured in newtons (N).'],
['Other Systems of Units','Which is a CGS unit of force?',['A. Newton','B. Joule','C. Dyne','D. Watt'],2,'The dyne is the CGS unit of force.'],
['Dimensions of Physical Quantities','What are the dimensions of velocity?',['A. [LT⁻¹]','B. [LT⁻²]','C. [MLT⁻²]','D. [ML²T⁻²]'],0,'Velocity = displacement/time, so its dimensions are [LT⁻¹].'],
['Dimensional Formula','If v = s/t, what is the dimensional formula of v?',['A. [L]','B. [LT⁻¹]','C. [LT⁻²]','D. [T⁻¹]'],1,'Dividing length by time gives [LT⁻¹].'],
['Common Dimensional Formulae','Which quantity has dimensions [ML²T⁻²]?',['A. Momentum','B. Force','C. Energy','D. Power'],2,'Work and energy have dimensions [ML²T⁻²].'],
['Dimensional Homogeneity','Can quantities having different dimensions be added directly?',['A. Yes','B. No','C. Only in SI','D. Only in CGS'],1,'Terms being added must have the same dimensions.'],
['Dimensional Analysis','What is a major use of dimensional analysis?',['A. Checking dimensional consistency','B. Measuring temperature','C. Drawing vectors','D. Finding colour'],0,'Dimensional analysis is commonly used to test dimensional consistency and derive relations.'],
['Deriving Relations Using Dimensions','Dimensional analysis can determine a relation only up to what?',['A. A dimensionless constant','B. Charge','C. Density only','D. Temperature only'],0,'Dimensionless numerical constants cannot be obtained from dimensions alone.'],
['Limitations of Dimensional Analysis','Can dimensional analysis determine the numerical value of 2π?',['A. Yes','B. No','C. Only in SI','D. Always'],1,'Dimensional analysis cannot determine dimensionless numerical constants such as 2π.'],
['Conversion of Units','How many metres are equal to 2 km?',['A. 20 m','B. 200 m','C. 2000 m','D. 20000 m'],2,'1 km = 1000 m, so 2 km = 2000 m.'],
['Conversion Using Dimensions','1 km/h is equal to approximately:',['A. 1/3.6 m/s','B. 3.6 m/s','C. 36 m/s','D. 3600 m/s'],0,'1 km/h = 1000/3600 m/s = 1/3.6 m/s.'],
['Orders of Magnitude','The order of magnitude of 7 × 10⁴ is closest to:',['A. 10³','B. 10⁴','C. 10⁵','D. 10⁶'],2,'Since 7 is greater than √10, 7 × 10⁴ is closer to 10⁵.'],
['Accuracy and Precision','Repeated readings are close to one another but far from the true value. They are:',['A. Accurate only','B. Precise but inaccurate','C. Neither','D. Impossible'],1,'Precision means repeatability; accuracy means closeness to the true value.'],
['Significant Figures','How many significant figures are in 0.00450?',['A. 2','B. 3','C. 4','D. 5'],1,'Leading zeros are not significant; 4, 5 and the trailing zero are significant.'],
['Operations with Significant Figures','For multiplication, the final answer is generally limited by the factor having the:',['A. Most decimal places','B. Least significant figures','C. Largest value','D. Smallest unit'],1,'Multiplication and division use the least number of significant figures.'],
['Types of Errors','A zero-offset that remains in repeated measurements is mainly a:',['A. Systematic error','B. Random error','C. No error','D. Rounding error'],0,'A consistent instrumental offset is a systematic error.'],
['Absolute Error','If a measured value is 10.2 and the reference value is 10.0, the absolute error is:',['A. 0.02','B. 0.2','C. 2','D. 20'],1,'Absolute error = |10.2 − 10.0| = 0.2.'],
['Relative Error','If Δx/x = 0.02, the percentage error is:',['A. 0.2%','B. 2%','C. 20%','D. 200%'],1,'Percentage error = relative error × 100 = 2%.'],
['Propagation of Errors','For z = xy, the maximum fractional error is:',['A. Δx + Δy','B. Δx/x + Δy/y','C. Δx/x − Δy/y','D. xy'],1,'For a product, fractional errors add in the maximum-error approximation.'],
['Errors in Derived Quantities','If A = l², the approximate fractional error in A is:',['A. Δl/l','B. 2Δl/l','C. Δl²/l²','D. 0'],1,'For A = l², ΔA/A ≈ 2Δl/l.'],
['Least Count','A ruler marked in 1 mm divisions has a least count of:',['A. 1 mm','B. 1 cm','C. 0.1 m','D. 10 mm'],0,'The smallest directly readable division is 1 mm.'],
['Vernier Calipers','A vernier caliper can be used to measure:',['A. Internal diameter','B. Temperature','C. Electric current','D. Time period'],0,'Vernier calipers can measure external and internal dimensions and depth.'],
['Screw Gauge','A screw gauge is commonly used to measure:',['A. Wire diameter','B. Room temperature','C. Mass of a planet','D. Sound frequency directly'],0,'A screw gauge is suitable for very small dimensions such as wire diameter.'],
['Zero Error and Zero Correction','If the zero error is +0.02 cm, the zero correction is:',['A. +0.02 cm','B. −0.02 cm','C. +0.20 cm','D. Cannot be defined'],1,'Zero correction has the opposite sign to zero error.'],
['Graphical Measurement and Experimental Analysis','In y = mx + c, m represents the:',['A. Intercept','B. Slope','C. Area','D. Error'],1,'The coefficient m is the slope of the straight-line graph.'],
['Dimensionless Quantities','Which quantity is dimensionless?',['A. Strain','B. Force','C. Energy','D. Momentum'],0,'Strain is a ratio of two lengths, so its dimensions cancel.'],
['Dimensionless Constants','Which cannot be determined by dimensional analysis alone?',['A. Dimensions of force','B. Dimensions of velocity','C. Numerical value of π','D. Dimensions of energy'],2,'Dimensionless numerical constants cannot be obtained by dimensional analysis alone.'],
['Dimensional Analysis in Mechanics','If x = at² and x is displacement, the dimensions of a are:',['A. [LT⁻¹]','B. [LT⁻²]','C. [L²T⁻²]','D. [T⁻²]'],1,'a = x/t², hence [a] = [LT⁻²].'],
['Dimensional Analysis in Electricity','What are the dimensions of electric charge?',['A. [AT]','B. [A/T]','C. [MLT⁻¹]','D. [ML²T⁻²]'],0,'Charge Q = current × time, so [Q] = [AT].'],
['Dimensional Analysis in Modern Physics','The dimensions of Planck constant h are:',['A. [ML²T⁻¹]','B. [MLT⁻²]','C. [ML²T⁻²]','D. [LT⁻¹]'],0,'From E = hν, h = E/ν = energy × time = [ML²T⁻¹].']
];
let i=Math.max(0,Math.min(qs.length-1,parseInt(new URLSearchParams(location.search).get('sub')||'0',10)||0));let answered=false;
function render(){const q=qs[i];document.getElementById('title').textContent=q[0];document.getElementById('badge').textContent='SUB-CONCEPT '+(i+1)+' OF '+qs.length;document.getElementById('question').textContent=q[1];document.getElementById('score').textContent='Question '+(i+1)+' of '+qs.length;document.getElementById('bar').style.width=((i+1)/qs.length*100)+'%';document.getElementById('feedback').className='feedback hidden';document.getElementById('next').className='next hidden';document.getElementById('options').innerHTML=q[2].map((x,n)=>`<button class="option" onclick="answer(${n})">${x}</button>`).join('');answered=false}
function answer(n){if(answered)return;answered=true;const q=qs[i];document.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(k===q[3])b.style.borderColor='#20b56b';if(k===n&&n!==q[3])b.style.borderColor='#e05252'});const f=document.getElementById('feedback');if(n===q[3]){f.className='feedback correct';f.innerHTML='<div class="correction-title">✓ Correct!</div>'+q[4]}else{f.className='feedback wrong';f.innerHTML='<div class="correction-title">✗ Correction</div><b>Correct answer: '+q[2][q[3]]+'</b><br>'+q[4]}document.getElementById('next').className='next';localStorage.setItem('kp_last_units_sub',i)}
function nextQuestion(){if(i<qs.length-1){i++;history.replaceState(null,'','jee-physics-mcq-lesson.html?unit=units-measurements&sub='+i);render()}else{location.href='units-measurements-path.html'}}
render();
</script></body></html>
