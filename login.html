<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SkillUp | Login</title>
<style>
:root{--primary:#5b55f5;--primary2:#1687ff;--ink:#172033;--muted:#667085;--line:#dfe4ee;--bg:#f5f7ff;--danger:#b42318;--success:#087443}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:18px}.login-card{width:min(430px,100%);background:#fff;border:1px solid #e9ecf5;border-radius:24px;padding:30px 26px 24px;box-shadow:0 18px 55px rgba(34,42,90,.12)}.brand{text-align:center;margin-bottom:25px}.logo{width:58px;height:58px;margin:0 auto 12px;border-radius:18px;background:linear-gradient(135deg,#635bff,#1687ff);display:grid;place-items:center;color:#fff;font-size:28px;box-shadow:0 9px 22px rgba(91,85,245,.24)}.brand h1{font-size:27px;line-height:1;margin:0 0 7px;letter-spacing:-.7px}.brand p{margin:0;color:var(--muted);font-size:12px}.panel h2{font-size:24px;margin:0 0 6px;letter-spacing:-.5px}.sub{font-size:12px;color:var(--muted);margin:0 0 22px}.field{margin-bottom:15px}.field label{display:block;font-size:10px;font-weight:900;margin-bottom:7px;letter-spacing:.2px}.input{width:100%;height:54px;border:1.5px solid var(--line);border-radius:13px;background:#fbfcff;padding:0 14px;font-size:16px;outline:0;color:var(--ink)}.input::placeholder{color:#98a2b3}.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(91,85,245,.10);background:#fff}.passWrap{position:relative}.passWrap .input{padding-right:50px}.eye{position:absolute;right:4px;top:4px;width:44px;height:46px;border:0;background:transparent;border-radius:10px;cursor:pointer;font-size:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 17px;font-size:11px}.remember{color:var(--muted);display:flex;align-items:center;gap:7px;min-height:40px}.remember input{width:18px;height:18px;accent-color:var(--primary)}.linkBtn{border:0;background:none;color:var(--primary);font-weight:850;cursor:pointer;padding:10px 0;font-size:11px}.btn{width:100%;height:54px;border-radius:13px;font-size:15px;font-weight:900;cursor:pointer;touch-action:manipulation}.btn:disabled{opacity:.65;cursor:wait}.primary{border:0;color:#fff;background:linear-gradient(135deg,#1687ff,#5b55f5);box-shadow:0 10px 24px rgba(91,85,245,.22)}.divider{display:flex;align-items:center;gap:10px;color:#98a2b3;font-size:9px;font-weight:800;margin:18px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.google{background:#fff;border:1px solid var(--line);color:var(--ink)}.google:hover{background:#f8f9fd}.msg{min-height:20px;text-align:center;font-size:11px;font-weight:800;margin-top:10px}.msg.error{color:var(--danger)}.msg.success{color:var(--success)}.signup{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}.signup a{color:var(--primary);font-weight:900;text-decoration:none;padding:10px 2px;display:inline-block}.teacher{text-align:center;display:block;margin-top:4px;padding:9px;color:#475467;font-size:11px;font-weight:800;text-decoration:none}.back{text-align:center;margin-top:2px}.back a{color:#667085;text-decoration:none;font-size:11px;padding:9px;display:inline-block}.security{text-align:center;color:#98a2b3;font-size:8px;margin-top:6px}
@media(max-width:480px){body{padding:12px;background:var(--bg);align-items:center}.login-card{width:100%;border-radius:20px;padding:25px 20px 18px;box-shadow:0 12px 38px rgba(34,42,90,.10)}.brand{margin-bottom:22px}.logo{width:54px;height:54px;border-radius:16px;font-size:25px}.brand h1{font-size:25px}.panel h2{font-size:22px}.sub{margin-bottom:19px}.field{margin-bottom:13px}.input,.btn{height:53px}.row{margin-bottom:13px}.divider{margin:15px 0}.signup{margin-top:14px}}
@media(max-width:360px){body{padding:8px}.login-card{padding:20px 16px 14px}.brand{margin-bottom:17px}.logo{width:48px;height:48px;font-size:22px;margin-bottom:9px}.brand h1{font-size:23px}.brand p{font-size:11px}.panel h2{font-size:21px}.sub{margin-bottom:15px}.field{margin-bottom:10px}.input,.btn{height:50px}.row{margin-bottom:9px}.divider{margin:12px 0}.google{font-size:14px}.signup{margin-top:10px}.teacher,.back{padding-top:5px;padding-bottom:5px}}
</style>
</head>
<body>
<main class="login-card" aria-label="SkillUp login">
  <header class="brand"><div class="logo" aria-hidden="true">⚛️</div><h1>SkillUp</h1><p>Learn • Practice • Master</p></header>
  <section class="panel">
    <h2>Login</h2><p class="sub">Access your account and continue learning.</p>
    <div class="field"><label for="email">EMAIL ADDRESS</label><input class="input" id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com"></div>
    <div class="field"><label for="password">PASSWORD</label><div class="passWrap"><input class="input" id="password" type="password" autocomplete="current-password" placeholder="Enter your password"><button class="eye" id="eye" type="button" aria-label="Show password">👁</button></div></div>
    <div class="row"><label class="remember"><input id="remember" type="checkbox"> Remember me</label><button id="forgot" class="linkBtn" type="button">Forgot password?</button></div>
    <button id="login" class="btn primary">Login</button>
    <div class="divider">OR</div>
    <button id="google" class="btn google">🌐 &nbsp; Continue with Google</button>
    <div id="msg" class="msg" aria-live="polite"></div>
    <div class="signup">New to SkillUp? <a href="register.html">Create Student Account</a></div>
    <a class="teacher" href="teacher-login.html">👨‍🏫 Teacher / Admin Login</a>
    <div class="back"><a href="index.html">← Back to SkillUp</a></div>
    <div class="security">Secure Firebase Authentication</div>
  </section>
</main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,sendPasswordResetEmail,setPersistence,browserLocalPersistence,browserSessionPersistence}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import{getFirestore,doc,setDoc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),show=(t,c='')=>{$('msg').textContent=t;$('msg').className='msg '+c};
$('eye').onclick=()=>{const p=$('password'),showing=p.type==='password';p.type=showing?'text':'password';$('eye').textContent=showing?'🙈':'👁'};
function busy(v){$('login').disabled=v;$('google').disabled=v;$('login').textContent=v?'Signing in…':'Login'}
async function routeUser(user){const ref=doc(db,'users',user.uid),snap=await getDoc(ref);const data=snap.exists()?snap.data():{};if(!snap.exists())await setDoc(ref,{email:user.email||'',role:'student',createdAt:new Date().toISOString()},{merge:true});location.href=data.role==='teacher'?'teacher-dashboard.html':'student-dashboard.html'}
$('login').onclick=async()=>{show('');const e=$('email').value.trim(),p=$('password').value;if(!e||!p){show('Enter your email and password.','error');return}busy(true);try{await setPersistence(auth,$('remember').checked?browserLocalPersistence:browserSessionPersistence);const c=await signInWithEmailAndPassword(auth,e,p);await routeUser(c.user)}catch(err){const m={'auth/invalid-credential':'Incorrect email or password.','auth/user-not-found':'No account found for this email.','auth/wrong-password':'Incorrect password.','auth/invalid-email':'Enter a valid email address.','auth/too-many-requests':'Too many attempts. Please try again later.'};show(m[err.code]||'Unable to sign in. Please try again.','error')}finally{busy(false)}};
$('google').onclick=async()=>{show('');busy(true);try{const c=await signInWithPopup(auth,new GoogleAuthProvider());await routeUser(c.user)}catch(err){if(err.code!=='auth/popup-closed-by-user')show('Google sign-in could not be completed.','error')}finally{busy(false)}};
$('forgot').onclick=async()=>{const e=$('email').value.trim();if(!e){show('Enter your email address first.','error');return}try{await sendPasswordResetEmail(auth,e);show('Password reset email sent. Check your inbox.','success')}catch(err){show('Could not send reset email. Check the email address.','error')}};
</script>
</body>
</html>
