<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a31">
<title>SkillUp | Login</title>
<style>
:root{--navy:#071a31;--blue:#1687ff;--green:#58cc02;--ink:#172033;--muted:#667085;--line:#dfe7ef;--gold:#ffc21a;--bg:#f4f7fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
.page{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 15% 10%,#1687ff14,transparent 28%),radial-gradient(circle at 90% 90%,#58cc0210,transparent 24%),var(--bg)}
.wrap{width:min(420px,100%)}
.brand{text-align:center;margin-bottom:18px}.brand-icon{width:78px;height:78px;margin:0 auto 10px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#071a31,#0d3157);border:1px solid #294765;box-shadow:0 12px 30px #071a3125;color:#fff;font-size:38px}.brand-name{font-size:28px;font-weight:950;letter-spacing:.5px;color:var(--navy)}.brand-name span{color:var(--blue)}.tagline{margin-top:4px;color:#b87900;font-size:8px;font-weight:950;letter-spacing:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px 22px;box-shadow:0 15px 45px #17203312}.welcome{text-align:center}.welcome h1{font-size:24px;margin:0 0 7px}.welcome p{font-size:12px;color:var(--muted);margin:0 0 21px}
.field{margin-bottom:14px}.field label{display:block;font-size:10px;font-weight:900;margin-bottom:7px;color:var(--ink)}.input-wrap{position:relative}.input-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:17px}.input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;background:#fbfdff;padding:0 42px;font-size:14px;outline:0;color:var(--ink)}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1687ff14}.input::placeholder{color:#98a2b3}.eye{position:absolute;right:7px;top:5px;width:40px;height:40px;border:0;background:transparent;color:#667085;font-size:17px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;margin:2px 1px 17px;font-size:10px}.remember{display:flex;align-items:center;gap:6px;color:var(--muted)}.remember input{accent-color:var(--blue)}.link{border:0;background:none;color:var(--blue);font-weight:900;cursor:pointer;padding:7px}
.btn{width:100%;height:50px;border-radius:12px;font-size:12px;font-weight:950;cursor:pointer}.primary{border:0;color:#fff;background:linear-gradient(135deg,#1687ff,#423de8);box-shadow:0 8px 22px #1687ff35}.primary:active,.secondary:active{transform:scale(.99)}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.divider{display:flex;align-items:center;gap:10px;color:#98a2b3;font-size:8px;font-weight:900;margin:17px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.msg{min-height:18px;text-align:center;font-size:10px;font-weight:800;margin-top:9px}.msg.error{color:#d92d20}.msg.success{color:#16834b}.signup{text-align:center;color:var(--muted);font-size:10px;margin-top:16px}.signup a,.teacher,.back a{color:var(--blue);font-weight:950;text-decoration:none}.teacher{display:block;text-align:center;margin-top:12px;font-size:9px}.back{text-align:center;margin-top:10px}.back a{font-size:9px;color:#667085}.security{text-align:center;color:#98a2b3;font-size:8px;margin-top:14px}
@media(max-width:480px){.page{padding:14px;align-items:flex-start;padding-top:28px}.wrap{width:100%}.brand-icon{width:68px;height:68px;font-size:32px;border-radius:19px}.brand-name{font-size:25px}.card{padding:22px 17px;border-radius:20px}.welcome h1{font-size:22px}.input,.btn{height:52px}}
</style>
</head>
<body>
<div class="page"><main class="wrap">
<header class="brand"><div class="brand-icon">⚛️</div><div class="brand-name">SKILL<span>UP</span></div><div class="tagline">MASTER EVERY SUBJECT</div></header>
<section class="card"><div class="welcome"><h1>Welcome Back 👋</h1><p>Continue your learning journey.</p></div>
<div class="field"><label for="email">EMAIL ADDRESS</label><div class="input-wrap"><span class="input-icon">📧</span><input class="input" id="email" type="email" autocomplete="email" placeholder="Enter your email"></div></div>
<div class="field"><label for="password">PASSWORD</label><div class="input-wrap"><span class="input-icon">🔒</span><input class="input" id="password" type="password" autocomplete="current-password" placeholder="Enter your password"><button class="eye" id="eye" type="button" aria-label="Show password">👁️</button></div></div>
<div class="row"><label class="remember"><input id="remember" type="checkbox"> Remember me</label><button id="forgot" class="link" type="button">Forgot Password?</button></div>
<button id="login" class="btn primary">LOG IN →</button><div class="divider">OR</div><button id="google" class="btn secondary">🌐 &nbsp; Continue with Google</button><div id="msg" class="msg" aria-live="polite"></div>
<div class="signup">New to SkillUp? <a href="register.html">CREATE ACCOUNT</a></div><a class="teacher" href="teacher-login.html">👨‍🏫 Teacher / Admin Login</a><div class="back"><a href="index.html">← Back to SkillUp</a></div><div class="security">🔐 Secure Firebase Authentication</div>
</section></main></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,sendPasswordResetEmail,setPersistence,browserLocalPersistence,browserSessionPersistence}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),show=(t,c='')=>{$('msg').textContent=t;$('msg').className='msg '+c};$('eye').onclick=()=>{const p=$('password'),s=p.type==='password';p.type=s?'text':'password'};function busy(v){$('login').disabled=v;$('google').disabled=v;$('login').textContent=v?'SIGNING IN…':'LOG IN →'}async function routeUser(user){const ref=doc(db,'users',user.uid),snap=await getDoc(ref);const data=snap.exists()?snap.data():{};if(!snap.exists())await setDoc(ref,{email:user.email||'',role:'student',createdAt:new Date().toISOString()},{merge:true});location.href=data.role==='teacher'?'teacher-dashboard.html':'physics-dashboard.html'}$('login').onclick=async()=>{show('');const e=$('email').value.trim(),p=$('password').value;if(!e||!p){show('Enter your email and password.','error');return}busy(true);try{await setPersistence(auth,$('remember').checked?browserLocalPersistence:browserSessionPersistence);const c=await signInWithEmailAndPassword(auth,e,p);await routeUser(c.user)}catch(err){const m={'auth/invalid-credential':'Incorrect email or password.','auth/user-not-found':'No account found for this email.','auth/wrong-password':'Incorrect password.','auth/invalid-email':'Enter a valid email address.','auth/too-many-requests':'Too many attempts. Please try again later.'};show(m[err.code]||'Unable to sign in. Please try again.','error')}finally{busy(false)}};$('google').onclick=async()=>{show('');busy(true);try{const c=await signInWithPopup(auth,new GoogleAuthProvider());await routeUser(c.user)}catch(err){if(err.code!=='auth/popup-closed-by-user')show('Google sign-in could not be completed.','error')}finally{busy(false)}};$('forgot').onclick=async()=>{const e=$('email').value.trim();if(!e){show('Enter your email address first.','error');return}try{await sendPasswordResetEmail(auth,e);show('Password reset email sent. Check your inbox.','success')}catch(err){show('Could not send reset email. Check the email address.','error')}};
</script>
</body></html>
