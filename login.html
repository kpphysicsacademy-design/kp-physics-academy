<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | KP Physics Academy</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#0b1930;min-height:100vh;display:grid;place-items:center}.card{width:min(430px,calc(100% - 32px));background:#fff;border-radius:20px;padding:32px;box-shadow:0 12px 40px #0b193018}.logo{text-align:center;font-size:26px;font-weight:900;color:#1687ff}.sub{text-align:center;color:#718096;margin:8px 0 25px}label{display:block;font-weight:700;margin:15px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d6dfeb;border-radius:9px;font-size:15px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#1687ff;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.secondary{background:#031326}.msg{margin-top:15px;padding:12px;border-radius:9px;display:none;line-height:1.5}.back{display:block;text-align:center;margin-top:20px;color:#1687ff;font-weight:700;text-decoration:none}</style></head><body><div class="card"><div class="logo">KP PHYSICS ACADEMY</div><div class="sub">Login to continue your Physics journey</div><label>Email</label><input id="email" type="email" placeholder="Enter your email"><label>Password</label><input id="password" type="password" placeholder="Enter your password"><button onclick="login()">Login</button><button class="secondary" onclick="signup()">Create Student Account</button><div class="msg" id="msg"></div><a class="back" href="index.html">← Back to Home</a></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const msg=document.getElementById('msg');function show(t){msg.textContent=t;msg.style.display='block'}window.login=async()=>{try{const c=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);const snap=await import('https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js').then(m=>m.getDoc(doc(db,'users',c.user.uid)));const role=snap.exists()?snap.data().role:'student';location.href=role==='teacher'?'teacher-dashboard.html':'student-dashboard.html'}catch(e){show(e.message)}};window.signup=async()=>{try{const c=await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);await setDoc(doc(db,'users',c.user.uid),{email:c.user.email,role:'student',createdAt:new Date().toISOString()});location.href='student-dashboard.html'}catch(e){show(e.message)}};</script></body></html>
