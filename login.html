<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Login | KP Physics Academy</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#0b1930;min-height:100vh;display:grid;place-items:center}.card{width:min(430px,calc(100% - 32px));background:#fff;border-radius:20px;padding:32px;box-shadow:0 12px 40px #0b193018}.logo{text-align:center;font-size:26px;font-weight:900;color:#1687ff}.sub{text-align:center;color:#718096;margin:8px 0 25px}label{display:block;font-weight:700;margin:15px 0 7px}input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d6dfeb;border-radius:9px;font-size:15px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#1687ff;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.secondary{background:#031326}.teacher{display:block;margin-top:22px;padding-top:20px;border-top:1px solid #e5eaf1;text-align:center;color:#1687ff;font-weight:800;text-decoration:none}.back{display:block;text-align:center;margin-top:20px;color:#1687ff;font-weight:700;text-decoration:none}.msg{margin-top:15px;padding:12px;border-radius:9px;display:none;line-height:1.5;background:#fff3f3;color:#8b0000}</style></head><body><div class="card"><div class="logo">KP PHYSICS ACADEMY</div><div class="sub">Student login — continue your Physics journey</div><label>Email</label><input id="email" type="email" placeholder="Enter your email"><label>Password</label><input id="password" type="password" placeholder="Enter your password"><label>Your Class</label><select id="studentClass"><option value="6">Class 6</option><option value="7">Class 7</option><option value="8">Class 8</option><option value="9">Class 9</option><option value="10">Class 10</option><option value="11">Class 11</option><option value="12">Class 12</option></select><small style="color:#718096;display:block;margin-top:8px">Your selected class is saved with your student profile when you create an account.</small><button onclick="login()">Student Login</button><button class="secondary" onclick="signup()">Create Student Account</button><a class="teacher" href="teacher-login.html">👨‍🏫 Teacher Login →</a><a class="back" href="index.html">← Back to Home</a><div class="msg" id="msg"></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),msg=document.getElementById('msg');function show(t){msg.textContent=t;msg.style.display='block'}window.login=async()=>{try{const c=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);const snap=await getDoc(doc(db,'users',c.user.uid));const data=snap.exists()?snap.data():{};if(data.role==='teacher'){location.href='teacher-dashboard.html';return}location.href='student-dashboard.html'}catch(e){show(e.message)}};window.signup=async()=>{try{const c=await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);await setDoc(doc(db,'users',c.user.uid),{email:c.user.email,role:'student',class:studentClass.value,createdAt:new Date().toISOString()});location.href='student-dashboard.html'}catch(e){show(e.message)}};</script></body></html>
