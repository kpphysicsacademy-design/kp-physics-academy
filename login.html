<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08152f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SkillUp | Login</title>
<style>
:root{--navy:#08152f;--navy2:#102448;--purple:#635bff;--blue:#1687ff;--ink:#15213a;--muted:#667085;--line:#e3e8f2;--bg:#f6f8fc;--white:#fff;--danger:#b42318;--success:#087443}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}body{min-height:100svh;background:linear-gradient(180deg,var(--navy) 0 34%,var(--bg) 34% 100%);display:flex;align-items:center;justify-content:center;padding:18px}
.login-shell{width:min(430px,100%)}
.brand{text-align:center;color:#fff;padding:8px 0 25px}.logo{width:72px;height:72px;margin:0 auto 13px;border-radius:22px;background:linear-gradient(135deg,#7b6cff,#1687ff);display:grid;place-items:center;font-size:34px;box-shadow:0 14px 32px rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.18)}.brand h1{font-size:30px;line-height:1;margin:0 0 7px;font-weight:900;letter-spacing:-.8px}.brand p{margin:0;color:#b9c7e5;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.login-card{background:var(--white);border:1px solid #edf0f6;border-radius:28px;padding:27px 24px 22px;box-shadow:0 22px 55px rgba(9,25,55,.16)}.panel h2{font-size:25px;margin:0 0 5px;letter-spacing:-.5px}.sub{font-size:12px;color:var(--muted);margin:0 0 21px}.field{margin-bottom:15px}.field label{display:block;font-size:10px;font-weight:900;margin-bottom:7px;letter-spacing:.45px;color:#344054}.input{width:100%;height:54px;border:1.5px solid var(--line);border-radius:15px;background:#f9fbfe;padding:0 15px;font-size:16px;outline:0;color:var(--ink);transition:.18s}.input::placeholder{color:#98a2b3}.input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(99,91,255,.10);background:#fff}.passWrap{position:relative}.passWrap .input{padding-right:50px}.eye{position:absolute;right:4px;top:4px;width:44px;height:46px;border:0;background:transparent;border-radius:11px;cursor:pointer;font-size:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 17px;font-size:11px}.remember{color:var(--muted);display:flex;align-items:center;gap:7px;min-height:38px}.remember input{width:18px;height:18px;accent-color:var(--purple)}.linkBtn{border:0;background:none;color:var(--purple);font-weight:850;cursor:pointer;padding:9px 0;font-size:11px}.btn{width:100%;height:54px;border-radius:15px;font-size:15px;font-weight:900;cursor:pointer;touch-action:manipulation}.btn:disabled{opacity:.65;cursor:wait}.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 11px 25px rgba(91,85,245,.24)}.divider{display:flex;align-items:center;gap:11px;color:#98a2b3;font-size:9px;font-weight:900;margin:19px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.google{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.google:hover{background:#f8f9fd}.msg{min-height:20px;text-align:center;font-size:11px;font-weight:800;margin-top:10px}.msg.error{color:var(--danger)}.msg.success{color:var(--success)}.signup{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.signup a{color:var(--purple);font-weight:900;text-decoration:none;padding:9px 2px;display:inline-block}.security{text-align:center;color:#98a2b3;font-size:8px;margin-top:12px;letter-spacing:.3px}.secondary-links{text-align:center;margin-top:8px}.secondary-links a{color:#98a2b3;text-decoration:none;font-size:10px;padding:6px}.secondary-links a:hover{color:var(--purple)}
@media(max-width:480px){body{padding:12px;align-items:center;background:linear-gradient(180deg,var(--navy) 0 31%,var(--bg) 31% 100%)}.login-shell{width:100%;max-width:430px}.brand{padding:4px 0 21px}.logo{width:62px;height:62px;border-radius:19px;font-size:29px}.brand h1{font-size:27px}.brand p{font-size:9px;letter-spacing:1.3px}.login-card{border-radius:25px;padding:24px 19px 18px}.panel h2{font-size:23px}.sub{margin-bottom:18px}.field{margin-bottom:13px}.input,.btn{height:53px}.row{margin-bottom:13px}.divider{margin:16px 0}.signup{margin-top:14px}}
@media(max-height:720px){body{padding:8px}.brand{padding:0 0 13px}.logo{width:52px;height:52px;font-size:24px;margin-bottom:8px}.brand h1{font-size:24px}.brand p{font-size:8px}.login-card{padding:18px 17px 13px}.sub{margin-bottom:13px}.field{margin-bottom:9px}.input,.btn{height:48px}.row{margin-bottom:8px}.divider{margin:10px 0}.signup{margin-top:8px}.security{margin-top:7px}}
</style>
</head>
<body>
<main class="login-shell" aria-label="SkillUp login">
  <header class="brand">
    <div class="logo" aria-hidden="true">⚛️</div>
    <h1>SkillUp</h1>
    <p>Learn • Practice • Master</p>
  </header>
  <section class="login-card">
    <div class="panel">
      <h2>Welcome back 👋</h2>
      <p class="sub">Log in to continue your learning journey.</p>
      <div class="field"><label for="email">EMAIL ADDRESS</label><input class="input" id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="Enter your email"></div>
      <div class="field"><label for="password">PASSWORD</label><div class="passWrap"><input class="input" id="password" type="password" autocomplete="current-password" placeholder="Enter your password"><button class="eye" id="eye" type="button" aria-label="Show password">👁</button></div></div>
      <div class="row"><label class="remember"><input id="remember" type="checkbox"> Remember me</label><button id="forgot" class="linkBtn" type="button">Forgot password?</button></div>
      <button id="login" class="btn primary">LOGIN</button>
      <div class="divider">OR</div>
      <button id="google" class="btn google">🌐 &nbsp; Continue with Google</button>
      <div id="msg" class="msg" aria-live="polite"></div>
      <div class="signup">New to SkillUp? <a href="register.html">CREATE ACCOUNT</a></div>
      <div class="secondary-links"><a href="teacher-login.html">Teacher / Admin</a><span>•</span><a href="index.html">Back to SkillUp</a></div>
      <div class="security">🔒 Secure Firebase Authentication</div>
    </div>
  </section>
</main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,sendPasswordResetEmail,setPersistence,browserLocalPersistence,browserSessionPersistence}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import{getFirestore,doc,setDoc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),show=(t,c='')=>{$('msg').textContent=t;$('msg').className='msg '+c};
$('eye').onclick=()=>{const p=$('password'),showing=p.type==='password';p.type=showing?'text':'password';$('eye').textContent=showing?'🙈':'👁'};
function busy(v){$('login').disabled=v;$('google').disabled=v;$('login').textContent=v?'Signing in…':'LOGIN'}
async function routeUser(user){const ref=doc(db,'users',user.uid),snap=await getDoc(ref);const data=snap.exists()?snap.data():{};if(!snap.exists())await setDoc(ref,{email:user.email||'',role:'student',createdAt:new Date().toISOString()},{merge:true});location.href=data.role==='teacher'?'teacher-dashboard.html':'student-dashboard.html'}
$('login').onclick=async()=>{show('');const e=$('email').value.trim(),p=$('password').value;if(!e||!p){show('Enter your email and password.','error');return}busy(true);try{await setPersistence(auth,$('remember').checked?browserLocalPersistence:browserSessionPersistence);const c=await signInWithEmailAndPassword(auth,e,p);await routeUser(c.user)}catch(err){const m={'auth/invalid-credential':'Incorrect email or password.','auth/user-not-found':'No account found for this email.','auth/wrong-password':'Incorrect password.','auth/invalid-email':'Enter a valid email address.','auth/too-many-requests':'Too many attempts. Please try again later.'};show(m[err.code]||'Unable to sign in. Please try again.','error')}finally{busy(false)}};
$('google').onclick=async()=>{show('');busy(true);try{const c=await signInWithPopup(auth,new GoogleAuthProvider());await routeUser(c.user)}catch(err){if(err.code!=='auth/popup-closed-by-user')show('Google sign-in could not be completed.','error')}finally{busy(false)}};
$('forgot').onclick=async()=>{const e=$('email').value.trim();if(!e){show('Enter your email address first.','error');return}try{await sendPasswordResetEmail(auth,e);show('Password reset email sent. Check your inbox.','success')}catch(err){show('Could not send reset email. Check the email address.','error')}};
</script>
</body>
</html>
