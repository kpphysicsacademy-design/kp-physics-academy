<title>SkillUp | Login</title>
<style>
:root{--ink:#fff;--muted:#d9d3ee;--purple:#7b2cff;--blue:#315dff;--line:rgba(255,255,255,.28)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#10072b}body{min-height:100svh;overflow-x:hidden}.page{position:relative;min-height:100svh;display:flex;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 24%,rgba(139,58,255,.34),transparent 30%),radial-gradient(circle at 7% 48%,rgba(255,174,75,.25),transparent 23%),radial-gradient(circle at 94% 53%,rgba(54,194,255,.27),transparent 25%),linear-gradient(145deg,#18072f,#13052e 46%,#061d49)}.page:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 35%,#ffd36a 0 2px,transparent 4px),radial-gradient(circle at 20% 27%,#ffe3a2 0 2px,transparent 4px),radial-gradient(circle at 87% 39%,#72d8ff 0 2px,transparent 4px),radial-gradient(circle at 92% 48%,#8bdfff 0 2px,transparent 4px);background-size:220px 240px,280px 310px,260px 300px,320px 270px;opacity:.82}.page:after{content:"";position:absolute;width:120%;height:55%;left:-10%;bottom:-18%;background:radial-gradient(ellipse,rgba(126,50,255,.3),transparent 58%);filter:blur(25px)}.content{position:relative;z-index:2;width:min(500px,100%);padding:28px 18px 34px;text-align:center}.hero{padding-top:20px;margin-bottom:25px}.logo{width:94px;height:94px;margin:auto auto 15px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(145deg,#ffd25b,#8b38ff 55%,#4d7dff);box-shadow:0 0 30px rgba(151,69,255,.7),0 0 70px rgba(69,129,255,.28);font-size:46px;border:1px solid rgba(255,255,255,.3)}.brand{font-size:52px;line-height:.95;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#fff,#ddd6ff 48%,#9d62ff);-webkit-background-clip:text;background-clip:text;color:transparent}.tagline{margin-top:12px;font-size:16px;letter-spacing:1px;color:#eee9ff;font-weight:600}.glass{width:100%;padding:25px 22px 21px;border:1.5px solid rgba(255,255,255,.42);border-radius:31px;background:linear-gradient(145deg,rgba(67,42,116,.52),rgba(20,30,75,.4));box-shadow:0 20px 70px rgba(0,0,0,.32),inset 0 0 28px rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.panel h2{margin:0 0 7px;font-size:29px}.sub{margin:0 0 20px;color:#d9d4ed;font-size:12px}.field{margin-bottom:14px;text-align:left}.field label{display:block;font-size:10px;font-weight:800;letter-spacing:.8px;color:#eee9ff;margin-bottom:7px}.inputwrap{position:relative}.icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:22px;z-index:1;filter:drop-shadow(0 0 5px rgba(255,213,120,.45))}.input{width:100%;height:58px;border-radius:17px;border:1.5px solid var(--line);background:rgba(20,17,58,.42);color:#fff;padding:0 48px;font-size:16px;outline:0}.input::placeholder{color:#eeeaf8}.input:focus{border-color:#7ad9ff;box-shadow:0 0 0 3px rgba(84,187,255,.11),0 0 22px rgba(93,70,255,.25)}.pass .input{padding-right:53px}.eye{position:absolute;right:6px;top:6px;width:45px;height:46px;border:0;background:transparent;color:#dcd7ef;font-size:20px;cursor:pointer}.row{display:flex;justify-content:space-between;align-items:center;margin:0 2px 16px;font-size:11px}.remember{display:flex;align-items:center;gap:7px;color:#ddd7ed}.remember input{width:17px;height:17px;accent-color:#7b2cff}.linkBtn{border:0;background:none;color:#d9b8ff;font-weight:800;cursor:pointer;padding:8px 2px}.btn{width:100%;height:58px;border-radius:19px;font-size:16px;font-weight:900;cursor:pointer}.primary{border:1px solid rgba(255,255,255,.18);color:#fff;background:linear-gradient(100deg,#7c19ff,#5837ff 48%,#216cff);box-shadow:0 0 18px rgba(134,36,255,.7),0 12px 32px rgba(35,30,140,.35)}.divider{display:flex;align-items:center;gap:12px;color:#c9c2df;font-size:9px;font-weight:900;margin:17px 0}.divider:before,.divider:after{content:"";height:1px;background:rgba(255,255,255,.25);flex:1}.google{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff}.msg{min-height:18px;text-align:center;font-size:11px;font-weight:800;margin-top:9px}.msg.error{color:#ffb7c4}.msg.success{color:#b9ffd9}.signup{margin-top:16px;color:#d8d1e9;font-size:11px}.signup a,.teacher,.back a{color:#d7b4ff;font-weight:900;text-decoration:none;padding:9px 2px;display:inline-block}.teacher{font-size:10px;color:#cfc8e2}.back a{font-size:10px;color:#aaa2bf}.security{color:#938ba9;font-size:8px;margin-top:2px}.bottom-copy{margin-top:58px}.bottom-copy .line1{font-size:25px}.bottom-copy .line2{font-size:29px;font-weight:900;margin-top:5px}.bottom-copy .line3{font-size:17px;color:#a777ff;margin-top:12px}.spark{color:#c8a8ff;font-size:28px;margin-left:6px}@media(max-width:480px){.content{padding:22px 15px 28px}.hero{padding-top:8px;margin-bottom:20px}.logo{width:82px;height:82px;font-size:40px}.brand{font-size:43px}.tagline{font-size:14px}.glass{padding:22px 18px 18px;border-radius:27px}.panel h2{font-size:26px}.input,.btn{height:56px}.bottom-copy{margin-top:46px}.bottom-copy .line1{font-size:22px}.bottom-copy .line2{font-size:25px}.bottom-copy .line3{font-size:16px}}@media(max-height:760px){.hero{padding-top:0;margin-bottom:14px}.logo{width:68px;height:68px;font-size:33px}.brand{font-size:38px}.tagline{font-size:12px}.glass{padding:18px 17px 14px}.input,.btn{height:50px}.field{margin-bottom:9px}.row{margin-bottom:10px}.bottom-copy{margin-top:28px}}
</style>
</head>
<body><div class="page"><main class="content" aria-label="SkillUp login"><header class="hero"><div class="logo" aria-hidden="true">🎓📖</div><div class="brand">SKILLUP</div><div class="tagline">MASTER EVERY SUBJECT</div></header><section class="glass"><div class="panel"><h2>Welcome Back 👋</h2><p class="sub">Continue your learning adventure.</p><div class="field"><label for="email">EMAIL ADDRESS</label><div class="inputwrap"><span class="icon">✉</span><input class="input" id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="Email Address"></div></div><div class="field pass"><label for="password">PASSWORD</label><div class="inputwrap"><span class="icon">🔒</span><input class="input" id="password" type="password" autocomplete="current-password" placeholder="Password"><button class="eye" id="eye" type="button" aria-label="Show password">◉</button></div></div><div class="row"><label class="remember"><input id="remember" type="checkbox"> Remember me</label><button id="forgot" class="linkBtn" type="button">Forgot Password?</button></div><button id="login" class="btn primary">LOG IN</button><div class="divider">OR</div><button id="google" class="btn google">🌐 &nbsp; Continue with Google</button><div id="msg" class="msg" aria-live="polite"></div><div class="signup">New to SkillUp? <a href="register.html">CREATE ACCOUNT</a></div><a class="teacher" href="teacher-login.html">👨‍🏫 Teacher / Admin Login</a><div class="back"><a href="index.html">← Back to SkillUp</a></div><div class="security">Secure Firebase Authentication</div></div></section><footer class="bottom-copy"><div class="line1">Your Learning</div><div class="line2">Adventure Awaits... <span class="spark">✦</span></div><div class="line3">Elevate Your Mind</div></footer></main></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,sendPasswordResetEmail,setPersistence,browserLocalPersistence,browserSessionPersistence}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),show=(t,c='')=>{$('msg').textContent=t;$('msg').className='msg '+c};$('eye').onclick=()=>{const p=$('password'),s=p.type==='password';p.type=s?'text':'password';$('eye').textContent=s?'◉':'◌'};function busy(v){$('login').disabled=v;$('google').disabled=v;$('login').textContent=v?'SIGNING IN…':'LOG IN'}async function routeUser(user){const ref=doc(db,'users',user.uid),snap=await getDoc(ref);const data=snap.exists()?snap.data():{};if(!snap.exists())await setDoc(ref,{email:user.email||'',role:'student',createdAt:new Date().toISOString()},{merge:true});location.href=data.role==='teacher'?'teacher-dashboard.html':'student-dashboard.html'}$('login').onclick=async()=>{show('');const e=$('email').value.trim(),p=$('password').value;if(!e||!p){show('Enter your email and password.','error');return}busy(true);try{await setPersistence(auth,$('remember').checked?browserLocalPersistence:browserSessionPersistence);const c=await signInWithEmailAndPassword(auth,e,p);await routeUser(c.user)}catch(err){const m={'auth/invalid-credential':'Incorrect email or password.','auth/user-not-found':'No account found for this email.','auth/wrong-password':'Incorrect password.','auth/invalid-email':'Enter a valid email address.','auth/too-many-requests':'Too many attempts. Please try again later.'};show(m[err.code]||'Unable to sign in. Please try again.','error')}finally{busy(false)}};$('google').onclick=async()=>{show('');busy(true);try{const c=await signInWithPopup(auth,new GoogleAuthProvider());await routeUser(c.user)}catch(err){if(err.code!=='auth/popup-closed-by-user')show('Google sign-in could not be completed.','error')}finally{busy(false)}};$('forgot').onclick=async()=>{const e=$('email').value.trim();if(!e){show('Enter your email address first.','error');return}try{await sendPasswordResetEmail(auth,e);show('Password reset email sent. Check your inbox.','success')}catch(err){show('Could not send reset email. Check the email address.','error')}};
</script></body></html>
