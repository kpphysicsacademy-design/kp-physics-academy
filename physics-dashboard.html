<style>

body.theme-chemistry:before{content:"H₂O     CO₂     CH₄     NH₃     NaCl     H₂SO₄     O₂     N₂     ⚗     ⚛     ⌬     C₆H₆";color:#d7a8ff22;text-shadow:0 0 24px #a855f766;transform:rotate(-7deg);letter-spacing:10px}

body.theme-botany:after{background:radial-gradient(circle at 10% 18%,#4ade8066 0 1px,transparent 3px),radial-gradient(circle at 27% 72%,#22c55e55 0 1px,transparent 3px),radial-gradient(circle at 72% 16%,#84cc1666 0 1px,transparent 3px),radial-gradient(circle at 89% 68%,#a3e63555 0 1px,transparent 3px),radial-gradient(circle at 54% 42%,#34d39955 0 1px,transparent 3px),radial-gradient(circle at 65% 86%,#16a34a44 0 1px,transparent 3px),radial-gradient(ellipse at 18% 42%,transparent 0 90px,#22c55e22 91px 93px,transparent 94px),radial-gradient(ellipse at 84% 62%,transparent 0 120px,#84cc1622 121px 123px,transparent 124px),radial-gradient(ellipse at 50% 38%,#092b1aaa 0,transparent 62%),linear-gradient(135deg,#03130bee,#062519ee 45%,#081c13ee)}
body.theme-botany .science-network{opacity:.9;background:radial-gradient(circle at 18% 35%,transparent 0 58px,#4ade8030 59px 61px,transparent 62px),radial-gradient(circle at 82% 65%,transparent 0 88px,#22c55e28 89px 91px,transparent 92px),radial-gradient(circle at 50% 80%,transparent 0 48px,#a3e63524 49px 51px,transparent 52px),radial-gradient(circle at 36% 18%,transparent 0 34px,#34d39924 35px 37px,transparent 38px)}
#authLoading{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:transparent;color:#fff;font-weight:800}#app{display:none}.page{min-height:100vh;padding-bottom:78px;background:transparent}
.top{position:sticky;top:0;z-index:50;min-height:64px;padding:8px 10px;background:transparent;border-bottom:1px solid #7b6cff55;backdrop-filter:none;-webkit-backdrop-filter:none;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.logo{display:flex;align-items:center;gap:7px;min-width:max-content}.logo .icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:transparent;border:1px solid #b892ff77;font-size:21px;box-shadow:none}.logo b{display:block;font-size:14px;letter-spacing:.6px}.logo small{display:block;color:#ffd34d;font-size:6px;font-weight:950;letter-spacing:1.5px;margin-top:2px}
.picker{text-align:center}.picker select{appearance:none;color:#fff;background:transparent;border:1px solid #8b5cf677;border-radius:14px;padding:9px 28px 9px 12px;min-width:125px;font-size:10px;font-weight:900;outline:0;backdrop-filter:none;box-shadow:none}.picker select:focus{border-color:#5ce1ff}
.stats{display:flex;gap:4px;align-items:center}.pill{white-space:nowrap;background:transparent;border:1px solid #5ce1ff55;border-radius:11px;padding:8px 7px;font-size:9px;font-weight:900}.logout-btn{white-space:nowrap;border:1px solid #8b5cf655;background:transparent;color:#fff;border-radius:11px;padding:8px;font-size:8px;font-weight:900;cursor:pointer}
.main{width:100%;max-width:760px;margin:auto;padding:14px 10px 20px;display:grid;gap:12px}.intro{padding:6px 4px;background:transparent}.eyebrow{color:#b892ff;font-size:9px;font-weight:950;letter-spacing:2px}.intro h1{font-size:27px;line-height:1.12;margin:6px 0;text-shadow:0 0 22px #268cff33}.intro h1 span{color:#4f9dff}.intro p{font-size:11px;line-height:1.4;color:var(--muted);margin:0}
.card{background:transparent;border:1px solid #7b6cff55;border-radius:20px;padding:12px;box-shadow:none;backdrop-filter:none}
.master{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #8b5cf677;background:transparent;border-radius:16px;padding:12px;margin-bottom:12px}.masterIcon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:transparent;border:1px solid #b892ff66;font-size:23px;box-shadow:none}.masterText{flex:1}.masterText b{display:block;font-size:13px}.masterText small{color:var(--muted);font-size:9px}.fullPath{border:1px solid #6d42d8;color:#c7a8ff;border-radius:12px;padding:9px;font-size:8px;font-weight:950;background:transparent}
.pathWrap{position:relative;overflow:hidden;border-radius:16px;padding:8px 2px 16px;min-height:700px;background:transparent}.road{position:relative;padding:8px 0 14px}.road:before{content:"";position:absolute;left:50%;top:78px;bottom:38px;width:3px;transform:translateX(-50%);background:repeating-linear-gradient(to bottom,#c18cff 0 4px,transparent 4px 11px);filter:drop-shadow(0 0 5px #a66cff);opacity:.9}.lesson{position:relative;z-index:2;display:flex;align-items:center;min-height:90px;width:100%;margin:0 auto 2px}.lesson.left{justify-content:flex-start;padding-right:49%;padding-left:2%}.lesson.right{justify-content:flex-end;padding-left:49%;padding-right:2%}
.node{width:64px;height:64px;flex:0 0 64px;border-radius:50%;display:grid;place-items:center;border:4px solid #70748b;color:#fff;font-size:27px;background:transparent;box-shadow:none;cursor:pointer}.done .node{border-color:#8ee33e;background:transparent;box-shadow:0 0 20px #7ee52b55}.current .node{border-color:#3099ff;background:transparent;box-shadow:0 0 25px #268cff88}.locked .node{opacity:.72}.lessonInfo{width:154px;background:transparent;border:1px solid #5ce1ff55;border-radius:13px;padding:8px 9px;box-shadow:none;backdrop-filter:none}.left .lessonInfo{margin-left:7px}.right .lessonInfo{margin-right:7px;order:-1}.lessonInfo b{display:block;font-size:9px;line-height:1.25}.lessonInfo small{display:block;color:var(--muted);font-size:7px;margin-top:4px;line-height:1.3}.badge{display:inline-block;margin-top:5px;border-radius:999px;padding:4px 7px;font-size:6.5px;font-weight:950;background:transparent;border:1px solid #5ce1ff44;color:#d7dcf0}.done .badge{border-color:#8ee33e88;color:#8ee33e}.current .badge{border-color:#3099ff99;color:#fff}.locked .badge{border-color:#ffffff33;color:#ddd}.pathFooter{text-align:center;position:relative;z-index:4;margin-top:5px}.end{width:64px;height:64px;margin:auto;border-radius:50%;display:grid;place-items:center;background:transparent;border:4px solid #9c6cff;box-shadow:none;font-size:25px}
.bottom{position:fixed;z-index:60;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);height:68px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-top:1px solid #7b6cff55;display:flex;box-shadow:none;padding-bottom:env(safe-area-inset-bottom)}.bottom a{flex:1;text-align:center;color:#aeb7d0;font-size:7px;font-weight:900;padding-top:7px}.bottom span{display:block;font-size:19px;margin-bottom:2px}.bottom .active{color:#9b6cff}.bottom .active span{text-shadow:0 0 12px #8b5cf6}
@media(max-width:480px){.logo b{font-size:12px}.logo small{font-size:5px}.logo .icon{width:34px;height:34px;font-size:18px}.picker select{min-width:105px;font-size:9px;padding:8px 20px 8px 9px}.stats .pill{display:none}.logout-btn{font-size:7px;padding:8px 6px}.main{padding:12px 8px 18px}.card{padding:9px}.pathWrap{min-height:680px}.lessonInfo{width:146px}.lessonInfo b{font-size:8.5px}.lessonInfo small{font-size:6.7px}.node{width:58px;height:58px;flex-basis:58px;font-size:24px}.lesson.left{padding-right:48%}.lesson.right{padding-left:48%}.bottom{height:64px}.bottom a{font-size:6.5px}.bottom span{font-size:18px}}
@media(min-width:700px){.main{padding:20px}.intro h1{font-size:34px}.pathWrap{min-height:800px;padding:15px 30px 20px}.lessonInfo{width:190px}.lessonInfo b{font-size:11px}.lessonInfo small{font-size:8px}.node{width:72px;height:72px;flex-basis:72px;font-size:30px}}
</style>
</head>
<body>
<div class="science-network"></div>
<div id="authLoading">Loading SkillUp…</div>
<div id="app"><div class="page">
<header class="top">
<a class="logo" href="physics-dashboard.html"><span class="icon" id="subjectIcon">⚛️</span><div><b>SKILLUP</b><small>MASTER EVERY SUBJECT</small></div></a>
<div class="picker"><select id="subjectSelect" aria-label="Select subject"><option value="physics">⚛️ Physics</option><option value="chemistry">🧪 Chemistry</option><option value="botany">🌿 Botany</option><option value="zoology">🧬 Zoology</option><option value="maths">📐 Maths</option></select></div>
<div class="stats"><span class="pill">🔥 <span id="streak">0</span></span><span class="pill">⭐ <span id="xp">0</span></span><button id="logoutBtn" class="logout-btn" type="button">LOG OUT</button></div>
</header>
<main class="main">
<section class="intro"><div class="eyebrow">YOUR <span id="introSubjectSmall">PHYSICS</span> PATH</div><h1>Keep going, <span id="introSubject">Physics</span>! 🚀</h1><p>Complete each concept to unlock the next lesson.</p></section>
<section class="card"><div class="master"><div class="masterIcon" id="masterIcon">⚛️</div><div class="masterText"><b id="masterTitle">Physics MASTER PATH</b><small>Foundation → Advanced</small></div><a id="fullPath" class="fullPath" href="full-physics-path.html">FULL PATH →</a></div><div class="pathWrap"><div id="pathList" class="road"></div></div></section>
</main>
<nav class="bottom"><a class="active" href="physics-dashboard.html"><span>🏠</span>Home</a><a id="learnLink" href="full-physics-path.html"><span>📖</span>Learn</a><a href="question-bank.html"><span>🎯</span>Practice</a><a href="challenge-concepts.html"><span>🏆</span>League</a><a href="profile.html"><span>👤</span>Profile</a></nav>
</div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import{firebaseConfig}from'./firebase-config.js';
const firebaseApp=initializeApp(firebaseConfig),auth=getAuth(firebaseApp),$=id=>document.getElementById(id);
const data={
physics:{name:'Physics',icon:'⚛️',path:'full-physics-path.html',items:['Units & Measurements','Vectors','Motion in a Straight Line','Motion in a Plane','Laws of Motion','Work, Energy & Power','System of Particles & Rotational Motion','Gravitation','Properties of Bulk Matter','Thermodynamics','Kinetic Theory','Oscillations','Waves','Electrostatics','Current Electricity','Magnetic Effects of Current','Electromagnetic Induction','Alternating Current','Electromagnetic Waves','Ray Optics','Wave Optics','Dual Nature of Matter','Atoms & Nuclei','Semiconductor Electronics'],emojis:['📏','🧭','🏃','🚀','⚖️','⚡','⚛️','🌍','💧','🔥','🎈','〰️','🌊','⚡','🔋','🧲','🌀','〰️','📡','🔭','🌈','⚛️','☢️','💻']},
chemistry:{name:'Chemistry',icon:'🧪',path:'chemistry-full-path.html',items:['Some Basic Concepts of Chemistry','Structure of Atom','Classification of Elements','Chemical Bonding','States of Matter','Thermodynamics','Equilibrium','Redox Reactions','Hydrogen','s-Block Elements','Organic Chemistry Basics','Hydrocarbons','Solutions','Electrochemistry','Chemical Kinetics','Surface Chemistry','Coordination Compounds','Haloalkanes & Haloarenes','Alcohols, Phenols & Ethers','Aldehydes, Ketones & Carboxylic Acids','Amines','Biomolecules','Polymers','Chemistry in Everyday Life'],emojis:['⚗️','⚛️','🧩','🔗','💨','🔥','⚖️','🔴','💧','🧂','🧪','⛽','💧','🔋','⚡','🫧','🔷','🧪','🌸','🧴','🧬','🍬','🧵','🏠']},
botany:{name:'Botany',icon:'🌿',path:'botany-full-path.html',items:['The Living World','Biological Classification','Plant Kingdom','Morphology of Flowering Plants','Anatomy of Flowering Plants','Cell: Structure & Function','Biomolecules','Cell Cycle & Cell Division','Transport in Plants','Mineral Nutrition','Photosynthesis','Respiration in Plants','Plant Growth & Development','Sexual Reproduction in Flowering Plants','Principles of Inheritance','Molecular Basis of Inheritance','Strategies for Enhancement in Food Production','Microbes in Human Welfare','Ecology','Biodiversity & Conservation'],emojis:['🌎','🦠','🌱','🌸','🌿','🔬','🧬','🔄','💧','🪨','☀️','🔥','🌱','🌺','🧬','🧬','🌾','🦠','🌳','🌍']},
zoology:{name:'Zoology',icon:'🧬',path:'zoology-full-path.html',items:['Animal Diversity','Structural Organisation in Animals','Digestion & Absorption','Breathing & Exchange of Gases','Body Fluids & Circulation','Excretory Products & Elimination','Locomotion & Movement','Neural Control & Coordination','Chemical Coordination & Integration','Human Reproduction','Reproductive Health','Human Health & Disease','Evolution','Human Physiology','Animal Husbandry'],emojis:['🦁','🐾','🍽️','🫁','❤️','🧪','🏃','🧠','🧬','👶','🩺','🛡️','🦴','🐄','🧍']},
maths:{name:'Maths',icon:'📐',path:'maths-full-path.html',items:['Sets & Relations','Functions','Trigonometry','Complex Numbers','Quadratic Equations','Sequences & Series','Permutations & Combinations','Binomial Theorem','Coordinate Geometry','Limits & Continuity','Differentiation','Applications of Derivatives','Integrals','Differential Equations','Vectors & 3D Geometry','Probability','Statistics'],emojis:['🔢','🔗','📐','🧮','✖️','🔢','🎲','📊','📍','∞','📈','🎯','∫','〰️','🧭','🎲','📊']}
};
function getProgress(subject){try{return JSON.parse(localStorage.getItem('skillupProgress_'+subject)||'{}')}catch{return{}}}
function render(subject){const d=data[subject];document.body.className='theme-'+subject;$('subjectIcon').textContent=d.icon;$('masterIcon').textContent=d.icon;$('introSubject').textContent=d.name;$('introSubjectSmall').textContent=d.name.toUpperCase();$('masterTitle').textContent=d.name+' MASTER PATH';$('fullPath').href=d.path;$('learnLink').href=d.path;const p=getProgress(subject),completed=Math.max(0,Math.min(d.items.length,Number(p.completed||0)));$('xp').textContent=Number(p.xp||0);$('streak').textContent=Number(p.streak||0);let html='';d.items.forEach((name,i)=>{const state=i<completed?'done':i===completed?'current':'locked',side=i%2===0?'right':'left',badge=state==='done'?'COMPLETED ✓':state==='current'?'CURRENT':'LOCKED 🔒';html+=`<div class="lesson ${side} ${state}"><div class="node" data-index="${i}">${d.emojis[i%d.emojis.length]}</div><div class="lessonInfo"><b>${i+1}. ${name}</b><small>${state==='current'?'Continue your current lesson':state==='done'?'Completed':'Complete the previous lesson'}</small><span class="badge">${badge}</span></div></div>`});html+=`<div class="pathFooter"><div class="end">⚑</div><small style="display:block;color:#aeb7d0;font-size:7px;margin-top:3px">END</small></div>`;$('pathList').innerHTML=html;$('pathList').querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>{const i=Number(n.dataset.index);if(i<=completed)location.href='concept.html?subject='+subject+'&index='+i}))}
$('subjectSelect').addEventListener('change',e=>{localStorage.setItem('skillupSubject',e.target.value);render(e.target.value)});$('logoutBtn').addEventListener('click',async()=>{await signOut(auth);location.replace('login.html')});
document.addEventListener('keydown',e=>{if(['ArrowDown','PageDown'].includes(e.key)){e.preventDefault();scrollBy({top:e.key==='PageDown'?innerHeight*.82:100,behavior:'smooth'})}else if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();scrollBy({top:e.key==='PageUp'?-innerHeight*.82:-100,behavior:'smooth'})}else if(e.key==='Home'){e.preventDefault();scrollTo({top:0,behavior:'smooth'})}else if(e.key==='End'){e.preventDefault();scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'})}});
onAuthStateChanged(auth,user=>{if(!user){location.replace('login.html');return}$('authLoading').style.display='none';$('app').style.display='block';const saved=localStorage.getItem('skillupSubject')||'physics';$('subjectSelect').value=data[saved]?saved:'physics';render($('subjectSelect').value)});
</script>
</body>
