<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020611">
<title>SkillUp | Learning Path</title>
<style>
:root{--bg:#020611;--white:#f7f8ff;--muted:#b9c3dc;--purple:#9b6cff;--blue:#268cff;--cyan:#5ce1ff;--yellow:#ffd34d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;min-height:100%;overflow-x:hidden;background:transparent;color:var(--white);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior-y:auto;touch-action:pan-y}
a{text-decoration:none;color:inherit}button,select{font:inherit}
body:before{content:"⚛     E=mc²       λ       F=ma       ∫       Δx       c=λf       H₂O       π";position:fixed;inset:0;z-index:-4;pointer-events:none;padding:12vh 3vw;white-space:pre-wrap;overflow:hidden;color:#5ce1ff18;font:700 clamp(18px,3vw,42px)/3.2 Inter,system-ui;letter-spacing:8px;transform:rotate(-8deg);text-shadow:0 0 22px #268cff55}
body:after{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;background:radial-gradient(circle at 12% 12%,#268cff55 0 1px,transparent 2px),radial-gradient(circle at 24% 74%,#9b6cff55 0 1px,transparent 2px),radial-gradient(circle at 78% 17%,#5ce1ff55 0 1px,transparent 2px),radial-gradient(circle at 88% 66%,#ffd34d44 0 1px,transparent 2px),radial-gradient(circle at 53% 42%,#9b6cff44 0 1px,transparent 2px),radial-gradient(circle at 65% 86%,#268cff44 0 1px,transparent 2px),radial-gradient(ellipse at 50% 40%,#071a31aa 0,transparent 62%),linear-gradient(135deg,#020611ee,#07152bee 48%,#020611ee)}
.science-network{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.75;background:radial-gradient(circle at 18% 35%,transparent 0 70px,#268cff18 71px 72px,transparent 73px),radial-gradient(circle at 82% 65%,transparent 0 95px,#9b6cff18 96px 97px,transparent 98px),radial-gradient(circle at 50% 80%,transparent 0 55px,#5ce1ff18 56px 57px,transparent 58px)}
#authLoading{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#020611;color:#fff;font-weight:800}#app{display:none}.page{min-height:100vh;padding-bottom:78px}
.top{position:sticky;top:0;z-index:50;min-height:64px;padding:8px 10px;background:#02081788;border-bottom:1px solid #7b6cff35;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.logo{display:flex;align-items:center;gap:7px;min-width:max-content}.logo .icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#9b6cffcc,#4320aacc);border:1px solid #b892ff77;font-size:21px;box-shadow:0 0 22px #8b5cf655}.logo b{display:block;font-size:14px;letter-spacing:.6px}.logo small{display:block;color:#ffd34d;font-size:6px;font-weight:950;letter-spacing:1.5px;margin-top:2px}.picker{text-align:center}.picker select{appearance:none;color:#fff;background:#07112666;border:1px solid #8b5cf677;border-radius:14px;padding:9px 28px 9px 12px;min-width:125px;font-size:10px;font-weight:900;outline:0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 18px #8b5cf622}.picker select:focus{border-color:#5ce1ff}.stats{display:flex;gap:4px;align-items:center}.pill{white-space:nowrap;background:#07112666;border:1px solid #5ce1ff33;border-radius:11px;padding:8px 7px;font-size:9px;font-weight:900;backdrop-filter:blur(10px)}.logout-btn{white-space:nowrap;border:1px solid #8b5cf655;background:#07112666;color:#fff;border-radius:11px;padding:8px;font-size:8px;font-weight:900;cursor:pointer}
.main{width:100%;max-width:760px;margin:auto;padding:14px 10px 20px;display:grid;gap:12px}.intro{padding:6px 4px}.eyebrow{color:#b892ff;font-size:9px;font-weight:950;letter-spacing:2px}.intro h1{font-size:27px;line-height:1.12;margin:6px 0;text-shadow:0 0 22px #268cff33}.intro h1 span{color:#4f9dff}.intro p{font-size:11px;line-height:1.4;color:var(--muted);margin:0}
.card{background:linear-gradient(145deg,#0711264d,#050b1c42);border:1px solid #7b6cff55;border-radius:20px;padding:12px;box-shadow:0 12px 40px #0005,0 0 35px #43209b18;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.master{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #8b5cf677;background:linear-gradient(135deg,#0a123055,#090b2240);border-radius:16px;padding:12px;margin-bottom:12px;backdrop-filter:blur(4px)}.masterIcon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#6d42d855;border:1px solid #b892ff66;font-size:23px;box-shadow:0 0 20px #8b5cf644}.masterText{flex:1}.masterText b{display:block;font-size:13px}.masterText small{color:var(--muted);font-size:9px}.fullPath{border:1px solid #6d42d8;color:#c7a8ff;border-radius:12px;padding:9px;font-size:8px;font-weight:950;background:#07112644}
.pathWrap{position:relative;overflow:hidden;border-radius:16px;padding:8px 2px 16px;min-height:700px;background:radial-gradient(circle at 80% 20%,#421d7720,transparent 30%),radial-gradient(circle at 20% 65%,#1261a520,transparent 32%);backdrop-filter:blur(1px)}.road{position:relative;padding:8px 0 14px}.road:before{content:"";position:absolute;left:50%;top:78px;bottom:38px;width:3px;transform:translateX(-50%);background:repeating-linear-gradient(to bottom,#c18cff 0 4px,transparent 4px 11px);filter:drop-shadow(0 0 5px #a66cff);opacity:.9}.lesson{position:relative;z-index:2;display:flex;align-items:center;min-height:90px;width:100%;margin:0 auto 2px}.lesson.left{justify-content:flex-start;padding-right:49%;padding-left:2%}.lesson.right{justify-content:flex-end;padding-left:49%;padding-right:2%}.node{width:64px;height:64px;flex:0 0 64px;border-radius:50%;display:grid;place-items:center;border:4px solid #70748b;color:#fff;font-size:27px;background:radial-gradient(circle at 35% 25%,#34405c99,#11162a66);box-shadow:0 0 0 3px #14182b66,0 0 22px #7d7f9840;cursor:pointer}.done .node{border-color:#8ee33e;background:radial-gradient(circle at 35% 25%,#386b2899,#0b241266);box-shadow:0 0 0 3px #17381b55,0 0 25px #7ee52b66}.current .node{border-color:#3099ff;background:radial-gradient(circle at 35% 25%,#2c79ffbb,#122b7488);box-shadow:0 0 0 3px #123c7855,0 0 32px #268cffaa}.locked .node{opacity:.72}.lessonInfo{width:154px;background:#07112666;border:1px solid #5ce1ff35;border-radius:13px;padding:8px 9px;box-shadow:0 7px 20px #0006;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.left .lessonInfo{margin-left:7px}.right .lessonInfo{margin-right:7px;order:-1}.lessonInfo b{display:block;font-size:9px;line-height:1.25}.lessonInfo small{display:block;color:var(--muted);font-size:7px;margin-top:4px;line-height:1.3}.badge{display:inline-block;margin-top:5px;border-radius:999px;padding:4px 7px;font-size:6.5px;font-weight:950;background:#121a3566;color:#d7dcf0}.done .badge{background:#12341a88;color:#8ee33e}.current .badge{background:#123a7c99;color:#fff}.locked .badge{background:#201e3866;color:#ddd}.pathFooter{text-align:center;position:relative;z-index:4;margin-top:5px}.end{width:64px;height:64px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#3e1d7d88;border:4px solid #9c6cff;box-shadow:0 0 30px #8b5cf688;font-size:25px}
.bottom{position:fixed;z-index:60;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);height:68px;background:#02081777;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #7b6cff44;display:flex;box-shadow:0 -8px 28px #0008;padding-bottom:env(safe-area-inset-bottom)}.bottom a{flex:1;text-align:center;color:#aeb7d0;font-size:7px;font-weight:900;padding-top:7px}.bottom span{display:block;font-size:19px;margin-bottom:2px;filter:grayscale(.25)}.bottom .active{color:#9b6cff}.bottom .active span{filter:none;text-shadow:0 0 12px #8b5cf6}
@media(max-width:480px){.top{grid-template-columns:auto 1fr auto}.logo b{font-size:12px}.logo small{font-size:5px}.logo .icon{width:34px;height:34px;font-size:18px}.picker select{min-width:105px;font-size:9px;padding:8px 20px 8px 9px}.stats .pill{display:none}.logout-btn{font-size:7px;padding:8px 6px}.main{padding:12px 8px 18px}.card{padding:9px}.pathWrap{min-height:680px}.lessonInfo{width:146px}.lessonInfo b{font-size:8.5px}.lessonInfo small{font-size:6.7px}.node{width:58px;height:58px;flex-basis:58px;font-size:24px}.lesson.left{padding-right:48%}.lesson.right{padding-left:48%}.bottom{height:64px}.bottom a{font-size:6.5px}.bottom span{font-size:18px}}
@media(min-width:700px){.main{padding:20px}.intro h1{font-size:34px}.pathWrap{min-height:800px;padding:15px 30px 20px}.lessonInfo{width:190px}.lessonInfo b{font-size:11px}.lessonInfo small{font-size:8px}.node{width:72px;height:72px;flex-basis:72px;font-size:30px}}
</style>
</head>
<body>
<div class="science-network"></div>
<div id="authLoading">Loading SkillUp…</div>
<div id="app"><div class="page">
<header class="top">
<a class="logo" href="physics-dashboard.html"><span class="icon" id="subjectIcon">⚛️</span><div><b>SKILLUP</b><small>MASTER EVERY SUBJECT</small></div></a>
<div class="picker"><select id="subjectSelect" aria-label="Select subject"><option value="physics">⚛️ Physics</option><option value="chemistry">🧪 Chemistry</option><option value="botany">🌿 Botany</option><option value="zoology">🧬 Zoology</option><option value="maths">📐 Maths</option></select></div>
<div class="stats"><span class="pill">🔥 <span id="streak">0</span></span><span class="pill">⭐ <span id="xp">0</span></span><button id="logoutBtn" class="logout-btn" type="button">LOG OUT</button></div>
</header>
<main class="main">
<section class="intro"><div class="eyebrow">YOUR <span id="introSubjectSmall">PHYSICS</span> PATH</div><h1>Keep going, <span id="introSubject">Physics</span>! 🚀</h1><p>Complete each concept to unlock the next lesson.</p></section>
<section class="card"><div class="master"><div class="masterIcon" id="masterIcon">⚛️</div><div class="masterText"><b id="masterTitle">Physics MASTER PATH</b><small>Foundation → Advanced</small></div><a id="fullPath" class="fullPath" href="full-physics-path.html">FULL PATH →</a></div><div class="pathWrap"><div id="pathList" class="road"></div></div></section>
</main>
<nav class="bottom"><a class="active" href="physics-dashboard.html"><span>🏠</span>Home</a><a id="learnLink" href="full-physics-path.html"><span>📖</span>Learn</a><a href="question-bank.html"><span>🎯</span>Practice</a><a href="challenge-concepts.html"><span>🏆</span>League</a><a href="profile.html"><span>👤</span>Profile</a></nav>
</div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import{firebaseConfig}from'./firebase-config.js';
const firebaseApp=initializeApp(firebaseConfig);const auth=getAuth(firebaseApp);const $=id=>document.getElementById(id);
const data={
physics:{name:'Physics',icon:'⚛️',path:'full-physics-path.html',items:['Units & Measurements','Vectors','Motion in a Straight Line','Motion in a Plane','Laws of Motion','Work, Energy & Power','System of Particles & Rotational Motion','Gravitation','Properties of Bulk Matter','Thermodynamics','Kinetic Theory','Oscillations','Waves','Electrostatics','Current Electricity','Magnetic Effects of Current','Electromagnetic Induction','Alternating Current','Electromagnetic Waves','Ray Optics','Wave Optics','Dual Nature of Matter','Atoms & Nuclei','Semiconductor Electronics'],emojis:['📏','🧭','🏃','🚀','⚖️','⚡','⚛️','🌍','💧','🔥','🎈','〰️','🌊','⚡','🔋','🧲','🌀','〰️','📡','🔭','🌈','⚛️','☢️','💻']},
chemistry:{name:'Chemistry',icon:'🧪',path:'chemistry-full-path.html',items:['Some Basic Concepts of Chemistry','Structure of Atom','Classification of Elements','Chemical Bonding','States of Matter','Thermodynamics','Equilibrium','Redox Reactions','Hydrogen','s-Block Elements','Organic Chemistry Basics','Hydrocarbons','Solutions','Electrochemistry','Chemical Kinetics','Surface Chemistry','Coordination Compounds','Haloalkanes & Haloarenes','Alcohols, Phenols & Ethers','Aldehydes, Ketones & Carboxylic Acids','Amines','Biomolecules','Polymers','Chemistry in Everyday Life'],emojis:['⚗️','⚛️','🧩','🔗','💨','🔥','⚖️','🔴','💧','🧂','🧪','⛽','💧','🔋','⚡','🫧','🔷','🧪','🌸','🧴','🧬','🍬','🧵','🏠']},
botany:{name:'Botany',icon:'🌿',path:'botany-full-path.html',items:['The Living World','Biological Classification','Plant Kingdom','Morphology of Flowering Plants','Anatomy of Flowering Plants','Cell: Structure & Function','Biomolecules','Cell Cycle & Cell Division','Transport in Plants','Mineral Nutrition','Photosynthesis','Respiration in Plants','Plant Growth & Development','Sexual Reproduction in Flowering Plants','Principles of Inheritance','Molecular Basis of Inheritance','Strategies for Enhancement in Food Production','Microbes in Human Welfare','Ecology','Biodiversity & Conservation'],emojis:['🌎','🦠','🌱','🌸','🌿','🔬','🧬','🔄','💧','🪨','☀️','🔥','🌱','🌺','🧬','🧬','🌾','🦠','🌳','🌍']},
zoology:{name:'Zoology',icon:'🧬',path:'zoology-full-path.html',items:['Animal Diversity','Structural Organisation in Animals','Digestion & Absorption','Breathing & Exchange of Gases','Body Fluids & Circulation','Excretory Products & Elimination','Locomotion & Movement','Neural Control & Coordination','Chemical Coordination & Integration','Human Reproduction','Reproductive Health','Human Health & Disease','Evolution','Human Physiology','Animal Husbandry'],emojis:['🦁','🐾','🍽️','🫁','❤️','🧪','🏃','🧠','🧬','👶','🩺','🛡️','🦴','🐄','🧍']},
maths:{name:'Maths',icon:'📐',path:'maths-full-path.html',items:['Sets & Relations','Functions','Trigonometry','Complex Numbers','Quadratic Equations','Sequences & Series','Permutations & Combinations','Binomial Theorem','Coordinate Geometry','Limits & Continuity','Differentiation','Applications of Derivatives','Integrals','Differential Equations','Vectors & 3D Geometry','Probability','Statistics'],emojis:['🔢','🔗','📐','🧮','✖️','🔢','🎲','📊','📍','∞','📈','🎯','∫','〰️','🧭','🎲','📊']}
};
let current='physics';
function getProgress(subject){try{return JSON.parse(localStorage.getItem('skillupProgress_'+subject)||'{}')}catch{return{}}}
function render(subject){current=subject;const d=data[subject];$('subjectIcon').textContent=d.icon;$('masterIcon').textContent=d.icon;$('introSubject').textContent=d.name;$('introSubjectSmall').textContent=d.name.toUpperCase();$('masterTitle').textContent=d.name+' MASTER PATH';$('fullPath').href=d.path;$('learnLink').href=d.path;const p=getProgress(subject);const completed=Math.max(0,Math.min(d.items.length,Number(p.completed||0)));$('xp').textContent=Number(p.xp||0);$('streak').textContent=Number(p.streak||0);
let html='';d.items.forEach((name,i)=>{const state=i<completed?'done':i===completed?'current':'locked';const side=i%2===0?'right':'left';const badge=state==='done'?'COMPLETED ✓':state==='current'?'CURRENT':'LOCKED 🔒';html+=`<div class="lesson ${side} ${state}"><div class="node" data-index="${i}">${d.emojis[i%d.emojis.length]}</div><div class="lessonInfo"><b>${i+1}. ${name}</b><small>${state==='current'?'Continue your current lesson':state==='done'?'Completed':'Complete the previous lesson'}</small><span class="badge">${badge}</span></div></div>`});html+=`<div class="pathFooter"><div class="end">⚑</div><small style="display:block;color:#aeb7d0;font-size:7px;margin-top:3px">END</small></div>`;$('pathList').innerHTML=html;$('pathList').querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>{const i=Number(n.dataset.index);if(i<=completed)location.href='concept.html?subject='+subject+'&index='+i}));}
$('subjectSelect').addEventListener('change',e=>{localStorage.setItem('skillupSubject',e.target.value);render(e.target.value)});$('logoutBtn').addEventListener('click',async()=>{await signOut(auth);location.replace('login.html')});
document.addEventListener('keydown',e=>{if(['ArrowDown','PageDown'].includes(e.key)){e.preventDefault();window.scrollBy({top:e.key==='PageDown'?window.innerHeight*.82:100,behavior:'smooth'})}else if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();window.scrollBy({top:e.key==='PageUp'?-window.innerHeight*.82:-100,behavior:'smooth'})}else if(e.key==='Home'){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})}else if(e.key==='End'){e.preventDefault();window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'})}});
onAuthStateChanged(auth,user=>{if(!user){location.replace('login.html');return}$('authLoading').style.display='none';$('app').style.display='block';const saved=localStorage.getItem('skillupSubject')||'physics';$('subjectSelect').value=data[saved]?saved:'physics';render($('subjectSelect').value)});
</script>
</body>
</html>
