<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Plant Kingdom Practice</title><style>:root{--navy:#071f19;--green:#20a447;--ink:#183028;--muted:#64746d;--bg:#f7fbf8;--line:#d9e9df;--good:#20a447;--bad:#d94a4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink)}.top{background:var(--navy);color:#fff;padding:13px 16px}.top a{color:#fff;text-decoration:none;font-weight:900}.wrap{max-width:680px;margin:auto;padding:18px 14px}.meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:900}.bar{height:12px;background:#dce9e1;border-radius:99px;overflow:hidden;margin:12px 0 24px}.fill{height:100%;width:5%;background:var(--green);transition:.25s}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 25px #18302810}.topic{font-size:11px;font-weight:900;color:var(--green);letter-spacing:1px}.q{font-size:22px;font-weight:900;line-height:1.35;margin:12px 0 20px}.option{width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;margin:10px 0;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer}.option:hover{border-color:var(--green)}.option.correct{border-color:var(--good);background:#effaf2}.option.wrong{border-color:var(--bad);background:#fff1f1}.feedback{display:none;margin-top:16px;padding:15px;border-radius:14px;font-weight:800}.feedback.show{display:block}.feedback.good{background:#effaf2;color:#126b2f}.feedback.bad{background:#fff1f1;color:#9d2929}.next{display:none;width:100%;margin-top:15px;border:0;border-radius:14px;padding:16px;background:var(--green);color:#fff;font-weight:950;font-size:15px;cursor:pointer}.next.show{display:block}.xp{text-align:center;margin-top:15px;font-size:12px;color:var(--muted);font-weight:800}@media(max-width:480px){.q{font-size:20px}.card{padding:18px}.option{padding:15px}}</style></head><body><header class="top"><a href="botany-neet-path.html">← BACK TO BOTANY PATH</a></header><main class="wrap"><div class="meta"><span id="count">QUESTION 1 OF 20</span><span id="xp">⭐ 0 XP</span></div><div class="bar"><div class="fill" id="fill"></div></div><section class="card"><div class="topic">🌱 PLANT KINGDOM • BASIS OF CLASSIFICATION</div><div class="q" id="q"></div><div id="options"></div><div id="feedback" class="feedback"></div><button id="next" class="next">CONTINUE →</button></section><div class="xp">Answer correctly to earn XP and build your Botany streak.</div></main><script>const qs=[["Which feature is an important basis for classifying plants?","Blood circulation","Cell structure","Body temperature","Nervous system",1,"Plant classification considers characters such as cell structure, body organisation, reproduction and phylogeny."],["In plant classification, body organisation refers mainly to the level of structural complexity of the plant body.","True","False","Only flowering plants","Only seed plants",0,"Body organisation is a major criterion used to distinguish different plant groups."],["Which of the following is NOT generally used as a basis for plant classification?","Mode of nutrition","Reproductive characters","Phylogenetic relationships","Blood group",3,"Blood groups are not a plant classification criterion."],["Phylogenetic classification is based mainly on:","Evolutionary relationships","Plant height only","Leaf colour only","Habitat only",0,"Phylogenetic classification reflects evolutionary relationships among organisms."],["Which combination best represents major bases of plant classification?","Cell structure, body organisation and reproduction","Blood pressure, pulse and respiration","Body temperature and blood group","Only plant colour",0,"Multiple characters including cell structure, body organisation and reproductive features are considered."],["Which plant group has the simplest body organisation among the following?","Algae","Gymnosperms","Angiosperms","Pteridophytes",0,"Algae generally have a simple thalloid body organisation."],["The presence or absence of vascular tissue helps in classifying plants into major groups.","True","False","Only in animals","Only in fungi",0,"Vascular tissue is an important feature distinguishing major plant groups."],["Which feature is especially useful for distinguishing seed plants from non-seed plants?","Presence of seeds","Leaf colour","Plant height","Age of plant",0,"Seed production is a major feature separating gymnosperms and angiosperms from cryptogams."],["Reproductive characters are useful in plant classification because they are often:","Relatively stable and informative","Completely random","Unrelated to evolution","Absent in all plants",0,"Reproductive features provide important evidence for relationships and classification."],["Plants with flowers and fruits belong to:","Angiosperms","Bryophytes","Pteridophytes","Algae",0,"Angiosperms are flowering plants and produce seeds enclosed within fruits."],["Gymnosperms are characterised by:","Naked seeds","No reproduction","No vascular tissue","Only spores",0,"Gymnosperms bear seeds that are not enclosed within fruits."],["Bryophytes require water for sexual reproduction because:","Male gametes need water to reach the female gamete","They produce seeds","They have flowers","They lack cells",0,"Motile male gametes swim through water to reach the egg."],["Pteridophytes are commonly called:","Vascular cryptogams","Flowering plants","Seedless algae","Non-living plants",0,"Pteridophytes possess vascular tissues but reproduce by spores rather than seeds."],["Which sequence shows increasing structural complexity in a broad plant classification context?","Algae → Bryophytes → Pteridophytes → Seed plants","Seed plants → Algae → Bryophytes → Pteridophytes","Bryophytes → Algae → Seed plants → Pteridophytes","All are identical",0,"This sequence broadly reflects increasing body and vascular complexity."],["Cell structure is considered in classification because it helps identify:","Fundamental similarities and differences","Only plant size","Only habitat","Only colour",0,"Cellular characters reveal important fundamental differences among organisms."],["Mode of nutrition is one criterion used in broader biological classification.","True","False","Never relevant","Only relevant to rocks",0,"Mode of nutrition is among the criteria considered in biological classification."],["Which is a reproductive basis of classification?","Spore formation","Shoe size","Blood group","Pulse rate",0,"Spore formation is an important reproductive character in plant groups."],["A classification based on evolutionary history is called:","Phylogenetic classification","Artificial colour classification","Random classification","Geographical classification only",0,"Phylogenetic systems aim to represent evolutionary relationships."],["The most comprehensive modern approach to classification considers:","Multiple characters and evolutionary relationships","Only one visible character","Plant colour alone","Plant size alone",0,"Modern classification uses many characters and evidence of evolutionary relationships."],["Why is classification important in studying plant diversity?","It organises diversity and shows relationships","It removes biodiversity","It changes plant genes","It stops reproduction",0,"Classification makes the enormous diversity of plants easier to study and understand."]];let i=0,xp=0,locked=false;const q=document.getElementById('q'),o=document.getElementById('options'),f=document.getElementById('feedback'),n=document.getElementById('next');function render(){locked=false;f.className='feedback';n.className='next';const z=qs[i];document.getElementById('count').textContent='QUESTION '+(i+1)+' OF '+qs.length;document.getElementById('fill').style.width=((i+1)/qs.length*100)+'%';q.textContent=z[0];o.innerHTML='';z.slice(1,5).forEach((a,k)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+k)+'. '+a;b.onclick=()=>answer(k,b);o.appendChild(b)})}function answer(k,b){if(locked)return;locked=true;const z=qs[i],all=[...document.querySelectorAll('.option')],ok=k===z[5];all.forEach((v,j)=>{v.disabled=true;if(j===z[5])v.classList.add('correct')});if(ok){xp+=10;document.getElementById('xp').textContent='⭐ '+xp+' XP';f.className='feedback show good';f.innerHTML='✅ Correct! +10 XP<br><small>'+z[6]+'</small>'}else{b.classList.add('wrong');f.className='feedback show bad';f.innerHTML='❌ Not quite.<br><small>'+z[6]+'</small>'}n.className='next show'}n.onclick=()=>{if(i<qs.length-1){i++;render()}else{q.textContent='🎉 Plant Kingdom Basics Complete!';o.innerHTML='You earned '+xp+' XP.';f.className='feedback show good';f.textContent='Great work! Continue your Botany learning path.';n.className='next';}};render();</script></body></html>
