The prothallus is generally:","Diploid and dependent","Haploid and photosynthetic","Triploid and seed-bearing","Diploid and flowering",1,"The prothallus is a haploid gametophyte and is usually photosynthetic."],["Plant Kingdom MCQ 12: The male sex organ on a pteridophyte gametophyte is:","Antheridium","Archegonium","Sporangium","Sorus",0,"Antheridia produce male gametes."],["Plant Kingdom MCQ 13: The female sex organ on a pteridophyte gametophyte is:","Antheridium","Archegonium","Sporophyll","Sorus",1,"Archegonia contain the egg."],["Plant Kingdom MCQ 14: Fertilisation in most plant-kingdom requires:","Water","Pollination","Wind only","Fruit formation",0,"Motile male gametes require water to reach the egg."],["Plant Kingdom MCQ 15: The zygote of a pteridophyte develops into the:","Sporophyte","Gametophyte","Spore","Sorus",0,"The diploid zygote develops into the sporophyte."],["Plant Kingdom MCQ 16: The dominant generation in plant-kingdom is:","Haploid gametophyte","Diploid sporophyte","Triploid endosperm","Diploid prothallus",1,"The sporophyte is the dominant diploid generation."],["Plant Kingdom MCQ 17: Which pteridophyte is homosporous?","Lycopodium","Selaginella","Salvinia","Marsilea",0,"Lycopodium is homosporous, producing one type of spore."],["Plant Kingdom MCQ 18: Which genus is heterosporous?","Selaginella","Lycopodium","Equisetum","Pteris",0,"Selaginella produces two kinds of spores and is heterosporous."],["Plant Kingdom MCQ 19: Heterosporous plant-kingdom produce:","Microspores and megaspores","Seeds and fruits","Pollen and ovules","Only one kind of spore",0,"Heterospory involves production of microspores and megaspores."],["Plant Kingdom MCQ 20: Microspores develop into:","Male gametophytes","Female gametophytes","Sporophytes directly","Seeds",0,"Microspores give rise to male gametophytes."],["Plant Kingdom MCQ 21: Megaspores develop into:","Female gametophytes","Male gametophytes","Sporophytes directly","Sori",0,"Megaspores give rise to female gametophytes."],["Plant Kingdom MCQ 22: Which pair is correctly matched?","Selaginella — heterosporous","Lycopodium — heterosporous","Pteris — gymnosperm","Marchantia — pteridophyte",0,"Selaginella is a heterosporous pteridophyte."],["Plant Kingdom MCQ 23: Which pair represents heterosporous plant-kingdom mentioned in NCERT?","Selaginella and Salvinia","Lycopodium and Pteris","Equisetum and Adiantum","Funaria and Riccia",0,"Selaginella and Salvinia are classic NCERT examples of heterospory."],["Plant Kingdom MCQ 24: Which of the following is NOT a pteridophyte?","Funaria","Pteris","Equisetum","Adiantum",0,"Funaria is a bryophyte."],["Plant Kingdom MCQ 25: The leaves of ferns are commonly called:","Fronds","Needles","Cotyledons","Scales",0,"Large fern leaves are called fronds."],["Plant Kingdom MCQ 26: In ferns, young leaves often show:","Circinate vernation","Parallel venation only","Seed dormancy","Secondary growth",0,"Young fern leaves commonly show circinate vernation."],["Plant Kingdom MCQ 27: Equisetum is commonly known as:","Horsetail","Club moss","Water fern","Liverwort",0,"Equisetum is commonly called horsetail."],["Plant Kingdom MCQ 28: Lycopodium is commonly known as:","Club moss","True moss","Horsetail","Liverwort",0,"Lycopodium is commonly called club moss, though it is a pteridophyte."],["Plant Kingdom MCQ 29: The sporophyte of plant-kingdom is generally:","Independent","Completely dependent on gametophyte","Absent","A seed",0,"The pteridophyte sporophyte is an independent plant body."],["Plant Kingdom MCQ 30: The gametophyte of most plant-kingdom is generally:","Small and inconspicuous","Large and dominant","Woody","Seed-bearing",0,"The gametophyte is small compared with the dominant sporophyte."],["Plant Kingdom MCQ 31: Which tissue system distinguishes plant-kingdom from bryophytes?","Xylem and phloem","Epidermis only","Chlorophyll","Cell wall",0,"Plant Kingdom possess well-developed vascular tissues, unlike bryophytes."],["Plant Kingdom MCQ 32: The alternation of generations in plant-kingdom occurs between:","Gametophyte and sporophyte","Root and shoot","Seed and fruit","Flower and cone",0,"Plant Kingdom alternate between haploid gametophyte and diploid sporophyte."],["Plant Kingdom MCQ 33: Spores in the sporangia are usually produced by:","Meiosis","Mitosis only","Fertilisation","Pollination",0,"Meiosis in sporogenous tissue produces haploid spores."],["Plant Kingdom MCQ 34: Gametes in the haploid gametophyte are produced by:","Mitosis","Meiosis","Fertilisation","Pollination",0,"A haploid gametophyte produces gametes by mitosis."],["Plant Kingdom MCQ 35: The correct sequence is:","Spore → Gametophyte → Gametes → Zygote → Sporophyte","Seed → Fruit → Gametophyte","Sporophyte → Fruit → Seed","Pollen → Ovule → Fruit",0,"Spores form gametophytes, which produce gametes; fertilisation forms a zygote that develops into a sporophyte."],["Plant Kingdom MCQ 36: Which statement is correct?","Plant Kingdom reproduce by spores","Plant Kingdom produce fruits","All plant-kingdom produce seeds","Plant Kingdom have flowers",0,"Plant Kingdom are seedless vascular plants that reproduce by spores."],["Plant Kingdom MCQ 37: Which feature is absent in plant-kingdom?","Flowers","Vascular tissue","True roots","Sporangia",0,"Plant Kingdom have vascular tissue and true organs but lack flowers."],["Plant Kingdom MCQ 38: Which feature is absent in plant-kingdom?","Seeds","Sporophyte","Gametophyte","Vascular tissue",0,"Plant Kingdom are seedless plants."],["Plant Kingdom MCQ 39: The male gametes of plant-kingdom are generally:","Motile","Immobile pollen grains","Enclosed in fruits","Produced in anthers",0,"Motile male gametes swim through water to reach the egg."],["Plant Kingdom MCQ 40: Why are plant-kingdom dependent on water for sexual reproduction?","Male gametes need water to reach the egg","Seeds need water to germinate","Fruits form only in water","Sporophytes are aquatic",0,"Water provides a medium for motile male gametes to reach the archegonium."],["Plant Kingdom MCQ 41: The prothallus usually bears:","Antheridia and archegonia","Flowers and fruits","Sori only","Seeds and ovules",0,"The gametophyte bears male and female sex organs."],["Plant Kingdom MCQ 42: Which statement about homospory is correct?","Only one type of spore is produced","Microspores and megaspores are produced","Seeds are produced","Fruits are produced",0,"Homosporous plants produce only one type of spore."],["Plant Kingdom MCQ 43: Heterospory refers to production of:","Two different sizes/types of spores","Two kinds of flowers","Two kinds of seeds","Only diploid spores",0,"Heterospory involves distinct microspores and megaspores."],["Plant Kingdom MCQ 44: Which is an aquatic pteridophyte?","Salvinia","Pinus","Funaria","Cycas",0,"Salvinia is an aquatic heterosporous pteridophyte."],["Plant Kingdom MCQ 45: Which statement best explains the evolutionary significance of heterospory?","It is a precursor to seed habit","It directly produces flowers","It eliminates gametophytes","It creates fruits",0,"Retention and development of megaspore-related structures are linked to the evolution of seed habit."],["Plant Kingdom MCQ 46: In a typical fern, sori are commonly found:","On the underside of fertile fronds","Inside flowers","On roots only","Inside fruits",0,"Ferns commonly bear sori on fertile leaves, often on their lower surface."],["Plant Kingdom MCQ 47: Which of the following is a vascular cryptogam?","Pteris","Marchantia","Mango","Pinus",0,"Pteris is a seedless vascular plant, hence a vascular cryptogam."],["Plant Kingdom MCQ 48: Statement I: Plant Kingdom have a dominant sporophyte. Statement II: Their gametophyte is called a prothallus. Choose the correct option.","Both statements are correct","Only Statement I is correct","Only Statement II is correct","Both statements are incorrect",0,"Both statements are correct for typical plant-kingdom."],["Plant Kingdom MCQ 49: Which combination is characteristic of plant-kingdom?","Vascular tissue + spores + dominant sporophyte","Seeds + fruits + flowers","No vascular tissue + dominant gametophyte","Pollen + ovules + fruits",0,"Plant Kingdom are vascular, spore-producing plants with a dominant sporophyte."],["Plant Kingdom MCQ 50: Which sequence correctly represents the pteridophyte life cycle?","Sporophyte → spores → gametophyte → gametes → zygote → sporophyte","Gametophyte → seeds → fruits → sporophyte","Sporophyte → flowers → seeds → gametophyte","Spore → fruit → seed → sporophyte",0,"The sporophyte produces spores; spores form gametophytes; gametes fuse to form a zygote that develops into the sporophyte."]];let i=0,lock=false,round=1,queue=qs.map((_,index)=>index),mastered=new Set(),wrongThisRound=[],firstAttempts=0,firstCorrect=0,totalWrong=0;
