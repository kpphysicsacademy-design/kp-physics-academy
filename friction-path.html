h Rough Block','Atwood System with Friction','Multiple Blocks','Friction and Constraints','Acceleration of Connected Blocks','Advanced Connected Problems']],['🟠','07 • Friction Applications',['Friction in Lift','Friction in Accelerating Frame','Friction in Wedge','Friction in Circular Motion','Friction and Turning','Vehicle on Road','Banking with Friction','Everyday Applications','Application Problems']],['🟠','08 • Advanced Friction',['Variable Applied Force','Minimum and Maximum Force','Multiple Contact Surfaces','Multiple Friction Coefficients','Limiting Equilibrium','Friction Direction Traps','Combined Newton Laws + Friction','Advanced Numericals']],['🔴','09 • JEE Practice',['JEE Main Conceptual','JEE Main Numerical','JEE Main Multi-step','JEE Advanced Conceptual','JEE Advanced Numerical','Friction + Newton Laws','Friction + Inclined Plane','Friction + Pulley','Mixed Challenge']],['🏆','10 • Final Mastery',['Concept Test','Static Friction Test','Kinetic Friction Test','Horizontal Surface Test','Inclined Plane Test','Connected Systems Test','Advanced Friction Test','JEE Main Test','JEE Advanced Test','Wrong-Question Revision','Final Unseen Mastery']]];const lessons=[];sections.forEach(s=>s[2].forEach(x=>lessons.push({name:x,section:s[1]})));const done=+localStorage.getItem('kp_friction_completed')||0;let n=0,out='';sections.forEach(s=>{out+=`<section class="section"><h2>${s[0]} ${s[1]}</h2><p class="muted">${s[2].length} lessons • 5 MCQs per task</p><div class="path">`;s[2].forEach(x=>{const i=n++,d=i<done;out+=`<div class="lesson"><div class="node"><h3>${d?'🏆 ':s[0]+' '}${i+1}. ${x}</h3><p>${s[1]} • Zero → Hero</p><span class="tag">${d?'MASTERED':'UNLOCKED'}</span><a class="btn" href="friction-lesson.html?id=${i}">${d?'Review':'Start Task →'}</a></div></div>`});out+='</div></section>'});document.getElementById('content').innerHTML=out;document.getElementById('count').textContent=lessons.length;document.getElementById('xp').textContent=done*10;document.getElementBy
