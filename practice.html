<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Practice — Select Your Target</title><link rel="stylesheet" href="common.css"></head><body><header class="top"><div class="brand">🚀SKILLUP<small>LEARN • PRACTICE • MASTER</small></div></header><main class="wrap"><section class="hero"><div class="icon">🎯</div><h1>Practice</h1><p>Choose your target first. SkillUp will build the right practice path.</p></section><section class="step"><div class="step-title">1️⃣ Select Your Target</div><div class="grid" id="goals"><button class="choice" data-goal="neet">🩺 NEET<small>Medical entrance</small></button><button class="choice" data-goal="jee-main">🎯 IIT-JEE Main<small>Engineering entrance</small></button><button class="choice" data-goal="jee-advanced">🏆 IIT-JEE Advanced<small>Advanced engineering</small></button><button class="choice" data-goal="olympiad">🧠 Olympiad<small>Science & Mathematics</small></button><button class="choice" data-goal="spellbee">🔤 SpellBee<small>English language competition</small></button></div></section><section class="step hidden" id="classStep"><div class="step-title">2️⃣ Select Your Class</div><div class="grid" id="classes"></div></section><section class="step hidden" id="subjectStep"><div class="step-title">3️⃣ Select Subject</div><div class="grid" id="subjects"></div></section><section class="step hidden" id="ready"><div class="summary" id="summary"></div><button class="start" id="start">🚀 START PRACTICE</button></section></main><script>const state={goal:'',cls:'',subject:''};const goalButtons=[...document.querySelectorAll('[data-goal]')];const classStep=document.getElementById('classStep'),subjectStep=document.getElementById('subjectStep'),ready=document.getElementById('ready'),classes=document.getElementById('classes'),subjects=document.getElementById('subjects'),summary=document.getElementById('summary'),start=document.getElementById('start');const allClasses=[6,7,8,9,10,11,12];const seniorClasses=[11,12];const data={neet:{11:[['Physics','physics'],['Chemistry','chemistry'],['Botany','botany'],['Zoology','zoology']],12:[['Physics','physics'],['Chemistry','chemistry'],['Botany','botany'],['Zoology','zoology']]},'jee-main':{11:[['Physics','physics'],['Chemistry','chemistry'],['Mathematics','maths']],12:[['Physics','physics'],['Chemistry','chemistry'],['Mathematics','maths']]},'jee-advanced':{11:[['Physics','physics'],['Chemistry','chemistry'],['Mathematics','maths']],12:[['Physics','physics'],['Chemistry','chemistry'],['Mathematics','maths']]},olympiad:{6:[['Science','science'],['Mathematics','maths']],7:[['Science','science'],['Mathematics','maths']],8:[['Natural Science','ns'],['Physical Science','ps'],['Mathematics','maths']],9:[['Natural Science','ns'],['Physical Science','ps'],['Mathematics','maths']],10:[['Natural Science','ns'],['Physical Science','ps'],['Mathematics','maths']],11:[['Physics','physics'],['Chemistry','chemistry'],['Biology','biology'],['Mathematics','maths']],12:[['Physics','physics'],['Chemistry','chemistry'],['Biology','biology'],['Mathematics','maths']]},spellbee:{6:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']],7:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']],8:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']],9:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']],10:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']],11:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']],12:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']]}};const goalNames={neet:'NEET','jee-main':'IIT-JEE Main','jee-advanced':'IIT-JEE Advanced',olympiad:'Olympiad',spellbee:'SpellBee'};function choose(arr,container,type){container.innerHTML='';arr.forEach(([label,val])=>{const b=document.createElement('button');b.className='choice';b.textContent=type==='class'?`Class ${label}`:label;b.dataset.value=val;b.onclick=()=>{[...container.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(type==='class'){state.cls=val;state.subject='';showSubjects()}else{state.subject=val;showReady()}};container.appendChild(b)})}function showSubjects(){subjectStep.classList.remove('hidden');ready.classList.add('hidden');choose(data[state.goal][state.cls]||[],subjects,'subject');subjectStep.scrollIntoView({behavior:'smooth',block:'nearest'})}function showReady(){ready.classList.remove('hidden');summary.textContent=`Target: ${goalNames[state.goal]}  •  Class ${state.cls}  •  Subject: ${state.subject==='english-spellbee'?'English SpellBee':state.subject==='word-power'?'Word Power':state.subject==='maths'?'Mathematics':state.subject==='ns'?'Natural Science':state.subject==='ps'?'Physical Science':state.subject.charAt(0).toUpperCase()+state.subject.slice(1)}`;ready.scrollIntoView({behavior:'smooth',block:'nearest'})}goalButtons.forEach(b=>b.onclick=()=>{goalButtons.forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state.goal=b.dataset.goal;state.cls='';state.subject='';classStep.classList.remove('hidden');subjectStep.classList.add('hidden');ready.classList.add('hidden');choose((state.goal==='neet'||state.goal==='jee-main'||state.goal==='jee-advanced'?seniorClasses:allClasses).map(x=>[x,String(x)]),classes,'class');classStep.scrollIntoView({behavior:'smooth',block:'nearest'})});start.onclick=()=>{const params=new URLSearchParams({goal:state.goal,class:state.cls,subject:state.subject});window.location.href='question-bank.html?'+params.toString()};</script><script src="routes.js"></script><script src="navigation.js"></script><script src="pages.js"></script><script src="link-audit.js"></script>
</body></html>
