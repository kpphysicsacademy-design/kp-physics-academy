<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | NEET Practice</title><link rel="stylesheet" href="common.css"></head><body><header class="top"><div class="brand">🚀SkillUp<small>NEET • PRACTICE • MASTER</small></div></header><main class="wrap"><section class="hero"><div class="icon">🎯</div><h1>NEET Practice</h1><p>Choose a NEET subject and start focused practice.</p></section><section class="step"><div class="step-title">1️⃣ Select NEET Subject</div><div class="grid" id="subjects"></div></section><section class="step hidden" id="ready"><div class="summary" id="summary"></div><button class="start" id="start">🚀 START PRACTICE</button></section></main><script>const subjects=document.getElementById('subjects'),ready=document.getElementById('ready'),summary=document.getElementById('summary'),start=document.getElementById('start');const data=[['⚡','Physics','physics'],['🧪','Chemistry','chemistry'],['🌿','Botany','botany'],['🦋','Zoology','zoology']];let subject='';data.forEach(([icon,label,value])=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`${icon} ${label}`;b.onclick=()=>{document.querySelectorAll('#subjects .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');subject=value;ready.classList.remove('hidden');summary.textContent=`NEET • Subject: ${label}`;ready.scrollIntoView({behavior:'smooth',block:'nearest'})};subjects.appendChild(b)});start.onclick=()=>{if(!subject)return;window.location.href='question-bank.html?goal=neet&subject='+encodeURIComponent(subject)};</script><script src="routes.js"></script><script src="navigation.js"></script><script src="pages.js"></script><script src="link-audit.js"></script>
</body></html>
