<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SkillUp | Physics Practice Path</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#f7f9fc;color:#172033}
.topbar{height:50px;background:#071a31;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px;position:sticky;top:0;z-index:20}.brand{font-size:16px;font-weight:950;white-space:nowrap}.brand small{display:block;font-size:8px;letter-spacing:1.5px;color:#8db9e8;margin-top:2px}.subject-select{background:#102744;color:#fff;border:1px solid #4b6fa0;border-radius:12px;padding:7px 28px 7px 10px;font-size:12px;font-weight:950;max-width:220px}.stats{display:flex;gap:7px}.pill{background:#102744;border:1px solid #294765;border-radius:12px;padding:5px 8px;font-size:9px;font-weight:900;white-space:nowrap}
main{padding:7px 7px 62px}.page{max-width:760px;margin:0 auto}.title{text-align:center;color:#1687ff;font-size:20px;line-height:1.15;margin:9px 0 3px}.subtitle{text-align:center;color:#667085;font-size:8px;margin:0 0 10px}
.path-card{background:#fff;border-radius:16px;padding:9px 7px 12px;box-shadow:0 5px 22px rgba(23,32,51,.08)}.path-title{text-align:center;color:#126fcf;font-size:20px;font-weight:950;margin:2px 0 2px}.path-sub{text-align:center;color:#667085;font-size:8px;margin-bottom:8px}.progress-wrap{margin:0 auto 8px;max-width:500px}.progress-label{display:flex;justify-content:space-between;font-size:8px;font-weight:900;color:#475467;margin-bottom:3px}.progress{height:8px;background:#e7edf4;border-radius:99px;overflow:hidden}.progress-bar{height:100%;width:0;background:#1687ff;border-radius:99px}
.path-road{position:relative;max-width:620px;margin:0 auto;padding:4px 0 8px}.path-road:before{content:"";position:absolute;left:50%;top:10px;bottom:12px;width:4px;background:#dfe7ef;border-radius:99px;transform:translateX(-50%)}
.path-node{position:relative;display:flex;align-items:center;justify-content:center!important;min-height:72px;margin:1px 0;padding:0!important;z-index:2}.path-node .node-wrap{width:170px;display:flex;align-items:center;gap:8px}.path-node:nth-child(odd) .node-wrap{flex-direction:row-reverse;text-align:right;transform:translateX(-40px)}.path-node:nth-child(even) .node-wrap{text-align:left;transform:translateX(40px)}
.path-node a{width:62px;height:62px;flex:0 0 62px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:#fff;font-size:9px;font-weight:950;text-align:center;line-height:1.08;border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .15s,filter .15s}.path-node a:hover{transform:translateY(-2px);filter:brightness(1.04)}.path-node .node-label{font-size:7px;font-weight:900;color:#344054;line-height:1.15}.path-node .node-number{font-size:7px;color:#98a2b3;font-weight:800;margin-bottom:2px}
.foundation a{background:#22a06b}.mechanics a{background:#1687ff}.thermal a{background:#f59e0b}.waves a{background:#7c5cff}.electric a{background:#0ea5a5}.optics a{background:#e0569a}.modern a{background:#e05252}.exam a{background:#f2b705;color:#172033}
.path-note{text-align:center;color:#667085;font-size:8px;margin-top:2px}.section-title{text-align:center;color:#126fcf;font-size:10px;font-weight:950;margin:10px 0 5px}.empty-note{display:none}
.bottom{position:fixed;bottom:0;left:0;right:0;height:48px;background:#fff;border-top:1px solid #dfe7ef;display:flex;z-index:100;box-shadow:0 -5px 18px #17203312}.bottom a{flex:1;text-align:center;color:#667085;text-decoration:none;font-size:7px;font-weight:900;padding-top:4px}.bottom span{display:block;font-size:15px;margin-bottom:2px}.bottom .active{color:#1687ff}
@media(max-width:720px){.brand{font-size:13px}.subject-select{max-width:175px;font-size:11px;padding:6px 24px 6px 8px}.stats .pill:last-child{display:none}.title{font-size:20px}.path-title{font-size:18px}.path-road{max-width:330px}.path-node{min-height:65px}.path-node .node-wrap{width:145px;gap:5px}.path-node:nth-child(odd) .node-wrap{transform:translateX(-40px)}.path-node:nth-child(even) .node-wrap{transform:translateX(40px)}.path-node a{width:62px;height:62px;flex-basis:62px;font-size:8px}.path-node .node-label,.path-node .node-number{font-size:7px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand">SKILLUP<small>PRACTICE</small></div><select id="subjectSelect" class="subject-select" aria-label="Select subject"><option value="physics">SkillUp Physics</option><option value="chemistry">SkillUp Chemistry</option><option value="botany">SkillUp Botany</option><option value="zoology">SkillUp Zoology</option><option value="maths">SkillUp Maths</option></select><div class="stats"><span class="pill">🔥 7</span><span class="pill">⭐ 420 XP</span><span class="pill">❤️ 5</span></div></header>
<main><div class="page">
<h1 class="title">⚡ Physics Practice Path</h1><p class="subtitle">Complete Physics — learn by topic, not by class</p>
<section class="path-card">
<div class="path-title">COMPLETE PHYSICS TOPIC PATH</div><div class="path-sub">Foundations → NEET / JEE-IIT</div>
<div class="progress-wrap"><div class="progress-label"><span id="progressText">0 / 31 topics</span><span>Physics Path</span></div><div class="progress"><div class="progress-bar" id="progressBar"></div></div></div>
<div class="path-road" id="physicsPath"></div><div class="path-note">Tap any circle to open its topic practice.</div>
</section></div></main>
<nav class="bottom"><a id="homeLink"><span>🏠</span>Home</a><a id="learnLink"><span>🧭</span>Learn</a><a class="active" id="practiceLink"><span>🎯</span>Practice</a><a id="leagueLink"><span>🏆</span>League</a><a id="profileLink"><span>👤</span>Profile</a></nav>
<script>
(function(){
const VERSION='20260826.6';
const p=new URLSearchParams(location.search),allowed=['physics','chemistry','botany','zoology','maths'];
const subject=(allowed.includes((p.get('subject')||'physics').toLowerCase())?(p.get('subject')||'physics'):'physics').toLowerCase();
const pages={physics:'physics-learn.html',chemistry:'chemistry-learn.html',botany:'botany-learn.html',zoology:'zoology-learn.html',maths:'maths-learn.html'};
function u(path,extra){const x=new URL(path,location.href);x.searchParams.set('v',VERSION);if(extra)Object.keys(extra).forEach(k=>x.searchParams.set(k,extra[k]));return x.pathname+'?'+x.searchParams.toString()}
const select=document.getElementById('subjectSelect');select.value=subject;select.onchange=()=>location.href=u('practice.html',{subject:select.value});
document.getElementById('homeLink').href=u('skillup-home.html');document.getElementById('learnLink').href=u(pages[subject]);document.getElementById('practiceLink').href=u('practice.html',{subject});document.getElementById('leagueLink').href=u('league.html',{subject});document.getElementById('profileLink').href=u('profile.html');
const topics=[
['Units & Measurements','Units\n&\nMeasurements','foundation','units-measurements'],['Basic Mathematics for Physics','Basic\nMaths','foundation','basic-mathematics'],['Vectors','Vectors','foundation','vectors'],['Motion & Kinematics','Motion &\nKinematics','mechanics','motion-kinematics'],['Relative Motion','Relative\nMotion','mechanics','relative-motion'],['Laws of Motion','Laws of\nMotion','mechanics','laws-of-motion'],['Friction','Friction','mechanics','friction'],['Work, Energy & Power','Work, Energy\n& Power','mechanics','work-energy-power'],['Circular Motion','Circular\nMotion','mechanics','circular-motion'],['Centre of Mass & Momentum','COM &\nMomentum','mechanics','centre-of-mass-momentum'],['Rotational Motion','Rotational\nMotion','mechanics','rotational-motion'],['Gravitation','Gravitation','mechanics','gravitation'],['Properties of Matter','Properties\nof Matter','thermal','properties-of-matter'],['Thermal Physics','Thermal\nPhysics','thermal','thermal-physics'],['Thermodynamics','Thermo-\ndynamics','thermal','thermodynamics'],['Kinetic Theory','Kinetic\nTheory','thermal','kinetic-theory'],['Oscillations','Oscillations','waves','oscillations'],['Waves','Waves','waves','waves'],['Electrostatics','Electro-\nstatics','electric','electrostatics'],['Current Electricity','Current\nElectricity','electric','current-electricity'],['Magnetism','Magnetism','electric','magnetism'],['Electromagnetic Induction','EM\nInduction','electric','electromagnetic-induction'],['Alternating Current','Alternating\nCurrent','electric','alternating-current'],['Electromagnetic Waves','EM\nWaves','electric','electromagnetic-waves'],['Ray Optics','Ray\nOptics','optics','ray-optics'],['Wave Optics','Wave\nOptics','optics','wave-optics'],['Dual Nature','Dual\nNature','modern','dual-nature'],['Atoms & Nuclei','Atoms &\nNuclei','modern','atoms-nuclei'],['Semiconductors','Semi-\nconductors','modern','semiconductors'],['NEET Physics','NEET\nPhysics','exam','neet'],['JEE / IIT Physics','JEE / IIT\nPhysics','exam','jee']
];
function topicUrl(t){const q=new URLSearchParams();q.set('subject','physics');if(t[3]==='neet')q.set('track','neet');else if(t[3]==='jee')q.set('track','jee');else q.set('topic',t[3]);return 'question-bank.html?'+q.toString()+'&v='+VERSION}
const road=document.getElementById('physicsPath');topics.forEach((t,i)=>{const node=document.createElement('div');node.className='path-node '+t[2];const wrap=document.createElement('div');wrap.className='node-wrap';const a=document.createElement('a');a.href=topicUrl(t);a.innerText=t[1];const label=document.createElement('div');label.innerHTML='<div class="node-number">'+String(i+1).padStart(2,'0')+'</div><div class="node-label">'+t[0]+'</div>';wrap.append(a,label);node.appendChild(wrap);road.appendChild(node)});
document.getElementById('progressText').innerText='0 / '+topics.length+' topics';
document.getElementById('progressBar').style.width='0%';
})();
</script>
</body></html>
