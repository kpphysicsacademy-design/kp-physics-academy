<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Practice — Select Your Target</title><link rel="stylesheet" href="common.css"><style>*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#172033;font-family:Inter,Arial,sans-serif;min-height:100vh;padding-bottom:62px}.top{height:58px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 9px;position:sticky;top:0;z-index:20}.brand{font-size:14px;font-weight:950}.brand small{display:block;color:#7652d9;font-size:6px;letter-spacing:1.3px;text-align:center;margin-top:2px}.wrap{max-width:560px;margin:auto;padding:12px 10px 70px}.hero{text-align:center;padding:7px 4px 12px}.hero .icon{font-size:25px}.hero h1{font-size:22px;margin:4px 0}.hero p{font-size:8px;color:#667085;margin:0}.step{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:12px;margin:10px 0}.step-title{font-size:11px;font-weight:950;margin-bottom:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:2px solid #e2e8f0;border-radius:13px;background:#fff;padding:11px 7px;text-align:center;cursor:pointer;font-weight:950;font-size:10px;color:#172033}.choice small{display:block;color:#667085;font-size:7px;margin-top:3px}.choice.selected{border-color:#7652d9;background:#f2efff;box-shadow:0 3px 0 #d9d1f5}.hidden{display:none}.summary{background:#eefbf1;border:1px solid #b9e6c2;border-radius:14px;padding:10px;font-size:8px;line-height:1.5;margin-top:10px}.start{display:block;width:100%;border:0;background:#58cc02;color:#fff;text-align:center;text-decoration:none;padding:13px;border-radius:14px;font-size:12px;font-weight:950;box-shadow:0 4px 0 #46a302;cursor:pointer;margin-top:10px}.bottom{position:fixed;left:0;right:0;bottom:0;height:48px;background:#fff;border-top:1px solid #e2e7ef;display:flex;z-index:30;box-shadow:0 -4px 14px rgba(23,32,51,.08)}.bottom a{flex:1;text-align:center;text-decoration:none;color:#667085;font-size:7px;font-weight:900;padding-top:4px}.bottom span{display:block;font-size:15px;margin-bottom:2px}.bottom .active{color:#7652d9}@media(max-width:360px){.brand{font-size:12px}.choice{font-size:9px;padding:10px 5px}}</style></head><body><header class="top"><div class="brand">🚀 SKILLUP<small>LEARN • PRACTICE • MASTER</small></div></header><main class="wrap"><section class="hero"><div class="icon">🎯</div><h1>Practice</h1><p>Choose your target first. SkillUp will build the right practice path.</p></section><section class="step"><div class="step-title">1️⃣ Select Your Target</div><div class="grid" id="goals"><button class="choice" data-goal="neet">🩺 NEET<small>Medical entrance</small></button><button class="choice" data-goal="jee-main">🎯 IIT-JEE Main<small>Engineering entrance</small></button><button class="choice" data-goal="jee-advanced">🏆 IIT-JEE Advanced<small>Advanced engineering</small></button><button class="choice" data-goal="olympiad">🧠 Olympiad<small>Science & Mathematics</small></button><button class="choice" data-goal="spellbee">🔤 SpellBee<small>English language competition</small></button></div></section><section class="step hidden" id="classStep"><div class="step-title">2️⃣ Select Your Class</div><div class="grid" id="classes"></div></section><section class="step hidden" id="subjectStep"><div class="step-title">3️⃣ Select Subject</div><div class="grid" id="subjects"></div></section><section class="step hidden" id="ready"><div class="summary" id="summary"></div><button class="start" id="start">🚀 START PRACTICE</button></section></main><nav class="bottom"><a href="skillup-home.html"><span>🏠</span>Home</a><a href="learn.html"><span>🧭</span>Learn</a><a class="active" href="practice.html"><span>🎯</span>Practice</a><a href="league.html"><span>🏆</span>League</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const state={goal:'',cls:'',subject:''};const goalButtons=[...document.querySelectorAll('[data-goal]')];const classStep=document.getElementById('classStep'),subjectStep=document.getElementById('subjectStep'),ready=document.getElementById('ready'),classes=document.getElementById('classes'),subjects=document.getElementById('subjects'),summary=document.getElementById('summary'),start=document.getElementById('start');const allClasses=[6,7,8,9,10,11,12];const seniorClasses=[11,12];const data={neet:{11:[['Physics','physics'],['Chemistry','chemistry'],['Botany','botany'],['Zoology','zoology']],12:[['Physics','physics'],['Chemistry','chemistry'],['Botany','botany'],['Zoology','zoology']]},'jee-main':{11:[['Physics','physics'],['Chemistry','chemistry'],['Mathematics','maths']],12:[['Physics','physics'],['Chemistry','chemistry'],['Mathematics','maths']]},'jee-advanced':{11:[['Physics','physics'],['Chemistry','chemistry'],['Mathematics','maths']],12:[['Physics','physics'],['Chemistry','chemistry'],['Mathematics','maths']]},olympiad:{6:[['Science','science'],['Mathematics','maths']],7:[['Science','science'],['Mathematics','maths']],8:[['Natural Science','ns'],['Physical Science','ps'],['Mathematics','maths']],9:[['Natural Science','ns'],['Physical Science','ps'],['Mathematics','maths']],10:[['Natural Science','ns'],['Physical Science','ps'],['Mathematics','maths']],11:[['Physics','physics'],['Chemistry','chemistry'],['Biology','biology'],['Mathematics','maths']],12:[['Physics','physics'],['Chemistry','chemistry'],['Biology','biology'],['Mathematics','maths']]},spellbee:{6:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']],7:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']],8:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']],9:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']],10:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']],11:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']],12:[['English SpellBee','english-spellbee'],['Vocabulary','vocabulary'],['Grammar','grammar'],['Reading','reading'],['Word Power','word-power']]}};const goalNames={neet:'NEET','jee-main':'IIT-JEE Main','jee-advanced':'IIT-JEE Advanced',olympiad:'Olympiad',spellbee:'SpellBee'};function choose(arr,container,type){container.innerHTML='';arr.forEach(([label,val])=>{const b=document.createElement('button');b.className='choice';b.textContent=type==='class'?`Class ${label}`:label;b.dataset.value=val;b.onclick=()=>{[...container.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(type==='class'){state.cls=val;state.subject='';showSubjects()}else{state.subject=val;showReady()}};container.appendChild(b)})}function showSubjects(){subjectStep.classList.remove('hidden');ready.classList.add('hidden');choose(data[state.goal][state.cls]||[],subjects,'subject');subjectStep.scrollIntoView({behavior:'smooth',block:'nearest'})}function showReady(){ready.classList.remove('hidden');summary.textContent=`Target: ${goalNames[state.goal]}  •  Class ${state.cls}  •  Subject: ${state.subject==='english-spellbee'?'English SpellBee':state.subject==='word-power'?'Word Power':state.subject==='maths'?'Mathematics':state.subject==='ns'?'Natural Science':state.subject==='ps'?'Physical Science':state.subject.charAt(0).toUpperCase()+state.subject.slice(1)}`;ready.scrollIntoView({behavior:'smooth',block:'nearest'})}goalButtons.forEach(b=>b.onclick=()=>{goalButtons.forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state.goal=b.dataset.goal;state.cls='';state.subject='';classStep.classList.remove('hidden');subjectStep.classList.add('hidden');ready.classList.add('hidden');choose((state.goal==='neet'||state.goal==='jee-main'||state.goal==='jee-advanced'?seniorClasses:allClasses).map(x=>[x,String(x)]),classes,'class');classStep.scrollIntoView({behavior:'smooth',block:'nearest'})});start.onclick=()=>{const params=new URLSearchParams({goal:state.goal,class:state.cls,subject:state.subject});window.location.href='question-bank.html?'+params.toString()};</script><script src="routes.js"></script><script src="navigation.js"></script></body></html>
