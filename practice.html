<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SkillUp | Practice</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:#fff;color:#172033}
.topbar{height:68px;background:#071a31;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px}.brand{font-size:16px;font-weight:950;white-space:nowrap}.brand small{display:block;font-size:8px;letter-spacing:1.5px;color:#8db9e8;margin-top:2px}.subject-select{background:#102744;color:#fff;border:1px solid #4b6fa0;border-radius:12px;padding:9px 32px 9px 12px;font-size:14px;font-weight:950;max-width:220px}.stats{display:flex;gap:7px}.pill{background:#102744;border:1px solid #294765;border-radius:12px;padding:7px 10px;font-size:10px;font-weight:900;white-space:nowrap}
.content{position:fixed;top:68px;bottom:58px;left:0;right:0;background:#fff}.frame{width:100%;height:100%;border:0;background:#fff;display:block}.bottom{position:fixed;bottom:0;left:0;right:0;height:58px;background:#fff;border-top:1px solid #dfe7ef;display:flex;z-index:100;box-shadow:0 -5px 18px #17203312}.bottom a{flex:1;text-align:center;color:#667085;text-decoration:none;font-size:9px;font-weight:900;padding-top:6px}.bottom span{display:block;font-size:20px;margin-bottom:2px}.bottom .active{color:#1687ff}@media(max-width:720px){.brand{font-size:13px}.subject-select{max-width:175px;font-size:12px;padding:8px 28px 8px 10px}.stats .pill:last-child{display:none}.bottom a{font-size:8px}.bottom span{font-size:18px}}
</style></head>
<body>
<header class="topbar"><div class="brand">SKILLUP<small>PRACTICE</small></div><select id="subjectSelect" class="subject-select" aria-label="Select subject"><option value="physics">SkillUp Physics</option><option value="chemistry">SkillUp Chemistry</option><option value="botany">SkillUp Botany</option><option value="zoology">SkillUp Zoology</option><option value="maths">SkillUp Maths</option></select><div class="stats"><span class="pill">🔥 7</span><span class="pill">⭐ 420 XP</span><span class="pill">❤️ 5</span></div></header>
<main class="content"><iframe id="practiceFrame" class="frame" title="SkillUp Practice"></iframe></main>
<nav class="bottom"><a id="homeLink" href="skillup-home.html"><span>🏠</span>Home</a><a id="learnLink" href="physics-learn.html"><span>🧭</span>Learn</a><a class="active" href="practice.html"><span>🎯</span>Practice</a><a id="leagueLink" href="league.html?subject=physics"><span>🏆</span>League</a><a id="profileLink" href="profile.html"><span>👤</span>Profile</a></nav>
<script>
(function(){
 const p=new URLSearchParams(location.search), allowed=['physics','chemistry','botany','zoology','maths'];
 const s=allowed.includes((p.get('subject')||'physics').toLowerCase())?(p.get('subject')||'physics').toLowerCase():'physics';
 const pages={physics:'physics-learn.html',chemistry:'chemistry-learn.html',botany:'botany-learn.html',zoology:'zoology-learn.html',maths:'maths-learn.html'}, version='20260825.1';
 function u(path,extra){const x=new URL(path,location.href);x.searchParams.set('v',version);if(extra)Object.keys(extra).forEach(k=>x.searchParams.set(k,extra[k]));return x.pathname+'?'+x.searchParams.toString()}
 const select=document.getElementById('subjectSelect');select.value=s;select.onchange=()=>location.href=u('practice.html',{subject:select.value});
 document.getElementById('homeLink').href=u('skillup-home.html');document.getElementById('learnLink').href=u(pages[s]);document.getElementById('leagueLink').href=u('league.html',{subject:s});document.getElementById('profileLink').href=u('profile.html');
 document.getElementById('practiceFrame').src=u('question-bank.html',{subject:s});
})();
</script></body></html>
