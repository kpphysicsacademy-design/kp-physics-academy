<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6c2bff" />
  <title>SkillUp — Learn • Practice • Master</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">⚡ Skill<b>Up</b></div>
      <div class="stats">
        <span>🔥 <b id="streak">0</b></span>
        <span>⭐ <b id="xp">0</b></span>
        <span>❤️ <b id="hearts">5</b></span>
      </div>
    </header>
    <main class="path-page">
      <section class="hero">
        <p class="eyebrow">JEE + NEET LEARNING</p>
        <h1>Your SkillUp Learning Path</h1>
        <p>Learn one concept at a time. Practice, master and move forward.</p>
      </section>
      <section class="path" id="physicsPath" aria-label="SkillUp learning path"></section>
    </main>
    <nav class="bottom-nav">
      <button class="active">🏠<span>Home</span></button>
      <button>🎯<span>Practice</span></button>
      <button>🏆<span>League</span></button>
      <button>👤<span>Profile</span></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
