<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>SkillUp Learn</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#172033;font-family:Arial,sans-serif;min-height:100vh}.top{height:58px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:10}.brand{font-size:15px;font-weight:950}.brand small{display:block;color:#7652d9;font-size:6px;letter-spacing:1.4px;text-align:center;margin-top:2px}.wrap{max-width:520px;margin:auto;padding:12px 9px}.select{width:100%;padding:12px;border:2px solid #7652d9;border-radius:14px;background:#fff;font-size:13px;font-weight:900;box-shadow:0 3px 0 #d9d1f5;outline:none}.hint{text-align:center;color:#667085;font-size:8px;margin:8px 0}.home{position:fixed;right:14px;bottom:14px;width:48px;height:48px;border-radius:50%;background:#7652d9;color:#fff;text-decoration:none;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 0 #5940a8;z-index:20}.home:active{transform:translateY(2px);box-shadow:0 2px 0 #5940a8}</style></head><body><header class="top"><div class="brand">🚀 SKILLUP<small>LEARN • PRACTICE • MASTER</small></div></header><main class="wrap"><select id="path" class="select"><option value="6">Class 6</option><option value="7">Class 7</option><option value="8">Class 8</option><option value="9">Class 9</option><option value="10">Class 10</option><option value="11">Class 11</option><option value="12">Class 12</option><option value="neet">NEET</option><option value="jee">IIT / JEE</option></select><div class="hint">Select a class or exam to continue.</div></main><a class="home" href="skillup-home.html" aria-label="Home">⌂</a><script>const key='skillupLearnSelectedPath',path=document.getElementById('path');function restore(){const saved=localStorage.getItem(key)||'6';path.value=path.querySelector('option[value="'+saved+'"]')?saved:'6'}restore();path.addEventListener('change',()=>localStorage.setItem(key,path.value));window.addEventListener('pageshow',restore);</script></body></html>
