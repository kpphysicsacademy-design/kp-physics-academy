<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Learn</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#172033;background:#fff;padding-bottom:55px}.top{height:56px;background:#071a31;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px}.brand{font-weight:900}.brand small{display:block;font-size:7px;color:#9dc8ff;letter-spacing:1px}.selects{display:flex;gap:5px}.select{background:#102744;color:#fff;border:1px solid #4b6fa0;border-radius:9px;padding:7px 18px 7px 7px;font-weight:800;font-size:10px;max-width:110px}.main{max-width:700px;margin:auto;padding:16px 10px}.eyebrow{text-align:center;color:#1687ff;font-size:8px;font-weight:900;letter-spacing:1.5px}.title{text-align:center;font-size:25px;margin:5px 0}.sub{text-align:center;color:#667085;font-size:10px;margin-bottom:16px}.subject-list{display:grid;gap:9px}.subject{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #dfe7ef;border-radius:15px;text-decoration:none;color:#172033;box-shadow:0 3px 0 #e8edf2}.icon{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;font-size:21px;box-shadow:inset 0 4px 5px #fff8,inset 0 -6px 8px #0002,0 3px 0 #17203318}.physics .icon{background:#dbeafe}.chemistry .icon{background:#fef3c7}.biology .icon{background:#dcfce7}.maths .icon{background:#fce7f3}.name{display:block;font-weight:900;font-size:13px}.desc{display:block;color:#667085;font-size:8px;margin-top:3px}.arrow{margin-left:auto;font-size:22px;color:#98a2b3}.bottom{position:fixed;bottom:0;left:0;right:0;height:48px;background:#fff;border-top:1px solid #dfe7ef;display:flex}.bottom a{flex:1;text-align:center;text-decoration:none;color:#667085;font-size:7px;font-weight:900;padding-top:4px}.bottom span{display:block;font-size:15px}.active{color:#1687ff!important}@media(max-width:560px){.main{padding:13px 8px}.title{font-size:22px}.select{font-size:9px;max-width:105px}.icon{width:42px;height:42px;flex-basis:42px}}</style></head><body><header class="top"><div class="brand">SKILLUP<small>LEARN PATH</small></div><div class="selects"><select id="classSelect" class="select"></select><select id="subjectSelect" class="select"></select></div></header><main class="main"><div class="eyebrow">YOUR CLASS LEARNING PATH</div><h1 id="title" class="title">Class 8</h1><p class="sub">Select a subject to continue.</p><section id="subjectList" class="subject-list"></section></main><nav class="bottom"><a class="active"><span>🧭</span>Learn</a><a href="skillup-home.html"><span>🏠</span>Home</a><a href="practice.html"><span>🎯</span>Practice</a><a href="league.html"><span>🏆</span>League</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const subjects=['⚡|physics|Physics','🧪|chemistry|Chemistry','🌿|biology|Biology','📐|maths|Maths'];const pages={physics:'physics-learn.html',chemistry:'chemistry-learn.html',biology:'botany-learn.html',maths:'maths-learn.html'};const cs=document.getElementById('classSelect'),ss=document.getElementById('subjectSelect'),list=document.getElementById('subjectList'),title=document.getElementById('title');for(let c=6;c<=12;c++)cs.add(new Option('Class '+c,c));let p=new URLSearchParams(location.search);cs.value=p.get('class')||'8';function render(){let c=cs.value;title.textContent='Class '+c;ss.innerHTML='';list.innerHTML='';subjects.forEach(x=>{let [icon,key,name]=x;ss.add(new Option(name,key));let a=document.createElement('a');a.className='subject '+key;a.href=pages[key]+'?class='+c;a.innerHTML='<span class="icon">'+icon+'</span><span><span class="name">'+name+'</span><span class="desc">Class '+c+' learning path</span></span><span class="arrow">›</span>';list.appendChild(a)});ss.value=p.get('subject')||'physics'}cs.onchange=()=>location.href='learn.html?class='+cs.value;ss.onchange=()=>location.href='learn.html?class='+cs.value+'&subject='+ss.value;render();</script></body></html>
