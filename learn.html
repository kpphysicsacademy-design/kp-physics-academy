<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Learn</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#172033;background:#fff;padding-bottom:55px}.top{height:62px;background:#071a31;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px}.brand{font-weight:900}.brand small{display:block;font-size:7px;color:#9dc8ff;letter-spacing:1px}.selects{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.select{background:#102744;color:#fff;border:1px solid #4b6fa0;border-radius:9px;padding:7px 18px 7px 7px;font-weight:800;font-size:10px;max-width:125px}.main{max-width:700px;margin:auto;padding:16px 10px}.eyebrow{text-align:center;color:#1687ff;font-size:8px;font-weight:900;letter-spacing:1.5px}.title{text-align:center;font-size:25px;margin:5px 0}.sub{text-align:center;color:#667085;font-size:10px;margin-bottom:16px}.track-badge{text-align:center;margin:0 auto 10px;width:max-content;padding:5px 10px;border-radius:20px;background:#eef5ff;color:#2456a6;font-size:8px;font-weight:900}.subject-list{display:grid;gap:9px}.subject{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #dfe7ef;border-radius:15px;text-decoration:none;color:#172033;box-shadow:0 3px 0 #e8edf2}.icon{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;font-size:21px;box-shadow:inset 0 4px 5px #fff8,inset 0 -6px 8px #0002,0 3px 0 #17203318}.science .icon{background:#dcfce7}.maths .icon{background:#fce7f3}.social .icon{background:#ffedd5}.english .icon{background:#dbeafe}.language .icon{background:#ede9fe}.physics .icon{background:#dbeafe}.chemistry .icon{background:#fef3c7}.biology .icon{background:#dcfce7}.botany .icon{background:#bbf7d0}.zoology .icon{background:#fed7aa}.mathsa .icon{background:#e0e7ff}.mathsb .icon{background:#f5d0fe}.name{display:block;font-weight:900;font-size:13px}.desc{display:block;color:#667085;font-size:8px;margin-top:3px}.arrow{margin-left:auto;font-size:22px;color:#98a2b3}.bottom{position:fixed;bottom:0;left:0;right:0;height:48px;background:#fff;border-top:1px solid #dfe7ef;display:flex}.bottom a{flex:1;text-align:center;text-decoration:none;color:#667085;font-size:7px;font-weight:900;padding-top:4px}.bottom span{display:block;font-size:15px}.active{color:#1687ff!important}@media(max-width:560px){.top{height:62px}.main{padding:13px 8px}.title{font-size:22px}.select{font-size:9px;max-width:112px}.icon{width:42px;height:42px;flex-basis:42px}}</style></head><body><header class="top"><div class="brand">SKILLUP<small>LEARN PATH</small></div><div class="selects"><select id="pathSelect" class="select"></select><select id="subjectSelect" class="select"></select></div></header><main class="main"><div class="eyebrow">YOUR LEARNING PATH</div><div id="badge" class="track-badge"></div><h1 id="title" class="title"></h1><p class="sub">Select a subject to continue.</p><section id="subjectList" class="subject-list"></section></main><nav class="bottom"><a class="active"><span>🧭</span>Learn</a><a href="skillup-home.html"><span>🏠</span>Home</a><a href="practice.html"><span>🎯</span>Practice</a><a href="league.html"><span>🏆</span>League</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const classSubjects={6:[['🔬','science','Science'],['📐','maths','Mathematics'],['🌍','social','Social Science'],['📘','english','English'],['🗣️','language','Languages']],7:[['🔬','science','Science'],['📐','maths','Mathematics'],['🌍','social','Social Science'],['📘','english','English'],['🗣️','language','Languages']],8:[['🔬','science','Science'],['📐','maths','Mathematics'],['🌍','social','Social Science'],['📘','english','English'],['🗣️','language','Languages']],9:[['🔬','science','Science'],['📐','maths','Mathematics'],['🌍','social','Social Science'],['📘','english','English'],['🗣️','language','Languages']],10:[['🔬','science','Science'],['📐','maths','Mathematics'],['🌍','social','Social Science'],['📘','english','English'],['🗣️','language','Languages']],11:[['⚡','physics','Physics'],['🧪','chemistry','Chemistry'],['🌿','biology','Biology'],['📐','maths','Mathematics'],['📘','english','English'],['🗣️','language','Languages']],12:[['⚡','physics','Physics'],['🧪','chemistry','Chemistry'],['🌿','biology','Biology'],['📐','maths','Mathematics'],['📘','english','English'],['🗣️','language','Languages']]};const tracks={neet:{label:'NEET',subjects:[['⚡','physics','Physics'],['🧪','chemistry','Chemistry'],['🌱','botany','Botany'],['🦓','zoology','Zoology']]},jee:{label:'IIT / JEE',subjects:[['⚡','physics','Physics'],['🧪','chemistry','Chemistry'],['📘','mathsa','Maths A'],['📗','mathsb','Maths B']]}};const pages={science:'science-learn.html',maths:'maths-learn.html',social:'social-science-learn.html',english:'english-learn.html',language:'languages-learn.html',physics:'physics-learn.html',chemistry:'chemistry-learn.html',biology:'biology-learn.html',botany:'botany-learn.html',zoology:'zoology-learn.html',mathsa:'maths-learn.html',mathsb:'maths-learn.html'};const qs=new URLSearchParams(location.search);let currentClass=Number(qs.get('class'))||8;let currentTrack=qs.get('track')||'';const pathSelect=document.getElementById('pathSelect'),subjectSelect=document.getElementById('subjectSelect'),list=document.getElementById('subjectList'),title=document.getElementById('title'),badge=document.getElementById('badge');function setPathOptions(){pathSelect.innerHTML='';for(let c=6;c<=12;c++)pathSelect.add(new Option('Class '+c,'class-'+c));pathSelect.add(new Option('NEET','track-neet'));pathSelect.add(new Option('IIT / JEE','track-jee'));pathSelect.value=currentTrack?'track-'+currentTrack:'class-'+currentClass}function render(){let subjects,heading,badgeText;if(currentTrack&&tracks[currentTrack]){subjects=tracks[currentTrack].subjects;heading=tracks[currentTrack].label;badgeText='SPECIAL COMPETITIVE PATH'}else{if(!classSubjects[currentClass])currentClass=8;subjects=classSubjects[currentClass];heading='Class '+currentClass;badgeText='NCERT LEARNING PATH'}title.textContent=heading;badge.textContent=badgeText;subjectSelect.innerHTML='';list.innerHTML='';subjects.forEach(([icon,key,name])=>{subjectSelect.add(new Option(name,key));const a=document.createElement('a');a.className='subject '+key;a.href=(pages[key]||'#')+'?'+(currentTrack?'track='+currentTrack+'&subject='+key:'class='+currentClass+'&subject='+key);a.innerHTML='<span class="icon">'+icon+'</span><span><span class="name">'+name+'</span><span class="desc">'+heading+' learning path</span></span><span class="arrow">›</span>';list.appendChild(a)});subjectSelect.value=qs.get('subject')||subjects[0][1]}pathSelect.onchange=()=>{const v=pathSelect.value;if(v.startsWith('class-'))location.href='learn.html?class='+v.slice(6);else location.href='learn.html?track='+v.slice(6)};subjectSelect.onchange=()=>{const base=currentTrack?'track='+currentTrack:'class='+currentClass;location.href='learn.html?'+base+'&subject='+subjectSelect.value};setPathOptions();render();</script></body></html>
