'],['📘','english','English'],['🗣️','language','Languages']]};const syllabus={science:['Curiosity and Observation','Exploring Materials','Living World','Motion and Measurement','Light, Shadows and Reflections','Electricity and Circuits','Magnets','Water and Its Forms','Our Environment'],maths:['Number Systems','Arithmetic and Operations','Algebra','Geometry','Mensuration','Data Handling','Ratio and Proportion'],physics:['Units and Measurements','Motion','Laws of Motion','Work, Energy and Power','Gravitation','Properties of Matter','Thermal Physics','Waves','Electricity','Magnetism','Optics','Modern Physics'],chemistry:['Some Basic Concepts','Atomic Structure','Periodic Classification','Chemical Bonding','States of Matter','Thermodynamics','Equilibrium','Redox Reactions','Organic Chemistry','Biomolecules'],botany:['Diversity in Living World','Plant Structure','Cell Biology','Plant Physiology','Plant Growth and Development','Reproduction in Plants','Ecology','Genetics and Evolution'],social:['History','Geography','Political Science','Economics','Society and Culture'],english:['Reading','Writing','Grammar','Literature','Communication'],language:['Reading','Writing','Grammar','Literature','Communication']};const pages={science:'science-learn.html',maths:'maths-learn.html',physics:'physics-learn.html',chemistry:'chemistry-learn.html',botany:'botany-learn.html',social:'social-science-learn.html',english:'english-learn.html',language:'language-learn.html'};const cs=document.getElementById('classSelect'),ss=document.getElementById('subjectSelect'),list=document.getElementById('subjectList'),title=document.getElementById('title');for(let c=6;c<=12;c++)cs.add(new Option('Class '+c,c));cs.value=q.get('class')||'6';function render(){const c=Number(cs.value),items=classSubjects[c]||classSubjects[6];title.textContent='Class '+c;ss.innerHTML='';list.innerHTML='';items.forEach(([icon,key,name])=>{ss.add(new Option(name,key));const a=document.createElement('a');a.className='subject '
