<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>SkillUp Learn</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#f7f9fc;color:#172033}body{padding-bottom:58px}.top{height:50px;background:#fff;border-bottom:1px solid #e7ebf2;display:flex;align-items:center;padding:0 10px;position:sticky;top:0;z-index:20}.brand{font-size:13px;font-weight:950}.brand small{display:block;color:#7652d9;font-size:6.5px;letter-spacing:1.3px;margin-top:2px}.main{max-width:620px;margin:auto;padding:9px 7px 76px}.hero{text-align:center;padding:3px 4px 8px}.eyebrow{font-size:8px;font-weight:950;letter-spacing:1.4px;color:#7652d9}.hero h1{font-size:20px;line-height:1.2;margin:5px 0 3px}.hero p{font-size:8px;line-height:1.35;color:#667085;margin:0}.path{background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:10px;margin-bottom:12px;box-shadow:0 3px 0 #e8edf2}.path-title{font-size:8px;font-weight:950;letter-spacing:1px;color:#667085;margin-bottom:7px}.steps{display:flex;align-items:center;justify-content:center;gap:4px}.step{display:flex;align-items:center;gap:3px}.dot{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#7652d9;font-size:8px;font-weight:950}.step span:last-child{font-size:6.5px;font-weight:850;color:#475467}.chev{font-size:12px;color:#98a2b3}.section{font-size:8px;font-weight:950;letter-spacing:1px;color:#667085;margin:12px 2px 6px}.subject{background:#fff;border:1px solid #dfe7ef;border-radius:17px;margin-bottom:12px;padding:10px;box-shadow:0 3px 0 #e8edf2}.subject-head{display:flex;align-items:center;gap:9px;margin-bottom:5px}.subject-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:0 0 40px}.physics .subject-icon{background:#dbeafe}.chemistry .subject-icon{background:#fce7f3}.botany .subject-icon{background:#dcfce7}.zoology .subject-icon{background:#fef3c7}.maths .subject-icon{background:#ede9fe}.subject-name{font-size:12px;font-weight:950}.subject-sub{display:block;font-size:7px;color:#667085;margin-top:2px}.road{position:relative;height:286px;margin-top:2px}.road:before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:4px;background:#e5e7eb;border-radius:99px;transform:translateX(-50%)}.node{position:absolute;width:54px;height:54px;z-index:1}.node:nth-child(1){left:calc(50% - 78px);top:0}.node:nth-child(2){left:calc(50% + 24px);top:34px}.node:nth-child(3){left:calc(50% - 78px);top:68px}.node:nth-child(4){left:calc(50% + 24px);top:102px}.node:nth-child(5){left:calc(50% - 78px);top:136px}.node:nth-child(6){left:calc(50% + 24px);top:170px}.node:nth-child(7){left:calc(50% - 78px);top:204px}.node:nth-child(8){left:calc(50% + 24px);top:238px}.node a{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:#fff;font-size:8px;font-weight:950;text-align:center;line-height:1.05;border:3px solid #fff;box-shadow:0 4px 0 #0002}.node.open a{background:#58cc02;box-shadow:0 4px 0 #46a302}.node.mid a{background:#1cb0f6;box-shadow:0 4px 0 #1489c2}.node.special a{background:#ffc800;box-shadow:0 4px 0 #c89d00}.node .label{position:absolute;top:56px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:6.5px;font-weight:900;color:#667085}.subject-foot{display:flex;justify-content:space-between;align-items:center;margin-top:2px}.subject-foot span{font-size:6.5px;color:#667085}.subject-foot a{font-size:7px;font-weight:950;color:#7652d9;text-decoration:none}.bottom{position:fixed;left:0;right:0;bottom:0;width:100%;height:48px;background:#fff;border-top:1px solid #dfe7ef;display:flex;z-index:100;box-shadow:0 -4px 14px #17203314}.bottom a{flex:1;text-align:center;text-decoration:none;color:#667085;font-size:7px;font-weight:900;padding-top:4px}.bottom span{display:block;font-size:15px;line-height:1;margin-bottom:3px}.bottom .active{color:#7652d9}@media(max-width:560px){.main{padding-left:7px;padding-right:7px}.road{height:286px}.node{width:50px;height:50px}.node a{width:50px;height:50px}.node .label{top:52px;font-size:6px}.node:nth-child(1){left:calc(50% - 72px);top:0}.node:nth-child(2){left:calc(50% + 22px);top:36px}.node:nth-child(3){left:calc(50% - 72px);top:72px}.node:nth-child(4){left:calc(50% + 22px);top:108px}.node:nth-child(5){left:calc(50% - 72px);top:144px}.node:nth-child(6){left:calc(50% + 22px);top:180px}.node:nth-child(7){left:calc(50% - 72px);top:216px}.node:nth-child(8){left:calc(50% + 22px);top:252px}}</style></head><body><header class="top"><div class="brand">SKILLUP<small>LEARN • PRACTICE • MASTER</small></div></header><main class="main"><section class="hero"><div class="eyebrow">YOUR COMPLETE SUBJECT PATHS</div><h1>Learn</h1><p>Choose a subject and follow its complete class or competitive path.</p></section><section class="path"><div class="path-title">LEARNING FLOW</div><div class="steps"><div class="step"><span class="dot">1</span><span>Subject</span></div><span class="chev">›</span><div class="step"><span class="dot">2</span><span>Class / Track</span></div><span class="chev">›</span><div class="step"><span class="dot">3</span><span>Chapter</span></div><span class="chev">›</span><div class="step"><span class="dot">4</span><span>Practice</span></div><span class="chev">›</span><div class="step"><span class="dot">5</span><span>Mastery</span></div></div></section><div class="section">SUBJECT PATHS</div><div id="subjects"></div></main><nav class="bottom"><a class="active" href="learn.html"><span>🧭</span>Learn</a><a href="skillup-home.html"><span>🏠</span>Home</a><a href="practice.html"><span>🎯</span>Practice</a><a href="league.html"><span>🏆</span>League</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const subjects=[{key:'physics',icon:'⚡',name:'Physics',sub:'Class 6–12 • NEET • JEE / IIT',nodes:[['Class 6','learn.html?subject=physics&class=6'],['Class 7','learn.html?subject=physics&class=7'],['Class 8','learn.html?subject=physics&class=8'],['Class 9','learn.html?subject=physics&class=9'],['Class 10','learn.html?subject=physics&class=10'],['Class 11','learn.html?subject=physics&class=11'],['Class 12','learn.html?subject=physics&class=12'],['NEET / JEE','full-physics-path.html']]},{key:'chemistry',icon:'🧪',name:'Chemistry',sub:'Class 6–12 • NEET • JEE / IIT',nodes:[['Class 6','learn.html?subject=chemistry&class=6'],['Class 7','learn.html?subject=chemistry&class=7'],['Class 8','learn.html?subject=chemistry&class=8'],['Class 9','learn.html?subject=chemistry&class=9'],['Class 10','learn.html?subject=chemistry&class=10'],['Class 11','learn.html?subject=chemistry&class=11'],['Class 12','learn.html?subject=chemistry&class=12'],['NEET / JEE','practice.html?subject=chemistry']]},{key:'botany',icon:'🌿',name:'Botany',sub:'Class 6–12 • NEET',nodes:[['Class 6','learn.html?subject=botany&class=6'],['Class 7','learn.html?subject=botany&class=7'],['Class 8','learn.html?subject=botany&class=8'],['Class 9','learn.html?subject=botany&class=9'],['Class 10','learn.html?subject=botany&class=10'],['Class 11','learn.html?subject=botany&class=11'],['Class 12','learn.html?subject=botany&class=12'],['NEET','practice.html?subject=botany&track=neet']]},{key:'zoology',icon:'🦁',name:'Zoology',sub:'Class 6–12 • NEET',nodes:[['Class 6','learn.html?subject=zoology&class=6'],['Class 7','learn.html?subject=zoology&class=7'],['Class 8','learn.html?subject=zoology&class=8'],['Class 9','learn.html?subject=zoology&class=9'],['Class 10','learn.html?subject=zoology&class=10'],['Class 11','learn.html?subject=zoology&class=11'],['Class 12','learn.html?subject=zoology&class=12'],['NEET','practice.html?subject=zoology&track=neet']]},{key:'maths',icon:'📐',name:'Mathematics',sub:'Class 6–12 • JEE / IIT',nodes:[['Class 6','class6-maths-learn.html'],['Class 7','class7-maths-learn.html'],['Class 8','learn.html?subject=maths&class=8'],['Class 9','learn.html?subject=maths&class=9'],['Class 10','learn.html?subject=maths&class=10'],['Class 11','learn.html?subject=maths&class=11'],['Class 12','learn.html?subject=maths&class=12'],['JEE / IIT','practice.html?subject=maths&track=jee']]}];const root=document.getElementById('subjects');subjects.forEach(s=>{const box=document.createElement('section');box.className='subject '+s.key;box.innerHTML='<div class="subject-head"><span class="subject-icon">'+s.icon+'</span><span><span class="subject-name">'+s.name+'</span><span class="subject-sub">'+s.sub+'</span></span></div><div class="road"></div><div class="subject-foot"><span>Class → Chapter → Concept → Practice</span><a href="practice.html?subject='+s.key+'">Practice ›</a></div>';const road=box.querySelector('.road');s.nodes.forEach((n,i)=>{const d=document.createElement('div');d.className='node '+(i===0?'open':i===s.nodes.length-1?'special':'mid');d.innerHTML='<a href="'+n[1]+'">'+n[0]+'</a><span class="label">'+(i===s.nodes.length-1?'Special':'Learn')+'</span>';road.appendChild(d)});root.appendChild(box)});</script></body></html>
