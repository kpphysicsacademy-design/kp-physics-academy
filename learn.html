earn.html?class=12&subject=chemistry'],['🌿','botany','Biology','learn.html?class=12&subject=botany'],['📐','maths','Mathematics','learn.html?class=12&subject=maths']]};const cs=document.getElementById('classSelect'),ss=document.getElementById('subjectSelect'),list=document.getElementById('subjectList');function render(){const c=Number(new URLSearchParams(location.search).get('class'))||6;cs.value='Class '+c;const items=data[c]||class6;ss.innerHTML='';list.innerHTML='';items.forEach(([icon,key,name,url])=>{ss.add(new Option(name,key));const a=document.createElement('a');a.className='subject '+key;a.href=url;a.innerHTML='<span class="icon">'+icon+'</span><span><span class="name">'+name+'</span><span class="desc">Chapter → Concept → Practice</span></span><span class="arrow">›</span>';list.appendChild(a)});ss.value=new URLSearchParams(location.search).get('subject')||items[0][1]}cs.onchange=()=>location.href='learn.html?class='+cs.value.replace('Class ','');ss.onchange=()=>{const c=new URLSearchParams(location.search).get('class')||6;const item=(data[c]||class6).find(x=>x[1]===ss.value);if(item)location.href=item[3]};render();</script></body></html>
