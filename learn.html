','learn.html?class=10&subject=maths'],['🌏','social','Social Science','learn.html?class=10&subject=social'],['📘','english','English','learn.html?class=10&subject=english']],11:[['⚡','physics','Physics','learn.html?class=11&subject=physics'],['🧪','chemistry','Chemistry','learn.html?class=11&subject=chemistry'],['🌿','botany','Biology','learn.html?class=11&subject=botany'],['📐','maths','Mathematics','learn.html?class=11&subject=maths']],12:[['⚡','physics','Physics','learn.html?class=12&subject=physics'],['🧪','chemistry','Chemistry','learn.html?class=12&subject=chemistry'],['🌿','botany','Biology','learn.html?class=12&subject=botany'],['📐','maths','Mathematics','learn.html?class=12&subject=maths']]};const tracks={neet:[['⚡','physics','Physics','neet-learn.html'],['🧪','chemistry','Chemistry','neet-learn.html'],['🌿','botany','Botany','neet-learn.html'],['🦋','zoology','Zoology','neet-learn.html']],jee:[['⚡','physics','Physics','jee-learn.html'],['🧪','chemistry','Chemistry','jee-learn.html'],['📘','mathsa','Maths A','jee-learn.html'],['📐','mathsb','Maths B','jee-learn.html']]};const syllabus={science:9,maths:7,social:5,english:5,hindi:5,language:5,physics:12,chemistry:10,botany:9,zoology:8,mathsa:6,mathsb:6};const ps=document.getElementById('pathSelect'),ss=document.getElementById('subjectSelect'),list=document.getElementById('subjectList'),title=document.getElementById('title'),ey=document.getElementById('eyebrow'),sub=document.getElementById('sub');for(let c=6;c<=12;c++)ps.add(new Option('Class '+c,'class='+c));ps.add(new Option('NEET','track=neet'));ps.add(new Option('IIT / JEE','track=jee'));function selected(){return new URLSearchParams(location.search)}function render(){const p=selected(),t=p.get('track'),c=Number(p.get('class'))||6,items=t?tracks[t]:school[c];ps.value=t?'track='+t:'class='+c;title.textContent=t?(t==='neet'?'NEET':'IIT / JEE'):'Class '+c;ey.textContent=t?'COMPETITIVE LEARNING PATH':'YOUR CLASS LEARNING PATH';sub.textContent=t?'Choose a subject and follow its learning path.':'Choose a subject and follow its syllabus path.';ss.innerHTML='';list.innerHTML='';items.forEach(([icon,key,name,url])=>{ss.add(new Option(name,key));const a=document.createElement('a');a.className='subject '+key;a.href=url;a.innerHTML='<span class="icon">'+icon+'</span><span><span class="name">'+name+'</span><span class="desc">'+syllabus[key]+' syllabus units • Chapter → Concept → Practice</span></span><span class="arrow">›</span>';list.appendChild(a)});ss.value=p.get('subject')||items[0][1]}ps.onchange=()=>location.href='learn.html?'+ps.value;ss.onchange=()=>{const p=selected(),t=p.get('track');if(t){location.href=ss.value}else{const c=p.get('class')||6;const item=(school[Number(c)]||school[6]).find(x=>x[1]===ss.value);location.href=item?item[3]:'learn.html?class='+c+'&subject='+ss.value}};render();</script></body></html>
