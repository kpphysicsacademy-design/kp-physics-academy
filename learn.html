;height:45px;flex:0 0 45px;border-radius:50%;display:grid;place-items:center;font-size:21px;box-shadow:inset 0 4px 5px #fff8,inset 0 -6px 8px #0002,0 3px 0 #17203318}.science .icon{background:#dcfce7}.social .icon{background:#ffedd5}.english .icon{background:#dbeafe}.language .icon{background:#f3e8ff}.maths .icon{background:#fce7f3}.physics .icon{background:#dbeafe}.chemistry .icon{background:#fef3c7}.name{display:block;font-weight:900;font-size:13px}.desc{display:block;color:#667085;font-size:8px;margin-top:2px}.arrow{margin-left:auto;font-size:22px;color:#98a2b3}.section-label{font-size:9px;font-weight:950;color:#667085;letter-spacing:1px;margin:10px 2px 6px}.bottom{position:fixed;bottom:0;left:0;right:0;height:48px;background:#fff;border-top:1px solid #dfe7ef;display:flex;z-index:20}.bottom a{flex:1;text-align:center;text-decoration:none;color:#667085;font-size:7px;font-weight:900;padding-top:4px}.bottom span{display:block;font-size:15px}.active{color:#1687ff!important}@media(max-width:560px){.top{height:52px}.main{padding:11px 8px}.title{font-size:21px}.select{font-size:9px;max-width:120px}.path{padding:10px}.dot{width:27px;height:27px}.step span:last-child{font-size:6.5px}.icon{width:43px;height:43px;flex-basis:43px}.name{font-size:12px}}</style></head><body><header class="top"><div class="brand">SKILLUP<small>LEARN PATH</small></div><div class="selects"><select id="pathSelect" class="select"></select><select id="subjectSelect" class="select"></select></div></header><main class="main"><div class="eyebrow" id="eyebrow">YOUR CLASS LEARNING PATH</div><h1 id="title" class="title">Class 6</h1><p id="sub" class="sub">Choose a subject and follow its syllabus path.</p><section class="path"><div class="path-title">SYLLABUS LEARNING PATH</div><div class="steps"><div class="step"><span class="dot">1</span><span>Subject</span></div><span class="chev">›</span><div class="step"><span class="dot">2</span><span>Chapter</span></div><span class="chev">›</span><div class="step"><span class="dot">3</span><span>Concept</span></div><span class="chev">›</span><div class="step"><span class="dot">4</span><span>Practice</span></div><span class="chev">›</span><div class="step"><span class="dot">5</span><span>Mastery</span></div></div></section><div class="section-label">SYLLABUS / SUBJECTS</div><section id="subjectList" class="subject-list"></section></main><nav class="bottom"><a class="active"><span>🧭</span>Learn</a><a href="skillup-home.html"><span>🏠</span>Home</a><a href="practice.html"><span>🎯</span>Practice</a><a href="league.html"><span>🏆</span>League</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const school={6:[['🔬','science','Science'],['📐','maths','Mathematics'],['🌏','social','Social Science'],['📘','english','English'],['🗣️','language','Languages']],7:[['🔬','science','Science'],['📐','maths','Mathematics'],['🌏','social','Social Science'],['📘','english','English'],['🗣️','language','Languages']],8:[['🔬','science','Science'],['📐','maths','Mathematics'],['🌏','social','Social Science'],['📘','english','English'],['🗣️','language','Languages']],9:[['🔬','science','Science'],['📐','maths','Mathematics'],['🌏','social','Social Science'],['📘','english','English'],['🗣️','language','Languages']],10:[['🔬','science','Science'],['📐','maths','Mathematics'],['🌏','social','Social Science'],['📘','english','English'],['🗣️','language','Languages']],11:[['⚡','physics','Physics'],['🧪','chemistry','Chemistry'],['🌿','botany','Biology'],['📐','maths','Mathematics'],['📘','english','English'],['🗣️','language','Languages']],12:[['⚡','physics','Physics'],['🧪','chemistry','Chemistry'],['🌿','botany','Biology'],['📐','maths','Mathematics'],['📘','english','English'],['🗣️','language','Languages']]};const tracks={neet:[['⚡','physics','Physics'],['🧪','chemistry','Chemistry'],['🌿','botany','Botany'],['🦋','zoology','Zoology']],jee:[['⚡','physics','Physics'],['🧪','chemistry','Chemistry'],['📘','mathsa','Maths A'],['📐','mathsb','Maths B']]};const syllabus={science:9,maths:7,social:5,english:5,language:5,physics:12,chemistry:10,botany:9,zoology:8,mathsa:6,mathsb:6};const pages={science:'science-learn.html',maths:'maths-learn.html',physics:'physics-learn.html',chemistry:'chemistry-learn.html',botany:'botany-learn.html',zoology:'zoology-learn.html',mathsa:'maths-learn.html',mathsb:'maths-learn.html',social:'social-science-learn.html',english:'english-learn.html',language:'language-learn.html'};const ps=document.getElementById('pathSelect'),ss=document.getElementById('subjectSelect'),list=document.getElementById('subjectList'),title=document.getElementById('title'),ey=document.getElementById('eyebrow'),sub=document.getElementById('sub');for(let c=6;c<=12;c++)ps.add(new Option('Class '+c,'class='+c));ps.add(new Option('NEET','track=neet'));ps.add(new Option('IIT / JEE','track=jee'));function selected(){return new URLSearchParams(location.search)}function render(){const p=selected(),t=p.get('track'),c=Number(p.get('class'))||6,items=t?tracks[t]:school[c];ps.value=t?'track='+t:'class='+c;title.textContent=t?(t==='neet'?'NEET':'IIT / JEE'):'Class '+c;ey.textContent=t?'COMPETITIVE LEARNING PATH':'YOUR CLASS LEARNING PATH';sub.textContent=t?'Choose a subject; opening it returns to the existing competitive Learn path.':'Choose a subject and follow its syllabus path.';ss.innerHTML='';list.innerHTML='';items.forEach(([icon,key,name])=>{ss.add(new Option(name,key));const a=document.createElement('a');a.className='subject '+key;a.href=t?(t==='neet'?'neet-learn.html':'jee-learn.html'):(pages[key]+'?class='+c+'&subject='+key);a.innerHTML='<span class="icon">'+icon+'</span><span><span class="name">'+name+'</span><span class="desc">'+syllabus[key]+' syllabus units • Chapter → Concept → Practice</span></span><span class="arrow">›</span>';list.appendChild(a)});ss.value=p.get('subject')||items[0][1]}ps.onchange=()=>location.href='learn.html?'+ps.value;ss.onchange=()=>{const p=selected(),t=p.get('track'),c=p.get('class')||6;location.href=t?(t==='neet'?'neet-learn.html':'jee-learn.html'):'learn.html?class='+c+'&subject='+ss.value};render();</script></body></html>
