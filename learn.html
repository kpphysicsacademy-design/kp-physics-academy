<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Learn</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f7f9fc;color:#172033}body{padding-bottom:58px}.top{height:54px;background:#fff;border-bottom:1px solid #e7ebf2;display:flex;align-items:center;padding:0 10px;position:sticky;top:0;z-index:20}.brand{font-size:13px;font-weight:950}.brand small{display:block;color:#7652d9;font-size:6.5px;letter-spacing:1.3px;margin-top:2px}.main{max-width:620px;margin:auto;padding:8px 7px 76px}.hero{text-align:center;padding:3px 4px 7px}.eyebrow{font-size:8px;font-weight:950;letter-spacing:1.4px;color:#7652d9}.hero h1{font-size:20px;margin:5px 0 3px}.hero p{font-size:8px;color:#667085;margin:0}.select{width:100%;margin:9px 0 10px;padding:10px 12px;border:2px solid #7652d9;border-radius:14px;background:#fff;font-size:12px;font-weight:900;box-shadow:0 3px 0 #d9d1f5}.path{background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:10px;margin-bottom:12px;box-shadow:0 3px 0 #e8edf2}.path-title{font-size:8px;font-weight:950;letter-spacing:1px;color:#667085;margin-bottom:7px}.steps{display:flex;align-items:center;justify-content:center;gap:4px}.step{display:flex;align-items:center;gap:3px}.dot{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#7652d9;font-size:8px;font-weight:950}.step span:last-child{font-size:6.5px;font-weight:850;color:#475467}.chev{font-size:12px;color:#98a2b3}.section{font-size:8px;font-weight:950;letter-spacing:1px;color:#667085;margin:12px 2px 6px}.subject{background:#fff;border:1px solid #dfe7ef;border-radius:17px;margin-bottom:12px;padding:10px;box-shadow:0 3px 0 #e8edf2}.subject-head{display:flex;align-items:center;gap:9px;margin-bottom:5px}.subject-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:0 0 40px :4px}.bottom span{display:block;font-size:15px;line-height:1;margin-bottom:3px}.bottom .active{color:#7652d9}@media(max-width:560px){.main{padding-left:7px;padding-right:7px}.road{height:286px}.node{width:50px;height:50px}.node a{width:50px;height:50px}.node .label{top:52px;font-size:6px}.node:nth-child(1){left:calc(50% - 72px);top:0}.node:nth-child(2){left:calc(50% + 22px);top:36px}.node:nth-child(3){left:calc(50% - 72px);top:72px}.node:nth-child(4){left:calc(50% + 22px);top:108px}.node:nth-child(5){left:calc(50% - 72px);top:144px}.node:nth-child(6){left:calc(50% + 22px);top:180px}.node:nth-child(7){left:calc(50% - 72px);top:216px}.node:nth-child(8){left:calc(50% + 22px);top:252px}}@media(max-width:380px){.steps{gap:2px}.step span:last-child{font-size:6px}.dot{width:24px;height:24px}.chev{font-size:10px}}</style></head><body><header class="top"><div class="brand">SKILLUP<small>LEARN • PRACTICE • MASTER</small></div></header><main class="main"><section class="hero"><div class="eyebrow">YOUR COMPLETE LEARNING PATH</div><h1>Learn</h1><p>Select your class or competitive exam, then choose a subject.</p></section><select id="path" class="select"><option value="6">Class 6</option><option value="7">Class 7</option><option value="8">Class 8</option><option value="9">Class 9</option><option value="10">Class 10</option><option value="11">Class 11</option><option value="12">Class 12</option><option value="neet">NEET</option><option value="jee">IIT / JEE</option></select><section class="path"><div class="path-title">LEARNING FLOW</div><div class="steps"><div class="step"><span class="dot">1</span><span>Subject</span></div><span class="chev">›</span><div class="step"><span class="dot">2</span><span>Chapter</span></div><span class="chev">›</span><div class="step"><span class="dot">3</span><span>Concept</span></div><span class="chev">›</span><div class="step"><span class="dot">4</span><span>Practice</span></div><span class="chev">›</span><div class="step"><span class="dot">5</span><span>Mastery</span></div></div></section><div class="section">SUBJECT PATHS</div><div id="subjects"></div></main><nav class="bottom"><a href="skillup-home.html"><span>🏠</span>Home</a><a class="active" href="learn.html"><span>🧭</span>Learn</a><a href="practice.html"><span>🎯</span>Practice</a><a href="league.html"><span>🏆</span>League</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const storageKey='skillupLearnSelectedPath';const data={6:[['🔬','school','Science','science-learn.html'],['📐','school','Mathematics','class6-maths-learn.html'],['🌏','school','Social Science','class6-social-science-learn.html'],['📘','school','English','class6-english-learn.html'],['🇮🇳','school','Hindi','class6-hindi-learn.html']],7:[['🔬','school','Science','class7-science-learn.html'],['📐','school','Mathematics','class7-maths-learn.html'],['🌏','school','Social Science','class7-social-science-learn.html'],['📘','school','English','class7-english-learn.html'],['🇮🇳','school','Hindi','class7-hindi-learn.html']],8:[['🔬','school','Science','class8-science-learn.html'],['📐','school','Mathematics','class8-maths-learn.html'],['🌏','school','Social Science','class8-social-science-learn.html'],['📘','school','English','class8-english-learn.html'],['🇮🇳','school','Hindi','class8-hindi-learn.html']],9:[['🔬','school','Science','class9-science-learn.html'],['📐','school','Mathematics','class9-maths-learn.html'],['🌏','school','Social Science','class9-social-science-learn.html'],['📘','school','English','class9-english-learn.html'],['🇮🇳','school','Hindi','class9-hindi-learn.html']],10:[['🔬','school','Science','class10-science-learn.html'],['📐','school','Mathematics','class10-maths-learn.html'],['🌏','school','Social Science','class10-social-science-learn.html'],['📘','school','English','class10-english-learn.html'],['🇮🇳','school','Hindi','class10-hindi-learn.html']],11:[['⚡','physics','Physics','class11-physics-learn.html'],['🧪','chemistry','Chemistry','class11-chemistry-learn.html'],['🌿','botany','Botany','class11-botany-learn.html'],['🦋','zoology','Zoology','class11-zoology-learn.html'],['📘','mathsa','Maths A','class11-maths-a-learn.html'],['📐','mathsb','Maths B','class11-maths-b-learn.html']],12:[['⚡','physics','Physics','class12-physics-learn.html'],['🧪','chemistry','Chemistry','class12-chemistry-learn.html'],['🌿','botany','Botany','class12-botany-learn.html'],['🦋','zoology','Zoology','class12-zoology-learn.html'],['📘','mathsa','Maths A','class12-maths-a-learn.html'],['📐','mathsb','Maths B','class12-maths-b-learn.html']],neet:[['⚡','physics','Physics','full-physics-path.html'],['🧪','chemistry','Chemistry','chemistry-neet-path.html'],['🌿','botany','Botany','botany-neet-path.html'],['🦋','zoology','Zoology','zoology-neet-path.html']],jee:[['⚡','physics','Physics','full-physics-path.html'],['🧪','chemistry','Chemistry','chemistry-jee-path.html'],['📘','mathsa','Maths A','mathsa-full-path.html'],['📐','mathsb','Maths B','mathsb-full-path.html']]};const root=document.getElementById('subjects'),path=document.getElementById('path');function render(){const items=data[path.value]||[];root.innerHTML='';items.forEach(s=>{const box=document.createElement('section');box.className='subject '+s[1];box.innerHTML='<div class="subject-head"><span class="subject-icon">'+s[0]+'</span><span><span class="subject-name">'+s[2]+'</span><span class="subject-sub">'+(path.value==='neet'?'NEET complete path':path.value==='jee'?'IIT / JEE complete path':'Class '+path.value+' learning path')+'</span></span></div><div class="road"></div><div class="subject-foot"><span>Learn → Chapter → Concept → Practice</span><a href="'+s[3]+'">Open Path ›</a></div>';const road=box.querySelector('.road');for(let i=0;i<8;i++){const node=document.createElement('div');node.className='node '+(i===0?'open':i===7?'special':'mid');node.innerHTML='<a href="'+s[3]+'">'+(i===0?'START':i===7?'MASTERY':'STEP '+(i+1))+'</a><span class="label">'+(i===7?'Mastery':'Learn')+'</span>';road.appendChild(node)}root.appendChild(box)})}function restore(){const saved=localStorage.getItem(storageKey)||'6';path.value=path.querySelector('option[value="'+saved+'"]')?saved:'6'}restore();render();path.addEventListener('change',()=>{localStorage.setItem(storageKey,path.value);render()});window.addEventListener('pageshow',()=>{restore();render()});</script></body></html>
