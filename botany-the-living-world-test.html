","Fixed body colour","Constant shape","Occupation of space"],0,"Active metabolism demonstrates ongoing biochemical activity, whereas colour, shape and occupying space are not exclusive to living organisms."]],"biodiversity":[["Biodiversity means",["Variety of living organisms","Only plant diversity","Only animal diversity","Only microbial diversity"],0,"Biodiversity refers to the variety of living organisms and includes diversity within and among species and ecosystems."],["The number of known species is",["Continuously revised as organisms are discovered and studied","Permanently fixed","Exactly one million","Limited to plants"],0,"Species inventories change as new organisms are discovered, described and classified."],["A region containing many different species has high",["Species diversity","Nomenclature","Binomial naming","Taxonomic rank"],0,"Species diversity describes the variety of species present in a given area."],["Biodiversity is important to taxonomy because it provides",["The range of organisms requiring identification and classification","Only chemical substances","Only non-living objects","Only laboratory cultures"],0,"Taxonomy identifies, names and classifies organisms, so biological diversity provides the organisms that must be studied and organised."]],"taxonomy":[["Taxonomy deals with",["Identification, nomenclature and classification","Only respiration","Only digestion","Only reproduction"],0,"Taxonomy includes identifying organisms, giving them scientific names and placing them into classification groups."],["Binomial nomenclature uses",["Two words: genus and specific epithet","One word only","Three words in every case","Numbers only"],0,"A scientific species name has two parts: the genus name followed by the specific epithet."],["In a scientific name, the genus name begins with",["A capital letter","A numeral","A lowercase letter only","A Greek symbol"],0,"In binomial nomenclature, the genus is written with an initial capital letter while the "],0,"Asexual reproduction generally involves one parent and does not require fusion of gametes."],["Which statement about growth and reproduction is correct?",["Growth increases organismal material, whereas reproduction produces new individuals","Growth always produces offspring","Reproduction is only an increase in cell size","They are identical processes"],0,"Growth increases the size or cellular material of an organism; reproduction creates new individuals, so the processes are distinct."]],"metabolism-consciousness":[["Metabolism refers to",["All chemical reactions in an organism","Only reproduction","Only locomotion","Only growth"],0,"Metabolism comprises the complete set of chemical reactions occurring within an organism."],["Anabolism is primarily associated with",["Synthesis of complex molecules from simpler molecules","Breakdown of complex molecules","Physical weathering","Evaporation"],0,"Anabolism is constructive metabolism and uses simpler substances to synthesise more complex molecules."],["Catabolism is primarily associated with",["Breakdown of complex molecules with energy release","DNA naming","Species classification","Growth by external deposition"],0,"Catabolic pathways degrade complex molecules and commonly release energy that can be captured for cellular work."],["Consciousness is the ability to",["Sense and respond to surroundings","Only grow taller","Produce seeds in every organism","Make cell walls"],0,"Consciousness involves awareness and responsiveness; sensitivity to environmental stimuli is a characteristic of living systems."],["Human beings are distinct in the degree of consciousness because they can",["Show self-awareness and complex thought","Never respond to stimuli","Lack metabolism","Exist without cells"],0,"Humans show a high level of consciousness, including self-awareness, perception, memory and complex thought."]],"species-taxon":[["A species is generally a group of organisms that",["Can interbreed under natural conditions and
