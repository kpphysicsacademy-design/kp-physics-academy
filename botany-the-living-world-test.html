<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Living World Tests | SkillUp</title><style>:root{--g:#58cc02;--gd:#46a302;--ink:#4b4b4b;--line:#e5e5e5}*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:var(--ink)}.w{max-width:720px;margin:auto;padding:18px 14px 40px}.test-nav{display:flex;gap:10px;align-items:center;font-weight:900;margin-bottom:18px}.test-nav a,.back{color:#777;text-decoration:none}.hero,.topic,.quiz{background:#fff;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:20px;padding:20px;margin:14px 0}.hero{text-align:center}.mascot{font-size:50px}.mode{background:#eaf8df;color:#46a302;border-radius:14px;padding:10px;font-weight:900;margin-top:12px}.label{font-size:13px;font-weight:900;color:#777;letter-spacing:1px;margin:20px 4px 8px}.topic{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}.num{width:36px;height:36px;border-radius:12px;background:#eaf8df;color:#46a302;display:grid;place-items:center;font-weight:900}.topic-emoji{font-size:29px}.copy{flex:1}.copy b,.copy small{display:block}.copy small{color:#777;margin-top:4px}.start,.next-btn,.primary{background:var(--g);color:#fff;border:0;border-bottom:4px solid var(--gd);border-radius:12px;padding:11px;font-weight:900}.progress{height:14px;background:#e5e5e5;border-radius:20px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:var(--g)}.opts{display:grid;gap:12px}.opts button{background:#fff;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:15px;padding:15px;text-align:left;font-weight:800}.correct{border-color:#58cc02!important;background:#f1ffe8!important}.wrong{border-color:#ff4b4b!important;background:#fff0f0!important}#fb{background:#f4fbef;border-radius:14px;padding:14px;line-height:1.5;font-weight:700}.next-btn{width:100%;margin-top:12px}.done{display:none}.review{text-align:left;margin-top:20px}.review-item{background:#fff7f7;border:2px solid #ffd5d5;border-radius:14px;padding:14px;margin:10px 0}@media(max-width:520px){.topic{padding:14px}.start{font-size:10px}}.home-nav{position:fixed;top:12px;left:12px;z-index:1000;width:46px;height:46px;display:grid;place-items:center;background:#fff;border:2px solid #e5e5e5;border-bottom:5px solid #d6d6d6;border-radius:16px;text-decoration:none;font-size:23px;box-shadow:0 4px 12px rgba(0,0,0,.08)}</style></head><body><main class="w"><nav class="test-nav"><a href="botany-the-living-world.html">🌍 The Living World</a><span>›</span><b>🧪 Tests</b></nav><a class="back" href="botany-the-living-world.html">← Back to Chapter</a><div id="app"></div></main><script>const topics={"what-is-living":[["Living organisms are characterised by","Growth, reproduction, metabolism and cellular organisation","Only movement","Only large size","Only green colour",0],["Metabolism is a defining feature of","Living organisms","Only rocks","Only machines","Only clouds",0]],"biodiversity":[["Biodiversity means","Variety of living organisms","Only plant diversity","Only animal diversity","Only microbes",0],["The number of known species is constantly","Being revised as new organisms are studied","Always fixed","Zero","Exactly one million",0]],"taxonomy":[["Taxonomy deals with","Identification, nomenclature and classification","Only respiration","Only digestion","Only reproduction",0],["Binomial nomenclature uses","Two words","One word","Three numbers","Only symbols",0]],"taxonomical-hierarchy":[["The basic unit of classification is","Species","Kingdom","Phylum","Class",0],["Correct hierarchy is","Species → Genus → Family → Order","Family → Species → Kingdom","Kingdom → Species → Genus","Class → Species → Phylum",0]],"growth-reproduction":[["Growth in living organisms generally involves","Increase in mass and number of individuals","Only movement","Loss of cells","Decrease in metabolism",0],["Growth in plants occurs mainly in","Meristematic regions","Only dead tissues","Only fruits","Only seeds",0],["Reproduction is the process of","Producing offspring","Only increasing body size","Breaking down food","Removing wastes",0],["Asexual reproduction produces offspring usually from","A single parent","Two unrelated species","Only gametes from two parents","Only non-living matter",0]],"metabolism-consciousness":[["Metabolism refers to","All chemical reactions in an organism","Only reproduction","Only locomotion","Only growth",0],["Metabolism is absent in","Non-living objects","Living cells","Plants","Animals",0],["Consciousness is the ability to","Sense and respond to surroundings","Only grow taller","Produce seeds","Make cell walls",0],["Human beings are distinct in consciousness because they can","Be aware of themselves and think","Never respond to stimuli","Lack metabolism","Have no cells",0]],"species-taxon":[["A species is generally defined as a group of organisms that","Can interbreed and produce fertile offspring","Always look identical","Live in one habitat only","Have the same size",0],["A taxon is","A unit of classification","Only a plant group","A chemical substance","A type of habitat",0],["The rank immediately above species is","Genus","Kingdom","Phylum","Class",0],["Scientific names are usually written in","Italics when printed","Only capital letters","Numbers only","Quotation marks",0]],"taxonomical-aids":[["A herbarium is a collection of","Preserved plant specimens","Living animals","Rocks only","Microorganisms in water",0],["A botanical garden maintains","Living plant collections","Only preserved fossils","Only animal specimens","Only laboratory chemicals",0],["A museum may preserve organisms using","Preservation and storage techniques","Photosynthesis","Fertilisation only","Respiration only",0],["A taxonomic key is used for","Identification of organisms","Producing offspring","Measuring metabolism","Changing habitats",0]]};const labels=["What is Living?","Biodiversity","Taxonomy","Taxonomical Hierarchy","Growth & Reproduction","Metabolism & Consciousness","Species & Taxon","Taxonomical Aids"],keys=Object.keys(topics),emojis=["🌱","🌍","🏷️","🪜","🌱","🧠","🔬","🗂️"];const app=document.getElementById("app"),key=new URLSearchParams(location.search).get("topic");function list(){app.innerHTML='<section class="hero"><div class="icon">🦉</div><h1>The Living World</h1><p>Learn through concept-wise tests and instant explanations.</p><div class="mode">🎯 CONCEPT-WISE PRACTICE</div></section><div class="label">CHOOSE A TEST</div>'+keys.map((k,i)=>'<a class="topic" href="?topic='+k+'"><span class="num">'+(i+1)+'</span><span class="emoji">'+emojis[i]+'</span><span class="copy"><b>'+labels[i]+'</b><small>'+topics[k].length+' practice questions</small></span><span class="start">START →</span></a>').join("")}function test(){const qs=topics[key];let i=0,score=0,wrong=[];app.innerHTML='<section class="hero"><div class="icon">'+emojis[keys.indexOf(key)]+'</div><h1>'+labels[keys.indexOf(key)]+'</h1><div class="progress"><span id="bar"></span></div><b id="status"></b></section><section class="quiz" id="quiz"></section><section class="result hidden" id="result"><h1>🏆 Test Complete!</h1><p id="score"></p><div id="review"></div><button class="next" onclick="location.href=location.pathname">BACK TO TESTS</button></section>';function render(){let q=qs[i],opts=q.slice(1,5).map((x,j)=>({x,j}));for(let n=opts.length-1;n>0;n--){let z=Math.floor(Math.random()*(n+1));[opts[n],opts[z]]=[opts[z],opts[n]]}document.getElementById("status").textContent="Question "+(i+1)+" / "+qs.length;document.getElementById("quiz").innerHTML='<h2>'+q[0]+'</h2><div class="opts">'+opts.map((o,n)=>'<button data="'+o.j+'">'+String.fromCharCode(65+n)+'. '+o.x+'</button>').join("")+'</div><div class="feedback" id="fb"></div>';document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>answer(+b.dataset.data,q))}function answer(choice,q){let bs=[...document.querySelectorAll(".opts button")];bs.forEach(b=>{b.disabled=true;if(+b.dataset.data===q[5])b.classList.add("correct")});let fb=document.getElementById("fb");if(choice===q[5]){score++;fb.innerHTML="🎉 Correct! Great job."}else{bs.find(b=>+b.dataset.data===choice).classList.add("wrong");wrong.push({q:q[0],correct:q[q[5]+1]});fb.innerHTML="💡 Correct answer: "+q[q[5]+1]+". Review this concept and try again!"}fb.innerHTML+="<button class=\"next\" id=\"next\">"+(i===qs.length-1?"FINISH →":"NEXT →")+"</button>";document.getElementById("next").onclick=()=>{i++;document.getElementById("bar").style.width=(i/qs.length*100)+"%";if(i<qs.length)render();else finish()}}function finish(){document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.remove("hidden");document.getElementById("score").textContent="Score: "+score+" / "+qs.length;document.getElementById("review").innerHTML=wrong.length?'<h2>📝 Review Wrong Attempts</h2>'+wrong.map(x=>'<div class="review-item"><b>'+x.q+'</b><br>✅ '+x.correct+'</div>').join(""):"🎉 Perfect! No wrong attempts."}render()}key&&topics[key]?test():list();</script></body></html>
