name: Remove non-NEET competitive cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove non-NEET cards
        shell: python
        run: |
          from pathlib import Path
          import re
          targets = {
            'full-physics-path.html': [r'<a class="choice jee"[^>]*>.*?</a>', r'\.jee\{[^}]*\}'],
            'botany-full-path.html': [r'<a class="choice advanced"[^>]*>.*?</a>', r'\.advanced\{[^}]*\}']
          }
          changed = []
          for name, patterns in targets.items():
            p = Path(name)
            if not p.exists():
              continue
            s = p.read_text(encoding='utf-8')
            old = s
            for pattern in patterns:
              s = re.sub(pattern, '', s, flags=re.S)
            if s != old:
              p.write_text(s, encoding='utf-8')
              changed.append(name)
          print('Cleaned:', ', '.join(changed) if changed else 'nothing to change')
      - name: Remove this one-time workflow
        shell: bash
        run: rm -f .github/workflows/remove-non-neet-subject-cards.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "SkillUp Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add full-physics-path.html botany-full-path.html .github/workflows/remove-non-neet-subject-cards.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove non-NEET competitive cards"
          git push
