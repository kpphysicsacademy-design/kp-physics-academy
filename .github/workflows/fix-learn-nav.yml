name: Fix SkillUp Physics Learn navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[learn-nav-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Physics Learn header and Home route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('full-physics-path.html')
          s = p.read_text(encoding='utf-8')
          old = '<header class="top"><a class="brand" href="physics-dashboard.html"><span class="atom">⚛️</span><div><b>KP PHYSICS</b><small>ACADEMY</small></div></a><div class="stats">'
          new = '''<header class="top"><div class="subject-switcher"><select aria-label="Select subject" class="subject-select" onchange="if(this.value)location.href=this.value"><option value="full-physics-path.html" selected>SkillUp Physics</option><option value="chemistry-skillup-path.html">SkillUp Chemistry</option><option value="botany-full-path.html">SkillUp Botany</option><option value="zoology-full-path.html">SkillUp Zoology</option><option value="maths-full-path.html">SkillUp Maths</option></select></div><div class="stats">'''
          if old not in s:
              raise SystemExit('Expected Physics header was not found; aborting without changes.')
          s = s.replace(old, new, 1)
          css = '.subject-switcher{display:flex;align-items:center}.subject-select{appearance:auto;background:#102744;color:#fff;border:1px solid #4b6fa0;border-radius:12px;padding:9px 34px 9px 12px;font-size:14px;font-weight:950;cursor:pointer;max-width:230px}.subject-select:focus{outline:2px solid var(--blue);outline-offset:2px}@media(max-width:720px){.subject-select{max-width:175px;font-size:12px;padding:8px 28px 8px 10px}.stats .pill:last-child{display:none}}'
          s = s.replace('</style>', css + '</style>', 1)
          s = s.replace('<nav class="footer"><a href="physics-dashboard.html">', '<nav class="footer"><a href="skillup-home.html">', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit the safe in-place update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full-physics-path.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Physics Learn subject selector [learn-nav-fixed]"
          git push
      - name: Remove one-time fixer
        if: success()
        run: |
          git rm .github/workflows/fix-learn-nav.yml
          git commit -m "Remove one-time Learn nav fixer [learn-nav-fixed]"
          git push
