name: Fix Five Kingdom concept routing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy practice layers and route exact Five Kingdom concept
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('question-bank.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script id="skillup-practice-structure-js">.*?</script>', '', s, flags=re.S)
          patch='''<script id="five-kingdom-exact-route">(function(){const p=new URLSearchParams(location.search);const subject=(p.get("subject")||"").trim().toLowerCase();const topic=(p.get("topic")||"").trim().replace(/\\s+/g," ").toLowerCase();if(subject==="botany"&&topic==="five kingdom classification"){location.replace("botany-biological-classification-test.html");}})();</script>'''
          if 'id="five-kingdom-exact-route"' not in s:
              s=s.replace('</body>',patch+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-five-kingdom-router.yml
          git add question-bank.html .github/workflows/fix-five-kingdom-router.yml
          git diff --cached --quiet || git commit -m 'Route Five Kingdom practice to its dedicated 40-MCQ test'
          git push
