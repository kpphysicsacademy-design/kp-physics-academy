name: Sync central navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject central navigation
        shell: python
        run: |
          from pathlib import Path
          files = ["full-physics-path.html", "chemistry-skillup-path.html", "botany-full-path.html", "zoology-full-path.html"]
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding="utf-8")
              if 'src="navigation.js"' not in text:
                  marker = "</body>"
                  if marker in text:
                      text = text.replace(marker, '<script src="navigation.js"></script></body>', 1)
                      p.write_text(text, encoding="utf-8")
          wf = Path(".github/workflows/sync-central-navigation.yml")
          if wf.exists():
              wf.unlink()
      - name: Commit synchronized navigation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full-physics-path.html chemistry-skillup-path.html botany-full-path.html zoology-full-path.html .github/workflows/sync-central-navigation.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Synchronize subject pages with central navigation"
          git push