name: Update Botany NEET Path
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Duolingo-style Botany question practice
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('botany-full-path.html')
          s=p.read_text(encoding='utf-8')
          if '<html' not in s.lower(): raise SystemExit('Botany page is not valid HTML; refusing to overwrite it')
          marker="['🟢','Cyanobacteria & Archaebacteria','',35,'botany-chapter-learn.html'],"
          additions="""
['🟣','Kingdom Protista','',45,'botany-chapter-learn.html'],
['🦠','Protists: Chrysophytes, Dinoflagellates, Euglenoids, Slime Moulds & Protozoans','',45,'botany-chapter-learn.html'],
['🍄','Kingdom Fungi','',45,'botany-chapter-learn.html'],
['🍄','Fungal Structure, Nutrition, Reproduction & Spores','',45,'botany-chapter-learn.html'],
"""
          if "['🟣','Kingdom Protista'" not in s:
              if marker not in s: raise SystemExit('Botany insertion marker not found')
              s=s.replace(marker,marker+'\n'+additions,1)
          css='''<style id="botany-duolingo-practice">.botany-practice{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:9px;background:#20a447;color:#fff;border-radius:10px;padding:8px 10px;font-size:9px;font-weight:950;text-decoration:none;box-shadow:0 3px 0 #16853b;transition:.15s}.botany-practice:hover{transform:translateY(-2px)}@media(max-width:720px){.botany-practice{font-size:8px;padding:7px 8px}}</style>'''
          if 'id="botany-duolingo-practice"' not in s: s=s.replace('</head>',css+'</head>',1)
          # The existing path renderer uses item[1] as the concept title. Add a practice CTA to each node card.
          anchor="card.className='node-card';"
          if anchor in s and 'botany-practice' not in s:
              inject="""card.className='node-card';
          const practice=document.createElement('a');
          practice.className='botany-practice';
          practice.href='question-bank.html?subject=botany&topic='+encodeURIComponent(item[1]);
          practice.textContent='🎯 PRACTICE QUESTIONS';
          card.appendChild(practice);"""
              s=s.replace(anchor,inject,1)
          s=re.sub(r'<nav class="nav">.*?</nav>','',s,count=1,flags=re.S)
          if 'src="navigation.js"' not in s: s=s.replace('</body>','<script src="navigation.js"></script></body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add botany-full-path.html
          if git diff --cached --quiet; then echo 'No Botany changes'; exit 0; fi
          git commit -m 'Add Duolingo-style Botany question practice'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/update-botany-release.yml || true
          git commit -m 'Remove temporary Botany update workflow' || true
          git push || true
