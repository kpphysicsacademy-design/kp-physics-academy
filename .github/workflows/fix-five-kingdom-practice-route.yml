name: Fix Five Kingdom Practice Route
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Five Kingdom route
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('question-bank.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          if 'FIVE_KINGDOM_ROUTE_PATCH' not in s:
              patch=r'''<script id="FIVE_KINGDOM_ROUTE_PATCH">
          (function(){
            const topic=decodeURIComponent(new URLSearchParams(location.search).get('topic')||'').trim().replace(/\s+/g,' ');
            if(topic!=='Five Kingdom Classification') return;
            const questions=[
              ['Need for Biological Classification','Why was a new classification system needed beyond the two-kingdom system?',['It could better accommodate organisms with different cellular organisation and nutrition','It classified organisms only by habitat','It classified organisms only by body size','It ignored cell structure'],0,'The five-kingdom system was developed to handle major differences in cellular organisation, body organisation and mode of nutrition that the two-kingdom system could not adequately represent.'],
              ['Limitations of Two-Kingdom Classification','Which group created a major difficulty for the traditional Plantae–Animalia division?',['Unicellular organisms with mixed characteristics','Only mammals','Only flowering plants','Only birds'],0,'Many unicellular organisms show characteristics that do not fit neatly into a simple plant-or-animal division.'],
              ['R.H. Whittaker & Five Kingdom System','Who proposed the five-kingdom classification in 1969?',['R.H. Whittaker','Carolus Linnaeus','Ernst Haeckel','Robert Brown'],0,'R.H. Whittaker proposed the five-kingdom classification in 1969.'],
              ['Criteria Used by Whittaker','Which set contains major criteria used by Whittaker?',['Cell structure, body organisation, nutrition and reproduction','Body colour, height and habitat','Only locomotion and size','Only geographical distribution'],0,'Whittaker considered cell structure, body organisation, mode of nutrition, reproduction and evolutionary relationships.'],
              ['Prokaryotic vs Eukaryotic Organisation','Which kingdom contains prokaryotic organisms in the five-kingdom system?',['Monera','Protista','Fungi','Animalia'],0,'Monera contains prokaryotic organisms, whereas Protista, Fungi, Plantae and Animalia are eukaryotic.'],
              ['Kingdom Monera — General Characteristics','Which feature is characteristic of Monera?',['Prokaryotic cellular organisation','Membrane-bound nucleus','Multicellular tissue organisation','Chitinous cell wall in all members'],0,'Monerans are prokaryotic and lack a true membrane-bound nucleus.'],
              ['Archaebacteria & Eubacteria','Which pair represents major groups traditionally included in Monera?',['Archaebacteria and eubacteria','Fungi and protozoans','Algae and bryophytes','Mosses and ferns'],0,'The traditional five-kingdom system includes archaebacteria and eubacteria within Monera.'],
              ['Cyanobacteria & Mycoplasma','Which statement correctly describes Mycoplasma?',['It is a prokaryote that lacks a cell wall','It is a multicellular fungus','It has a chitinous cell wall','It is a photosynthetic plant'],0,'Mycoplasma is a prokaryote notable for lacking a cell wall.'],
              ['Kingdom Protista — General Characteristics','Protista primarily contains:',['Unicellular eukaryotes','Only prokaryotes','Only multicellular plants','Only multicellular animals'],0,'Protista is primarily composed of unicellular eukaryotic organisms.'],
              ['Chrysophytes, Dinoflagellates & Euglenoids','Euglena is placed in Protista because it:',['Is a unicellular eukaryote with both photosynthetic and heterotrophic nutrition','Is a prokaryote','Has a chitinous cell wall','Is multicellular'],0,'Euglena is a unicellular eukaryote capable of photosynthetic and heterotrophic nutrition.'],
              ['Slime Moulds & Protozoans','Amoeba and Paramecium are classified under:',['Protista','Monera','Fungi','Plantae'],0,'Amoeba and Paramecium are unicellular eukaryotes classified in Protista.'],
              ['Kingdom Fungi — General Characteristics','Fungi are characteristically:',['Heterotrophic and absorptive','Autotrophic and ingestive','Prokaryotic and photosynthetic','Multicellular animals'],0,'Fungi are heterotrophs that characteristically obtain nutrients by absorption.'],
              ['Fungal Cell Wall, Hyphae & Mycelium','The fungal cell wall is mainly composed of:',['Chitin','Cellulose','Peptidoglycan','Lignin'],0,'Chitin is the characteristic major structural component of fungal cell walls.'],
              ['Fungal Nutrition & Reproduction','Which statement about fungal nutrition is correct?',['Food is digested externally and nutrients are absorbed','Food is always ingested into a digestive tract','All fungi are photosynthetic','Fungi lack extracellular enzymes'],0,'Fungi commonly secrete enzymes outside their bodies, digest substrates externally and absorb the resulting nutrients.'],
              ['Lichens & Mycorrhiza','A lichen is a symbiotic association involving:',['A fungus and a photosynthetic partner','Two fungi only','A plant and an animal','A virus and a bacterium'],0,'Lichens consist of a fungus associated with a photosynthetic partner such as an alga or cyanobacterium.'],
              ['Kingdom Plantae — General Characteristics','Which combination best describes Plantae?',['Multicellular eukaryotes with cell walls and predominantly autotrophic nutrition','Unicellular prokaryotes with no cell wall','Multicellular ingestive heterotrophs without cell walls','Acellular organisms'],0,'Plantae mainly consists of multicellular eukaryotes with cell walls and predominantly photosynthetic nutrition.'],
              ['Kingdom Animalia — General Characteristics','Which feature is characteristic of Animalia?',['Multicellular ingestive heterotrophy and absence of cell wall','Prokaryotic organisation','Absorptive nutrition with chitinous cell wall','Photosynthesis in chloroplasts'],0,'Animals are multicellular eukaryotes that obtain food by ingestion and lack cell walls.'],
              ['Comparative Features of Five Kingdoms','Which kingdom is distinguished by prokaryotic cellular organisation?',['Monera','Protista','Fungi','Plantae'],0,'Monera is the prokaryotic kingdom in Whittaker’s five-kingdom system.'],
              ['Comparative Features of Five Kingdoms','Which comparison is correct?',['Fungi absorb nutrients whereas animals ingest food','Animals have chitinous cell walls whereas fungi do not','Monera is eukaryotic whereas Protista is prokaryotic','Plantae lacks cell walls whereas Animalia has cellulose walls'],0,'Fungi characteristically obtain nutrients by absorption, while animals obtain food by ingestion.'],
              ['NCERT Examples & Identification','Which organism is correctly matched with its kingdom?',['Agaricus — Fungi','Amoeba — Monera','Nostoc — Animalia','Paramecium — Plantae'],0,'Agaricus is a mushroom belonging to Kingdom Fungi.'],
              ['Five Kingdom Classification — NEET Mastery','Which sequence correctly lists Whittaker’s five kingdoms?',['Monera, Protista, Fungi, Plantae, Animalia','Monera, Fungi, Protista, Animalia, Plantae','Protista, Monera, Plantae, Fungi, Animalia','Fungi, Monera, Animalia, Protista, Plantae'],0,'Whittaker’s five kingdoms are Monera, Protista, Fungi, Plantae and Animalia.']
            ];
            const hero=document.querySelector('.hero h1'); const desc=document.querySelector('.hero p');
            if(hero) hero.textContent='Five Kingdom Classification';
            if(desc) desc.textContent=questions.length+' concept-wise questions with immediate feedback and specific explanations.';
            document.title='SkillUp | Five Kingdom Classification Practice';
            let i=0,score=0,answered=false; const quiz=document.getElementById('quiz'),done=document.getElementById('done'),bar=document.getElementById('bar');
            function render(){answered=false;const x=questions[i];quiz.innerHTML='<div class="qnum">CONCEPT '+(i+1)+' OF '+questions.length+' · '+x[0]+'</div><div class="q">'+x[1]+'</div><div class="opts">'+x[2].map((o,n)=>'<button data-i="'+n+'">'+String.fromCharCode(65+n)+'. '+o+'</button>').join('')+'</div><div id="fb" class="feedback hidden"></div><button id="nx" class="next hidden">NEXT →</button>';bar.style.width=(i/questions.length*100)+'%';quiz.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b));}
            function answer(n,b){if(answered)return;answered=true;const x=questions[i],buttons=[...quiz.querySelectorAll('.opts button')];buttons.forEach(v=>v.disabled=true);const fb=quiz.querySelector('#fb');if(n===x[3]){score++;b.classList.add('correct');fb.textContent='✅ Correct. '+x[4]}else{b.classList.add('wrong');buttons[x[3]].classList.add('correct');fb.textContent='❌ Incorrect. '+x[4]+' Correct answer: '+String.fromCharCode(65+x[3])+'. '+x[2][x[3]]}fb.className='feedback';const nx=quiz.querySelector('#nx');nx.className='next';nx.textContent=i===questions.length-1?'SEE RESULT →':'NEXT →';nx.onclick=()=>{if(i<questions.length-1){i++;render()}else{quiz.classList.add('hidden');done.classList.remove('hidden');done.innerHTML='<h2>🌱 Five Kingdom Classification Complete</h2><p><strong>'+score+'/'+questions.length+'</strong> correct</p><p>'+Math.round(score/questions.length*100)+'% accuracy</p><button class="next" onclick="location.reload()">RETRY</button>'}}}
            render();
          })();
          </script>'''
              s=s.replace(marker,patch+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/fix-five-kingdom-practice-route.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add question-bank.html .github/workflows/fix-five-kingdom-practice-route.yml
          git commit -m 'Fix Five Kingdom Classification practice routing' || exit 0
          git push
