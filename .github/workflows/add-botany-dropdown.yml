name: Fix Subject Path Header Stats
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-subject-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Botany and Zoology header stats
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patches = {
              'botany-full-path.html': [
                  ('<div class="stats"><span class="pill">🔥 <b id="streak">0</b></span><span class="pill">⭐ <b id="xp">0</b> XP</span></div>',
                   '<div class="stats"><span class="pill">🔥 <b id="streak">0</b></span><span class="pill">⭐ <b id="xp">0</b> XP</span><span class="pill">❤️ 5</span></div>'),
                  ('<a href="maths-full-path.html">📐 Maths</a>', '')
              ],
              'zoology-full-path.html': [
                  ('<div class="stats"><span class="pill">🔥 <b id="streak">0</b></span><span class="pill">⭐ <b id="xp">0</b> XP</span></div>',
                   '<div class="stats"><span class="pill">🔥 <b id="streak">0</b></span><span class="pill">⭐ <b id="xp">0</b> XP</span><span class="pill">❤️ 5</span></div>'),
                  ('<a href="maths-full-path.html">📐 Maths</a>', '')
              ]
          }

          changed = []
          for name, replacements in patches.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(name)
                  print(f'Updated {name}')
              else:
                  print(f'{name}: no change needed')

          print('Changed files:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit subject path updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add botany-full-path.html zoology-full-path.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add heart stat to Botany and Zoology paths"
          git push
