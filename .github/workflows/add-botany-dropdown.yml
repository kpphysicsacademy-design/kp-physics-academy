name: Fix Botany Subject Dropdown
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-botany:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Maths from Botany dropdown
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('botany-full-path.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="maths-full-path.html">📐 Maths</a>'
          if old not in s:
              print('Maths entry already absent; no change needed.')
              raise SystemExit(0)
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')
          print('Removed Maths from Botany dropdown.')
          PY
      - name: Commit Botany update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add botany-full-path.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove Maths from Botany dropdown"
          git push
