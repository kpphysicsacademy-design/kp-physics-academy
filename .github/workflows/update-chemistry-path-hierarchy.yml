name: Update Chemistry Path Hierarchy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-chemistry-path-hierarchy.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add chapter and concept hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('chemistry-skillup-path.html')
          s=p.read_text(encoding='utf-8')
          old='.section{margin:0 0 34px;scroll-margin-top:88px}'
          new='.section{margin:0 0 34px;scroll-margin-top:88px}.unit-break{margin:24px 0 8px;padding:10px 14px;background:#fff;border:2px solid var(--blue);border-left:7px solid var(--blue);border-radius:14px;color:var(--navy);font-weight:950;letter-spacing:.2px}.unit-break .unit-no{font-size:9px;color:var(--blue);display:block;letter-spacing:1px;margin-bottom:2px}.unit-break .unit-title{font-size:15px;display:block}.concept-label{display:inline-block;margin-bottom:4px;padding:3px 7px;border-radius:7px;background:#f1edff;color:var(--blue);font-size:7px;font-weight:950;letter-spacing:.7px;text-transform:uppercase}'
          if old not in s: raise SystemExit('CSS anchor not found')
          s=s.replace(old,new,1)
          old_js="""const path=document.getElementById('path');let globalIndex=0;groups.forEach(g=>{const sec=document.createElement('section');sec.className='section';sec.innerHTML='<div class=\"section-head\"><span class=\"emoji\">'+g[0]+'</span><div class=\"text\"><h2>'+g[1]+'</h2><p>'+g[2]+'</p></div><span class=\"count\">'+(g[4]-g[3])+' units</span></div><div class=\"path\"></div>';const p=sec.querySelector('.path');for(let i=g[3];i<g[4];i++){const u=data[i],subs=u[4].split('|');subs.forEach((s,si)=>{const n=document.createElement('div');n.className='node '+(globalIndex===0?'current ':'')+(globalIndex%2?'right':'left');n.innerHTML='<div class=\"node-card\"><div class=\"node-top\"><h3>UNIT '+u[0]+' • '+u[1]+' — '+(si+1)+'/'+subs.length+'</h3></div><p class=\"node-desc\">'+s+'</p>'+(globalIndex===0?'<a class=\"continue\" href=\"question-bank.html?subject=chemistry\">PRACTICE →</a>':'')+'</div><div class=\"node-dot\">'+u[3]+'</div>';p.appendChild(n);globalIndex++})}path.appendChild(sec)});"""
          new_js="""const path=document.getElementById('path');let globalIndex=0;groups.forEach(g=>{const sec=document.createElement('section');sec.className='section';sec.innerHTML='<div class=\"section-head\"><span class=\"emoji\">'+g[0]+'</span><div class=\"text\"><h2>'+g[1]+'</h2><p>'+g[2]+'</p></div><span class=\"count\">'+(g[4]-g[3])+' units</span></div><div class=\"path\"></div>';const p=sec.querySelector('.path');for(let i=g[3];i<g[4];i++){const u=data[i],subs=u[4].split('|');const br=document.createElement('div');br.className='unit-break';br.innerHTML='<span class=\"unit-no\">UNIT '+u[0]+'</span><span class=\"unit-title\">'+u[1]+'</span>';p.appendChild(br);subs.forEach((s,si)=>{const n=document.createElement('div');n.className='node '+(globalIndex===0?'current ':'')+(globalIndex%2?'right':'left');n.innerHTML='<div class=\"node-card\"><div class=\"node-top\"><span class=\"concept-label\">CONCEPT '+(si+1)+' / '+subs.length+'</span><h3>'+s+'</h3></div><p class=\"node-desc\">Unit '+u[0]+' • '+u[1]+'</p>'+(globalIndex===0?'<a class=\"continue\" href=\"question-bank.html?subject=chemistry\">PRACTICE →</a>':'')+'</div><div class=\"node-dot\">'+u[3]+'</div>';p.appendChild(n);globalIndex++})}path.appendChild(sec)});"""
          if old_js not in s: raise SystemExit('JS anchor not found')
          s=s.replace(old_js,new_js,1)
          s=s.replace('20260905.3','20260905.4',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chemistry-skillup-path.html
          git diff --cached --quiet || git commit -m 'Add Chemistry unit breaks and concept titles'
          git push
      - name: Remove updater
        if: success()
        run: |
          git rm .github/workflows/update-chemistry-path-hierarchy.yml
          git commit -m 'Remove temporary Chemistry updater'
          git push
