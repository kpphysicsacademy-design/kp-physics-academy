name: Add Biological Classification Questions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add question set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('botany-biological-classification-test.html')
          s=p.read_text(encoding='utf-8')
          if 'Which kingdom contains organisms that are prokaryotic?' in s:
              print('Question set already present; no content change needed.')
              raise SystemExit(0)
          marker="],\n'monera':"
          if marker not in s:
              raise SystemExit('Insertion marker not found')
          b64=''
          additions=base64.b64decode(b64).decode()
          s=s.replace(marker, ',\n'+additions+'],\n\'monera\':', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit question set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add botany-biological-classification-test.html
          git diff --cached --quiet || git commit -m "Add next Biological Classification questions"
          git push
