name: Standardize Practice Navigation

on:
  push:
    paths:
      - '.github/workflows/fix-practice-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Practice self-contained
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('question-bank.html')
          s = p.read_text(encoding='utf-8')

          # Keep only the header dropdown for subject switching.
          s = re.sub(r'<style id="skillup-practice-subject-nav">[\s\S]*?</style>\s*', '', s, count=1)
          s = re.sub(r'<nav class="skillup-practice-nav"[\s\S]*?</nav>\s*', '', s, count=1)

          # Remove any Practice -> Learn Path buttons/links added by older workflows.
          s = re.sub(r'<style id="skillup-practice-learn-link">[\s\S]*?</style>\s*', '', s, count=1)
          s = re.sub(r'<div class="skillup-practice-learn">[\s\S]*?</div>\s*', '', s, count=1)
          s = re.sub(r'<a[^>]+href="(?:full-physics-path|chemistry-skillup-path|botany-full-path|zoology-full-path|maths-full-path)\.html"[^>]*>[\s\S]*?</a>', '', s)

          # The subject dropdown remains the only cross-subject navigation on Practice.
          # Topic/question links inside Practice are intentionally preserved.

          # Remove duplicate structure initializers, keeping the first.
          marker = '<script id="skillup-practice-structure-js">'
          first = s.find(marker)
          if first >= 0:
              end = s.find('</script>', first)
              if end >= 0:
                  pos = end + 9
                  while True:
                      nxt = s.find(marker, pos)
                      if nxt < 0:
                          break
                      nxtend = s.find('</script>', nxt)
                      if nxtend < 0:
                          break
                      s = s[:nxt] + s[nxtend + 9:]

          p.write_text(s, encoding='utf-8')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question-bank.html
          git diff --cached --quiet || git commit -m "Remove Practice page Learn connections"
          git push
