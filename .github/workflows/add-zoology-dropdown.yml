name: Add Zoology Subject Dropdown
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-zoology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add subject dropdown if missing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('zoology-full-path.html')
          s=p.read_text(encoding='utf-8')
          if 'skillup-subject-dropdown' in s:
              raise SystemExit(0)
          old='<div class="stats"><span class="pill">🔥 <b id="streak">0</b></span><span class="pill">⭐ <b id="xp">0</b> XP</span><span class="pill">🧬 ZOOLOGY</span></div>'
          new='''<div class="skillup-subject-dropdown" id="skillup-subject-dropdown"><button type="button" class="skillup-subject-toggle" onclick="document.getElementById(\'skillup-subject-menu\').classList.toggle(\'show\')">🧬 ZOOLOGY ▾</button><div class="skillup-subject-menu" id="skillup-subject-menu"><a href="full-physics-path.html">⚡ Physics</a><a href="chemistry-skillup-path.html">🧪 Chemistry</a><a href="botany-full-path.html">🌿 Botany</a><a class="selected" href="zoology-full-path.html">🧬 Zoology</a><a href="maths-full-path.html">📐 Maths</a></div></div><div class="stats"><span class="pill">🔥 <b id="streak">0</b></span><span class="pill">⭐ <b id="xp">0</b> XP</span></div>'''
          css='''<style id="skillup-subject-dropdown">.skillup-subject-dropdown{position:relative;margin-left:auto;margin-right:8px}.skillup-subject-toggle{border:1px solid #2a5962;background:#103e49;color:#fff;border-radius:12px;padding:7px 11px;font:900 11px Inter,system-ui,sans-serif;cursor:pointer}.skillup-subject-menu{display:none;position:absolute;right:0;top:calc(100% + 7px);min-width:175px;background:#fff;border:1px solid #d8e8eb;border-radius:12px;box-shadow:0 10px 25px #0002;overflow:hidden;z-index:100}.skillup-subject-menu.show{display:block}.skillup-subject-menu a{display:block;padding:10px 12px;color:#17323a;text-decoration:none;font:900 11px Inter,system-ui,sans-serif}.skillup-subject-menu a:hover,.skillup-subject-menu a.selected{background:#e8f8e9;color:#078390}@media(max-width:720px){.skillup-subject-dropdown{margin-left:auto;margin-right:5px}.skillup-subject-toggle{padding:6px 8px;font-size:9px}.skillup-subject-menu{right:-4px;min-width:160px}}</style>'''
          if old not in s: raise SystemExit('Expected Zoology header not found')
          s=s.replace('</head>',css+'</head>',1).replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Zoology update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zoology-full-path.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Zoology subject dropdown"
          git push
