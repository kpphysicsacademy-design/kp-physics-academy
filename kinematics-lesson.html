<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinematics Task | KP Physics Academy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f9fd;color:#10213a}.top{background:#071a31;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:28px 18px 70px}.hero{text-align:center}.hero h1{font-size:34px}.muted{color:#718096;line-height:1.5}.card{background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 6px 20px #0000000a}.q{font-weight:800;margin-bottom:14px}.opt{display:block;width:100%;text-align:left;border:1px solid #d7e0ea;background:#f8fbff;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}.opt:hover{border-color:#1687ff}.opt.correct{border-color:#20b56b;background:#eafaf2}.opt.wrong{border-color:#e64b4b;background:#fff0f0}.feedback{font-weight:700;margin-top:10px}.summary{display:none;background:#fff7dc;border:1px solid #f1d37b;border-radius:16px;padding:18px;margin-top:20px}.btn{display:inline-block;padding:11px 18px;border-radius:9px;background:#1687ff;color:#fff;text-decoration:none;border:0;font-weight:800;cursor:pointer;margin:6px}.danger{background:#e64b4b}.green{background:#20b56b}.bar{height:10px;background:#e7edf4;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#20b56b}</style></head><body><header class="top"><a href="kinematics-path.html">← Kinematics</a><a href="index.html">Home</a></header><main class="wrap"><section class="hero"><p>🧭 JEE PHYSICS • MECHANICS • KINEMATICS</p><h1 id="title">Kinematics Task</h1><p class="muted">Only MCQs • Answer → Correction → Retry wrong questions → Master</p><div class="bar"><i id="bar"></i></div></section><div id="quiz"></div><div id="summary" class="summary"></div></main><script>const qs=[{q:'A physical quantity that specifies an object’s location relative to a chosen origin is called:',o:['Speed','Position','Acceleration','Time'],a:1,e:'Position tells where the object is located relative to the chosen reference frame.'},{q:'A student walks 5 m east and then 5 m west. What are the distance and magnitude of displacement?',o:['0 m, 10 m','10 m, 0 m','5 m, 5 m','10 m, 10 m'],a:1,e:'Distance is total path length = 10 m. The final position is the starting position, so displacement is 0 m.'},{q:'The SI unit of velocity is:',o:['m','m/s','m/s²','N'],a:1,e:'Velocity is displacement per unit time, so its SI unit is m/s.'},{q:'If an object moves with constant velocity, its acceleration is:',o:['Zero','Constant but non-zero','Increasing','Decreasing'],a:0,e:'Acceleration is the rate of change of velocity. Constant velocity means no change in velocity, hence zero acceleration.'},{q:'The slope of a position-time graph represents:',o:['Acceleration','Distance','Velocity','Force'],a:2,e:'Slope of an x-t graph is Δx/Δt, which represents velocity.'}];let id=Number(new URLSearchParams(location.search).get('id')||0);let index=0,wrong=[],answered=false;document.getElementById('title').textContent='Task '+(id+1)+' • '+(id===0?'What is Motion?':'Kinematics Concept');function render(){document.getElementById('bar').style.width=Math.round(index/qs.length*100)+'%';const x=qs[index];document.getElementById('quiz').innerHTML=`<div class="card"><div class="q">${index+1}. ${x.q}</div>${x.o.map((v,i)=>`<button class="opt" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}<div id="feedback" class="feedback"></div></div>`}function answer(i){if(answered)return;answered=true;const x=qs[index];const buttons=document.querySelectorAll('.opt');buttons[i].classList.add(i===x.a?'correct':'wrong');buttons[x.a].classList.add('correct');const f=document.getElementById('feedback');if(i!==x.a){wrong.push(index);f.innerHTML='❌ Incorrect. '+x.e+'<br><button class="btn danger" onclick="retryCurrent()">Retry this question</button>'}else{f.innerHTML='✅ Correct. '+x.e+'<br><button class="btn" onclick="next()">Next →</button>'}}function retryCurrent(){answered=false;render()}function next(){if(index<qs.length-1){index++;answered=false;render()}else{if(wrong.length){document.getElementById('summary').style.display='block';document.getElementById('summary').innerHTML=`⚠️ You still have ${wrong.length} incorrectly attempted question(s). Retry them until all are correct.<br><button class="btn danger" onclick="restartWrong()">Retry Wrong Questions</button>`}else{const old=Number(localStorage.getItem('kp_kinematics_completed')||0);if(id>=old)localStorage.setItem('kp_kinematics_completed',Math.min(id+1,127));document.getElementById('summary').style.display='block';document.getElementById('summary').innerHTML='🏆 Task mastered! All 5 questions were answered correctly.<br><a class="btn green" href="kinematics-path.html">Back to Kinematics Path</a>'}}}function restartWrong(){const unique=[...new Set(wrong)];wrong=[];index=unique[0];answered=false;render();if(unique.length>1){const oldNext=next;next=function(){if(unique.length>1){unique.shift();index=unique[0];answered=false;render()}else{next=oldNext;next()}}}}render();</script></body></html>
