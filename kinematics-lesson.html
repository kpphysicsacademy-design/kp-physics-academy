<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinematics Lesson | KP Physics Academy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f7f7f7;color:#243238}.top{background:#fff;border-bottom:2px solid #eee;padding:14px 18px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}.top a{text-decoration:none;color:#1687ff;font-weight:800}.wrap{max-width:700px;margin:auto;padding:24px 16px 90px}.hero{text-align:center}.eyebrow{font-size:12px;font-weight:800;color:#777;letter-spacing:.7px}.hero h1{font-size:30px;margin:8px 0}.muted{color:#68757b;line-height:1.55}.stats{display:flex;justify-content:center;gap:18px;margin:16px 0;font-weight:800}.progress{height:10px;background:#e6e6e6;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#58cc02}.card{background:#fff;border:2px solid #e5e5e5;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 3px 0 #ddd}.q{font-size:19px;font-weight:800;line-height:1.45}.opt{display:block;width:100%;margin:10px 0;padding:14px;border:2px solid #e1e5e7;background:#fff;border-radius:13px;text-align:left;font-size:16px;cursor:pointer}.opt.correct{border-color:#58cc02;background:#efffe8}.opt.wrong{border-color:#ff4b4b;background:#fff1f1}.feedback{font-weight:800;line-height:1.5;margin-top:14px}.btn{display:inline-block;width:100%;padding:14px;border:0;border-radius:13px;background:#58cc02;color:#fff;font-weight:900;cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #46a800;text-decoration:none;text-align:center}.secondary{background:#fff;color:#1687ff;border:2px solid #1687ff;box-shadow:none}.summary{display:none;text-align:center}.xp{font-size:24px;font-weight:900}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#eef9e9;color:#3d8c19;font-size:12px;font-weight:900}@media(max-width:480px){.hero h1{font-size:26px}.q{font-size:18px}}</style></head><body><header class="top"><a href="kinematics-path.html">← Kinematics</a><a href="app.html">⚡ App</a></header><main class="wrap"><section class="hero"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="muted">Learn → Practice → Retry → Master</p><div class="stats"><span>🔥 <b id="streak">0</b></span><span>⭐ <b id="xp">0</b> XP</span><span>❤️ <b id="hearts">5</b></span></div><div class="progress"><i id="bar"></i></div></section><section class="card"><h2>🧠 Learn</h2><p id="learn" class="muted"></p><p id="key" class="muted"></p></section><div id="quiz"></div><section id="summary" class="card summary"></section><a class="btn secondary" href="kinematics-path.html">Back to Kinematics Path</a></main><script>
const lessons=[
{title:'🏃 What is Motion?',learn:'Motion describes a change in position with respect to a chosen reference frame as time changes. Rest and motion are relative.',key:'Motion is relative to a reference frame.',qs:[['Which quantity specifies an object’s location relative to an origin?',['Speed','Position','Acceleration','Time'],1,'Position specifies location.'],['A passenger in a moving bus is at rest relative to:',['The road','A tree','Another passenger beside them','A stationary observer'],2,'Both passengers have the same motion relative to each other.'],['A student walks 5 m east and 5 m west. Distance and displacement are:',['0 m, 10 m','10 m, 0 m','5 m, 5 m','10 m, 10 m'],1,'Total path is 10 m; final position equals initial position.'],['Which statement is correct?',['Motion is absolute','Rest and motion depend on reference frame','Mass alone determines motion','An object can never be at rest'],1,'Rest and motion are relative.'],['A person walks east inside a train moving east. Ground velocity is generally:',['Zero','Train minus walking velocity','Train plus walking velocity','Walking velocity only'],2,'Velocities add in the same direction.']]},
{title:'📏 Distance & Displacement',learn:'Distance is total path length and is scalar. Displacement is directed change from initial to final position and is vector.',key:'Distance depends on path; displacement depends only on initial and final positions.',qs:[['Which quantity is scalar?',['Displacement','Distance','Velocity','Acceleration'],1,'Distance has magnitude only.'],['A runner completes one 400 m lap and returns to the start. Distance and displacement are:',['0 m, 400 m','400 m, 0 m','400 m, 400 m','0 m, 0 m'],1,'The path is 400 m; net displacement is zero.'],['The magnitude of displacement can never be:',['Greater than distance','Equal to distance','Less than distance','Zero'],0,'Displacement magnitude is always less than or equal to distance.'],['A person walks 3 m east and 4 m north. Displacement magnitude is:',['1 m','5 m','7 m','12 m'],1,'√(3²+4²)=5 m.'],['Straight-line motion without reversal gives distance:',['Less than displacement','Equal to displacement magnitude','Always zero','Unrelated'],1,'Path length equals displacement magnitude.']]},
{title:'🏎️ Speed & Velocity',learn:'Speed is rate of change of distance and is scalar. Velocity is rate of change of displacement and is vector. Average speed uses total distance; average velocity uses displacement.',key:'Average speed = total distance/time; average velocity = displacement/time.',qs:[['Which quantity is a vector?',['Speed','Distance','Velocity','Time'],2,'Velocity has magnitude and direction.'],['A car travels 60 km in 2 h. Average speed is:',['20 km/h','30 km/h','60 km/h','120 km/h'],1,'60/2 = 30 km/h.'],['A particle returns to its starting point after a round trip. Average velocity is:',['Maximum','Equal to speed','Zero','Negative'],2,'Net displacement is zero.'],['A car travels 20 m east in 4 s. Average velocity is:',['5 m/s east','5 m/s west','80 m/s east','0'],0,'20/4 = 5 m/s east.'],['Can average velocity magnitude exceed average speed?',['Yes always','Sometimes','No','Only circular motion'],2,'Displacement magnitude cannot exceed distance.']]},
{title:'🚀 Acceleration',learn:'Acceleration is the rate of change of velocity with time. It is a vector. Acceleration may occur when speed changes, direction changes, or both.',key:'a = Δv/Δt. Acceleration and velocity need not point in the same direction.',qs:[['The SI unit of acceleration is:',['m/s','m/s²','N','m²/s'],1,'Acceleration is change in velocity per unit time, so its unit is m/s².'],['A car changes velocity from 10 m/s to 30 m/s in 5 s. Average acceleration is:',['2 m/s²','4 m/s²','6 m/s²','8 m/s²'],1,'a=(30−10)/5=4 m/s².'],['An object moving with constant velocity has acceleration:',['Zero','Constant non-zero','Increasing','Infinite'],0,'Constant velocity means no change in velocity.'],['A body can have acceleration while its speed remains constant when:',['It is at rest','It moves in a circle','It moves in a straight line at constant velocity','Time stops'],1,'In circular motion, direction of velocity changes, so acceleration exists even at constant speed.'],['If velocity changes from +20 m/s to +5 m/s in 3 s, average acceleration is:',['+5 m/s²','−5 m/s²','+15 m/s²','−15 m/s²'],1,'a=(5−20)/3=−5 m/s².']]},
{title:'📈 Graphs of Motion',learn:'The slope of a position-time graph gives velocity. The slope of a velocity-time graph gives acceleration. The area under a velocity-time graph gives displacement.',key:'Slope of x-t = velocity; slope of v-t = acceleration; area under v-t = displacement.',qs:[['The slope of a position-time graph represents:',['Acceleration','Velocity','Displacement','Speed only'],1,'Slope = Δx/Δt, which is velocity.'],['A horizontal line on a position-time graph indicates that the object is:',['Moving with constant acceleration','At rest','Moving with constant speed','Moving backward'],1,'Position remains constant, so velocity is zero.'],['The slope of a velocity-time graph represents:',['Distance','Displacement','Acceleration','Position'],2,'Slope = Δv/Δt, which is acceleration.'],['The area under a velocity-time graph gives:',['Acceleration','Displacement','Position-time slope','Jerk'],1,'Signed area under v-t equals displacement.'],['A velocity-time graph shows constant velocity of 5 m/s for 4 s. Displacement is:',['1.25 m','9 m','20 m','25 m'],2,'Area = 5 × 4 = 20 m.']]},
{title:'📐 Equations of Motion',learn:'For one-dimensional motion with constant acceleration, v = u + at, s = ut + ½at², and v² = u² + 2as. These equations should not be used blindly when acceleration varies.',key:'Constant acceleration: v=u+at; s=ut+½at²; v²=u²+2as.',qs:[['Which equation gives final velocity for constant acceleration?',['v=u+at','s=ut+½at²','v²=u²+2as','s=vt'],0,'The first equation relates initial velocity, acceleration, time and final velocity.'],['A body starts from rest with acceleration 2 m/s² for 5 s. Final velocity is:',['5 m/s','10 m/s','12 m/s','25 m/s'],1,'v=u+at=0+(2)(5)=10 m/s.'],['A body starts from rest with a=4 m/s² for 3 s. Distance travelled is:',['6 m','12 m','18 m','36 m'],2,'s=½at²=½(4)(9)=18 m.'],['A particle has u=5 m/s, a=3 m/s² and travels 10 m. Final speed is approximately:',['5 m/s','9.22 m/s','10 m/s','13 m/s'],1,'v²=u²+2as=25+60=85, so v≈9.22 m/s.'],['The standard three equations of motion require:',['Constant acceleration','Constant velocity only','Zero displacement','Circular motion'],0,'These equations are derived for constant acceleration in one-dimensional motion.']]},
{title:'🔄 Relative Motion',learn:'Relative velocity describes how one object appears to move as seen from another object. For objects A and B, v(A/B) = v(A) − v(B). In one dimension, choose a positive direction and keep signs consistent.',key:'Relative velocity: v(A/B)=v(A)−v(B). For opposite directions, signed velocities must be used.',qs:[['The velocity of A relative to B is written as:',['v(A)+v(B)','v(A)−v(B)','v(B)−v(A) always','v(A)v(B)'],1,'Relative velocity of A with respect to B is v(A)−v(B).'],['Car A moves east at 20 m/s and car B moves east at 12 m/s. Velocity of A relative to B is:',['8 m/s east','8 m/s west','32 m/s east','32 m/s west'],0,'v(A/B)=20−12=8 m/s east.'],['Two cars move toward each other at 20 m/s and 15 m/s. Their relative speed is:',['5 m/s','15 m/s','20 m/s','35 m/s'],3,'For opposite directions, relative speed is 20+15=35 m/s.'],['A passenger walks east at 2 m/s inside a train moving east at 10 m/s relative to ground. Passenger speed relative to ground is:',['2 m/s','8 m/s','10 m/s','12 m/s'],3,'Same direction: 10+2=12 m/s east.'],['A boat moves north at 5 m/s relative to water while the river flows east at 3 m/s. Its ground speed is:',['2 m/s','3 m/s','5 m/s','√34 m/s'],3,'The velocities are perpendicular, so speed = √(5²+3²)=√34 m/s.']]},
{title:'🎯 Projectile Motion',learn:'A projectile moves under gravity after launch when air resistance is neglected. Horizontal and vertical motions are independent: horizontal velocity is constant while vertical velocity changes due to g.',key:'For launch speed u at angle θ: T=u sinθ/g, H=u²sin²θ/(2g), R=u²sin2θ/g for level-ground projection.',qs:[['In ideal projectile motion, horizontal acceleration is:',['g','−g','Zero','Variable'],2,'Gravity acts vertically, so horizontal acceleration is zero when air resistance is neglected.'],['A projectile is launched with speed u at angle θ. Its horizontal component of initial velocity is:',['u sinθ','u cosθ','u tanθ','u/g'],1,'Resolving u into components gives u cosθ horizontally and u sinθ vertically.'],['For a projectile returning to the same level, time of flight is:',['u cosθ/g','u sinθ/g','2u sinθ/g','u² sin²θ/g'],2,'Vertical displacement is zero: T=2u sinθ/g.'],['For level-ground projection, maximum horizontal range occurs at θ =:',['30°','45°','60°','90°'],1,'R=u²sin2θ/g is maximum when sin2θ=1, so θ=45°.'],['At the highest point of a projectile, its vertical velocity is:',['u sinθ','g','Zero','Maximum'],2,'Vertical velocity becomes zero at the highest point; horizontal velocity remains u cosθ.']]}
];
const id=Math.max(0,Math.min(lessons.length-1,Number(new URLSearchParams(location.search).get('id')||0)));const lesson=lessons[id];let index=0,wrong=[],answered=false;const progressKey='kp_kinematics_completed';function saved(){try{return JSON.parse(localStorage.getItem('kpPhysicsAppProgress')||'{}')}catch(e){return {}}}function save(s){localStorage.setItem('kpPhysicsAppProgress',JSON.stringify(s))}function stats(){const s=saved();document.getElementById('xp').textContent=s.xp||0;document.getElementById('hearts').textContent=s.hearts??5;document.getElementById('streak').textContent=s.streak||0}document.getElementById('eyebrow').textContent=`JEE PHYSICS • MECHANICS • KINEMATICS • LESSON ${id+1}`;document.getElementById('title').textContent=lesson.title;document.getElementById('learn').textContent=lesson.learn;document.getElementById('key').innerHTML='<b>'+lesson.key+'</b>';function render(){document.getElementById('bar').style.width=Math.round(index/lesson.qs.length*100)+'%';stats();const x=lesson.qs[index];document.getElementById('quiz').innerHTML=`<section class="card"><div class="badge">QUESTION ${index+1} / ${lesson.qs.length}</div><p class="q">${x[0]}</p>${x[1].map((v,i)=>`<button class="opt" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}<div id="feedback" class="feedback"></div></section>`}function answer(i){if(answered)return;answered=true;const x=lesson.qs[index],b=document.querySelectorAll('.opt');b[i].classList.add(i===x[2]?'correct':'wrong');if(i!==x[2])b[x[2]].classList.add('correct');const s=saved();if(i!==x[2]){wrong.push(index);s.hearts=Math.max(0,Number(s.hearts??5)-1);document.getElementById('feedback').innerHTML=`❌ Incorrect.<br>${x[3]}<br><button class="btn secondary" onclick="retryCurrent()">Retry this question</button>`}else document.getElementById('feedback').innerHTML=`✅ Correct!<br>${x[3]}<br><button class="btn" onclick="next()">Continue →</button>`;save(s);stats()}function retryCurrent(){answered=false;render()}function next(){if(index<lesson.qs.length-1){index++;answered=false;render()}else if(wrong.length)showRetry();else master()}function showRetry(){const box=document.getElementById('summary');box.style.display='block';box.innerHTML=`<div class="xp">🔁 Almost there!</div><p class="muted">${wrong.length} question(s) need another attempt.</p><button class="btn" onclick="retryWrong()">Retry Wrong Questions</button>`}function retryWrong(){const list=[...new Set(wrong)];wrong=[];index=list[0];answered=false;render();let n=0;const original=next;next=function(){if(n<list.length-1){n++;index=list[n];answered=false;render()}else{next=original;master()}}}function master(){const s=saved();s.xp=Number(s.xp||0)+50;s.hearts=Math.max(1,Number(s.hearts??5));save(s);const old=Number(localStorage.getItem(progressKey)||0);if(id+1>old)localStorage.setItem(progressKey,String(id+1));document.getElementById('quiz').innerHTML='';const box=document.getElementById('summary');box.style.display='block';box.innerHTML=`<div class="xp">🏆 Lesson Mastered!</div><p class="muted">You completed <b>${lesson.title}</b>.</p><p>⭐ <b>+50 XP</b></p><a class="btn" href="kinematics-path.html">Continue Kinematics →</a>`;document.getElementById('bar').style.width='100%';stats()}render();</script></body></html>
