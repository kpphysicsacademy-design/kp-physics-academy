<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinematics Lesson | KP Physics Academy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f7f7f7;color:#243238}.top{background:#fff;border-bottom:2px solid #eee;padding:14px 18px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}.top a{text-decoration:none;color:#1687ff;font-weight:800}.wrap{max-width:700px;margin:auto;padding:24px 16px 90px}.hero{text-align:center}.eyebrow{font-size:12px;font-weight:800;color:#777;letter-spacing:.7px}.hero h1{font-size:30px;margin:8px 0}.muted{color:#68757b;line-height:1.55}.stats{display:flex;justify-content:center;gap:18px;margin:16px 0;font-weight:800}.progress{height:10px;background:#e6e6e6;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#58cc02}.card{background:#fff;border:2px solid #e5e5e5;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 3px 0 #ddd}.q{font-size:19px;font-weight:800;line-height:1.45}.opt{display:block;width:100%;margin:10px 0;padding:14px;border:2px solid #e1e5e7;background:#fff;border-radius:13px;text-align:left;font-size:16px;cursor:pointer}.opt:hover{border-color:#58cc02}.opt.correct{border-color:#58cc02;background:#efffe8}.opt.wrong{border-color:#ff4b4b;background:#fff1f1}.feedback{font-weight:800;line-height:1.5;margin-top:14px}.btn{display:inline-block;width:100%;padding:14px;border:0;border-radius:13px;background:#58cc02;color:#fff;font-weight:900;cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #46a800;text-decoration:none;text-align:center}.secondary{background:#fff;color:#1687ff;border:2px solid #1687ff;box-shadow:none}.summary{display:none;text-align:center}.xp{font-size:24px;font-weight:900}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#eef9e9;color:#3d8c19;font-size:12px;font-weight:900}@media(max-width:480px){.hero h1{font-size:26px}.q{font-size:18px}}</style></head><body><header class="top"><a href="kinematics-path.html">← Kinematics</a><a href="app.html">⚡ App</a></header><main class="wrap"><section class="hero"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="muted">Learn → Practice → Retry → Master</p><div class="stats"><span>🔥 <b id="streak">0</b></span><span>⭐ <b id="xp">0</b> XP</span><span>❤️ <b id="hearts">5</b></span></div><div class="progress"><i id="bar"></i></div></section><section class="card"><h2>🧠 Learn</h2><p id="learn" class="muted"></p><p id="key" class="muted"></p></section><div id="quiz"></div><section id="summary" class="card summary"></section><a class="btn secondary" href="kinematics-path.html">Back to Kinematics Path</a></main><script>
const lessons=[
{title:'🏃 What is Motion?',learn:'Motion describes a change in the position of an object with respect to a chosen reference frame as time changes. Rest and motion are relative to the observer or reference frame.',key:'Key idea: Motion is relative to a reference frame.',qs:[
['A physical quantity that specifies an object’s location relative to a chosen origin is called:',['Speed','Position','Acceleration','Time'],1,'Position specifies where an object is located relative to the chosen reference frame.'],
['A passenger sitting inside a moving bus is at rest with respect to:',['The road','A tree beside the road','Another passenger sitting beside them','A stationary observer on the road'],2,'Both passengers share the same velocity, so the passenger is at rest relative to the other passenger.'],
['A student walks 5 m east and then 5 m west. What are the distance travelled and magnitude of displacement?',['0 m, 10 m','10 m, 0 m','5 m, 5 m','10 m, 10 m'],1,'Distance is 10 m, while displacement is zero because the student returns to the starting position.'],
['Which statement about motion is correct?',['Motion is always absolute','Rest and motion depend on the reference frame','An object cannot be at rest and in motion simultaneously','Motion depends only on mass'],1,'Rest and motion are relative concepts and depend on the reference frame.'],
['A person walks east inside a train moving east. Relative to the ground, the person’s velocity is generally:',['Zero','Train velocity minus walking velocity','Train velocity plus walking velocity','Always equal to walking velocity'],2,'For the same direction, velocities add: v(person,ground)=v(train,ground)+v(person,train).']]},
{title:'📏 Distance & Displacement',learn:'Distance is the total path length travelled by an object and is a scalar. Displacement is the directed change in position from the initial point to the final point and is a vector.',key:'Key idea: Distance depends on the path; displacement depends only on initial and final positions.',qs:[
['Which quantity is a scalar?',['Displacement','Distance','Velocity','Acceleration'],1,'Distance has magnitude only, so it is a scalar quantity.'],
['A runner completes one full 400 m lap and returns to the starting point. The distance and displacement are:',['0 m, 400 m','400 m, 0 m','400 m, 400 m','0 m, 0 m'],1,'The runner travels 400 m, but the initial and final positions coincide, so displacement is zero.'],
['The magnitude of displacement can never be:',['Greater than distance','Equal to distance','Less than distance','Zero'],0,'For any motion, displacement magnitude is less than or equal to distance.'],
['A person walks 3 m east and 4 m north. The magnitude of displacement is:',['1 m','5 m','7 m','12 m'],1,'The two displacements are perpendicular, so magnitude = √(3²+4²)=5 m.'],
['If an object moves in a straight line without changing direction, then distance travelled is:',['Always less than displacement magnitude','Equal to displacement magnitude','Always zero','Unrelated to displacement'],1,'For straight-line motion in one direction, path length equals the magnitude of displacement.']]}
];
const id=Math.max(0,Math.min(lessons.length-1,Number(new URLSearchParams(location.search).get('id')||0)));const lesson=lessons[id];let index=0,wrong=[],answered=false;const progressKey='kp_kinematics_completed';
function saved(){try{return JSON.parse(localStorage.getItem('kpPhysicsAppProgress')||'{}')}catch(e){return {}}}function save(s){localStorage.setItem('kpPhysicsAppProgress',JSON.stringify(s))}function updateStats(){const s=saved();document.getElementById('xp').textContent=s.xp||0;document.getElementById('hearts').textContent=s.hearts??5;document.getElementById('streak').textContent=s.streak||0}document.getElementById('eyebrow').textContent=`JEE PHYSICS • MECHANICS • KINEMATICS • LESSON ${id+1}`;document.getElementById('title').textContent=lesson.title;document.getElementById('learn').textContent=lesson.learn;document.getElementById('key').innerHTML='<b>'+lesson.key+'</b>';
function render(){document.getElementById('bar').style.width=Math.round(index/lesson.qs.length*100)+'%';updateStats();const x=lesson.qs[index];document.getElementById('quiz').innerHTML=`<section class="card"><div class="badge">QUESTION ${index+1} / ${lesson.qs.length}</div><p class="q">${x[0]}</p>${x[1].map((v,i)=>`<button class="opt" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}<div id="feedback" class="feedback"></div></section>`}
function answer(i){if(answered)return;answered=true;const x=lesson.qs[index],buttons=document.querySelectorAll('.opt');buttons[i].classList.add(i===x[2]?'correct':'wrong');if(i!==x[2])buttons[x[2]].classList.add('correct');const s=saved();if(i!==x[2]){wrong.push(index);s.hearts=Math.max(0,Number(s.hearts??5)-1);document.getElementById('feedback').innerHTML=`❌ Incorrect.<br>${x[3]}<br><button class="btn secondary" onclick="retryCurrent()">Retry this question</button>`}else document.getElementById('feedback').innerHTML=`✅ Correct!<br>${x[3]}<br><button class="btn" onclick="next()">Continue →</button>`;save(s);updateStats()}
function retryCurrent(){answered=false;render()}function next(){if(index<lesson.qs.length-1){index++;answered=false;render();return}if(wrong.length)showRetry();else master()}function showRetry(){const box=document.getElementById('summary');box.style.display='block';box.innerHTML=`<div class="xp">🔁 Almost there!</div><p class="muted">${wrong.length} question(s) need another attempt. Master the lesson by answering every question correctly.</p><button class="btn" onclick="retryWrong()">Retry Wrong Questions</button>`}function retryWrong(){const list=[...new Set(wrong)];wrong=[];index=list[0];answered=false;render();let n=0;const originalNext=next;next=function(){if(n<list.length-1){n++;index=list[n];answered=false;render()}else{next=originalNext;master()}}}
function master(){const s=saved();s.xp=Number(s.xp||0)+50;s.hearts=Math.max(1,Number(s.hearts??5));save(s);const old=Number(localStorage.getItem(progressKey)||0);if(id+1>old)localStorage.setItem(progressKey,String(id+1));document.getElementById('quiz').innerHTML='';const box=document.getElementById('summary');box.style.display='block';box.innerHTML=`<div class="xp">🏆 Lesson Mastered!</div><p class="muted">You completed <b>${lesson.title}</b> with all questions correct.</p><p>⭐ <b>+50 XP</b></p><a class="btn" href="kinematics-path.html">Continue Kinematics →</a>`;document.getElementById('xp').textContent=s.xp;document.getElementById('bar').style.width='100%'}render();
</script></body></html>
