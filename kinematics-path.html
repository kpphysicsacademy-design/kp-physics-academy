tive Acceleration','Retardation','Uniform Acceleration','Variable Acceleration','Acceleration from Velocity-Time Data','Basic Acceleration Problems']],['🟡','05 • Graphs of Motion',['Position-Time Graph','Slope of x-t Graph','Velocity-Time Graph','Slope of v-t Graph','Area Under v-t Graph','Acceleration-Time Graph','Area Under a-t Graph','Graph of Uniform Motion','Graph of Uniform Acceleration','Graph Interpretation Problems','Piecewise Motion Graphs','Graph-Based JEE Problems']],['🟡','06 • Equations of Motion',['First Equation of Motion','Second Equation of Motion','Third Equation of Motion','Derivation of Equations','Conditions for Use','Free-Fall as a Special Case','Motion with Initial Velocity','Stopping Distance','Time to Stop','Equation-Based Numericals','Mixed Equation Problems']],['🟠','07 • Relative Motion',['Relative Position','Relative Displacement','Relative Velocity','Relative Acceleration','Same-Direction Motion','Opposite-Direction Motion','Meeting Problems','Separation Problems','Rain-Man Problems','Boat-Stream Introduction','Relative Motion Numericals']],['🟠','08 • Projectile Motion',['Projectile Definition','Horizontal Projection','Oblique Projection','Initial Velocity Components','Time of Flight','Maximum Height','Horizontal Range','Trajectory Equation','Range-Maximum Height Relation','Complementary Angles','Projectile from Height','Projectile on Inclined Plane','Target Problems','Advanced Projectile Numericals']],['🔴','09 • Advanced 1D Motion',['Variable Acceleration','Acceleration as a Function of Time','Velocity from Acceleration','Position from Velocity','Average Velocity for Variable Motion','Calculus View of Motion','Stopping and Turning Points','Meeting of Moving Bodies','Multiple-Stage Motion','JEE Main Mixed Problems','JEE Advanced 1D Problems']],['🔴','10 • Advanced 2D Motion',['Vector Form of Position','Vector Velocity','Vector Acceleration','Component-Wise Motion','Independent Motion Along Axes','Relative Motion in 2D','Projectile with Moving Target','Projectile on Inclined Surface','Minimum Speed Problems','Minimum Distance Problems','Advanced Graph Problems','JEE Advanced 2D Problems']],['⚫','11 • Special Motion Problems',['Lift and Elevator Motion','Moving Escalator Problems','Rain and Wind','Boat and River','Aircraft and Wind','Particle Pursuit','Collision in Kinematics','Constraint-Based Kinematics','Motion with Changing Direction','Multi-Body Kinematics']],['🏆','12 • Final Mastery',['Foundation MCQ Test','Distance-Displacement Test','Speed-Velocity Test','Acceleration Test','Graph Test','Equations of Motion Test','Relative Motion Test','Projectile Test','Advanced Mixed Test','JEE Main Challenge','JEE Advanced Challenge','Wrong-Question Revision','Final Unseen Test','Kinematics Mastered']]];const lessons=[];sections.forEach(s=>s[2].forEach(name=>lessons.push({name,section:s[1]})));let completed=Math.max(0,Math.min(lessons.length,Number(localStorage.getItem('kp_kinematics_completed')||0)));function render(){let n=0,out='';sections.forEach((s,si)=>{out+=`<section class="section"><h2>${s[0]} ${s[1]}</h2><p class="muted">${s[2].length} lessons • Zero → Hero</p><div class="path">`;s[2].forEach(name=>{const i=n++,done=i<completed,current=i===completed;const href='kinematics-lesson.html?id='+i;out+=`<div class="lesson"><div class="node ${done?'done':''}"><h3>${done?'🏆 ':current?'⭐ ':s[0]+' '}${i+1}. ${name}</h3><p>${s[1]} • 5 MCQs per task</p><span class="tag">${done?'MASTERED':'UNLOCKED'}</span><a class="btn" href="${href}">${done?'Review':'Start Task →'}</a></div></div>`});out+='</div>';if(si<sections.length-1)out+='<div class="checkpoint">🏆 Section checkpoint — complete every wrong question correctly before mastery.</div>';out+='</section>'});document.getElementById('content').innerHTML=out;document.getElementById('count').textContent=lessons.length;document.getElementById('progress').textContent=`${completed} of ${lessons.length} lessons mastered • All lessons unlocked`;document.getElementById('bar').style.width=Math.round(completed/lessons.length*100)+'%';document.getElementById('xp').textContent=completed*10;document.getElementById('streak').textContent=localStorage.getItem('kp_streak')||0}render();</script></body></html>
