<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 6 Physics | KP Physics Academy</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f8fc;
    color: #071a33;
}

header {
    background: #031326;
    color: white;
    padding: 22px 7%;
    font-size: 25px;
    font-weight: bold;
}

.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
}

.back {
    color: #1687ff;
    text-decoration: none;
    font-weight: bold;
}

h1 {
    text-align: center;
    margin-top: 35px;
    color: #1687ff;
}

.subtitle {
    text-align: center;
    color: #68758a;
    margin-bottom: 40px;
}

.chapter {
    background: white;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.chapter h2 {
    margin-top: 0;
}

.topic {
    background: #f1f6ff;
    padding: 16px;
    margin-top: 12px;
    border-radius: 9px;
}

.status {
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    KP PHYSICS ACADEMY
</header>

<div class="container">

<a href="index.html" class="back">← Back to Home</a>

<h1>Class 6 Physics</h1>

<p class="subtitle">
    Physics Foundation
</p>

<div id="content" class="status">
    Loading chapters...
</div>

</div>


<script type="module">

/* ==============================
   FIREBASE IMPORTS
   ============================== */

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* ==============================
   FIREBASE CONFIGURATION
   ============================== */

const firebaseConfig = {

    apiKey: "AIzaSyByht3FbHAz9tC4iON3laoI5NG5ve-FQlk",

    authDomain: "kp-physics-academy.firebaseapp.com",

    projectId: "kp-physics-academy",

    storageBucket: "kp-physics-academy.firebasestorage.app",

    messagingSenderId: "445260149248",

    appId: "1:445260149248:web:c21427845e417de4ba1ee5",

    measurementId: "G-BBQYTZY1FV"
};


/* ==============================
   INITIALIZE FIREBASE
   ============================== */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* ==============================
   LOAD CHAPTERS
   ============================== */

async function loadChapters() {

    const container =
        document.getElementById("content");

    try {

        const chaptersRef = collection(
            db,
            "classes",
            "class_6",
            "chapters"
        );

        const snapshot =
            await getDocs(chaptersRef);


        console.log(
            "Firestore chapters:",
            snapshot.size
        );


        container.innerHTML = "";


        if (snapshot.empty) {

            container.innerHTML =
                "<p>No chapters found.</p>";

            return;
        }


        const chapters = [];


        snapshot.forEach((doc) => {

            const data = doc.data();

            chapters.push({

                id: doc.id,

                name:
                    data.name || "Chapter",

                order:
                    Number(data.order || 0),

                active:
                    data.active !== false

            });

        });


        /* Sort chapters */

        chapters.sort((a, b) =>
            a.order - b.order
        );


        /* Display chapters */

        chapters.forEach((chapter) => {

            if (!chapter.active) {
                return;
            }


            const chapterElement =
                document.createElement("div");

            chapterElement.className =
                "chapter";


            chapterElement.innerHTML = `

                <h2>
                    ${chapter.name}
                </h2>

                <div class="topic">

                    Chapter ID:
                    ${chapter.id}

                </div>

            `;


            container.appendChild(
                chapterElement
            );

        });

    }

    catch (error) {

        console.error(
            "Firestore error:",
            error
        );


        container.innerHTML = `

            <p style="color:red;">
                Unable to load Firestore chapters.
            </p>

            <p style="font-size:14px;color:#666;">
                Firestore connection error.
            </p>

        `;

    }

}


/* ==============================
   START APPLICATION
   ============================== */

loadChapters();

</script>

</body>
</html>
