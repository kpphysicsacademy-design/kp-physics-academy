<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formula Lesson | KP Physics Academy</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#0b1930}.wrap{max-width:760px;margin:auto;padding:28px 18px 60px}.back{color:#1687ff;text-decoration:none;font-weight:bold}.card{margin-top:25px;background:#fff;border:1px solid #dce5ef;border-radius:18px;padding:28px;box-shadow:0 8px 25px #0b19300d}.tag{color:#1687ff;font-weight:800}.formula{font:700 32px Cambria,Georgia,serif;text-align:center;background:#f1f6ff;border-radius:14px;padding:25px;margin:22px 0}.meaning{background:#f7f9fc;padding:16px;border-radius:12px;line-height:1.6}.symbols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.symbols div{background:#f1f6ff;border-radius:10px;padding:12px}.challenge{margin-top:20px;background:#fff9e8;border:1px solid #f0d98b;border-radius:12px;padding:16px}.challenge button{padding:10px 14px;margin:5px;border:1px solid #ccd6e2;background:white;border-radius:8px;cursor:pointer}.master{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#1687ff;color:white;font-weight:800;cursor:pointer}@media(max-width:600px){.symbols{grid-template-columns:1fr}.formula{font-size:25px}}</style></head><body><main class="wrap"><a class="back" href="physics-formulas.html">← Back to Formula Journey</a><div id="lesson"></div></main><script>const raw=localStorage.getItem('kp_formula_current_lesson')||sessionStorage.getItem('formulaLesson');const root=document.getElementById('lesson');if(!raw){root.innerHTML='<div class="card"><h2>No formula selected</h2><p>Please return to the Formula Journey and choose a skill.</p><a class="back" href="physics-formulas.html">Open Formula Journey</a></div>'}else{try{const d=JSON.parse(raw),x=d.data;const store='kp_formula_mastered';let mastered=JSON.parse(localStorage.getItem(store)||'{}');const key=d.classNo+'-'+d.index;function mark(){if(!mastered[key]){mastered[key]=true;localStorage.setItem(store,JSON.stringify(mastered));let xp=Number(localStorage.getItem('kp_formula_xp')||0)+100;localStorage.setItem('kp_formula_xp',xp)}render()}function render(){const done=!!mastered[key];root.innerHTML=`<div class="card"><span class="tag">Class ${d.classNo} • ${x[0]}</span><h1>${x[1]}</h1><div class="formula">${x[2]}</div><div class="meaning"><b>Simple meaning</b><p>${x[3]}</p></div><h3>🧠 Remember</h3><div class="symbols"><div><b>Formula</b><br>Use the relationship shown above.</div><div><b>Units</b><br>Check SI units before calculation.</div><div><b>Practice</b><br>Solve a related numerical problem.</div></div><div class="challenge"><b>🎯 Quick Challenge</b><p>Do you understand when this formula should be used?</p><button onclick="this.textContent='🎉 Correct!';this.disabled=true">Yes, I understand</button><button onclick="this.textContent='🔄 Revise once more'">I need revision</button></div><button class="master" onclick="mark()">${done?'🏆 Mastered — Review':'⭐ Complete Formula Skill + Earn 100 XP'}</button></div>`}render()}catch(e){root.innerHTML='<div class="card"><h2>Unable to open formula</h2><p>Please go back to the Formula Journey and select the skill again.</p></div>'}}</script></body></html>
