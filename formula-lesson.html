<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formula Lesson | KP Physics Academy</title><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#0b1930}.wrap{max-width:780px;margin:auto;padding:24px 16px 60px}.back{color:#1687ff;text-decoration:none;font-weight:800}.card{margin-top:20px;background:#fff;border:1px solid #dce5ef;border-radius:20px;padding:24px;box-shadow:0 8px 25px #0b19300d}.tag{color:#1687ff;font-weight:800}.chapter{display:inline-block;margin-top:7px;background:#edf5ff;color:#1687ff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}.title{text-align:center;font-size:30px;margin:20px 0 8px}.subtitle{text-align:center;color:#718096}.formula{font:700 34px Cambria,Georgia,serif;text-align:center;background:#eef6ff;border:2px solid #d7eaff;border-radius:16px;padding:24px;margin:20px 0;overflow:auto}.formula-image{max-width:100%;max-height:220px;display:block;margin:15px auto;border-radius:12px}.box{border-radius:15px;padding:17px;margin-top:15px;line-height:1.65}.story{background:#fff8df;border:1px solid #f0d98b}.meaning{background:#f2f8ff;border:1px solid #d9eaff}.example{background:#effaf3;border:1px solid #bfe8cd}.steps{background:#f8f4ff;border:1px solid #dfd1ff}.symbols{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.symbols div{background:#fff;border:1px solid #e0e7ef;border-radius:11px;padding:12px}.challenge{margin-top:20px;background:#fff9e8;border:1px solid #f0d98b;border-radius:15px;padding:17px}.challenge button,.send{padding:10px 14px;margin:5px 4px 0 0;border:1px solid #ccd6e2;background:#fff;border-radius:9px;cursor:pointer;font-weight:700}.practice,.master{width:100%;margin-top:12px;padding:14px;border:0;border-radius:11px;color:#fff;font-weight:800;cursor:pointer;font-size:15px}.practice{background:#1687ff}.master{background:#0b1930}.tip{background:#eafbf2;border-left:5px solid #36b86b;padding:12px 14px;border-radius:9px;margin-top:15px}.coach{background:#f5efff;border:1px solid #d9c7ff}.chat{height:190px;overflow:auto;background:#fff;border:1px solid #e2d8f7;border-radius:12px;padding:12px}.bubble{max-width:88%;padding:10px 12px;border-radius:12px;margin:7px 0;line-height:1.45}.ai{background:#eee7ff}.you{background:#e8f5ff;margin-left:auto}.chatrow{display:flex;gap:8px;margin-top:10px}.chatrow input{flex:1;padding:11px;border:1px solid #ccd6e2;border-radius:9px;font:inherit}.score{font-weight:800;margin-top:10px}.small{font-size:12px;color:#718096;margin-top:8px}@media(max-width:600px){.title{font-size:25px}.formula{font-size:27px}.symbols{grid-template-columns:1fr}.chatrow{flex-wrap:wrap}.chatrow input{min-width:100%}}</style></head><body><main class="wrap"><a class="back" href="physics-formulas.html">← Back to Formula Journey</a><div id="lesson"><div class="card">Loading your formula lesson… 📚</div></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{getAI,getGenerativeModel,GoogleAIBackend}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-ai.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),db=getFirestore(app),root=document.getElementById('lesson'),raw=localStorage.getItem('kp_formula_current_lesson');let aiModel=null;try{const ai=getAI(app,{backend:new GoogleAIBackend()});aiModel=getGenerativeModel(ai,{model:'gemini-3.5-flash-lite'});}catch(e){}const examples={'v = s/t':['Imagine riding a bicycle. If you travel 20 metres in 5 seconds, speed tells us how quickly you travelled.','20 m ÷ 5 s = 4 m/s.'],'F = ma':['A heavier shopping cart needs more push to make it speed up.','If m = 2 kg and a = 3 m/s², F = 6 N.'],'V = IR':['Think of electricity like water in a pipe. Voltage is the push, current is the flow and resistance makes flow harder.','If I = 2 A and R = 3 Ω, V = 6 V.'],'v = fλ':['A wave is a repeating pattern. Its speed depends on frequency and wavelength.','If f = 5 Hz and λ = 2 m, v = 10 m/s.'],'P = 1/f':['A lens with a short focal length bends light more strongly, so its power is larger.','If f = 0.5 m, P = 2 D.']};function safe(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}function startPractice(){location.href='formula-practice.html'}function mark(k){const m=JSON.parse(localStorage.getItem('kp_formula_mastered')||'{}');if(!m[k]){m[k]=true;localStorage.setItem('kp_formula_mastered',JSON.stringify(m));localStorage.setItem('kp_formula_xp',String(Number(localStorage.getItem('kp_formula_xp')||0)+100))}render(window.f,window.meta)}async function askCoach(question){const chat=document.getElementById('coachChat'),input=document.getElementById('coachInput'),send=document.getElementById('coachSend');if(!question.trim())return;chat.innerHTML+=`<div class="bubble you">${safe(question)}</div>`;input.value='';send.disabled=true;chat.scrollTop=chat.scrollHeight;const f=window.f;const prompt=`You are a kind Physics learning coach for a school child. Evaluate understanding, not memorization. Topic: ${f.name||'Physics formula'}. Formula: ${f.latex||f.formula||f.text||''}. Explanation: ${f.explanation||''}. SI unit: ${f.unit||''}. Student message: ${question}. Reply in simple child-friendly English. If the student is explaining their understanding, give a learning score from 0 to 100, say one thing they understood, one thing to improve, and ask exactly one short follow-up question. Do not reveal hidden reasoning. Keep it under 120 words.`;try{if(!aiModel)throw new Error('AI service is not initialized');const result=await aiModel.generateContent(prompt);const text=result.response.text();chat.innerHTML+=`<div class="bubble ai">🤖 ${safe(text).replace(/\n/g,'<br>')}</div>`}catch(e){chat.innerHTML+=`<div class="bubble ai">🤖 I could not connect to the AI coach right now. You can still continue the lesson and practice question.</div>`}send.disabled=false;chat.scrollTop=chat.scrollHeight}window.askCoach=askCoach;function render(f,meta){window.f=f;window.meta=meta;const key=meta.classNo+'-'+meta.index,done=JSON.parse(localStorage.getItem('kp_formula_mastered')||'{}')[key]===true,latex=f.latex||f.formula||'',text=f.text||'',symbols=f.symbols||'',unit=f.unit||'',example=f.example||'',ex=examples[latex]||['Think of this formula as a shortcut that connects important ideas in Physics.','Write the known values, put them into the formula, calculate carefully and include the correct unit.'];root.innerHTML=`<div class="card"><span class="tag">Class ${safe(meta.classNo)} • ${safe(f.chapter||meta.chapter||'Physics')}</span><div class="chapter">${safe(f.chapter||meta.chapter||'Formula')}</div><h1 class="title">${safe(f.name||meta.name||'Physics Formula')}</h1><p class="subtitle">Let's understand it like a story — not just memorize it! 😊</p><div class="formula">${latex?'\\('+safe(latex)+'\\)':safe(text)}</div>${f.imageUrl?`<img class="formula-image" src="${safe(f.imageUrl)}" alt="Formula image">`:''}${text?`<div class="box meaning"><h3>🗣️ In simple words</h3><p><b>${safe(text)}</b></p></div>`:''}<div class="box story"><h3>🌟 Imagine this</h3><p>${safe(ex[0])}</p></div><div class="box meaning"><h3>💡 What does it mean?</h3><p>${safe(f.explanation||meta.explanation||'This formula is a shortcut that connects quantities in a Physics problem.')}</p></div><div class="box example"><h3>🧸 Tiny real-life example</h3><p>${safe(example||ex[1])}</p></div>${symbols?`<div class="box steps"><h3>🔤 What do the symbols mean?</h3><div class="symbols">${symbols.split(/\n|,/).filter(Boolean).map(s=>`<div>${safe(s)}</div>`).join('')}</div></div>`:''}${unit?`<div class="box meaning"><h3>📏 SI Unit</h3><p><b>${safe(unit)}</b></p></div>`:''}<div class="box steps"><h3>🪜 How do I use it?</h3><ol><li>Read the question slowly.</li><li>Find the numbers given.</li><li>Write the formula.</li><li>Put the numbers into the formula.</li><li>Calculate and write the correct unit.</li></ol></div><div class="tip">⭐ <b>Kid's tip:</b> Try explaining this formula to a friend. Understand first. Memorize later!</div><div class="card coach"><h2>🤖 AI Learning Coach</h2><p>Explain the formula in your own words. I'll check your understanding and give you one small question.</p><div id="coachChat" class="chat"><div class="bubble ai">🤖 Hi! Teach me this formula in your own words. Don't worry about mistakes — I'll help you learn.</div></div><div class="chatrow"><input id="coachInput" placeholder="Explain what this formula means…"><button id="coachSend" class="send">Send</button></div><div class="small">Your answer is evaluated for learning feedback, not for punishment. 😊</div></div><div class="challenge"><b>🎯 Quick Check</b><p>Do you understand what this formula is trying to tell you?</p><button onclick="this.textContent='🎉 Great!';this.disabled=true">Yes! 😊</button><button onclick="this.textContent='🔄 Read the story again'">Not yet</button></div><button class="practice" onclick="startPractice()">🎯 Practice This Formula →</button><button class="master" onclick="mark('${safe(key)}')">${done?'🏆 Skill Mastered — Review Again':'⭐ I Understand This Formula + Earn 100 XP'}</button></div>`;document.getElementById('coachSend').onclick=()=>askCoach(document.getElementById('coachInput').value);document.getElementById('coachInput').addEventListener('keydown',e=>{if(e.key==='Enter')askCoach(e.target.value)});if(window.MathJax)MathJax.typesetPromise([root]).catch(()=>{})}async function start(){if(!raw){root.innerHTML='<div class="card"><h2>No formula selected</h2><p>Go back and choose a formula skill.</p></div>';return}try{const meta=JSON.parse(raw),x=meta.data||[];let f={classNo:meta.classNo,chapter:x[0],name:x[1],text:x[2],explanation:x[3]};try{const s=await getDocs(query(collection(db,'formulas'),where('classNo','==',Number(meta.classNo)),where('name','==',x[1])));if(!s.empty)f={...f,...s.docs[0].data()}}catch(e){}render(f,meta)}catch(e){root.innerHTML='<div class="card"><h2>Unable to open formula</h2><p>Please go back and select the formula again.</p></div>'}}start();</script></body></html>
