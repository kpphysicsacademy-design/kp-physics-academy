<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formula Lesson | KP Physics Academy</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#0b1930}.wrap{max-width:780px;margin:auto;padding:24px 16px 60px}.back{color:#1687ff;text-decoration:none;font-weight:800}.card{margin-top:20px;background:#fff;border:1px solid #dce5ef;border-radius:20px;padding:24px;box-shadow:0 8px 25px #0b19300d}.tag{color:#1687ff;font-weight:800}.chapter{display:inline-block;margin-top:7px;background:#edf5ff;color:#1687ff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}.title{text-align:center;font-size:30px;margin:20px 0 8px}.subtitle{text-align:center;color:#718096}.formula{font:700 34px Cambria,Georgia,serif;text-align:center;background:#eef6ff;border:2px solid #d7eaff;border-radius:16px;padding:24px;margin:20px 0}.box{border-radius:15px;padding:17px;margin-top:15px;line-height:1.65}.story{background:#fff8df;border:1px solid #f0d98b}.meaning{background:#f2f8ff;border:1px solid #d9eaff}.example{background:#effaf3;border:1px solid #bfe8cd}.steps{background:#f8f4ff;border:1px solid #dfd1ff}.box h3{margin:0 0 8px;font-size:18px}.symbols{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.symbols div{background:#fff;border:1px solid #e0e7ef;border-radius:11px;padding:12px}.challenge{margin-top:20px;background:#fff9e8;border:1px solid #f0d98b;border-radius:15px;padding:17px}.challenge button{padding:11px 14px;margin:5px 4px 0 0;border:1px solid #ccd6e2;background:#fff;border-radius:9px;cursor:pointer;font-weight:700}.master{width:100%;margin-top:20px;padding:14px;border:0;border-radius:11px;background:#1687ff;color:white;font-weight:800;cursor:pointer;font-size:15px}.tip{background:#eafbf2;border-left:5px solid #36b86b;padding:12px 14px;border-radius:9px;margin-top:15px}@media(max-width:600px){.title{font-size:25px}.formula{font-size:27px}.symbols{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="back" href="physics-formulas.html">← Back to Formula Journey</a><div id="lesson"></div></main><script>const raw=localStorage.getItem('kp_formula_current_lesson')||sessionStorage.getItem('formulaLesson');const root=document.getElementById('lesson');const examples={'v = s/t':['Imagine riding a bicycle. If you travel 20 metres in 5 seconds, your speed tells us how quickly you travelled.','20 m ÷ 5 s = 4 m/s. So your speed is 4 m/s.'],'Average speed = total distance / total time':['Imagine walking to school and back home. We use the whole distance and the whole time to find the average speed.','If you travel 100 m in 20 s, average speed = 100 ÷ 20 = 5 m/s.'],'I = Q/t':['Think of electric charge like tiny balls moving through a wire. Current tells us how much charge passes every second.','If 10 C of charge passes in 2 s, I = 10 ÷ 2 = 5 A.'],'P = F/A':['Think about pressing your hand on a table. The same push can feel different when it is spread over a large or small area.','A smaller area gives greater pressure for the same force.'],'F = ma':['A heavier shopping cart needs more push to make it speed up. This formula connects the push, the mass and the acceleration.','If m = 2 kg and a = 3 m/s², F = 2 × 3 = 6 N.'],'W = mg':['Weight is the pull of Earth on an object. A heavier object usually has a larger weight.','For a 2 kg object on Earth, W ≈ 2 × 9.8 = 19.6 N.'],'P = W/t':['Doing the same job in less time means doing it faster. Power tells us how quickly work is done.','If 100 J of work is done in 5 s, P = 100 ÷ 5 = 20 W.'],'V = IR':['Think of electricity like water moving through a pipe. Voltage gives the push, current is the flow and resistance makes the flow harder.','If I = 2 A and R = 3 Ω, V = 2 × 3 = 6 V.'],'P = VI = I²R = V²/R':['Electrical power tells us how quickly an electrical device uses energy.','A device using 2 A at 6 V has P = 6 × 2 = 12 W.'],'E = Pt':['A bulb using power for a longer time uses more electrical energy.','A 10 W bulb used for 5 s uses E = 10 × 5 = 50 J.'],'1/f = 1/v + 1/u':['This is a rule used with spherical mirrors. It helps us find where an image is formed.','Put the known distances into the formula and solve for the missing distance.'],'1/f = 1/v − 1/u':['This is a rule used with a lens. It connects the lens focal length with the object and image positions.','If two distances are known, the formula helps find the third.'],'P = 1/f':['A lens with a short focal length bends light more strongly. Its power is therefore larger.','If f = 0.5 m, P = 1 ÷ 0.5 = 2 D.'],'v = fλ':['A wave is like a repeating pattern. Its speed depends on how often the pattern repeats and how long one wave is.','If f = 5 Hz and λ = 2 m, v = 5 × 2 = 10 m/s.'],'T = 1/f':['Frequency tells how many vibrations happen each second. Time period tells how long one vibration takes. They are opposites.','If f = 2 Hz, T = 1 ÷ 2 = 0.5 s.'],'K = ½mv²':['A moving object has kinetic energy. A faster object has much more kinetic energy because speed is squared.','If m = 2 kg and v = 3 m/s, K = ½ × 2 × 3² = 9 J.'],'U = mgh':['An object kept high above the ground has stored gravitational energy.','A 2 kg object at 5 m has U ≈ 2 × 9.8 × 5 = 98 J.'],'F = (1/4πε₀)q₁q₂/r²':['Two electric charges can push or pull each other. This formula tells us how strong that force is.','Larger charges give a stronger force, while greater distance makes the force weaker.'],'E = F/q':['Electric field tells us how strong the electric push would be on each unit of charge.','If a 2 N force acts on a 1 C charge, E = 2 N/C.'],'V = W/q':['Electric potential tells us how much work is needed for each unit of charge.','If 10 J of work moves 2 C of charge, V = 5 V.'],'C = Q/V':['Capacitance tells us how much electric charge a capacitor can store for a given voltage.','If Q = 10 C and V = 2 V, C = 5 F.'],'F = qvB sinθ':['A moving electric charge can feel a force when it moves through a magnetic field.','The force depends on the charge, speed, magnetic field and direction of motion.'],'ε = −dΦ/dt':['Changing a magnetic field through a coil can produce an electric push called induced emf.','Move a magnet near a coil and an electric effect can be produced.'],'λ = h/p':['Tiny particles such as electrons can behave like waves. Their wavelength depends on their momentum.','A faster or heavier particle has greater momentum and therefore a shorter wavelength.'],'E = mc²':['Matter contains stored energy. Even a tiny amount of mass corresponds to a very large amount of energy.','The huge value of c² makes the energy very large.'],'T₁/₂ = 0.693/λ':['Half-life tells us how long it takes for half of a radioactive sample to disappear by decay.','After one half-life, half remains; after two half-lives, one-quarter remains.']};function safe(s){return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;')}if(!raw){root.innerHTML='<div class="card"><h2>No formula selected</h2><p>Go back and choose a formula skill.</p><a class="back" href="physics-formulas.html">Open Formula Journey</a></div>'}else{try{const d=JSON.parse(raw),x=d.data;const store='kp_formula_mastered';let mastered=JSON.parse(localStorage.getItem(store)||'{}');const key=d.classNo+'-'+d.index;const ex=examples[x[2]]||['Think of this formula as a shortcut that helps us connect two or more things in physics.','Start by writing down the values given in the question, then put them into the formula.'];function mark(){if(!mastered[key]){mastered[key]=true;localStorage.setItem(store,JSON.stringify(mastered));let xp=Number(localStorage.getItem('kp_formula_xp')||0)+100;localStorage.setItem('kp_formula_xp',xp)}render()}function render(){const done=!!mastered[key];root.innerHTML=`<div class="card"><span class="tag">Class ${safe(d.classNo)} • ${safe(x[0])}</span><div class="chapter">${safe(d.chapter||'Physics Formula')}</div><h1 class="title">${safe(x[1])}</h1><p class="subtitle">Let's understand it like a story — not just memorize it! 😊</p><div class="formula">${safe(x[2])}</div><div class="box story"><h3>🌟 Imagine this</h3><p>${safe(ex[0])}</p></div><div class="box meaning"><h3>💡 What does it mean?</h3><p>${safe(x[3])}</p><p><b>In simple words:</b> This formula is a small shortcut that helps you answer a physics question.</p></div><div class="box example"><h3>🧸 Tiny real-life example</h3><p>${safe(ex[1])}</p></div><div class="box steps"><h3>🪜 How do I use it?</h3><ol><li>Read the question slowly.</li><li>Find the numbers the question gives you.</li><li>Write the formula.</li><li>Put the numbers into the formula.</li><li>Calculate and write the correct unit.</li></ol></div><h3>🔤 What do the letters mean?</h3><div class="symbols"><div><b>Formula</b><br>Look at each letter and number carefully.</div><div><b>Units</b><br>Always check the unit before calculating.</div><div><b>Don't worry!</b><br>You do not need to memorize everything at once.</div><div><b>Remember</b><br>Understand first. Memorize later.</div></div><div class="tip">⭐ <b>Kid's tip:</b> Try explaining this formula to your friend using your own words. If you can explain it, you are really learning it!</div><div class="challenge"><b>🎯 Quick Challenge</b><p>Do you understand what this formula is trying to tell you?</p><button onclick="this.textContent='🎉 Great! You understand it';this.disabled=true">Yes! 😊</button><button onclick="this.textContent='🔄 Read the story again'">Not yet</button></div><button class="master" onclick="mark()">${done?'🏆 Skill Mastered — Review Again':'⭐ I Understand This Formula + Earn 100 XP'}</button></div>`}render()}catch(e){root.innerHTML='<div class="card"><h2>Unable to open formula</h2><p>Please go back and select the formula again.</p></div>'}}</script></body></html>
