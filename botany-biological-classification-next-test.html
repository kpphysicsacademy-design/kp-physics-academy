div></section><section class="quiz" id="quiz"></section><section class="result" id="done" style="display:none"></section></main><nav class="nav"><a href="botany-full-path.html"><span>🌿</span>Botany</a><a href="botany-biological-classification-test.html"><span>📚</span>Chapter</a><a href="question-bank.html?subject=botany&chapter=Biological%20Classification"><span>🎯</span>Practice</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const qs=[
['Which kingdom contains prokaryotic organisms in Whittaker’s five-kingdom system?',['Monera','Protista','Fungi','Animalia'],0,'Monera is the prokaryotic kingdom in Whittaker’s five-kingdom classification; the other listed kingdoms contain eukaryotic organisms.'],

['The principal mode of nutrition in fungi is:',['Absorptive heterotrophy','Photosynthesis','Ingestive heterotrophy','Autotrophic chemosynthesis'],0,'Fungi digest food outside their bodies and absorb the soluble products of digestion.'],
['The fungal cell wall is mainly made of:',['Chitin','Cellulose','Peptidoglycan','Pectin'],0,'Chitin is a characteristic component of fungal cell walls, distinguishing them from the cellulose-rich walls of plants.'],
['Which organism is correctly matched with its kingdom?',['Agaricus — Fungi','Nostoc — Fungi','Amoeba — Plantae','Euglena — Animalia'],0,'Agaricus is a mushroom and belongs to Kingdom Fungi.'],

['Methanogens are notable for producing:',['Methane','Oxygen','Sulphuric acid','Nitrogen gas'],0,'Methanogenic archaebacteria produce methane under anaerobic conditions and occur in habitats such as the rumen of cattle.'],
