<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEE Physics | KP Physics Academy</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f9fd;color:#10213a}.top{background:#071a31;color:#fff;padding:20px 6%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.intro{text-align:center}.intro h1{font-size:40px}.intro span{color:#1687ff}.muted{color:#718096}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px}.stat{background:#fff;border:1px solid #dfe7f1;border-radius:14px;padding:12px 20px;text-align:center}.bar{height:10px;background:#e8eef5;border-radius:20px;margin-top:12px}.bar i{display:block;height:100%;width:0;background:#20b56b;border-radius:20px}.section{margin:35px 0}.path{position:relative}.path:before{content:'';position:absolute;left:50%;top:20px;bottom:20px;width:6px;background:#dce8f5}.unit{min-height:125px;display:flex;align-items:center}.unit:nth-child(odd){justify-content:flex-start}.unit:nth-child(even){justify-content:flex-end}.node{width:350px;background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:15px;position:relative;box-shadow:0 7px 22px #0000000b}.node:before{content:'';position:absolute;top:50%;width:35px;height:4px;background:#dce8f5}.unit:nth-child(odd) .node:before{right:-35px}.unit:nth-child(even) .node:before{left:-35px}.node.locked{opacity:.55}.node.done{border-color:#20b56b}.node.current{border:2px solid #1687ff}.icon{float:left;font-size:25px;margin:5px 12px 30px 0}.node h3{margin:3px 0}.node p{font-size:12px;color:#718096}.node button{width:100%;padding:9px;border:0;border-radius:8px;background:#1687ff;color:white;font-weight:bold;cursor:pointer}.node button:disabled{background:#b5c0cd;cursor:not-allowed}.tag{font-size:10px;font-weight:bold;color:#138650}@media(max-width:700px){.path:before{left:25px}.unit,.unit:nth-child(odd),.unit:nth-child(even){justify-content:flex-start;padding-left:50px}.node{width:100%}.unit:nth-child(odd) .node:before,.unit:nth-child(even) .node:before{left:-35px;right:auto}.intro h1{font-size:30px}}</style></head><body><header class="top"><a href="index.html"><b>KP PHYSICS ACADEMY</b></a><a href="index.html">Home</a></header><main class="wrap"><section class="intro"><p>🧠 JEE PHYSICS • DEEP CONCEPT JOURNEY</p><h1>Master Physics <span>one concept at a time.</span></h1><p class="muted">Learn → Practice → Explain → AI Evaluation → Master → Unlock.</p></section><div class="stats"><div class="stat">🔥 <b id="streak">0</b><br><small>Streak</small></div><div class="stat">⭐ <b id="xp">0</b><br><small>XP</small></div><div class="stat">❤️ 5<br><small>Hearts</small></div><div class="stat"><b>111</b><br><small>Deep Concepts</small></div></div><div class="stat"><b>JEE Physics Deep Mastery</b><p id="progress" class="muted">0 of 111 concepts mastered</p><div class="bar"><i id="bar"></i></div></div><div id="content"></div></main><script>const groups=[['⚙️','Mechanics','Units & Measurements|Errors & Experimental Analysis|Vectors|Kinematics|Relative Motion|Projectile Motion|Newton\'s Laws|Friction|Circular Motion|Work-Energy Theorem|Potential Energy|Power|Centre of Mass|Momentum|Collisions|Rotational Kinematics|Torque|Angular Momentum|Moment of Inertia|Rolling Motion|Gravitation|Satellites|Escape Velocity'],['🌊','Properties of Matter','Elasticity|Fluid Pressure|Buoyancy|Continuity Equation|Bernoulli Equation|Viscosity|Surface Tension'],['🌡️','Thermal Physics','Thermal Expansion|Calorimetry|Heat Transfer|Kinetic Theory|Thermodynamic Processes|First Law|Second Law|Entropy|Heat Engines|Refrigerators'],['〰️','Oscillations & Waves','SHM|Energy in SHM|Springs|Pendulum|Wave Motion|Superposition|Standing Waves|Sound Waves|Doppler Effect'],['⚡','Electrostatics',"Coulomb's Law|Electric Field|Electric Flux|Gauss's Law|Electric Potential|Potential Energy|Capacitors|Dielectrics|Capacitor Combinations|Energy Stored in Capacitor"],['🔋','Current Electricity','Current & Drift Velocity|Resistance|Resistivity|Temperature Dependence|Kirchhoff\'s Laws|Wheatstone Bridge|Meter Bridge|Potentiometer|Cells & Batteries'],['🧲','Magnetism',"Lorentz Force|Biot-Savart Law|Ampere's Law|Motion in Magnetic Field|Cyclotron|Magnetic Dipole|Earth's Magnetism|Moving Coil Galvanometer"],['🔄','EMI & AC',"Faraday's Law|Lenz's Law|Motional EMF|Self Inductance|Mutual Inductance|AC Circuits|RMS Values|LCR Circuits|Resonance|Transformers"],['🔭','Optics',"Reflection|Mirrors|Refraction|Total Internal Reflection|Lenses|Lens Combinations|Optical Instruments|Prism|Interference|Young's Double Slit|Diffraction|Polarisation"],['⚛️','Modern Physics','Photoelectric Effect|de Broglie Waves|Bohr Model|Hydrogen Spectrum|Nuclear Physics|Radioactivity|Binding Energy|Nuclear Reactions|Fission & Fusion|Semiconductors|Diodes|Transistors|Logic Gates']];const concepts=[];groups.forEach(g=>g[2].split('|').forEach(x=>concepts.push({name:x,group:g[1],icon:g[0]})));let done=Math.max(0,Math.min(111,+localStorage.getItem('kp_jee_completed')||0));function render(){let n=0,out='';groups.forEach(g=>{let a=g[2].split('|');out+=`<section class="section"><h2>${g[0]} ${g[1]}</h2><p class="muted">${a.length} deep concepts</p><div class="path">`;a.forEach(x=>{let i=n++,ok=i<=done,finished=i<done;out+=`<div class="unit"><div class="node ${finished?'done':''} ${!ok?'locked':''} ${i===done?'current':''}><div class="icon">${finished?'🏆':g[0]}</div><h3>${i+1}. ${x}</h3><p>${g[1]} • JEE deeper concept</p><span class="tag">${finished?'MASTERED':ok?'READY':'LOCKED'}</span><br><button ${!ok?'disabled':''} onclick="openConcept(${i})">${finished?'Review':ok?'Start lesson →':'Complete previous concept'}</button></div></div>`});out+='</div></section>'});document.getElementById('content').innerHTML=out;document.getElementById('bar').style.width=Math.round(done/111*100)+'%';document.getElementById('progress').textContent=`${done} of 111 concepts mastered${done<111?' • Next: '+concepts[done].name:' • JEE Physics complete!'}`;document.getElementById('xp').textContent=done*10;document.getElementById('streak').textContent=localStorage.getItem('kp_streak')||0}function openConcept(i){if(i===0){location.href='units-measurements-path.html';return}location.href='jee-physics-lesson.html?id='+i}render();</script></body></html>
