<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEE Physics | KP Physics Academy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f9fd;color:#10213a}.top{background:#071a31;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:1050px;margin:auto;padding:30px 18px 70px}.hero{text-align:center}.hero h1{font-size:40px;margin:10px 0}.hero span{color:#1687ff}.muted{color:#718096;line-height:1.5}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}.stat{background:#fff;border:1px solid #dfe7f1;border-radius:14px;padding:12px 20px;text-align:center}.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}.toolbar input{width:min(500px,90%);padding:13px 15px;border:1px solid #d7e0ea;border-radius:12px;font-size:15px}.group{margin:35px 0}.group h2{margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.concept{background:#fff;border:1px solid #dfe7f1;border-radius:16px;padding:16px;text-decoration:none;color:#10213a;display:block;transition:.15s}.concept:hover{transform:translateY(-2px);border-color:#1687ff}.num{color:#1687ff;font-weight:800}.name{font-weight:800;margin:4px 0}.desc{font-size:12px;color:#718096}.tag{display:inline-block;margin-top:8px;font-size:10px;font-weight:800;color:#138650;background:#eaf9f1;padding:5px 8px;border-radius:10px}.built{border-color:#20b56b}.hide{display:none}@media(max-width:700px){.hero h1{font-size:30px}.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a href="index.html"><b>KP PHYSICS ACADEMY</b></a><a href="index.html">Home</a></header><main class="wrap"><section class="hero"><p>🧠 JEE PHYSICS • DEEP CONCEPT JOURNEY</p><h1>Master Physics <span>Zero → Hero</span></h1><p class="muted">All 111 concepts are visible and unlocked. Open a concept, learn its path, practise MCQs, correct mistakes, and build mastery.</p></section><div class="stats"><div class="stat"><b>111</b><br><small>Deep Concepts</small></div><div class="stat"><b>10</b><br><small>Major Areas</small></div><div class="stat">🔓<br><small>All Unlocked</small></div><div class="stat">🎯<br><small>JEE Main + Advanced</small></div></div><div class="toolbar"><input id="search" placeholder="Search concepts e.g. vectors, Gauss, SHM..." oninput="filter()"></div><div id="content"></div></main><script>const groups=[['⚙️','Mechanics',['Units & Measurements','Error & Experimental Analysis','Vectors','Kinematics','Relative Motion','Projectile Motion',"Newton's Laws",'Friction','Circular Motion','Work-Energy Theorem','Potential Energy','Power','Centre of Mass','Momentum','Collisions','Rotational Kinematics','Torque','Angular Momentum','Moment of Inertia','Rolling Motion','Gravitation','Satellites','Escape Velocity']],['🌊','Properties of Matter',['Elasticity','Fluid Pressure','Buoyancy','Continuity Equation','Bernoulli Equation','Viscosity','Surface Tension']],['🌡️','Thermal Physics',['Thermal Expansion','Calorimetry','Heat Transfer','Kinetic Theory','Thermodynamic Processes','First Law','Second Law','Entropy','Heat Engines','Refrigerators']],['〰️','Oscillations & Waves',['SHM','Energy in SHM','Springs','Pendulum','Wave Motion','Superposition','Standing Waves','Sound Waves','Doppler Effect']],['⚡','Electrostatics',["Coulomb's Law",'Electric Field','Electric Flux',"Gauss's Law",'Electric Potential','Potential Energy','Capacitors','Dielectrics','Capacitor Combinations','Energy Stored in Capacitor']],['🔋','Current Electricity',['Current & Drift Velocity','Resistance','Resistivity','Temperature Dependence',"Kirchhoff's Laws",'Wheatstone Bridge','Meter Bridge','Potentiometer','Cells & Batteries']],['🧲','Magnetism',["Lorentz Force","Biot-Savart Law","Ampere's Law",'Motion in Magnetic Field','Cyclotron','Magnetic Dipole',"Earth's Magnetism",'Moving Coil Galvanometer']],['🔄','EMI & AC',["Faraday's Law","Lenz's Law",'Motional EMF','Self Inductance','Mutual Inductance','AC Circuits','RMS Values','LCR Circuits','Resonance','Transformers']],['🔭','Optics',['Reflection','Mirrors','Refraction','Total Internal Reflection','Lenses','Lens Combinations','Optical Instruments','Prism','Interference',"Young's Double Slit",'Diffraction','Polarisation']],['⚛️','Modern Physics',['Photoelectric Effect','de Broglie Waves','Bohr Model','Hydrogen Spectrum','Nuclear Physics','Radioactivity','Binding Energy','Nuclear Reactions','Fission & Fusion','Semiconductors','Diodes','Transistors','Logic Gates']]];const built={'Units & Measurements':'units-measurements-path.html','Error & Experimental Analysis':'error-experimental-analysis-path.html','Vectors':'vectors-path.html','Kinematics':'kinematics-path.html','Relative Motion':'relative-motion-path.html','Projectile Motion':'projectile-motion-path.html',"Newton's Laws":'newtons-laws-path.html','Friction':'friction-path.html','Circular Motion':'circular-motion-path.html','Work-Energy Theorem':'work-energy-theorem-path.html','Potential Energy':'potential-energy-path.html','Power':'power-path.html','Centre of Mass':'centre-of-mass-path.html','Momentum':'momentum-path.html','Collisions':'collisions-path.html','Rotational Kinematics':'rotational-kinematics-path.html','Torque':'torque-path.html','Angular Momentum':'angular-momentum-path.html','Moment of Inertia':'moment-of-inertia-path.html','Rolling Motion':'rolling-motion-path.html','Gravitation':'gravitation-path.html','Satellites':'satellites-path.html','Escape Velocity':'escape-velocity-path.html','Elasticity':'elasticity-path.html','Fluid Pressure':'fluid-pressure-path.html','Buoyancy':'buoyancy-path.html'};let number=0;function render(){number=0;let out='';groups.forEach(g=>{out+=`<section class="group"><h2>${g[0]} ${g[1]}</h2><p class="muted">${g[2].length} concepts • Zero → Hero • All unlocked</p><div class="grid">`;g[2].forEach(name=>{const n=++number;const href=built[name]||('jee-physics-lesson-shuffled.html?id='+n);const isBuilt=!!built[name];out+=`<a class="concept ${isBuilt?'built':''}" data-search="${(name+' '+g[1]).toLowerCase()}" href="${href}"><div class="num">${n.toString().padStart(2,'0')}</div><div class="name">${name}</div><div class="desc">${g[1]} • JEE deeper concept</div><span class="tag">${isBuilt?'PATH READY':'UNLOCKED'}</span></a>`});out+='</div></section>'});document.getElementById('content').innerHTML=out}function filter(){const q=document.getElementById('search').value.toLowerCase().trim();document.querySelectorAll('.concept').forEach(x=>x.classList.toggle('hide',q&&!x.dataset.search.includes(q)))}render();</script></body></html>
