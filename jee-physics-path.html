<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEE Physics | KP Physics Academy</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6f9fd;color:#10213a}
.top{background:#071a31;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}
.top a{color:#fff;text-decoration:none}
.wrap{max-width:1080px;margin:auto;padding:30px 18px 70px}
.intro{text-align:center}
.intro h1{font-size:40px;margin:10px 0}
.intro span{color:#1687ff}
.muted{color:#718096;line-height:1.5}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}
.stat{background:#fff;border:1px solid #dfe7f1;border-radius:14px;padding:12px 20px;text-align:center}
.mastery{max-width:900px;margin:0 auto 35px}
.bar{height:10px;background:#e8eef5;border-radius:20px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#20b56b;border-radius:20px;transition:width .3s}
.section{margin:42px 0}
.section h2{margin-bottom:4px}
.section>.muted{margin-top:0}
.path{position:relative;margin-top:22px;padding:5px 0}
.path:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%);background:#dce8f5;border-radius:10px}
.unit{position:relative;min-height:155px;display:flex;align-items:center;width:100%}
.unit:nth-child(odd){justify-content:flex-start;padding-right:calc(50% + 55px)}
.unit:nth-child(even){justify-content:flex-end;padding-left:calc(50% + 55px)}
.node{width:100%;max-width:390px;background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:18px;position:relative;box-shadow:0 7px 22px rgba(0,0,0,.07)}
.unit:nth-child(odd) .node:after,.unit:nth-child(even) .node:after{content:'';position:absolute;top:50%;width:55px;height:4px;background:#dce8f5;transform:translateY(-50%)}
.unit:nth-child(odd) .node:after{right:-55px}
.unit:nth-child(even) .node:after{left:-55px}
.node.locked{opacity:.55}
.node.done{border-color:#20b56b}
.node.current{border:2px solid #1687ff}
.node-head{display:flex;align-items:flex-start;gap:12px}
.icon{font-size:25px;line-height:1;flex:0 0 32px;text-align:center}
.node h3{margin:0;font-size:17px;line-height:1.35}
.node p{font-size:12px;color:#718096;margin:8px 0 10px;line-height:1.4}
.tag{font-size:10px;font-weight:bold;color:#138650}
.node button{width:100%;margin-top:10px;padding:10px;border:0;border-radius:9px;background:#1687ff;color:#fff;font-weight:bold;cursor:pointer}
.node button:disabled{background:#b5c0cd;cursor:not-allowed}
@media(max-width:700px){
 .top{padding:16px 5%}
 .wrap{padding:25px 14px 60px}
 .intro h1{font-size:30px}
 .path:before{left:22px;transform:none}
 .unit,.unit:nth-child(odd),.unit:nth-child(even){justify-content:flex-start;padding-left:58px;padding-right:0;min-height:145px}
 .node{max-width:none}
 .unit:nth-child(odd) .node:after,.unit:nth-child(even) .node:after{left:-36px;right:auto;width:36px}
}
</style>
</head>
<body>
<header class="top">
<a href="index.html"><b>KP PHYSICS ACADEMY</b></a>
<a href="index.html">Home</a>
</header>
<main class="wrap">
<section class="intro">
<p>🧠 JEE PHYSICS • DEEP CONCEPT JOURNEY</p>
<h1>Master Physics <span>one concept at a time.</span></h1>
<p class="muted">Learn → Practice → Explain → AI Evaluation → Master → Unlock.</p>
</section>
<div class="stats">
<div class="stat">🔥 <b id="streak">0</b><br><small>Streak</small></div>
<div class="stat">⭐ <b id="xp">0</b><br><small>XP</small></div>
<div class="stat">❤️ 5<br><small>Hearts</small></div>
<div class="stat"><b>111</b><br><small>Deep Concepts</small></div>
</div>
<div class="stat mastery">
<b>JEE Physics Deep Mastery</b>
<p id="progress" class="muted">0 of 111 concepts mastered</p>
<div class="bar"><i id="bar"></i></div>
</div>
<div id="content"></div>
</main>
<script>
const groups=[
['⚙️','Mechanics','Units & Measurements|Errors & Experimental Analysis|Vectors|Kinematics|Relative Motion|Projectile Motion|Newton\'s Laws|Friction|Circular Motion|Work-Energy Theorem|Potential Energy|Power|Centre of Mass|Momentum|Collisions|Rotational Kinematics|Torque|Angular Momentum|Moment of Inertia|Rolling Motion|Gravitation|Satellites|Escape Velocity'],
['🌊','Properties of Matter','Elasticity|Fluid Pressure|Buoyancy|Continuity Equation|Bernoulli Equation|Viscosity|Surface Tension'],
['🌡️','Thermal Physics','Thermal Expansion|Calorimetry|Heat Transfer|Kinetic Theory|Thermodynamic Processes|First Law|Second Law|Entropy|Heat Engines|Refrigerators'],
['〰️','Oscillations & Waves','SHM|Energy in SHM|Springs|Pendulum|Wave Motion|Superposition|Standing Waves|Sound Waves|Doppler Effect'],
['⚡','Electrostatics',"Coulomb's Law|Electric Field|Electric Flux|Gauss's Law|Electric Potential|Potential Energy|Capacitors|Dielectrics|Capacitor Combinations|Energy Stored in Capacitor"],
['🔋','Current Electricity','Current & Drift Velocity|Resistance|Resistivity|Temperature Dependence|Kirchhoff\'s Laws|Wheatstone Bridge|Meter Bridge|Potentiometer|Cells & Batteries'],
['🧲','Magnetism',"Lorentz Force|Biot-Savart Law|Ampere's Law|Motion in Magnetic Field|Cyclotron|Magnetic Dipole|Earth's Magnetism|Moving Coil Galvanometer"],
['🔄','EMI & AC',"Faraday's Law|Lenz's Law|Motional EMF|Self Inductance|Mutual Inductance|AC Circuits|RMS Values|LCR Circuits|Resonance|Transformers"],
['🔭','Optics',"Reflection|Mirrors|Refraction|Total Internal Reflection|Lenses|Lens Combinations|Optical Instruments|Prism|Interference|Young's Double Slit|Diffraction|Polarisation"],
['⚛️','Modern Physics','Photoelectric Effect|de Broglie Waves|Bohr Model|Hydrogen Spectrum|Nuclear Physics|Radioactivity|Binding Energy|Nuclear Reactions|Fission & Fusion|Semiconductors|Diodes|Transistors|Logic Gates']
];
const concepts=[];
groups.forEach(g=>g[2].split('|').forEach(x=>concepts.push({name:x,group:g[1],icon:g[0]})));
let done=Math.max(0,Math.min(111,+localStorage.getItem('kp_jee_completed')||0));
function render(){
 let n=0,out='';
 groups.forEach(g=>{
  const a=g[2].split('|');
  out+=`<section class="section"><h2>${g[0]} ${g[1]}</h2><p class="muted">${a.length} deep concepts</p><div class="path">`;
  a.forEach(x=>{
   const i=n++,ok=i<=done,finished=i<done;
   out+=`<div class="unit"><div class="node ${finished?'done':''} ${!ok?'locked':''} ${i===done?'current':''}">
   <div class="node-head"><div class="icon">${finished?'🏆':g[0]}</div><h3>${i+1}. ${x}</h3></div>
   <p>${g[1]} • JEE deeper concept</p>
   <span class="tag">${finished?'MASTERED':ok?'READY':'LOCKED'}</span>
   <button ${!ok?'disabled':''} onclick="openConcept(${i})">${finished?'Review':ok?'Start lesson →':'Complete previous concept'}</button>
   </div></div>`;
  });
  out+='</div></section>';
 });
 document.getElementById('content').innerHTML=out;
 document.getElementById('bar').style.width=Math.round(done/111*100)+'%';
 document.getElementById('progress').textContent=`${done} of 111 concepts mastered${done<111?' • Next: '+concepts[done].name:' • JEE Physics complete!'}`;
 document.getElementById('xp').textContent=done*10;
 document.getElementById('streak').textContent=localStorage.getItem('kp_streak')||0;
}
function openConcept(i){
 if(i===0){location.href='units-measurements-path.html';return}
 location.href='jee-physics-lesson-shuffled.html?id='+i;
}
render();
</script>
</body>
</html>
