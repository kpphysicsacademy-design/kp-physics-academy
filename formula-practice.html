<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formula Practice | KP Physics Academy</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#0b1930}.wrap{max-width:760px;margin:auto;padding:25px 16px 60px}.back{color:#1687ff;text-decoration:none;font-weight:800}.card{margin-top:20px;background:#fff;border:1px solid #dce5ef;border-radius:20px;padding:25px;box-shadow:0 8px 25px #0b19300d}.tag{color:#1687ff;font-weight:800}.formula{text-align:center;background:#eef6ff;border-radius:15px;padding:18px;font:700 28px Cambria,Georgia,serif;margin:18px 0}.question{font-size:20px;font-weight:800;line-height:1.5}.option{display:block;width:100%;text-align:left;padding:14px;margin:10px 0;border:1px solid #d5deea;background:#fff;border-radius:11px;cursor:pointer;font-weight:700}.option:hover{background:#f2f8ff}.correct{background:#e9f9ef!important;border-color:#55b878!important}.wrong{background:#fff0f0!important;border-color:#e66!important}.feedback{padding:15px;border-radius:12px;margin-top:15px;display:none;line-height:1.5}.next,.complete{width:100%;padding:14px;border:0;border-radius:11px;background:#1687ff;color:#fff;font-weight:800;cursor:pointer;margin-top:18px}.progress{height:9px;background:#e5ebf2;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#1687ff;width:0}.xp{text-align:center;color:#1687ff;font-weight:900;margin-top:12px}.result{text-align:center}.result h2{font-size:28px}.score{font-size:42px;font-weight:900;color:#1687ff}@media(max-width:600px){.question{font-size:18px}.formula{font-size:24px}}</style></head><body><main class="wrap"><a class="back" href="formula-lesson.html">← Back to Formula</a><div id="app"></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),db=getFirestore(app);const raw=localStorage.getItem('kp_formula_current_lesson');const root=document.getElementById('app');let questions=[],pos=0,score=0,answered=false;function safe(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}function escRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}const built={"v = s/t":{q:'A cyclist travels 20 m in 5 s. What is the speed?',o:['2 m/s','4 m/s','5 m/s','25 m/s'],a:1,e:'Speed = distance ÷ time = 20 ÷ 5 = 4 m/s.'},"F = ma":{q:'A 2 kg object accelerates at 3 m/s². What force acts on it?',o:['5 N','6 N','9 N','12 N'],a:1,e:'F = ma = 2 × 3 = 6 N.'},"V = IR":{q:'If current is 2 A and resistance is 3 Ω, what is the voltage?',o:['1.5 V','5 V','6 V','9 V'],a:2,e:'V = IR = 2 × 3 = 6 V.'},"P = 1/f":{q:'A lens has focal length 0.5 m. What is its power?',o:['0.5 D','1 D','2 D','5 D'],a:2,e:'P = 1/f = 1/0.5 = 2 D.'},"v = fλ":{q:'A wave has frequency 5 Hz and wavelength 2 m. What is its speed?',o:['2.5 m/s','7 m/s','10 m/s','25 m/s'],a:2,e:'v = fλ = 5 × 2 = 10 m/s.'},"T = 1/f":{q:'A wave has frequency 2 Hz. What is its time period?',o:['0.2 s','0.5 s','2 s','4 s'],a:1,e:'T = 1/f = 1/2 = 0.5 s.'},"K = ½mv²":{q:'A 2 kg object moves at 3 m/s. What is its kinetic energy?',o:['3 J','6 J','9 J','18 J'],a:2,e:'K = ½mv² = ½ × 2 × 3² = 9 J.'},"U = mgh":{q:'A 2 kg object is 5 m above the ground. Take g = 9.8 m/s². What is its potential energy?',o:['19.6 J','49 J','98 J','196 J'],a:2,e:'U = mgh = 2 × 9.8 × 5 = 98 J.'}};function renderQuestion(){answered=false;const x=questions[pos];root.innerHTML=`<div class="card"><div class="tag">Class ${safe(x.classNo)} • ${safe(x.chapter)}</div><h1>${safe(x.name)}</h1><div class="progress"><span style="width:${pos/questions.length*100}%"></span></div><div class="xp">⭐ Practice ${pos+1} of ${questions.length}</div><div class="formula">${safe(x.formula)}</div><p class="question">${safe(x.q)}</p><div id="opts">${x.o.map((o,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${safe(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="next" class="next" style="display:none" onclick="next()">Next Question →</button></div>`}window.answer=function(i){if(answered)return;answered=true;const x=questions[pos],buttons=[...document.querySelectorAll('.option')];buttons[x.a].classList.add('correct');const fb=document.getElementById('feedback');if(i===x.a){score++;fb.innerHTML='🎉 <b>Correct!</b><br>'+safe(x.e);fb.className='feedback correct';}else{buttons[i].classList.add('wrong');fb.innerHTML='💡 <b>Not quite.</b><br>'+safe(x.e);fb.className='feedback wrong'}fb.style.display='block';document.getElementById('next').style.display='block'};window.next=function(){pos++;if(pos>=questions.length){const xp=score*25;localStorage.setItem('kp_formula_xp',String(Number(localStorage.getItem('kp_formula_xp')||0)+xp));const rawMeta=JSON.parse(raw||'{}');root.innerHTML=`<div class="card result"><div class="score">${score}/${questions.length}</div><h2>${score===questions.length?'🏆 Perfect!':'🌟 Good effort!'}</h2><p>You earned <b>${xp} XP</b>.</p><p>Review the formula and try again if you want to improve your score.</p><button class="complete" onclick="location.href='physics-formulas.html'">Continue Formula Journey →</button></div>`;return}renderQuestion()};async function start(){if(!raw){root.innerHTML='<div class="card"><h2>No practice selected</h2><p>Open a formula lesson first.</p></div>';return}try{const m=JSON.parse(raw),d=m.data||[];const base=built[d[2]];if(base)questions=[{classNo:m.classNo,chapter:d[0],name:d[1],formula:d[2],...base}];else questions=[{classNo:m.classNo,chapter:d[0],name:d[1],formula:d[2],q:'Which statement best describes this formula?',o:['It connects quantities in a Physics relationship.','It is only a unit conversion.','It has no physical meaning.','It can never be used in a calculation.'],a:0,e:'A Physics formula connects physical quantities and helps us solve problems.'}];try{const snap=await getDocs(query(collection(db,'formulas'),where('classNo','==',Number(m.classNo)),where('name','==',d[1])));if(!snap.empty){const f=snap.docs[0].data();if(f.practiceQuestion){questions[0]={...questions[0],q:f.practiceQuestion, o:f.practiceOptions||questions[0].o, a:Number(f.practiceAnswer??questions[0].a), e:f.practiceExplanation||questions[0].e}}}}catch(e){}renderQuestion()}catch(e){root.innerHTML='<div class="card"><h2>Unable to load practice</h2><p>Please return to the Formula Journey.</p></div>'}}start();</script></body></html>
