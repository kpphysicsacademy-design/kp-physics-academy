<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Formula Journey | KP Physics Academy</title><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#0b1930}.wrap{max-width:1050px;margin:auto;padding:25px 18px 60px}.top{display:flex;justify-content:space-between;margin-bottom:25px}.top a{color:#1687ff;text-decoration:none;font-weight:800}h1{text-align:center;font-size:40px;margin:8px 0}h1 span{color:#1687ff}.intro{text-align:center;color:#68758a;line-height:1.6;max-width:760px;margin:0 auto 25px}.classes{display:flex;gap:8px;overflow-x:auto;padding:5px 2px 15px}.classes button{min-width:90px;border:1px solid #dbe4ee;background:#fff;border-radius:12px;padding:12px 10px;font-weight:900;cursor:pointer}.classes button.active{background:#1687ff;color:#fff}.search{display:flex;gap:8px;margin:0 auto 22px;max-width:620px}.search input{flex:1;padding:12px;border:1px solid #d7e0eb;border-radius:9px}.search button{border:0;background:#0b1930;color:#fff;border-radius:9px;padding:12px 16px;font-weight:800}.chapter{background:#fff;border:1px solid #e0e7f0;border-radius:20px;padding:22px 18px;margin-bottom:22px;box-shadow:0 8px 25px #0b19300d}.chapter-head{display:flex;align-items:center;gap:15px;border-bottom:1px solid #e8eef5;padding:5px 8px 18px;margin-bottom:18px}.chapter-icon{width:55px;height:55px;border-radius:15px;background:#edf5ff;display:grid;place-items:center;font-size:28px}.chapter-head h2{margin:0;font-size:23px}.chapter-head p{margin:4px 0 0;color:#77859a;font-size:13px}.path{max-width:650px;margin:auto}.skill{position:relative;margin:0 auto 18px;padding:18px;border-radius:18px;border:1px solid #dce5ef;background:#fff;display:grid;grid-template-columns:58px 1fr auto;gap:13px;align-items:center;box-shadow:0 4px 12px #0b19300b}.skill:after{content:"";position:absolute;width:3px;height:18px;background:#d9e3ee;left:45px;bottom:-19px}.skill:last-child:after{display:none}.skill .icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#edf5ff;font-size:25px;border:3px solid #b9d9ff}.skill.mastered{border-color:#55b878;background:#f1fbf5}.skill.mastered .icon{background:#e6f8ed;border-color:#55b878}.open{border:0;background:#1687ff;color:#fff;padding:10px 13px;border-radius:10px;font-weight:800;cursor:pointer}.empty{padding:20px;text-align:center;color:#77859a;background:#f7f9fc;border-radius:12px}.error{padding:15px;background:#fff3f3;color:#8b0000;border-radius:10px}@media(max-width:650px){h1{font-size:32px}.skill{grid-template-columns:48px 1fr}.skill .icon{width:48px;height:48px}.skill .open{grid-column:2}.top{font-size:13px}.chapter-head h2{font-size:19px}}</style></head><body><main class="wrap"><div class="top"><a href="index.html">← Back to Home</a><a href="question-bank.html">Question Bank →</a></div><h1>Physics <span>Formula Journey</span></h1><p class="intro">Learn formulas one concept at a time. Choose your class, choose a Physics chapter, then master each formula in sequence.</p><div class="classes" id="classes"></div><div class="search"><input id="search" placeholder="Search a formula, unit or topic"><button onclick="searchFormula()">Search</button></div><div id="status" class="empty">Loading formulas...</div><div id="chapterPaths"></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),db=getFirestore(app);let current=6,formulas=[];const CHAPTERS=[['Mechanics','⚙️','Motion, force, work, energy, gravitation and fluids'],['Oscillations & Waves','〰️','Vibrations, sound, frequency and waves'],['Heat & Thermodynamics','🌡️','Temperature, heat and thermodynamic relations'],['Electricity','⚡','Current, circuits, charge, potential and capacitance'],['Magnetism','🧲','Magnetic force and electromagnetic induction'],['Optics','🔭','Light, mirrors and lenses'],['Modern Physics','⚛️','Atoms, nuclei, quantum ideas and semiconductors'],['Measurements','📐','Units, measurements and physical quantities']];const MAP={Measurement:'Measurements',Measurements:'Measurements',Motion:'Mechanics',Force:'Mechanics',Gravitation:'Mechanics',Work:'Mechanics',Power:'Mechanics',Kinematics:'Mechanics','Laws of Motion':'Mechanics','Work Energy':'Mechanics',Fluids:'Mechanics',Sound:'Oscillations & Waves',Oscillations:'Oscillations & Waves',Waves:'Oscillations & Waves',Heat:'Heat & Thermodynamics',Temperature:'Heat & Thermodynamics',Thermodynamics:'Heat & Thermodynamics',Electricity:'Electricity','Current Electricity':'Electricity',Electrostatics:'Electricity',Capacitance:'Electricity',AC:'Electricity',Magnetism:'Magnetism',EMI:'Magnetism',Light:'Optics',Optics:'Optics','Wave optics':'Optics','Dual nature':'Modern Physics',Atoms:'Modern Physics',Nuclei:'Modern Physics',Radioactivity:'Modern Physics',Semiconductors:'Modern Physics'};function chapterOf(ch){return MAP[ch]||'Mechanics'}function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function chooseClass(c){current=c;load()}function renderClasses(){document.getElementById('classes').innerHTML=[6,7,8,9,10,11,12].map(c=>`<button class="${c===current?'active':''}" onclick="chooseClass(${c})">Class ${c}</button>`).join('')}function render(){renderClasses();const root=document.getElementById('chapterPaths');root.innerHTML='';if(!formulas.length){root.innerHTML='<div class="empty">No formulas have been published for Class '+current+' yet.</div>';return}CHAPTERS.forEach(([name,icon,desc])=>{const items=formulas.filter(f=>chapterOf(f.chapter)===name);if(!items.length)return;const section=document.createElement('section');section.className='chapter';section.innerHTML=`<div class="chapter-head"><div class="chapter-icon">${icon}</div><div><h2>${name}</h2><p>${desc}</p></div></div><div class="path"></div>`;const path=section.querySelector('.path');items.forEach((f,i)=>{const key='kp_mastered_'+current+'_'+f.id;const mastered=localStorage.getItem(key)==='1';const el=document.createElement('div');el.className='skill '+(mastered?'mastered':'');const formula=f.latex?`\\(${esc(f.latex)}\\)`:esc(f.text||'');el.innerHTML=`<div class="icon">${mastered?'🏆':icon}</div><div><h3>${i+1}. ${esc(f.name)}</h3><p>${esc(f.chapter||'')} • ${mastered?'Mastered':'Ready to learn'}</p><div>${formula}</div></div><button class="open">${mastered?'Review':'Learn'}</button>`;el.querySelector('.open').onclick=()=>openLesson(f);path.appendChild(el)});root.appendChild(section)});if(window.MathJax)window.MathJax.typesetPromise([root]).catch(()=>{})}async function load(){document.getElementById('status').style.display='block';document.getElementById('status').textContent='Loading Class '+current+' formulas...';try{let s=await getDocs(query(collection(db,'formulas'),where('classNo','==',current)));formulas=s.docs.map(d=>({id:d.id,...d.data()}));if(!formulas.length){s=await getDocs(query(collection(db,'formulas'),where('classNo','==',String(current))));formulas=s.docs.map(d=>({id:d.id,...d.data()}))}document.getElementById('status').style.display='none';render()}catch(e){document.getElementById('status').className='error';document.getElementById('status').textContent='Unable to load formulas. Firebase rules or configuration need attention.'}}function openLesson(f){localStorage.setItem('kp_formula_current_lesson',JSON.stringify(f));window.open('formula-lesson.html','_blank','noopener,noreferrer')}function searchFormula(){const q=document.getElementById('search').value.toLowerCase().trim();if(!q){render();return}const found=formulas.find(f=>(`${f.name} ${f.chapter} ${f.text} ${f.symbols} ${f.unit}`).toLowerCase().includes(q));if(found)openLesson(found);else alert('No matching formula found in Class '+current+'.')}window.chooseClass=chooseClass;window.searchFormula=searchFormula;renderClasses();load();</script></body></html>
