<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Formula Journey | KP Physics Academy</title><meta name="description" content="Duolingo-style Physics formula learning journey for Classes 6 to 12."><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f8fc;color:#0b1930}.wrap{max-width:1000px;margin:auto;padding:25px 18px 60px}.top{display:flex;justify-content:space-between;margin-bottom:25px}.top a{color:#1687ff;text-decoration:none;font-weight:800}h1{text-align:center;font-size:40px;margin:8px 0}h1 span{color:#1687ff}.intro{text-align:center;color:#68758a;line-height:1.6;max-width:700px;margin:0 auto 25px}.xpbar{background:#fff;border:1px solid #e0e7f0;border-radius:15px;padding:15px 18px;margin-bottom:25px;display:flex;justify-content:space-between;gap:15px}.xp{color:#1687ff;font-weight:900}.classes{display:flex;gap:8px;overflow-x:auto;padding:5px 2px 15px}.classes button{min-width:90px;border:1px solid #dbe4ee;background:#fff;border-radius:12px;padding:12px 10px;font-weight:900;cursor:pointer}.classes button.active{background:#1687ff;color:#fff;border-color:#1687ff}.path{background:#fff;border:1px solid #e0e7f0;border-radius:20px;padding:25px 18px;box-shadow:0 8px 25px #0b19300d}.path-title{text-align:center;margin:0 0 22px}.path-title span{color:#1687ff}.skill{position:relative;max-width:520px;margin:0 auto 18px;padding:18px;border-radius:18px;border:1px solid #dce5ef;background:#fff;display:grid;grid-template-columns:58px 1fr auto;gap:13px;align-items:center;box-shadow:0 4px 12px #0b19300b}.skill:after{content:"";position:absolute;width:3px;height:18px;background:#d9e3ee;left:45px;bottom:-19px}.skill:last-child:after{display:none}.skill .icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#edf5ff;font-size:25px;border:3px solid #b9d9ff}.skill.locked{opacity:.62}.skill.mastered{border-color:#55b878;background:#f1fbf5}.skill.mastered .icon{background:#e6f8ed;border-color:#55b878}.skill h3{margin:0 0 5px;font-size:16px}.skill p{margin:0;color:#77859a;font-size:12px}.open{border:0;background:#1687ff;color:#fff;padding:10px 13px;border-radius:10px;font-weight:800;cursor:pointer}.open:disabled{background:#d9e1ea;color:#667486}.search{display:flex;gap:8px;margin:0 auto 22px;max-width:600px}.search input{flex:1;padding:12px;border:1px solid #d7e0eb;border-radius:9px}.search button{border:0;background:#0b1930;color:#fff;border-radius:9px;padding:12px 16px;font-weight:800}@media(max-width:650px){h1{font-size:32px}.skill{grid-template-columns:48px 1fr}.skill .icon{width:48px;height:48px}.skill .open{grid-column:2}.top{font-size:13px}}
</style></head><body><main class="wrap"><div class="top"><a href="index.html">← Back to Home</a><a href="question-bank.html">Question Bank →</a></div><h1>Physics <span>Formula Journey</span></h1><p class="intro">Learn one formula at a time. Select a class, choose a skill, and open the lesson on a separate page.</p><div class="xpbar"><span>🔥 Learning streak: <b>1 day</b></span><span class="xp">⭐ XP: <b id="xp">0</b></span></div><div class="classes" id="classes"></div><div class="search"><input id="search" placeholder="Search a formula or topic"><button onclick="searchFormula()">Search</button></div><section class="path"><h2 class="path-title">Class <span id="classTitle">6</span> Formula Path</h2><div id="skills"></div></section></main><script>const DATA={6:[['Measurement','Length conversion','1 m = 100 cm = 1000 mm','Relationship between metre, centimetre and millimetre.'],['Motion','Speed','v = s/t','Distance covered per unit time.'],['Motion','Average speed','Average speed = total distance / total time','Use total distance and total time.'],['Temperature','Temperature conversion','°C = (°F − 32) × 5/9','Convert Fahrenheit to Celsius.'],['Electricity','Electric circuit','Closed circuit → current can flow','A complete conducting path is needed.']],7:[['Motion','Speed','v = s/t','Distance divided by time.'],['Motion','Average speed','Average speed = total distance / total time','Total distance divided by total time.'],['Heat','Temperature conversion','°F = (°C × 9/5) + 32','Celsius to Fahrenheit.'],['Electricity','Current','I = Q/t','Charge flowing per unit time.'],['Sound','Wave speed','v = fλ','Wave speed, frequency and wavelength.']],8:[['Force','Pressure','P = F/A','Force per unit area.'],['Force','Moment','Moment = F × perpendicular distance','Turning effect of a force.'],['Sound','Frequency','f = number of vibrations / time','Vibrations per second.'],['Sound','Time period','T = 1/f','Frequency and time period are reciprocals.'],['Light','Wave relation','v = fλ','Wave speed relation.']],9:[['Motion','Speed','v = s/t','Distance per unit time.'],['Motion','Acceleration','a = (v − u)/t','Change in velocity per unit time.'],['Motion','First equation','v = u + at','Uniform acceleration.'],['Motion','Second equation','s = ut + ½at²','Uniform acceleration.'],['Motion','Third equation','v² = u² + 2as','Velocity-displacement relation.'],['Force','Newton’s second law','F = ma','Force for constant mass.'],['Gravitation','Weight','W = mg','Weight near Earth.'],['Work','Work','W = Fs cosθ','Work by a constant force.'],['Power','Power','P = W/t','Rate of doing work.'],['Sound','Wave speed','v = fλ','Wave speed relation.']],10:[['Light','Mirror formula','1/f = 1/v + 1/u','Spherical mirror relation.'],['Light','Magnification','m = hᵢ/hₒ = −v/u','Mirror magnification.'],['Light','Lens formula','1/f = 1/v − 1/u','Thin lens relation.'],['Light','Lens power','P = 1/f','f in metres; P in dioptres.'],['Electricity','Ohm’s law','V = IR','Potential difference, current and resistance.'],['Electricity','Power','P = VI = I²R = V²/R','Electrical power.'],['Electricity','Energy','E = Pt','Electrical energy.'],['Electricity','Series resistance','R = R₁ + R₂ + ...','Series combination.'],['Electricity','Parallel resistance','1/R = 1/R₁ + 1/R₂ + ...','Parallel combination.'],['Magnetism','Force on conductor','F = BIL sinθ','Force on current-carrying conductor.']],11:[['Kinematics','Velocity','v = u + at','Uniform acceleration.'],['Kinematics','Displacement','s = ut + ½at²','Uniform acceleration.'],['Kinematics','Velocity-displacement','v² = u² + 2as','Uniform acceleration.'],['Kinematics','Projectile range','R = u²sin2θ/g','Ideal projectile.'],['Laws of Motion','Force','F = ma','Newton’s second law.'],['Work Energy','Kinetic energy','K = ½mv²','Translational kinetic energy.'],['Work Energy','Potential energy','U = mgh','Near Earth.'],['Power','Power','P = W/t = Fv','Rate of doing work.'],['Gravitation','Gravitational force','F = Gm₁m₂/r²','Newton’s law of gravitation.'],['Fluids','Pressure','P = F/A','Pressure definition.'],['Thermodynamics','First law','ΔQ = ΔU + ΔW','Energy relation.'],['Oscillations','Spring period','T = 2π√(m/k)','Mass-spring oscillator.'],['Waves','Wave speed','v = fλ','Wave relation.']],12:[['Electrostatics','Coulomb’s law','F = (1/4πε₀)q₁q₂/r²','Electrostatic force.'],['Electrostatics','Electric field','E = F/q','Force per unit test charge.'],['Electrostatics','Electric potential','V = W/q','Work per unit charge.'],['Capacitance','Capacitance','C = Q/V','Charge per potential difference.'],['Current Electricity','Current','I = Q/t','Rate of charge flow.'],['Current Electricity','Ohm’s law','V = IR','Ohmic relation.'],['Current Electricity','Power','P = VI = I²R = V²/R','Electrical power.'],['Magnetism','Lorentz force','F = qvB sinθ','Force on moving charge.'],['EMI','Faraday law','ε = −dΦ/dt','Induced emf.'],['AC','RMS voltage','Vᵣₘₛ = V₀/√2','Sinusoidal AC.'],['Optics','Lens formula','1/f = 1/v − 1/u','Thin lens equation.'],['Optics','Lens power','P = 1/f','f in metres.'],['Wave optics','Fringe width','β = λD/d','Young’s double-slit experiment.'],['Dual nature','de Broglie wavelength','λ = h/p','Matter-wave wavelength.'],['Atoms','Bohr energy','Eₙ = −13.6/n² eV','Hydrogen energy level.'],['Nuclei','Mass-energy','E = mc²','Mass-energy equivalence.'],['Radioactivity','Half-life','T₁/₂ = 0.693/λ','Radioactive half-life.'],['Semiconductors','Diode equation','I ≈ I₀(e^(eV/kT) − 1)','Idealised diode relation.']]};let current=6,xp=Number(localStorage.getItem('kp_formula_xp')||0);function done(){return JSON.parse(localStorage.getItem('kp_formula_mastered')||'{}')}function chooseClass(c){current=c;render()}function openLesson(i){localStorage.setItem('kp_formula_current_lesson',JSON.stringify({classNo:current,index:i,data:DATA[current][i]}));window.open('formula-lesson.html','_blank','noopener,noreferrer')}function render(){document.getElementById('classes').innerHTML=[6,7,8,9,10,11,12].map(c=>`<button class="${c===current?'active':''}" onclick="chooseClass(${c})">Class ${c}</button>`).join('');document.getElementById('classTitle').textContent=current;const d=done();document.getElementById('skills').innerHTML=DATA[current].map((x,i)=>{const m=!!d[current+'-'+i],locked=i>0&&!d[current+'-'+(i-1)];return `<div class="skill ${m?'mastered':''} ${locked?'locked':''}"><div class="icon">${m?'🏆':locked?'🔒':'📐'}</div><div><h3>${i+1}. ${x[1]}</h3><p>${x[0]} • ${m?'Mastered':locked?'Complete previous skill first':'Ready to learn'}</p></div><button class="open" ${locked?'disabled':''} onclick="openLesson(${i})">${locked?'Locked':m?'Review':'Learn'}</button></div>`}).join('');document.getElementById('xp').textContent=xp}function searchFormula(){const q=document.getElementById('search').value.toLowerCase().trim();if(!q)return;const i=DATA[current].findIndex(x=>x.join(' ').toLowerCase().includes(q));if(i>=0)openLesson(i);else alert('No matching formula found in Class '+current+'.')}render();</script></body></html>
