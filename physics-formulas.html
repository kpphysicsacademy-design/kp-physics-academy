<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Formula Module | KP Physics Academy</title><meta name="description" content="Physics formulas from Class 6 to Class 12 - KP Physics Academy"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f8fc;color:#0b1930}.wrap{max-width:1150px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;gap:15px;margin-bottom:30px}.top a{color:#1687ff;text-decoration:none;font-weight:700}h1{text-align:center;font-size:42px;margin:10px 0}h1 span{color:#1687ff}.intro{text-align:center;color:#68758a;max-width:780px;margin:0 auto 30px;line-height:1.6}.classes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:25px}.classes button{border:1px solid #dce5ef;background:#fff;border-radius:9px;padding:11px 16px;font-weight:800;color:#0b1930;cursor:pointer}.classes button.active,.classes button:hover{background:#1687ff;color:#fff;border-color:#1687ff}.search{max-width:600px;margin:0 auto 25px;display:flex;gap:8px}.search input{flex:1;padding:13px;border:1px solid #d7e0eb;border-radius:9px;font-size:15px}.formula-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe7f1;border-radius:15px;padding:20px;box-shadow:0 5px 18px #0b19300c}.card h2{font-size:18px;color:#1687ff;margin:0 0 15px}.formula{background:#f1f6ff;border-left:4px solid #1687ff;border-radius:8px;padding:13px;margin:10px 0;font-family:Cambria,Georgia,serif;font-size:19px}.meaning{color:#68758a;font-size:13px;line-height:1.5}.tag{display:inline-block;font-size:11px;background:#edf5ff;color:#1687ff;border-radius:99px;padding:5px 9px;font-weight:800;margin-bottom:8px}@media(max-width:750px){h1{font-size:32px}.formula-grid{grid-template-columns:1fr}.search{flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><a href="index.html">← Back to Home</a><a href="question-bank.html">Question Bank →</a></div><h1>Physics <span>Formula Module</span></h1><p class="intro">A dedicated formula-revision module for Classes 6–12. Select a class and revise the important formulas topic by topic.</p><div class="classes" id="classes"></div><div class="search"><input id="search" placeholder="Search a formula, e.g. velocity, Ohm, lens"><button onclick="render()">Search</button></div><div id="formulaGrid" class="formula-grid"></div></main><script>const DATA={6:[['Measurement','Length conversion','1 m = 100 cm = 1000 mm','Common length conversions'],['Motion','Speed','Speed = Distance / Time','Basic relation between distance and time'],['Motion','Average speed','Average speed = Total distance / Total time','Use total quantities'],['Electricity','Simple circuit','Closed circuit → current can flow','A basic circuit idea, not a numerical formula'],['Temperature','Temperature conversion','°C = (°F − 32) × 5/9','Useful when comparing Celsius and Fahrenheit']],7:[['Motion','Speed','Speed = Distance / Time','Distance covered per unit time'],['Motion','Average speed','Average speed = Total distance / Total time','Total distance divided by total time'],['Heat','Temperature conversion','°F = (°C × 9/5) + 32','Celsius to Fahrenheit'],['Electricity','Electric current','Current = Charge / Time','Charge flowing per unit time'],['Light','Speed relation','Speed = Distance / Time','Use for simple motion of light in a model context']],8:[['Force','Pressure','Pressure = Force / Area','Force acting normally per unit area'],['Force','Moment','Moment = Force × perpendicular distance','Turning effect of force'],['Sound','Frequency','Frequency = Number of vibrations / Time','Vibrations per second'],['Sound','Time period','T = 1/f','Time period and frequency are reciprocals'],['Light','Speed relation','v = fλ','Wave speed, frequency and wavelength relation']],9:[['Motion','Speed','v = Distance / Time','Speed is distance travelled per unit time'],['Motion','Acceleration','a = (v − u) / t','Change in velocity per unit time'],['Motion','Equation of motion','v = u + at','First equation'],['Motion','Equation of motion','s = ut + 1/2 at²','Second equation'],['Motion','Equation of motion','v² = u² + 2as','Third equation'],['Force','Newton’s second law','F = ma','For constant mass'],['Gravitation','Weight','W = mg','Weight of mass m in gravitational field g'],['Gravitation','Density','ρ = m/V','Mass per unit volume'],['Work','Work','W = Fs cosθ','Work by a constant force'],['Power','Power','P = W/t','Rate of doing work'],['Sound','Wave speed','v = fλ','Wave speed relation']],10:[['Light','Mirror formula','1/f = 1/v + 1/u','Spherical mirror relation'],['Light','Magnification','m = hᵢ/hₒ = −v/u','Mirror magnification'],['Light','Lens formula','1/f = 1/v − 1/u','Thin lens relation using Cartesian sign convention'],['Light','Lens power','P = 1/f','f in metres; P in dioptres'],['Electricity','Ohm’s law','V = IR','Potential difference, current and resistance'],['Electricity','Power','P = VI = I²R = V²/R','Electrical power'],['Electricity','Energy','E = Pt','Electrical energy for constant power'],['Electricity','Resistance series','R = R₁ + R₂ + ...','Series combination'],['Electricity','Resistance parallel','1/R = 1/R₁ + 1/R₂ + ...','Parallel combination'],['Magnetism','Force on conductor','F = BIL sinθ','Force on a current-carrying conductor']],11:[['Units','Density','ρ = m/V','Mass per unit volume'],['Kinematics','Velocity','v = u + at','Uniform acceleration'],['Kinematics','Displacement','s = ut + 1/2 at²','Uniform acceleration'],['Kinematics','Velocity-displacement','v² = u² + 2as','Uniform acceleration'],['Kinematics','Projectile range','R = u² sin2θ / g','Ideal projectile on level ground'],['Laws of Motion','Force','F = ma','Newton’s second law'],['Work Energy','Work','W = F·s = Fs cosθ','Constant force'],['Work Energy','Kinetic energy','K = 1/2 mv²','Translational kinetic energy'],['Work Energy','Potential energy','U = mgh','Near Earth surface'],['Power','Power','P = W/t = Fv','For force and velocity along same direction'],['Gravitation','Newton’s gravitation','F = Gm₁m₂/r²','Gravitational force'],['Gravitation','Acceleration due to gravity','g = GM/R²','At the surface of a spherical body'],['Fluids','Pressure','P = F/A','Pressure definition'],['Fluids','Continuity','A₁v₁ = A₂v₂','Steady incompressible flow'],['Thermodynamics','First law','ΔQ = ΔU + ΔW','Work done by the system convention'],['Oscillations','Time period','T = 2π√(m/k)','Mass-spring system'],['Waves','Wave speed','v = fλ','Wave relation']],12:[['Electrostatics','Coulomb’s law','F = (1/4πε₀) q₁q₂/r²','Force between point charges in vacuum'],['Electrostatics','Electric field','E = F/q','Force per unit positive test charge'],['Electrostatics','Electric potential','V = W/q','Work per unit charge'],['Capacitance','Capacitance','C = Q/V','Charge stored per potential difference'],['Capacitance','Parallel plate capacitor','C = ε₀A/d','Vacuum parallel-plate capacitor'],['Current Electricity','Current','I = Q/t','Charge flow rate'],['Current Electricity','Ohm’s law','V = IR','Ohmic conductor relation'],['Current Electricity','Electrical power','P = VI = I²R = V²/R','Power in a resistor'],['Magnetism','Lorentz force','F = qvB sinθ','Magnetic force on moving charge'],['Magnetism','Force on conductor','F = BIL sinθ','Current-carrying conductor'],['EMI','Faraday law','ε = −dΦ/dt','Induced emf'],['AC','RMS voltage','Vᵣₘₛ = V₀/√2','Sinusoidal AC'],['AC','Transformer','Vₛ/Vₚ = Nₛ/Nₚ','Ideal transformer'],['Optics','Lens formula','1/f = 1/v − 1/u','Thin lens equation'],['Optics','Magnification','m = v/u','Lateral magnification for a thin lens with sign convention'],['Optics','Power of lens','P = 1/f','f in metres'],['Wave optics','Young’s fringe width','β = λD/d','YDSE fringe width'],['Dual nature','de Broglie wavelength','λ = h/p','Matter-wave wavelength'],['Atoms','Bohr energy','Eₙ = −13.6/n² eV','Hydrogen-like atom energy level'],['Nuclei','Mass-energy relation','E = mc²','Mass-energy equivalence'],['Radioactivity','Decay law','N = N₀e^(−λt)','Radioactive decay'],['Radioactivity','Half-life','T₁/₂ = 0.693/λ','Half-life relation'],['Semiconductors','Diode current','I ≈ I₀(e^(eV/kT) − 1)','Idealised diode equation form']]};let current=6;function renderClasses(){document.getElementById('classes').innerHTML=[6,7,8,9,10,11,12].map(c=>`<button class="${c===current?'active':''}" onclick="current=${c};render()">Class ${c}</button>`).join('')}function render(){renderClasses();const q=document.getElementById('search').value.toLowerCase().trim();const items=DATA[current].filter(x=>x.join(' ').toLowerCase().includes(q));document.getElementById('formulaGrid').innerHTML=items.map(x=>`<article class="card"><span class="tag">${x[0]}</span><h2>${x[1]}</h2><div class="formula">${x[2]}</div><p class="meaning">${x[3]}</p></article>`).join('')||'<div class="card"><h2>No formula found</h2><p class="meaning">Try another search term.</p></div>'}render();</script></body></html>
