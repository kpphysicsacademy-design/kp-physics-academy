<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Formula Journey | KP Physics Academy</title><meta name="description" content="Duolingo-style Physics formula learning journey for Classes 6 to 12."><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f8fc;color:#0b1930}.wrap{max-width:1000px;margin:auto;padding:25px 18px 60px}.top{display:flex;justify-content:space-between;margin-bottom:25px}.top a{color:#1687ff;text-decoration:none;font-weight:800}h1{text-align:center;font-size:40px;margin:8px 0}h1 span{color:#1687ff}.intro{text-align:center;color:#68758a;line-height:1.6;max-width:700px;margin:0 auto 25px}.xpbar{background:#fff;border:1px solid #e0e7f0;border-radius:15px;padding:15px 18px;margin-bottom:25px;display:flex;justify-content:space-between;align-items:center;gap:15px}.xp{color:#1687ff;font-weight:900}.classes{display:flex;gap:8px;overflow-x:auto;padding:5px 2px 15px}.classes button{min-width:90px;border:1px solid #dbe4ee;background:#fff;border-radius:12px;padding:12px 10px;font-weight:900;cursor:pointer}.classes button.active{background:#1687ff;color:#fff;border-color:#1687ff}.path{background:#fff;border:1px solid #e0e7f0;border-radius:20px;padding:25px 18px;box-shadow:0 8px 25px #0b19300d}.path-title{text-align:center;margin:0 0 22px}.path-title span{color:#1687ff}.skill{position:relative;max-width:520px;margin:0 auto 18px;padding:18px;border-radius:18px;border:1px solid #dce5ef;background:#fff;display:grid;grid-template-columns:58px 1fr auto;gap:13px;align-items:center;box-shadow:0 4px 12px #0b19300b}.skill:after{content:"";position:absolute;width:3px;height:18px;background:#d9e3ee;left:45px;bottom:-19px}.skill:last-child:after{display:none}.skill .icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#edf5ff;font-size:25px;border:3px solid #b9d9ff}.skill.locked{opacity:.62}.skill.mastered{border-color:#55b878;background:#f1fbf5}.skill.mastered .icon{background:#e6f8ed;border-color:#55b878}.skill.current{border-color:#1687ff;box-shadow:0 7px 20px #1687ff20}.skill h3{margin:0 0 5px;font-size:16px}.skill p{margin:0;color:#77859a;font-size:12px}.open{border:0;background:#1687ff;color:#fff;padding:10px 13px;border-radius:10px;font-weight:800;cursor:pointer}.locked .open{background:#d9e1ea;color:#667486}.lesson{display:none;margin:25px auto 0;max-width:700px;background:#fff;border:1px solid #dce5ef;border-radius:18px;padding:25px}.lesson.show{display:block}.lesson .formula{font:700 28px Cambria,Georgia,serif;text-align:center;background:#f1f6ff;border-radius:12px;padding:22px;margin:18px 0;color:#0b1930}.lesson h2{margin-top:0}.symbols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.symbols div{background:#f7f9fc;border-radius:9px;padding:10px;font-size:13px}.challenge{background:#fff9e8;border:1px solid #f0d98b;border-radius:12px;padding:15px;margin-top:18px}.challenge button{margin:6px 5px 0 0;border:1px solid #d7dfe8;background:#fff;padding:9px 12px;border-radius:8px;cursor:pointer}.challenge button.correct{background:#e7f8ed;border-color:#55b878}.challenge button.wrong{background:#fdeaea;border-color:#df6666}.master{width:100%;margin-top:15px;padding:12px;border:0;border-radius:10px;background:#1687ff;color:#fff;font-weight:900;cursor:pointer}.search{display:flex;gap:8px;margin:0 auto 22px;max-width:600px}.search input{flex:1;padding:12px;border:1px solid #d7e0eb;border-radius:9px}.search button{border:0;background:#0b1930;color:#fff;border-radius:9px;padding:12px 16px;font-weight:800}@media(max-width:650px){h1{font-size:32px}.skill{grid-template-columns:48px 1fr}.skill .icon{width:48px;height:48px}.skill .open{grid-column:2}.symbols{grid-template-columns:1fr}.top{font-size:13px}.xpbar{font-size:13px}}
</style></head><body><main class="wrap"><div class="top"><a href="index.html">← Back to Home</a><a href="question-bank.html">Question Bank →</a></div><h1>Physics <span>Formula Journey</span></h1><p class="intro">Learn Physics formulas like a journey. Complete one skill, earn XP, and unlock the next skill. You can choose another class whenever you want.</p><div class="xpbar"><span>🔥 Learning streak: <b id="streak">1 day</b></span><span class="xp">⭐ XP: <b id="xp">0</b></span></div><div class="classes" id="classes"></div><div class="search"><input id="search" placeholder="Search a formula or topic"><button onclick="searchFormula()">Search</button></div><section class="path"><h2 class="path-title">Class <span id="classTitle">6</span> Formula Path</h2><div id="skills"></div><div id="lesson" class="lesson"></div></section></main><script>const DATA={6:[['Measurement','Length conversion','1 m = 100 cm = 1000 mm','Remember the relationship between metre, centimetre and millimetre.'],['Motion','Speed','v = s/t','Speed tells how much distance is covered per unit time.'],['Motion','Average speed','Average speed = total distance / total time','Use total distance and total time.'],['Temperature','Temperature conversion','°C = (°F − 32) × 5/9','Conversion between Celsius and Fahrenheit.'],['Electricity','Electric circuit','Closed circuit → current can flow','A complete conducting path is needed for current to flow.']],7:[['Motion','Speed','v = s/t','Distance divided by time.'],['Motion','Average speed','Average speed = total distance / total time','Total distance divided by total time.'],['Heat','Temperature conversion','°F = (°C × 9/5) + 32','Celsius to Fahrenheit.'],['Electricity','Current','I = Q/t','Charge flowing per unit time.'],['Sound','Wave speed','v = fλ','Wave speed, frequency and wavelength.']],8:[['Force','Pressure','P = F/A','Force per unit area.'],['Force','Moment','Moment = F × perpendicular distance','Turning effect of a force.'],['Sound','Frequency','f = number of vibrations / time','Number of vibrations per second.'],['Sound','Time period','T = 1/f','Frequency and time period are reciprocals.'],['Light','Wave relation','v = fλ','Wave speed relation.']],9:[['Motion','Speed','v = s/t','Distance travelled per unit time.'],['Motion','Acceleration','a = (v − u)/t','Change in velocity per unit time.'],['Motion','First equation','v = u + at','Equation for uniformly accelerated motion.'],['Motion','Second equation','s = ut + ½at²','Displacement under uniform acceleration.'],['Motion','Third equation','v² = u² + 2as','Velocity-displacement relation.'],['Force','Newton’s second law','F = ma','Force for constant mass.'],['Gravitation','Weight','W = mg','Weight near Earth’s surface.'],['Work','Work','W = Fs cosθ','Work by a constant force.'],['Power','Power','P = W/t','Rate of doing work.'],['Sound','Wave speed','v = fλ','Wave speed relation.']],10:[['Light','Mirror formula','1/f = 1/v + 1/u','Spherical mirror relation.'],['Light','Magnification','m = hᵢ/hₒ = −v/u','Magnification of a spherical mirror.'],['Light','Lens formula','1/f = 1/v − 1/u','Thin lens relation using Cartesian sign convention.'],['Light','Lens power','P = 1/f','f in metres; P in dioptres.'],['Electricity','Ohm’s law','V = IR','Potential difference, current and resistance.'],['Electricity','Power','P = VI = I²R = V²/R','Electrical power.'],['Electricity','Energy','E = Pt','Electrical energy for constant power.'],['Electricity','Series resistance','R = R₁ + R₂ + ...','Series combination.'],['Electricity','Parallel resistance','1/R = 1/R₁ + 1/R₂ + ...','Parallel combination.'],['Magnetism','Force on conductor','F = BIL sinθ','Force on a current-carrying conductor.']],11:[['Kinematics','Velocity','v = u + at','Uniform acceleration.'],['Kinematics','Displacement','s = ut + ½at²','Uniform acceleration.'],['Kinematics','Velocity-displacement','v² = u² + 2as','Uniform acceleration.'],['Kinematics','Projectile range','R = u²sin2θ/g','Ideal projectile on level ground.'],['Laws of Motion','Force','F = ma','Newton’s second law.'],['Work Energy','Kinetic energy','K = ½mv²','Translational kinetic energy.'],['Work Energy','Potential energy','U = mgh','Near Earth’s surface.'],['Power','Power','P = W/t = Fv','Rate of doing work.'],['Gravitation','Gravitational force','F = Gm₁m₂/r²','Newton’s law of gravitation.'],['Fluids','Pressure','P = F/A','Pressure definition.'],['Thermodynamics','First law','ΔQ = ΔU + ΔW','Thermodynamic energy relation.'],['Oscillations','Spring period','T = 2π√(m/k)','Time period of a mass-spring oscillator.'],['Waves','Wave speed','v = fλ','Wave relation.']],12:[['Electrostatics','Coulomb’s law','F = (1/4πε₀)q₁q₂/r²','Electrostatic force between point charges in vacuum.'],['Electrostatics','Electric field','E = F/q','Force per unit positive test charge.'],['Electrostatics','Electric potential','V = W/q','Work done per unit charge.'],['Capacitance','Capacitance','C = Q/V','Charge stored per potential difference.'],['Current Electricity','Current','I = Q/t','Rate of flow of charge.'],['Current Electricity','Ohm’s law','V = IR','Ohmic conductor relation.'],['Current Electricity','Electrical power','P = VI = I²R = V²/R','Electrical power.'],['Magnetism','Lorentz force','F = qvB sinθ','Magnetic force on a moving charge.'],['EMI','Faraday law','ε = −dΦ/dt','Induced emf.'],['AC','RMS voltage','Vᵣₘₛ = V₀/√2','Sinusoidal AC.'],['Optics','Lens formula','1/f = 1/v − 1/u','Thin lens equation.'],['Optics','Lens power','P = 1/f','f in metres.'],['Wave optics','Fringe width','β = λD/d','Young’s double-slit experiment.'],['Dual nature','de Broglie wavelength','λ = h/p','Matter-wave wavelength.'],['Atoms','Bohr energy','Eₙ = −13.6/n² eV','Hydrogen energy level.'],['Nuclei','Mass-energy','E = mc²','Mass-energy equivalence.'],['Radioactivity','Half-life','T₁/₂ = 0.693/λ','Radioactive half-life relation.'],['Semiconductors','Diode equation','I ≈ I₀(e^(eV/kT) − 1)','Idealised diode equation form.']]};let current=6,selected=0,totalXP=Number(localStorage.getItem('kp_formula_xp')||0);function mastered(){return JSON.parse(localStorage.getItem('kp_formula_mastered')||'{}')}function isMastered(c,i){return !!mastered()[c+'-'+i]}function saveMastered(){const d=mastered();d[current+'-'+selected]=true;localStorage.setItem('kp_formula_mastered',JSON.stringify(d));totalXP+=100;localStorage.setItem('kp_formula_xp',totalXP);render()}function chooseClass(c){current=c;selected=0;render()}function openSkill(i){selected=i;renderLesson();document.getElementById('lesson').scrollIntoView({behavior:'smooth',block:'nearest'})}function renderClasses(){document.getElementById('classes').innerHTML=[6,7,8,9,10,11,12].map(c=>`<button class="${c===current?'active':''}" onclick="chooseClass(${c})">Class ${c}</button>`).join('')}function render(){renderClasses();document.getElementById('classTitle').textContent=current;const items=DATA[current],done=mastered();document.getElementById('skills').innerHTML=items.map((x,i)=>{const m=isMastered(current,i),locked=i>0&&!isMastered(current,i-1);return `<div class="skill ${m?'mastered':''} ${locked?'locked':''} ${i===selected?'current':''}"><div class="icon">${m?'🏆':locked?'🔒':'📐'}</div><div><h3>${i+1}. ${x[1]}</h3><p>${x[0]} • ${m?'Mastered':locked?'Complete previous skill first':'Ready to learn'}</p></div><button class="open" onclick="${locked?'void(0)':`openSkill(${i})`}">${locked?'Locked':m?'Review':'Learn'}</button></div>`}).join('');renderLesson();document.getElementById('xp').textContent=totalXP}function renderLesson(){const x=DATA[current][selected];if(!x)return;const m=isMastered(current,selected);document.getElementById('lesson').className='lesson show';document.getElementById('lesson').innerHTML=`<h2>📐 ${x[1]}</h2><p><b>Topic:</b> ${x[0]}</p><div class="formula">${x[2]}</div><p>${x[3]}</p><h3>🧠 Remember</h3><div class="symbols">${symbols(x[2]).map(s=>`<div><b>${s[0]}</b><br>${s[1]}</div>`).join('')}</div><div class="challenge"><b>🎯 Quick Challenge</b><p>For this skill, identify the correct use of the formula before moving on.</p><button onclick="challenge(this,true)">I understand the formula</button><button onclick="challenge(this,false)">I need revision</button><p id="feedback"></p></div><button class="master" onclick="saveMastered()">${m?'🏆 Mastered — Review Skill':'⭐ Complete Skill + Earn 100 XP'}</button>`}function symbols(f){const out=[];if(f.includes('v ='))out.push(['v','velocity/speed']);if(f.includes('s'))out.push(['s','distance/displacement']);if(f.includes('t'))out.push(['t','time']);if(f.includes('u'))out.push(['u','initial velocity']);if(f.includes('a'))out.push(['a','acceleration']);if(f.includes('F'))out.push(['F','force']);if(f.includes('m'))out.push(['m','mass']);if(f.includes('I'))out.push(['I','current']);if(f.includes('R'))out.push(['R','resistance']);if(f.includes('V'))out.push(['V','potential difference']);return out.length?out:[['Formula','Use the relationship shown above'],['Units','Check SI units before calculation'],['Practice','Solve a related numerical problem']]}function challenge(btn,ok){document.getElementById('feedback').textContent=ok?'🎉 Correct! You are ready to complete this skill.':'🔄 Revise the formula once more before mastering it.';btn.className=ok?'correct':'wrong'}function searchFormula(){const q=document.getElementById('search').value.toLowerCase().trim();if(!q)return;const i=DATA[current].findIndex(x=>x.join(' ').toLowerCase().includes(q));if(i>=0){selected=i;render();openSkill(i)}else alert('No matching formula found in Class '+current+'.')}render();</script></body></html>
