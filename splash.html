<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6c2bff"><title>SkillUp</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fc;color:#172033}.splash{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,#d9ccff 0%,transparent 30%),linear-gradient(145deg,#f3efff,#f7f5ff 48%,#eafbf4)}.glow{position:absolute;width:300px;height:300px;border-radius:50%;background:#6c2bff22;filter:blur(70px);animation:pulse 2.5s ease-in-out infinite}.content{position:relative;z-index:2;width:min(420px,100%);animation:enter .7s ease-out}.brand-icon{width:92px;height:92px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#6c2bff,#3b82f6);border:1px solid #ffffffaa;box-shadow:0 18px 45px #6c2bff35;font-size:46px}.brand{font-size:40px;font-weight:950;letter-spacing:.4px;color:#172033}.brand span{color:#6c2bff}.tagline{margin-top:6px;color:#f0a900;font-size:8px;font-weight:950;letter-spacing:3px}.message{margin:25px auto 30px;max-width:300px;color:#667085;font-size:14px;line-height:1.5}.loader{width:190px;height:5px;margin:auto;border-radius:10px;background:#e4def4;overflow:hidden}.loader:before{content:"";display:block;width:42%;height:100%;background:linear-gradient(90deg,#6c2bff,#3b82f6);border-radius:10px;animation:load 1.25s ease-in-out infinite}.loading{margin-top:12px;color:#7a8596;font-size:9px;letter-spacing:1.5px;text-transform:uppercase}.footer{position:absolute;bottom:22px;left:0;right:0;color:#8b8fa055;font-size:9px;letter-spacing:1px}@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.12);opacity:1}}@keyframes load{0%{transform:translateX(-130%)}50%{transform:translateX(120%)}100%{transform:translateX(430%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="splash"><div class="glow"></div><section class="content"><div class="brand-icon">⚛️</div><div class="brand">SKILL<span>UP</span></div><div class="tagline">MASTER EVERY SUBJECT</div><p class="message" id="message">Checking your account…</p><div class="loader"></div><div class="loading" id="loading">Connecting to SkillUp</div></section><div class="footer">NEET • JEE • COMPETITIVE LEARNING</div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let redirected=false;function go(url){if(redirected)return;redirected=true;location.replace(url)}onAuthStateChanged(auth,async user=>{if(user){document.getElementById('message').textContent='Welcome back. Opening your SkillUp home…';document.getElementById('loading').textContent='Signed in';try{const snap=await getDoc(doc(db,'users',user.uid));const role=snap.exists()?snap.data().role:'student';setTimeout(()=>go(role==='teacher'?'teacher-dashboard.html':'student-dashboard.html'),700)}catch(e){setTimeout(()=>go('student-dashboard.html'),700)}}else{document.getElementById('message').textContent='Learn smarter. Practice daily. Build your skills.';document.getElementById('loading').textContent='Opening login';setTimeout(()=>go('login.html'),1600)}});setTimeout(()=>go('login.html'),5000);</script></body></html>
