<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a31">
<title>SkillUp</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#071a31;color:#fff}.splash{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 38%,#1687ff38,transparent 34%),linear-gradient(145deg,#071a31,#0d2a4c)}.glow{position:absolute;width:280px;height:280px;border-radius:50%;background:#1687ff20;filter:blur(65px);animation:pulse 2.5s ease-in-out infinite}.content{position:relative;z-index:2;width:min(420px,100%);animation:enter .7s ease-out}.brand-icon{width:92px;height:92px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#071a31,#0d3157);border:1px solid #385774;box-shadow:0 18px 45px #0005;font-size:46px}.brand{font-size:40px;font-weight:950;letter-spacing:.4px}.brand span{color:#1687ff}.tagline{margin-top:6px;color:#ffc21a;font-size:8px;font-weight:950;letter-spacing:3px}.message{margin:25px auto 30px;max-width:300px;color:#cbd5e1;font-size:14px;line-height:1.5}.loader{width:190px;height:4px;margin:auto;border-radius:10px;background:#ffffff18;overflow:hidden}.loader:before{content:"";display:block;width:42%;height:100%;background:#1687ff;border-radius:10px;animation:load 1.25s ease-in-out infinite}.loading{margin-top:12px;color:#94a3b8;font-size:9px;letter-spacing:1.5px;text-transform:uppercase}.footer{position:absolute;bottom:22px;left:0;right:0;color:#ffffff55;font-size:9px;letter-spacing:1px}@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.12);opacity:1}}@keyframes load{0%{transform:translateX(-130%)}50%{transform:translateX(120%)}100%{transform:translateX(430%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="splash"><div class="glow"></div><section class="content"><div class="brand-icon">⚛️</div><div class="brand">SKILL<span>UP</span></div><div class="tagline">MASTER EVERY SUBJECT</div><p class="message" id="message">Checking your account…</p><div class="loader"></div><div class="loading" id="loading">Connecting to SkillUp</div></section><div class="footer">NEET • JEE • COMPETITIVE LEARNING</div></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let redirected=false;
function go(url){if(redirected)return;redirected=true;location.replace(url)}
onAuthStateChanged(auth,async user=>{
  if(user){
    document.getElementById('message').textContent='Welcome back. Opening your SkillUp home…';
    document.getElementById('loading').textContent='Signed in';
    try{
      const snap=await getDoc(doc(db,'users',user.uid));
      const role=snap.exists()?snap.data().role:'student';
      setTimeout(()=>go(role==='teacher'?'teacher-dashboard.html':'student-dashboard.html'),700);
    }catch(e){setTimeout(()=>go('student-dashboard.html'),700)}
  }else{
    document.getElementById('message').textContent='Learn smarter. Practice daily. Build your skills.';
    document.getElementById('loading').textContent='Opening login';
    setTimeout(()=>go('login.html'),1600);
  }
});
setTimeout(()=>go('login.html'),5000);
</script>
</body>
</html>
