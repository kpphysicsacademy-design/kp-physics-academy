-width:620px;font-weight:800}@media(max-width:700px){.hero h1{font-size:30px}.path:before{left:20px;transform:none}.lesson,.lesson:nth-child(odd),.lesson:nth-child(even){justify-content:flex-start;padding-left:50px;padding-right:0;min-height:120px}.node{max-width:none}}</style></head><body><header class="top"><a href="jee-physics-path.html">← JEE Physics Path</a><a href="index.html">Home</a></header><main class="wrap"><section class="hero"><p>⚙️ JEE PHYSICS • MECHANICS • CONCEPT 7</p><h1>Newton's Laws <span>Zero → Hero</span></h1><p class="muted">MCQ → Correction → Retry wrong questions → Master → Next</p></section><div class="stats"><div class="stat">🔥 <b id="streak">0</b><br><small>Streak</small></div><div class="stat">⭐ <b id="xp">0</b><br><small>XP</small></div><div class="stat">🎯 <b>11</b><br><small>Sections</small></div><div class="stat">📚 <b id="count">0</b><br><small>Lessons</small></div></div><div class="mastery"><b>Newton's Laws Mastery</b><p id="progress" class="muted">Start from the foundation</p><div class="bar"><i id="bar"></i></div></div><div id="content"></div></main><script>const sections=[['🟢','01 • Force & Inertia',['Force: Basic Idea','Interaction and Force','Contact Forces','Non-Contact Forces','Net Force','Balanced Forces','Unbalanced Forces','Inertia','Inertia of Rest','Inertia of Motion','Inertia of Direction']],['🟢','02 • Newton’s First Law',['Statement of First Law','Inertial Frames','Non-Inertial Frames Introduction','Inertia and Mass','Equilibrium Condition','Static Equilibrium','Dynamic Equilibrium','Applications of First Law','Everyday Examples','Foundation MCQs']],['🔵','03 • Newton’s Second Law',['Momentum','Rate of Change of Momentum','Newton’s Second Law','F = ma','Force from Momentum','Variable Mass Introduction','Impulse','Force-Time Graph','Impulse-Momentum Relation','Average Force','Second Law Numericals']],['🔵','04 • Newton’s Third Law',['Action and Reaction','Statement of Third Law','Equal and Opposite Forces','Different Bodies Principle','Normal Force Pairs','Tension and Reaction Pairs','Walking','Swimming','Recoil','Collision Force Pairs','Third Law Numericals']],['🟡','05 • Free Body Diagrams',['What is an FBD?','System Selection','Isolating a Body','Weight','Normal Reaction','Tension','Friction Force','Applied Force','Pseudo Force Introduction','Drawing Correct FBDs','FBD Practice Problems']],['🟡','06 • Equilibrium & Applications',['Translational Equilibrium','Two-Force Equilibrium','Three-Force Equilibrium','Lami’s Theorem','Connected Bodies','Tension in Strings','Massless String','Ideal Pulley','Multiple Force Systems','Equilibrium Numericals']],['🟠','07 • Friction with Newton’s Laws',['Static Friction','Limiting Friction','Kinetic Friction','Coefficient of Friction','Angle of Friction','Angle of Repose','Friction on Horizontal Surface','Friction on Inclined Plane','Connected Blocks with Friction','Variable Friction Problems','Advanced Friction Problems']],['🟠','08 • Pulley & Connected Systems',['Single Pulley','Fixed Pulley','Movable Pulley','Atwood Machine','Two-Block Systems','Three-Block Systems','Inclined Connected Blocks','Pulley with Friction','Acceleration of Connected Bodies','Tension in Connected Systems','Advanced Pulley Problems']],['🔴','09 • Inclined Planes & Advanced Dynamics',['Forces on Inclined Plane','Components of Weight','Smooth Incline','Rough Incline','Block Against Wall','Wedge Introduction','Wedge and Block','Multiple Inclines','Constraint-Based Dynamics','JEE Main Mixed Problems','JEE Advanced Dynamics']],['🔴','10 • Non-Inertial Frames & Pseudo Force',['Accelerated Frames','Pseudo Force','Pseudo Force Direction','Lift and Elevator','Accelerating Wedge','Accelerating Vehicle','Effective Gravity','Pendulum in Accelerating Frame','Block in Accelerating Frame','Advanced Non-Inertial Problems']],['🏆','11 • Final Mastery',['First Law Test','Second Law Test','Third Law Test','Momentum & Impulse Test','FBD Test','Equilibrium Test','Friction Test','Pulley Test','Inclined Plane Test','Mixed JEE Main Test','JEE Advanced Challenge','Wrong-Question Revision','Final Unseen Test',"Newton's Laws Mastered"]]];const lessons=[];sections.forEach(s=>s[2].forEach(name=>lessons.push({name,section:s[1]})));let completed=Math.max(0,Math.min(lessons.length,Number(localStorage.getItem('kp_newton_completed')||0)));function render(){let n=0,out='';sections.forEach((s,si)=>{out+=`<section class="section"><h2>${s[0]} ${s[1]}</h2><p class="muted">${s[2].length} lessons • Zero → Hero</p><div class="path">`;s[2].forEach(name=>{const i=n++,done=i<completed,current=i===completed;const href='newtons-laws-lesson.html?id='+i;out+=`<div class="lesson"><div class="node ${done?'done':''}"><h3>${done?'🏆 ':current?'⭐ ':s[0]+' '}${i+1}. ${name}</h3><p>${s[1]} • 5 MCQs per task</p><span class="tag">${done?'MASTERED':'UNLOCKED'}</span><a class="btn" href="${href}">${done?'Review':'Start Task →'}</a></div></div>`});out+='</div>';if(si<sections.length-1)out+='<div class="checkpoint">🏆 Section checkpoint — every wrong question must be answered correctly before mastery.</div>';out+='</section>'});document.getElementById('content').innerHTML=out;document.getElementById('count').textContent=lessons.length;document.getElementById('progress').textContent=`${completed} of ${lessons.length} lessons mastered • All lessons unlocked`;document.getElementById('bar').style.width=Math.round(completed/lessons.length*100)+'%';document.getElementById('xp').textContent=completed*10;document.getElementById('streak').textContent=localStorage.getItem('kp_streak')||0}render();</script></body></html>
