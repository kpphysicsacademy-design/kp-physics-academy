<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Protista & Fungi Test</title><style>:root{--g:#58cc02;--gd:#46a302;--ink:#3c3c3c;--line:#e5e5e5;--red:#ff4b4b}*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:var(--ink)}main{max-width:720px;margin:auto;padding:18px 14px 50px}.hero,.quiz{background:#fff;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:20px;padding:20px;margin:14px 0}.hero{text-align:center}.mascot{font-size:50px}.badge{background:#eaf8df;color:#46a302;border-radius:14px;padding:10px;font-weight:900;margin-top:12px}.progress{height:14px;background:#e5e5e5;border-radius:20px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;width:0;background:var(--g);transition:.2s}.opts{display:grid;gap:12px;margin-top:18px}.opts button{background:#fff;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:15px;padding:15px;text-align:left;font-weight:800;cursor:pointer}.opts button:disabled{cursor:default}.correct{border-color:var(--g)!important;background:#f1ffe8!important}.wrong{border-color:var(--red)!important;background:#fff0f0!important}.feedback{margin-top:15px;padding:14px;border-radius:14px;background:#f4fbef;line-height:1.5;font-weight:700}.next{width:100%;margin-top:12px;background:var(--g);color:#fff;border:0;border-bottom:4px solid var(--gd);border-radius:12px;padding:12px;font-weight:900;cursor:pointer}.review{text-align:left;margin-top:18px}.review div{background:#fff7f7;border:2px solid #ffd5d5;border-radius:14px;padding:12px;margin:8px 0}@media(max-width:520px){h1{font-size:23px}.opts button{padding:13px}}.home{position:fixed;top:12px;left:12px;background:#fff;border:2px solid var(--line);border-bottom:5px solid #ddd;border-radius:14px;padding:8px;text-decoration:none;font-size:20px}</style></head><body><a class="home" href="botany-full-path.html" aria-label="Botany Path">🌿</a><main id="app"></main><script>const questions=[
['Protista includes organisms that are mainly:',['Unicellular eukaryotes','Multicellular prokaryotes','Acellular particles','Only filamentous fungi'],0,'Protists are predominantly unicellular eukaryotes, although some forms are colonial or multicellular-like.'],
['Which group is included in Kingdom Protista?',['Euglenoids','Mosses','Gymnosperms','Lichens'],0,'Euglenoids are protists. Mosses and gymnosperms are plants, while lichens are symbiotic associations.'],
['Chrysophytes commonly occur in:',['Freshwater and marine environments','Only dry deserts','Only tree bark','Only animal tissues'],0,'Chrysophytes such as diatoms occur in freshwater and marine habitats and are important aquatic producers.'],
['The cell wall of diatoms is chiefly made of:',['Silica','Chitin','Cellulose only','Peptidoglycan'],0,'Diatom walls contain silica and form the characteristic two-part frustule.'],
['Red tides are commonly associated with:',['Dinoflagellates','Bryophytes','Mosses','Ferns'],0,'Some dinoflagellates multiply rapidly and produce red tides in marine water.'],
['Euglenoids differ from typical plant cells because they possess:',['A protein-rich pellicle instead of a cell wall','Chitinous walls','No nucleus','Peptidoglycan walls'],0,'Euglenoids have a flexible protein-rich pellicle rather than a conventional cellulose cell wall.'],
['Slime moulds are characterized by:',['Saprophytic nutrition during feeding','Seed formation','Flowers','Vascular tissue'],0,'Slime moulds feed saprophytically on decaying organic matter and can form fruiting bodies during reproduction.'],
['Protozoans are generally:',['Heterotrophic unicellular protists','Multicellular plants','Photosynthetic fungi','Seed-producing organisms'],0,'Protozoans are heterotrophic unicellular protists and include forms such as Amoeba and Paramecium.'],
['Fungi are primarily:',['Heterotrophic absorptive organisms','Autotrophic vascular plants','Photosynthetic prokaryotes','Ingestive animals'],0,'Fungi obtain nutrients by absorption after secreting digestive enzymes onto their food source.'],
['The fungal cell wall is mainly composed of:',['Chitin','Silica','Peptidoglycan','Lignin only'],0,'Chitin is a major structural component of fungal cell walls.'],
['The body of a typical fungus consists of thread-like structures called:',['Hyphae','Rhizoids only','Stomata','Tracheids'],0,'Hyphae are thread-like fungal filaments; a mass of hyphae forms the mycelium.'],
['A mass of interconnected fungal hyphae is called:',['Mycelium','Protonema','Thallus of algae','Prothallus'],0,'The mycelium is the network or mass formed by interconnected fungal hyphae.'],
['Yeast commonly reproduces asexually by:',['Budding','Binary fission only','Fragmentation of leaves','Seeds'],0,'Yeast commonly reproduces asexually by budding, in which a daughter cell develops as an outgrowth.'],
['Rhizopus commonly produces asexual spores inside:',['Sporangia','Anthers','Archegonia','Ovaries'],0,'Rhizopus forms sporangia in which numerous asexual spores are produced.'],
['Which fungal group includes Agaricus?',['Basidiomycetes','Bryophytes','Pteridophytes','Dinoflagellates'],0,'Agaricus, the common mushroom, is a basidiomycete.'],
['Sexual spores of Ascomycetes are called:',['Ascospores','Basidiospores','Zoospores only','Conidia only'],0,'Ascomycetes produce sexual spores called ascospores, typically inside asci.'],
['Sexual spores of Basidiomycetes are called:',['Basidiospores','Ascospores','Oospores only','Zygospores only'],0,'Basidiospores are produced externally on basidia in basidiomycetes.'],
['Deuteromycetes were traditionally called:',['Fungi imperfecti','Algae imperfecti','Seedless plants','Protist algae'],0,'Deuteromycetes were called fungi imperfecti because only their asexual or imperfect stage was known.'],
['Lichens represent a symbiotic association between:',['Alga and fungus','Bacterium and moss','Fungus and fern','Protozoan and alga only'],0,'A lichen is a mutualistic association in which the photosynthetic partner provides organic nutrients and the fungus provides protection and support.'],
['Mycorrhiza is an association between:',['Fungus and plant roots','Alga and animal tissue','Bacterium and flower','Protozoan and seed'],0,'Mycorrhiza is a mutualistic association between fungal hyphae and plant roots that can improve mineral and water absorption.']
];let i=0,score=0,wrong=[];const app=document.getElementById('app');function render(){const q=questions[i];app.innerHTML='<section class="hero"><div class="mascot">🍄</div><h1>Protista & Fungi</h1><div class="badge">🌿 NEET BOTANY • CONCEPT PRACTICE</div><div class="progress"><span style="width:'+((i)/questions.length*100)+'%"></span></div><b>Question '+(i+1)+' / '+questions.length+'</b></section><section class="quiz"><h2>'+q[0]+'</h2><div class="opts">'+q[1].map((o,n)=>'<button data-i="'+n+'">'+String.fromCharCode(65+n)+'. '+o+'</button>').join('')+'</div><div id="fb"></div><button class="next" id="next" style="display:none">CONTINUE →</button></section>';document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>answer(+b.dataset.i));document.getElementById('next').onclick=()=>{i++;i<questions.length?render():finish()}}function answer(choice){const q=questions[i],buttons=[...document.querySelectorAll('.opts button')];buttons.forEach(b=>{b.disabled=true;if(+b.dataset.i===q[2])b.classList.add('correct')});const fb=document.getElementById('fb');if(choice===q[2]){score++;fb.innerHTML='🎉 <b>Correct!</b><br>💡 '+q[3]}else{buttons.find(b=>+b.dataset.i===choice).classList.add('wrong');wrong.push({q:q[0],answer:q[1][q[2]]});fb.innerHTML='💡 <b>Learn:</b> '+q[3]}document.getElementById('next').style.display='block'}function finish(){app.innerHTML='<section class="hero"><div class="mascot">🏆</div><h1>Skill Complete!</h1><p><b>'+score+' / '+questions.length+'</b> correct</p><div class="badge">⭐ Botany mastery progress updated by this practice session.</div>'+(wrong.length?'<div class="review"><h3>REVIEW MISSED QUESTIONS</h3>'+wrong.map(x=>'<div><b>'+x.q+'</b><br>Correct: '+x.answer+'</div>').join('')+'</div>':'<p>🌟 Perfect round!</p>')+'<button class="next" onclick="i=0;score=0;wrong=[];render()">TRY AGAIN</button><a class="next" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="botany-full-path.html">BACK TO BOTANY PATH</a></section>'}render();</script></main></body></html>
