gy',['Multiple Potential Fields','Gravitational + Elastic PE','Effective Potential','Equilibrium Analysis','Turning Point Analysis','Energy Diagrams','Advanced Graph Problems','JEE Advanced Applications']],['🔴','09 • JEE Main & Advanced',['Conceptual PE Problems','Calculation Problems','Graph-Based Problems','Gravity PE Problems','Spring PE Problems','Conservation Problems','Mixed Mechanics Problems','JEE Main Test','JEE Advanced Challenge']],['🏆','10 • Final Mastery',['Foundation Test','Gravitational PE Test','Elastic PE Test','Potential Curve Test','Conservative Force Test','Energy Conservation Test','Mixed Application Test','Wrong-Question Revision','Final Unseen Mastery']]];let n=0,out='';sections.forEach(s=>{out+=`<section class="section"><h2>${s[0]} ${s[1]}</h2><p class="muted">${s[2].length} lessons • 5 MCQs per task</p><div class="path">`;s[2].forEach(x=>{const i=n++;out+=`<div class="lesson"><div class="card"><h3>${i+1}. ${x}</h3><p>${s[1]} • Zero → Hero</p><span class="tag">🔓 UNLOCKED</span><a class="btn" href="jee-physics-lesson-shuffled.html?topic=potential-energy&lesson=${i+1}">Start Task →</a></div></div>`});out+='</div></section>'});document.getElementById('content').innerHTML=out;</script></main></body></html>
