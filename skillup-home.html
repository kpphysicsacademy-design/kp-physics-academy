<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | NEET Preparation</title><link rel="stylesheet" href="common.css"><style>
.home-hero{position:relative;overflow:hidden;text-align:center;padding:34px 22px 28px;border-radius:28px;background:linear-gradient(135deg,#071a31 0%,#123a66 58%,#0b6b78 100%);color:#fff;box-shadow:0 14px 36px rgba(7,26,49,.18)}.home-hero:before,.home-hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.home-hero:before{width:180px;height:180px;right:-70px;top:-75px;background:rgba(88,204,2,.18)}.home-hero:after{width:130px;height:130px;left:-55px;bottom:-65px;background:rgba(25,200,255,.18)}.home-hero>*{position:relative;z-index:1}.home-hero .eyebrow{letter-spacing:2px;font-weight:800;font-size:12px;opacity:.85}.home-hero h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin:12px 0 14px;font-weight:900}.home-hero h1 span{background:linear-gradient(90deg,#58cc02,#ffc800,#19c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}.home-hero p{max-width:620px;margin:0 auto;font-size:15px;line-height:1.55;color:rgba(255,255,255,.88)}.label{text-align:center;margin:28px 0 14px;font-weight:900;letter-spacing:1.5px;color:#526070}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:900px;margin:0 auto 28px}.subject{position:relative;display:flex;align-items:center;gap:15px;min-height:104px;padding:18px;border-radius:22px;background:#fff;border:2px solid #e5ebf2;box-shadow:0 8px 22px rgba(23,32,51,.07);text-decoration:none;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.subject:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(23,32,51,.12)}.subject .icon{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;font-size:30px;flex:0 0 auto}.subject .name{display:block;font-size:21px;font-weight:900;color:#172033}.subject .desc{display:block;margin-top:4px;font-size:12px;color:#667085}.subject .arrow{margin-left:auto;font-size:28px;font-weight:300;color:#98a2b3}.subject.physics{border-color:#b9dcff}.subject.physics .icon{background:#e7f3ff}.subject.chemistry{border-color:#d9c8ff}.subject.chemistry .icon{background:#f0eaff}.subject.botany{border-color:#bde9b0}.subject.botany .icon{background:#e9f8e4}.subject.zoology{border-color:#b9e9ed}.subject.zoology .icon{background:#e6f9fa}
.neet-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid #e7ebf2;box-shadow:0 -6px 22px rgba(23,32,51,.08);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:9999;padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px));box-sizing:border-box}.neet-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#667085;font-size:10px;font-weight:900;line-height:1;min-width:0;height:52px;border-radius:14px}.neet-nav a.active{color:#16a34a;background:#eaf8e6}.neet-nav .nav-icon{display:none}.neet-nav .nav-label{white-space:nowrap}.page-space{height:82px}@media(max-width:650px){.home-hero{padding:28px 16px 24px;border-radius:22px}.home-hero h1{font-size:34px}.home-hero p{font-size:14px}.grid{grid-template-columns:1fr;gap:12px}.subject{min-height:88px;padding:14px}.subject .icon{width:50px;height:50px;font-size:26px;border-radius:15px}.subject .name{font-size:19px}.neet-nav{height:64px}.neet-nav a{font-size:9px;height:50px;border-radius:12px}}
</style></head><body><header class="top"><a class="home-brand" href="skillup-home.html" aria-label="SkillUp Home"><span class="home-brand-rocket" aria-hidden="true">🚀</span><span class="home-brand-copy"><strong>SkillUp</strong><small>LEARN • PRACTICE • MASTER</small></span></a></header><main class="wrap"><section class="hero home-hero"><div class="eyebrow">NEET LEARNING JOURNEY</div><h1>Dream big.<br><span>Learn smart. Achieve more.</span></h1><p>Master every concept. Practice with purpose. Build the confidence to reach your NEET goal.</p></section><div class="label">CHOOSE YOUR NEET SUBJECT</div><section id="grid" class="grid"></section><div class="page-space" aria-hidden="true"></div></main><nav class="neet-nav" aria-label="SkillUp NEET navigation"><a href="skillup-home.html" class="active"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a><a href="learn.html"><span class="nav-icon">📚</span><span class="nav-label">Learn</span></a><a href="practice.html"><span class="nav-icon">🎯</span><span class="nav-label">Practice</span></a><a href="compete.html"><span class="nav-icon">🏆</span><span class="nav-label">League</span></a><a href="profile.html"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a></nav><script>const items=[['⚡','physics','Physics','full-physics-path.html'],['🧪','chemistry','Chemistry','chemistry-skillup-path.html'],['🌿','botany','Botany','botany-full-path.html'],['🦋','zoology','Zoology','zoology-full-path.html']];const grid=document.getElementById('grid');grid.innerHTML=items.map(([i,k,n,u])=>`<a class="subject ${k}" href="${u}"><span class="icon">${i}</span><span><span class="name">${n}</span><span class="desc">Learn → Practice → Master</span></span><span class="arrow">›</span></a>`).join('');</script></body></html>
