ition:relative;min-height:112px;display:flex;align-items:center}.node.left{justify-content:flex-start;padding-right:54%}.node.right{justify-content:flex-end;padding-left:54%}.node-card{width:100%;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 #1720330a;position:relative;z-index:2;transition:.18s;cursor:pointer}.node-card:hover{transform:translateY(-3px);box-shadow:0 8px 18px #17203316}.node.left .node-card:after,.node.right .node-card:after{content:"";position:absolute;top:50%;width:14px;height:14px;background:#fff;z-index:-1}.node.left .node-card:after{right:-9px;border-top:2px solid var(--line);border-right:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}.node.right .node-card:after{left:-9px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}.node-dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:#fff;background:var(--locked);border:5px solid var(--bg);box-shadow:0 5px 0 #929ba5;z-index:4}.node.done .node-dot{background:var(--green);box-shadow:0 5px 0 var(--gd)}.node.current .node-dot{background:var(--blue);box-shadow:0 5px 0 #126fcf}.node.current .node-card{border-color:var(--blue);box-shadow:0 5px 0 #1687ff38}.node.done .node-card{border-color:#9be56c}.node.locked .node-card{opacity:.72;cursor:not-allowed}.node.locked .node-card:hover{transform:none;box-shadow:0 4px 0 #1720330a}.node-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.node h3{font-size:14px;margin:0}.node p{font-size:10px;color:var(--muted);line-height:1.4;margin:4px 0 0}.xp{display:inline-block;margin-top:7px;font-size:9px;font-weight:950;color:#b87900}.status{float:right;margin-top:7px;font-size:8px;font-weight:950;color:var(--muted)}.current .status{color:var(--blue)}.done .status{color:var(--gd)}.continue{display:block;margin-top:8px;text-align:center;background:var(--blue);color:#fff;border-radius:10px;padding:7px;font-size:9px;font-weight:950;box-shadow:0 3px 0 #126fcf;text-decoration:none}.checkpoint{position:relative;z-index:6;width:min(430px,90%);margin:22px auto 5px;background:linear-gradient(135deg,#fff9d8,#fff);border:3px solid #f0c84b;border-radius:24px;text-align:center;padding:18px;box-shadow:0 6px 0 #e7c95f,0 10px 25px #f0c84b26}.checkpoint .cup{font-size:39px}.checkpoint h3{margin:4px 0;font-size:17px}.checkpoint p{margin:0 auto;color:var(--muted);font-size:10px;line-height:1.45;max-width:340px}.exam-btn{display:inline-block;margin-top:12px;background:#ff9600;color:#fff;border:0;border-radius:12px;padding:10px 18px;font-size:10px;font-weight:950;box-shadow:0 4px 0 #d97800;cursor:pointer;text-decoration:none}.arena{text-align:center;padding:8px 0 25px}.arena h2{font-size:17px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:800px;margin:auto}.choice{color:#fff;border-radius:14px;padding:13px 8px;font-size:9px;font-weight:950;box-shadow:0 6px 15px #0002;transition:.2s;text-decoration:none}.choice:hover{transform:translateY(-4px)}.jee{background:linear-gradient(135deg,#7351d8,#9a78ef)}.neet{background:linear-gradient(135deg,#e94d8a,#f579aa)}.challenge{background:linear-gradient(135deg,#e65a39,#b93642)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(920px,100%);height:58px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -5px 18px #17203312;display:flex;z-index:60}.nav a{flex:1;text-align:center;color:var(--muted);font-size:9px;font-weight:900;text-decoration:none;padding-top:7px}.nav span{display:block;font-size:20px;margin-bottom:2px}.nav .active{color:var(--gd)}.modal{display:none;position:fixed;inset:0;background:#071a3177;place-items:center;z-index:100;padding:18px}.modal.show{display:grid}.box{width:min(430px,100%);background:#fff;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0003}.box h2{margin:0;font-size:18px}.box p{font-size:10px;color:var(--muted);line-height:1.5}.reward{font-size:9px;color:#b87900;font-weight:950}.actions{display:flex;gap:7px;margin-top:14px}.actions button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:950;cursor:pointer}.close{background:#eeeaf3}.complete{background:var(--blue);color:#fff}.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;font-size:10px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;z-index:110}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:720px){.top{height:68px;padding:6px 11px}.atom{font-size:30px}.brand b{font-size:17px}.stats .pill:last-child{display:none}.wrap{padding:9px 10px 100px}.legend{gap:9px;font-size:8px;margin-bottom:18px}.class-head{padding:12px}.class-head h2{font-size:15px}.class-head p{font-size:9px}.path:before{left:29px}.node,.node.left,.node.right{justify-content:flex-start;padding:0 0 0 70px;min-height:120px}.node-dot{left:29px;width:50px;height:50px;font-size:22px}.node.left .node-card:after,.node.right .node-card:after{left:-9px;right:auto;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-top:0;border-right:0;transform:translateY(-50%) rotate(45deg)}.node h3{font-size:13px}.node p{font-size:9px}.checkpoint{width:94%;padding:15px}.checkpoint h3{font-size:15px}.exam-btn{width:92%}.choices{grid-template-columns:1fr}.nav{height:52px}.nav span{font-size:18px}}

<div class="toast" id="toast"></div>
<script>
const groups=[
['🟢','Class 6–8','Chemistry foundation',[['🧊','Matter Around Us','States and properties of matter',20],['🔬','Separation of Substances','Mixtures and separation methods',25],['⚛️','Atoms & Molecules','Early atomic ideas and symbols',30],['🧪','Changes Around Us','Physical and chemical changes',30],['🔥','Combustion & Flame','Fuel, ignition and combustion',35]]],
['🟡','Class 9–10','Core Chemistry',[['⚛️','Matter in Our Surroundings','Particles, states and changes',35],['🧮','Atoms & Molecules','Laws, formulae and mole foundations',35],['🔭','Structure of the Atom','Atomic models and electronic structure',40],['🧪','Chemical Reactions','Equations, types and balancing',40],['🧂','Acids, Bases & Salts','pH, indicators and neutralisation',45],['🔩','Metals & Non-metals','Properties, reactions and extraction',45],['💎','Carbon Compounds','Hydrocarbons and functional groups',50],['📊','Periodic Classification','Groups, periods and trends',50]]],
['🔵','Class 11','NCERT Chemistry • competitive foundation',[['🧮','Some Basic Concepts','Mole concept and stoichiometry',50],['⚛️','Structure of Atom','Quantum numbers and electronic configuration',50],['📊','Periodic Classification','Periodic trends and modern periodic table',50],['🔗','Chemical Bonding','Ionic, covalent and molecular structure',55],['🌡️','Thermodynamics','Enthalpy, entropy and Gibbs energy',60],['⚖️','Equilibrium','Chemical and ionic equilibrium',60],['⚡','Redox Reactions','Oxidation numbers and balancing',55],['🧪','Organic Chemistry Basics','GOC, nomenclature and isomerism',60],['⛽','Hydrocarbons','Alkanes, alkenes, alkynes and aromatic chemistry',60]]],
['🔴','Class 12','NCERT Chemistry • examination core',[['💧','Solutions','Concentration and colligative properties',65],['🔋','Electrochemistry','Cells, Nernst equation and conductivity',65],['⏱️','Chemical Kinetics','Rate laws and Arrhenius equation',65],['🧲','Coordination Compounds','Ligands, bonding and isomerism',70],['🔩','d- & f-Block Elements','Transition chemistry and trends',60],['🧪','Haloalkanes & Haloarenes','Preparation, reactions and mechanisms',65],['🍶','Alcohols, Phenols & Ethers','Preparation and reactions',65],['🍋','Aldehydes, Ketones & Acids','Carbonyl chemistry',70],['🧬','Amines & Biomolecules','Nitrogen compounds and biomolecules',70]]]
];
const key='skillupChemistryProgress';let s=JSON.parse(localStorage.getItem(key)||'{"done":[],"xp":0,"streak":0}');let all=[];groups.forEach(g=>g[3].forEach(n=>all.push(n)));const path=document.getElementById('path');
function lessonHref(i){const n=all[i][1].toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const map={'matter-around-us':'question-bank.html?subject=chemistry&topic=matter','separation-of-substances':'question-bank.html?subject=chemistry&topic=separation','atoms-molecules':'question-bank.html?subject=chemistry&topic=atoms','changes-around-us':'question-bank.html?subject=chemistry&topic=changes','combustion-flame':'question-bank.html?subject=chemistry&topic=combustion'};return map[n]||'question-bank.html?subject=chemistry'}
function build(){path.innerHTML='';groups.forEach((g,gi)=>{const sec=document.createElement('section');sec.className='section';sec.innerHTML=`<div class="class-head"><span class="emoji">${g[0]}</span><div class="text"><h2>${g[1]}</h2><p>${g[2]}</p></div><span class="count" id="count-${gi}">0/${g[3].length}</span></div><div class="path"></div><div class="checkpoint"><div class="cup">🏆</div><h3>${g[1]} MASTERY EXAM</h3><p>Complete this stage and prove your Chemistry mastery before moving forward.</p><a class="exam-btn" href="question-bank.html?subject=chemistry&mode=checkpoint">START MASTERY EXAM →</a></div>`;const p=sec.querySelector('.path');g[3].forEach((n,local)=>{const i=groups.slice(0,gi).reduce((a,x)=>a+x[3].length,0)+local;const done=s.done.includes(i),unlocked=i===0||s.done.includes(i-1);const side=local%2===0?'left':'right';const el=document.createElement('div');el.className=`node ${side} ${done?'done':unlocked?'current':'locked'}`;el.innerHTML=`<div class="node-card"><div class="node-top"><h3>${n[0]} ${n[1]}</h3><span class="status">${done?'MASTERED':unlocked?'RESUME HERE':'LOCKED'}</span></div><p>${n[2]}</p><span class="xp">⭐ +${n[3]} XP</span>${unlocked&&!done?`<a class="continue" href="${lessonHref(i)}">CONTINUE THIS TASK →</a>`:''}</div><div class="node-dot">${done?'✓':unlocked?n[0]:'🔒'}</div>`;if(unlocked&&!done){el.querySelector('.node-card').addEventListener('click',e=>{if(e.target.tagName==='A')return;openM(i)})}p.appendChild(el)});path.appendChild(sec)});render()}
function render(){document.getElementById('xp').textContent=s.xp||0;document.getElementById('streak').textContent=s.streak||0;groups.forEach((g,gi)=>{const start=groups.slice(0,gi).reduce((a,x)=>a+x[3].length,0);document.getElementById('count-'+gi).textContent=`${g[3].filter((_,i)=>s.done.includes(start+i)).length}/${g[3].length}`})}
let selected=-1;function openM(i){selected=i;const n=all[i];document.getElementById('mt').textContent=n[1];document.getElementById('md').textContent=n[2]+' Complete the lesson and unlock the next Chemistry skill.';document.getElementById('mr').textContent='⭐ Reward: +'+n[3]+' XP';document.getElementById('complete').onclick=()=>{if(!s.done.includes(i)){s.done.push(i);s.xp=(s.xp||0)+n[3];s.streak=s.streak||1;localStorage.setItem(key,JSON.stringify(s));toast('Skill completed! Next Chemistry skill unlocked. 🎉')}closeM();build()};document.getElementById('modal').classList.add('show')}
function closeM(){document.getElementById('modal').classList.remove('show')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
build();
</script>
