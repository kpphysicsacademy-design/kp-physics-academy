<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kingdom Monera | NEET Botany</title><link rel="stylesheet" href="skillup-mastery.css"><style>body{margin:0}.su-header{text-align:center;margin-bottom:14px}.su-tag{display:inline-block;background:#e8f8e9;color:#16853b;border-radius:999px;padding:7px 11px;font:900 10px Arial}.su-title{font:900 28px Arial;margin:10px 0 5px}.su-sub{font:13px Arial;color:#64746d}.su-feedback{margin-top:12px;padding:14px;border-radius:14px;line-height:1.5;font:13px Arial}.su-correct{background:#eef9ee;border:1px solid #9bdc7d}.su-wrong{background:#fff0f0;border:1px solid #efb1b1}.su-next{width:100%;padding:14px;border:0;border-radius:14px;background:#18a64a;color:#fff;font-weight:900;font-size:14px;margin-top:12px}.su-summary{margin-top:14px}.su-option:disabled{cursor:default}</style></head><body><main class="su-practice"><section class="su-card su-header"><div style="font-size:42px">🦠</div><span class="su-tag">NEET BOTANY • KINGDOM MONERA</span><div class="su-title">Kingdom Monera</div><div class="su-sub">30 concept-based MCQs • 10 subconcepts • mastery review</div></section><section class="su-card"><div id="concept" style="font-weight:900;color:#16853b;margin-bottom:8px"></div><div id="count" style="font:900 11px Arial;color:#64746d;margin-bottom:8px"></div><div class="su-progress"><i id="progress"></i></div></section><section class="su-card" id="quiz"></section><section class="su-card su-summary hidden" id="summary"></section></main><script src="skillup-mastery.js"></script><script>
const questions=[
{skill:'General Characteristics of Monera',question:'Which feature is common to organisms placed in Kingdom Monera?',options:['Prokaryotic cellular organisation','Membrane-bound nucleus','Multicellular body','Chitinous cell wall'],correctIndex:0,explanation:'Monerans are prokaryotes, so their cells lack a membrane-bound nucleus and other membrane-bound organelles.'},
{skill:'General Characteristics of Monera',question:'Which structure is absent in a typical bacterial cell?',options:['Membrane-bound nucleus','Plasma membrane','Ribosomes','Cytoplasm'],correctIndex:0,explanation:'Bacterial cells have a nucleoid rather than a membrane-bound nucleus; plasma membrane, cytoplasm and ribosomes are present.'},
{skill:'General Characteristics of Monera',question:'Monerans may obtain nutrition by:',options:['Autotrophic as well as heterotrophic modes','Photosynthesis only','Ingestion only','Absorption only'],correctIndex:0,explanation:'Monerans show nutritional diversity. They include photosynthetic and chemosynthetic autotrophs as well as many heterotrophic bacteria.'},
{skill:'General Characteristics of Monera',question:'Which statement correctly describes bacterial genetic material?',options:['It is mainly present in a nucleoid region','It is enclosed by a nuclear envelope','It is present only inside mitochondria','It is absent from the cell'],correctIndex:0,explanation:'The bacterial chromosome is located in the nucleoid, an irregular region not surrounded by a nuclear membrane.'},
{skill:'Cell Structure of Bacteria',question:'The bacterial cell wall is generally made of:',options:['Peptidoglycan','Cellulose','Chitin','Silica'],correctIndex:0,explanation:'Eubacterial cell walls commonly contain peptidoglycan, also called murein.'},
{skill:'Cell Structure of Bacteria',question:'Which structure is responsible for bacterial motility in many species?',options:['Flagellum','Chloroplast','Cilium','Pseudopodium'],correctIndex:0,explanation:'Many motile bacteria move using flagella, which are proteinaceous appendages distinct from eukaryotic cilia.'},
{skill:'Cell Structure of Bacteria',question:'A bacterial capsule mainly helps in:',options:['Protection and adhesion','Photosynthesis in chloroplasts','Nuclear division','Formation of flowers'],correctIndex:0,explanation:'A capsule or slime layer can protect bacteria from environmental stresses and help them adhere to surfaces.'},
{skill:'Cell Structure of Bacteria',question:'Which structure is NOT a membrane-bound organelle in bacteria?',options:['Ribosome','Mitochondrion','Chloroplast','Golgi apparatus'],correctIndex:0,explanation:'Bacteria lack membrane-bound organelles. Ribosomes are present but are non-membranous structures involved in protein synthesis.'},
{skill:'Archaebacteria',question:'Which group is known for living in extreme environments?',options:['Archaebacteria','Flowering plants','Protozoans','Mammals'],correctIndex:0,explanation:'Archaebacteria include extremophiles adapted to habitats such as high salt, high temperature and anaerobic environments.'},
{skill:'Archaebacteria',question:'Methanogens are important because they:',options:['Produce methane under anaerobic conditions','Produce oxygen in chloroplasts','Cause red tides','Form fungal mycelia'],correctIndex:0,explanation:'Methanogens are anaerobic archaebacteria that generate methane during their metabolism and occur in habitats such as cattle rumen.'},
{skill:'Archaebacteria',question:'Halophiles are adapted to:',options:['Highly saline environments','Only freshwater ponds','Dry seeds only','Human blood only'],correctIndex:0,explanation:'Halophilic archaebacteria are adapted to environments with very high salt concentrations.'},
{skill:'Archaebacteria',question:'Archaebacterial cell walls differ from typical eubacterial walls because they:',options:['Lack the typical peptidoglycan composition of eubacteria','Always contain cellulose','Always contain chitin','Have no membrane'],correctIndex:0,explanation:'Archaebacterial cell envelopes are chemically distinctive and do not contain the typical peptidoglycan characteristic of eubacteria.'},
{skill:'Eubacteria',question:'Eubacteria are commonly described as:',options:['True bacteria with diverse nutritional modes','Unicellular eukaryotes','Multicellular fungi','Non-cellular viruses'],correctIndex:0,explanation:'Eubacteria are true bacteria and include autotrophic and heterotrophic forms with wide ecological diversity.'},
{skill:'Eubacteria',question:'Which organism is an example of a eubacterium?',options:['Escherichia coli','Amoeba','Agaricus','Paramecium'],correctIndex:0,explanation:'Escherichia coli is a typical eubacterium; Amoeba and Paramecium are protists and Agaricus is a fungus.'},
{skill:'Eubacteria',question:'Heterotrophic bacteria may function as:',options:['Decomposers, parasites or symbionts','Only predators','Only photosynthetic plants','Only methanogens'],correctIndex:0,explanation:'Heterotrophic bacteria obtain organic nutrients in several ways, including saprophytic, parasitic and symbiotic associations.'},
{skill:'Eubacteria',question:'Which bacterial group is traditionally associated with curd formation?',options:['Lactic acid bacteria','Methanogens','Dinoflagellates','Slime moulds'],correctIndex:0,explanation:'Lactic acid bacteria such as Lactobacillus convert sugars to lactic acid and are used in curd formation.'},
{skill:'Cyanobacteria',question:'Cyanobacteria are also called:',options:['Blue-green algae','Red algae','Brown algae','Golden algae'],correctIndex:0,explanation:'Cyanobacteria are historically called blue-green algae, but they are prokaryotic bacteria rather than true algae.'},
{skill:'Cyanobacteria',question:'Cyanobacteria perform oxygenic photosynthesis using:',options:['Chlorophyll a','Chlorophyll c only','Fucoxanthin only','No photosynthetic pigment'],correctIndex:0,explanation:'Cyanobacteria contain chlorophyll a and accessory pigments and carry out oxygen-releasing photosynthesis.'},
{skill:'Cyanobacteria',question:'Which cyanobacterium is associated with nitrogen fixation?',options:['Nostoc','Mycoplasma','Amoeba','Agaricus'],correctIndex:0,explanation:'Nostoc is a nitrogen-fixing cyanobacterium; specialized heterocysts provide a suitable environment for nitrogen fixation.'},
{skill:'Cyanobacteria',question:'Heterocysts in some cyanobacteria are specialised for:',options:['Nitrogen fixation','Cellular digestion','Sexual reproduction','Spore dispersal in fungi'],correctIndex:0,explanation:'Heterocysts are specialized cells in certain cyanobacteria that provide conditions suitable for nitrogen fixation.'},
{skill:'Chemosynthetic Bacteria',question:'Chemosynthetic autotrophic bacteria obtain energy by:',options:['Oxidising inorganic substances','Ingesting animals','Absorbing sunlight through chloroplasts','Digesting fungal hyphae'],correctIndex:0,explanation:'Chemosynthetic bacteria derive energy by oxidising inorganic substances such as ammonia, nitrites, hydrogen sulphide or ferrous ions.'},
{skill:'Chemosynthetic Bacteria',question:'Nitrifying bacteria obtain energy during oxidation of:',options:['Nitrogen-containing inorganic compounds','Cellulose only','Fats only','Chitin only'],correctIndex:0,explanation:'Nitrifying bacteria obtain energy by oxidising compounds such as ammonia or nitrites during nitrogen cycling.'},
{skill:'Chemosynthetic Bacteria',question:'Chemosynthetic bacteria are ecologically important because they:',options:['Contribute to biogeochemical cycles','Produce flowers','Form animal tissues','Carry out mitosis'],correctIndex:0,explanation:'Chemosynthetic bacteria participate in nutrient cycles, especially transformations involving nitrogen, sulphur, iron and other elements.'},
{skill:'Mycoplasma',question:'Mycoplasma is distinctive among bacteria because it:',options:['Lacks a cell wall','Has a chitinous wall','Has chloroplasts','Is multicellular'],correctIndex:0,explanation:'Mycoplasma lacks a cell wall, making its cell membrane flexible and allowing variable shapes.'},
{skill:'Mycoplasma',question:'Because Mycoplasma lacks a cell wall, it is generally:',options:['Pleomorphic','Always spherical','Always filamentous','Always rectangular'],correctIndex:0,explanation:'Without a rigid cell wall, Mycoplasma can assume variable forms, a condition called pleomorphism.'},
{skill:'Mycoplasma',question:'Mycoplasma belongs to:',options:['Kingdom Monera','Kingdom Fungi','Kingdom Plantae','Kingdom Animalia'],correctIndex:0,explanation:'Mycoplasma is a wall-less prokaryote and is traditionally placed in Kingdom Monera.'},
{skill:'Bacterial Reproduction',question:'The most common method of bacterial reproduction is:',options:['Binary fission','Meiosis','Budding with gametes','Fragmentation of a flower'],correctIndex:0,explanation:'Bacteria commonly reproduce asexually by binary fission, in which one cell divides into two daughter cells.'},
{skill:'Bacterial Reproduction',question:'Under favourable conditions, bacterial multiplication can be very rapid because bacteria:',options:['Reproduce by repeated binary fission','Form seeds','Perform fertilisation','Undergo meiosis'],correctIndex:0,explanation:'Rapid repeated binary fission allows bacterial populations to increase quickly when environmental conditions are favourable.'},
{skill:'Bacterial Reproduction',question:'Genetic exchange between bacteria can occur through:',options:['Processes such as conjugation','Formation of flowers','Meiosis in ovaries','Pollination'],correctIndex:0,explanation:'Bacteria can exchange genetic material through mechanisms such as conjugation, transformation and transduction; these are not forms of reproduction.'},
{skill:'Monera Identification and Applications',question:'Which pair is correctly matched?',options:['Nostoc — cyanobacterium','Amoeba — bacterium','Agaricus — cyanobacterium','Paramecium — mycoplasma'],correctIndex:0,explanation:'Nostoc is a cyanobacterium. Amoeba and Paramecium are protists, while Agaricus is a fungus.'},
{skill:'Monera Identification and Applications',question:'Which statement best distinguishes Monera from Protista?',options:['Monera are prokaryotic whereas Protista are eukaryotic','Monera are multicellular whereas Protista are always multicellular','Monera have chloroplasts whereas Protista never do','Monera have chitin walls whereas Protista have cellulose walls'],correctIndex:0,explanation:'The fundamental distinction in the five-kingdom system is cellular organisation: Monera are prokaryotic, while Protista are eukaryotic.'}
];
const concept=document.getElementById('concept'),count=document.getElementById('count'),bar=document.getElementById('progress'),quiz=document.getElementById('quiz'),summary=document.getElementById('summary');let practice;
function esc(v){return String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(q,s){concept.textContent=q.skill;count.textContent=`Question ${s.index+1} of ${s.queueLength} • Round ${s.round}`;bar.style.width=(s.mastered/s.total*100)+'%';quiz.innerHTML=`<div style="font:900 10px Arial;color:#64746d;margin-bottom:8px">CONCEPT</div><h2 style="font:900 20px Arial;line-height:1.4">${esc(q.question)}</h2><div id="opts"></div><div id="feedback"></div><button id="next" class="su-next" style="display:none">NEXT →</button>`;const o=document.getElementById('opts');q.options.forEach((v,i)=>{const b=document.createElement('button');b.className='su-option';b.textContent=String.fromCharCode(65+i)+'. '+v;b.onclick=()=>answer(i,b);o.appendChild(b)});}
function answer(i,b){const q=practice.current(),ok=practice.answer(i),bs=[...document.querySelectorAll('.su-option')];bs.forEach(x=>x.disabled=true);b.classList.add(ok?'su-correct':'su-wrong');if(!ok)bs[practice.correctIndex(q)].classList.add('su-correct');const f=document.getElementById('feedback');f.className='su-feedback '+(ok?'su-correct':'su-wrong');f.textContent=(ok?'✅ Correct. ':'❌ Incorrect. ')+q.explanation+(ok?'':' Correct answer: '+String.fromCharCode(65+practice.correctIndex(q))+'. '+q.options[practice.correctIndex(q)]);const n=document.getElementById('next');n.style.display='block';n.textContent='NEXT →';n.onclick=()=>practice.next();}
function complete(s){quiz.classList.add('hidden');summary.classList.remove('hidden');summary.innerHTML=`<h2>🦠 Kingdom Monera Complete</h2><p><strong>${s.mastery}% mastery</strong></p><div class="su-summary-grid"><div class="su-stat"><b>${s.mastered}/${s.total}</b><br>MASTERED</div><div class="su-stat"><b>${s.firstPassAccuracy}%</b><br>FIRST PASS</div><div class="su-stat"><b>${s.rounds}</b><br>REVIEW ROUNDS</div></div><p>Weak areas are identified from incorrect attempts. Review every missed question until all 30 are mastered.</p><button class="su-primary" onclick="location.reload()">PRACTICE AGAIN</button>`;bar.style.width='100%'}
practice=new SkillUpMasteryPractice({questions,onRender:render,onAnswer(){},onComplete:complete,skillFor:q=>q.skill});render(practice.current(),practice.state());
</script></body></html>
