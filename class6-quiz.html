<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class 6 Concept MCQs | KP Physics Academy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#0b1930}.wrap{max-width:900px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:15px}.top a{color:#1687ff;text-decoration:none;font-weight:700}h1{font-size:34px;margin:25px 0 8px}.sub{color:#68758a;margin-bottom:25px}.quiz{background:#fff;border:1px solid #dfe7f1;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #0b19300c}.q{font-size:18px;font-weight:700;line-height:1.5}.opt{display:block;width:100%;text-align:left;background:#f1f6ff;border:2px solid transparent;border-radius:10px;padding:13px;margin:10px 0;cursor:pointer;font-size:15px}.opt:hover{border-color:#1687ff}.opt.correct{background:#e6f7eb;border-color:#1e9b4b}.opt.wrong{background:#ffe7e7;border-color:#df3838}.explain{display:none;margin-top:14px;padding:14px;background:#f7faff;border-left:4px solid #1687ff;line-height:1.6}.status{font-weight:700;margin-top:10px}.empty{background:#fff;border-radius:14px;padding:24px;border:1px solid #dfe7f1;line-height:1.7}.back{display:inline-block;margin-top:20px;background:#031326;color:#fff;padding:11px 15px;border-radius:9px;text-decoration:none;font-weight:700}</style></head><body><main class="wrap"><div class="top"><a href="class6-notes.html">← Class 6</a><a href="question-bank.html">Full Question Bank →</a></div><h1 id="title">Concept MCQs</h1><p class="sub" id="subtitle">Loading questions...</p><div id="quiz"></div></main><script>
const PROJECT='kp-physics-academy';const params=new URLSearchParams(location.search);const chapter=params.get('chapter')||'';const topic=params.get('topic')||'';document.getElementById('title').textContent=topic||'Class 6 Physics MCQs';document.getElementById('subtitle').textContent=chapter?chapter+' • '+topic:'Class 6 concept practice';
const URL='https://firestore.googleapis.com/v1/projects/'+PROJECT+'/databases/(default)/documents/physics_questions';
function val(f,n){return f?.[n]?.stringValue??f?.[n]?.integerValue??''}
async function load(){const box=document.getElementById('quiz');try{const r=await fetch(URL);if(!r.ok)throw Error('Firestore error');const data=await r.json();let docs=data.documents||[];docs=docs.filter(d=>{const f=d.fields||{};const c=String(val(f,'class')||val(f,'className')).trim();const ch=String(val(f,'chapter')).trim();const t=String(val(f,'topic')).trim();return (!c||c==='6')&&(!ch||ch===chapter)&&(!t||t===topic)&&f.question});if(!docs.length){box.innerHTML='<div class="empty"><strong>No concept-specific MCQs are linked yet.</strong><p>Your Firestore questions need these additional fields:</p><ul><li><b>class</b> = 6</li><li><b>chapter</b> = '+escapeHtml(chapter)+'</li><li><b>topic</b> = '+escapeHtml(topic)+'</li></ul><p>Once those fields are added to Q1, Q2, Q3... this page will automatically show the matching MCQs.</p></div>';return}docs.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));box.innerHTML=docs.map((d,i)=>renderQ(d,i)).join('')}catch(e){box.innerHTML='<div class="empty">Unable to load Firestore questions. Please refresh and try again.</div>'}}
function renderQ(d,i){const f=d.fields||{};const ans=String(val(f,'answer')||val(f,'Answer')).toUpperCase();const exp=val(f,'explanation')||val(f,'Explanation')||'No explanation available.';return `<div class="quiz"><div class="q">Q${i+1}. ${escapeHtml(val(f,'question'))}</div>${['A','B','C','D'].map(x=>`<button class="opt" data-answer="${x}" onclick="choose(this,'${ans}',${JSON.stringify(exp)})">${x}. ${escapeHtml(val(f,'option'+x))}</button>`).join('')}<div class="status"></div><div class="explain"></div></div>`}
function choose(btn,ans,exp){const q=btn.closest('.quiz');q.querySelectorAll('.opt').forEach(x=>x.classList.remove('correct','wrong'));const selected=btn.dataset.answer;const correct=q.querySelector('[data-answer="'+ans+'"]');if(selected===ans){btn.classList.add('correct');q.querySelector('.status').textContent='✓ Correct!'}else{btn.classList.add('wrong');if(correct)correct.classList.add('correct');q.querySelector('.status').textContent='✗ Incorrect — correct answer: '+ans}const e=q.querySelector('.explain');e.style.display='block';e.innerHTML='<strong>Explanation:</strong><br>'+escapeHtml(exp)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();</script></body></html>
