<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard | KP Physics Academy</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#0b1930}header{background:#031326;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}button{border:0;border-radius:8px;padding:10px 15px;background:#1687ff;color:#fff;font-weight:700;cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.hero,.card{background:#fff;border-radius:18px;padding:25px;box-shadow:0 8px 25px #0b193012;margin-bottom:22px}.hero h1{margin:0 0 8px}.muted{color:#718096}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.concept{background:#fff;border:1px solid #dfe7f0;border-radius:14px;padding:20px}.concept h3{margin-top:0}.tag{display:inline-block;background:#edf5ff;color:#1687ff;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:800}.open{margin-top:14px}@media(max-width:750px){.grid{grid-template-columns:1fr}header{gap:15px;flex-wrap:wrap}}</style></head><body><header><strong>KP PHYSICS ACADEMY • STUDENT</strong><button onclick="logout()">Logout</button></header><main class="wrap"><div class="hero"><h1 id="welcome">My Physics Journey</h1><p class="muted" id="profile">Loading your learning path...</p><div id="progress"></div></div><div class="card"><h2>📚 My Concepts</h2><p class="muted">Your teacher's concepts for your class appear here.</p><div class="grid" id="concepts"><p>Loading...</p></div></div><div class="card"><h2>📐 Formula Journey</h2><p class="muted">Open the formula journey for your class.</p><button onclick="openFormulas()">Open Formula Journey →</button></div><div class="card"><h2>🔢 Question Bank</h2><button onclick="location.href='question-bank.html'">Practice Questions →</button></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,getDoc,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let userClass='6';window.logout=()=>signOut(auth).then(()=>location.href='index.html');window.openFormulas=()=>location.href='physics-formulas.html?class='+encodeURIComponent(userClass);onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html';return}const p=await getDoc(doc(db,'users',u.uid));if(!p.exists()||p.data().role==='teacher'){location.href='teacher-dashboard.html';return}const d=p.data();userClass=String(d.classNo||'6');document.getElementById('welcome').textContent='Welcome, '+(d.name||u.email.split('@')[0])+' 👋';document.getElementById('profile').textContent='Class '+userClass+' • '+u.email;await loadConcepts()});async function loadConcepts(){const box=document.getElementById('concepts');try{const q=query(collection(db,'concepts'),where('classNo','==',Number(userClass)));const s=await getDocs(q);box.innerHTML='';if(s.empty){box.innerHTML='<p class="muted">No concepts have been published for your class yet.</p>';return}s.forEach(x=>{const d=x.data(),el=document.createElement('div');el.className='concept';el.innerHTML='<span class="tag">Class '+userClass+'</span><h3>'+esc(d.title||'Concept')+'</h3><p class="muted">'+esc(d.chapter||'Physics')+'</p><p>'+esc(d.explanation||'Learn this concept step by step.')+'</p><button class="open">Learn Concept →</button>';el.querySelector('button').onclick=()=>{localStorage.setItem('kp_student_concept',JSON.stringify({id:x.id,...d}));location.href='concept-lesson.html'};box.appendChild(el)})}catch(e){box.innerHTML='<p class="muted">Unable to load concepts. Check Firebase configuration and rules.</p>'}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
