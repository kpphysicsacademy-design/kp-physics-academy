<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Redirecting</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:#f4f7fb;color:#071a31;text-align:center}.box{padding:30px}.logo{font-size:42px}.msg{margin-top:10px;color:#667085}
</style>
</head>
<body>
<div class="box"><div class="logo">⚛️</div><strong>SKILLUP</strong><div class="msg">Opening your SkillUp Home…</div></div>
<script type="module">
import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{firebaseConfig}from'./firebase-config.js';
const auth=getAuth(initializeApp(firebaseConfig));
onAuthStateChanged(auth,user=>{location.replace(user?'physics-dashboard.html':'login.html')});
</script>
</body>
</html>
