<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Learn</title><style>:root{--green:#58cc02;--green-dark:#46a302;--ink:#3c3c3c;--muted:#777;--bg:#f7f7f7;--line:#e5e5e5}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);line-height:1.45}.w{max-width:760px;margin:auto;padding:10px 14px 44px}.card{background:#fff;border:2px solid var(--line);border-bottom:6px solid #ddd;border-radius:24px;padding:16px;margin:14px 0}.hero{text-align:center;padding:20px 16px}.hero h1{font-size:clamp(28px,7vw,40px);margin:4px 0 8px;font-weight:900}.hero p{color:var(--muted);font-weight:700}.icon{font-size:48px}.btn{display:flex;justify-content:center;background:var(--green);color:#fff;padding:15px;border-radius:16px;border-bottom:6px solid var(--green-dark);text-decoration:none;font-weight:900;margin-top:12px}.item{padding:14px;border-bottom:1px solid #eee;font-weight:bold;display:flex;gap:12px}.item h3{margin:0 0 6px;font-size:18px}.item p{margin:0;color:var(--muted);font-weight:700}.num{min-width:38px;height:38px;border-radius:12px;background:#eaf8df;color:var(--green-dark);text-align:center;line-height:38px;font-weight:900}.progress{height:14px;background:#e5e5e5;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:var(--green);transition:.3s}.learnBtn{margin-top:10px;border:0;border-radius:12px;padding:9px 12px;font-weight:900;background:#eaf8df;color:var(--green-dark)}.item.done{opacity:.65}.item.done .num{background:var(--green);color:#fff}.back{display:block;text-align:center;margin:18px;text-decoration:none;font-weight:900;color:#777}.section-title{font-size:24px;font-weight:900;margin:4px 0 12px}@media(max-width:520px){.w{padding:10px 12px 36px}.card{border-radius:20px}.item{padding:12px}}</style></head><body><main class="w" id="app"></main><script>
const ch=new URLSearchParams(location.search).get('chapter')||'Botany Chapter';

'What is Living? Growth, Reproduction & Metabolism':{
icon:'🔬',intro:'Master the defining properties of living organisms with NCERT-focused concepts, examples and NEET traps.',
concepts:[
['🌱','Living vs Non-living','Living organisms show cellular organisation, metabolism and consciousness; individual properties such as growth may occur in non-living systems too.'],
['📈','Growth','Growth is an increase in mass and number of individuals. In plants it is generally indeterminate; non-living objects may also increase by external accumulation.'],
['🧬','Reproduction','Living organisms produce progeny. Reproduction may be asexual or sexual, but it is not an all-inclusive defining property because sterile organisms can still be living.'],
['⚙️','Metabolism','All living organisms perform thousands of enzyme-mediated chemical reactions. Metabolism includes anabolism and catabolism and is a defining feature of living systems.'],
['🧪','Metabolic Reactions','Isolated metabolic reactions can be demonstrated outside the body, but metabolism as an organised cellular process occurs in living organisms.'],
['🧫','Cellular Organisation','Cells are the basic structural and functional units of life. Organised cellular structure is a fundamental feature of living organisms.'],
['👁️','Consciousness','The ability to sense surroundings and respond to stimuli is a defining property of living organisms. Human beings are self-conscious.'],
['🌍','Response to Environment','Organisms respond to physical, chemical and biological stimuli such as light, temperature, chemicals and other organisms.'],
['🧠','NCERT Definition Focus','Living organisms are self-replicating, evolving and self-regulating interactive systems capable of responding to external stimuli.'],
['⚠️','NEET Common Traps','Growth and reproduction alone are not universal defining properties. Metabolism and consciousness are more reliable characteristics of living systems.']
],
quick:['Growth in living organisms occurs from within; non-living growth occurs by external addition.','Metabolism = sum total of all chemical reactions.','Anabolism builds molecules; catabolism breaks molecules.','Sterile organisms are still living.','Consciousness means sensing and responding to the environment.']
